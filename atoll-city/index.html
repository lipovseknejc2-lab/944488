<style>
/* Layout: island city builder for an upright phone. World canvas fills the screen; HUD on top, tool bar at the thumb, sheets slide up over the city. One deep-sea look. */
:root{
  --bg:#06192b; --panel:rgba(7,26,44,.96); --panel2:#123553; --line:rgba(140,220,230,.18);
  --sea:#3fd6cf; --coral:#ff7a59; --gold:#ffc94a; --txt:#eaf6f7; --mut:#8fb2bd; --good:#5fdc8c; --bad:#ff6363; --warn:#ffb648;

  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fb);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 9px;font-size:12.5px;display:flex;gap:5px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0;font-weight:700}
.chip b{font-weight:900}
.chip small{font-size:10px;font-weight:900}
.money b{color:var(--gold);font-family:var(--fd);font-weight:400;font-size:16px;letter-spacing:.4px;padding-top:2px}
.sp{flex:1}
.ico{width:16px;height:16px;flex:none}
.lbl{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}

.bar{position:fixed;left:0;right:0;bottom:0;padding:8px max(6px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:linear-gradient(rgba(4,16,28,0),rgba(4,16,28,.9) 35%);z-index:6}

.mode{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:7;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}

.sl{display:flex;align-items:center;gap:8px}

.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:12px;cursor:pointer}

.sw{flex:none;width:44px;height:26px;border-radius:13px;background:#2b4f61;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on .sw{background:var(--good)}.tog.on .sw::after{left:21px}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--panel2);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:13px}.item .m span{font-size:11.5px;color:var(--mut)}
.pill{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:7px;background:#2b4f61;letter-spacing:.03em}
.pill.g{background:var(--good);color:#06301a!important}.pill.b{background:var(--bad);color:#3a0000!important}.pill.y{background:var(--gold);color:#3a2600!important}.pill.s{background:var(--sea);color:#04262a!important}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;align-items:center;gap:5px;z-index:9;pointer-events:none;width:min(360px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:700;text-align:center;animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:rgba(2,10,18,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:#0b2a44;border:1px solid var(--line);border-radius:22px;padding:16px;max-width:420px;width:100%;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}

.mbox h2{font-family:var(--fd);font-weight:400;margin:0;font-size:25px;letter-spacing:.5px;text-wrap:balance;line-height:1.08}
.mbox p{margin:0;line-height:1.45;color:#cfe5e6;font-size:14px}
.mcv{width:100%;height:170px;border-radius:14px;display:block;background:#0a3050}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--panel2);border-radius:10px;padding:7px;text-align:center}
.stats3 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--mut);text-align:center;min-width:0}
.col img{width:100%;aspect-ratio:1;border-radius:10px;display:block}
.sw8{display:flex;gap:6px;flex-wrap:wrap}.sw8 button{width:34px;height:34px;border-radius:10px;border:2px solid transparent}.sw8 button.on{border-color:#fff}
textarea{background:#08243a;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:8px;font:11px ui-monospace,monospace;width:100%;height:60px;-webkit-user-select:text;user-select:text}
input[type=text]{background:#08243a;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px 10px;font:inherit;font-weight:700;width:100%;-webkit-user-select:text;user-select:text}
.boot{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 30%,#0f4a6e,#06192b 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .4s}
.boot h1{margin:0;font-family:var(--fd);font-weight:400;font-size:40px;color:var(--gold);text-shadow:0 3px 0 #a0601a}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ri=n=>Math.random()*n|0,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[ri(a.length)];

const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtk=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e9?s+'$'+(a/1e9).toFixed(2)+'B':a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':a>=1e4?s+'$'+(a/1e3).toFixed(1)+'k':fmt(n)};
const num=n=>Math.round(n).toLocaleString('en-US');
const pct=v=>Math.round(clamp(v,0,1.5)*100)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>{const A=hexRgb(a),B=hexRgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const shade=(h,t)=>t>0?mix(h,'#ffffff',t):mix(h,'#000000',-t);
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const now=()=>Date.now();

/* ================= game data ================= */
const TS=32;
const SECTORS={police:{n:'Police',pub:1,c:'#4a8aff'},fire:{n:'Fire',pub:1,c:'#ff5a4a'},health:{n:'Health',pub:1,c:'#ff8ab0'},edu:{n:'Education',pub:1,c:'#ffc94a'},maint:{n:'Maintenance',pub:1,c:'#b8a070'},util:{n:'Utilities',pub:1,c:'#3fd6cf'},food:{n:'Food',pub:0,c:'#5fdc8c'},trade:{n:'Trade',pub:0,c:'#ff9a3d'},tour:{n:'Tourism',pub:0,c:'#c07bff'}};
const SECK=Object.keys(SECTORS);
const CLS=[{n:'Workers',w:40,c:'#8fd0ff'},{n:'Skilled',w:58,c:'#5fdc8c'},{n:'Wealthy',w:130,c:'#ffc94a'}];
const CATS={house:'Housing',civic:'Services',util:'Utilities',prod:'Work',tour:'Tourism',fun:'Leisure',wonder:'Wonders',design:'My designs'};
// n name, cat, w h size, cost, up upkeep/lvl/day, bt build seconds, max level, era any|modern|trad, req town hall lvl, sec sector, st staff/lvl
// cap/capi housing (+per lvl), cls class housed, svc people served per worker, water/food/goods/pwo/pw/beds/attr/fun/app/poll per lvl
const B={

  $('#hPe').textContent=G.pearls;$('#hIn').textContent=view==='world'?'Atoll map':ISLES[G.cur].n;$('#hD').textContent='Day '+G.day;const hh=Math.floor(G.tod*24),mm=Math.floor(G.tod*24*60%60/10)*10;$('#hT').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;$('#hW').textContent=G.evt.storm>0?'⛈':lightAmt()>.5?'☾':'☀';
  $('#hS').textContent=G.speed?G.speed+'×':'❚❚';$('#hG').textContent=G.goals.claimed;$('#cDot').hidden=!G.pendNot;$('#bar').style.display=mode?'none':''}
$('#hSpd').onclick=()=>{G.speed=G.speed===1?2:G.speed===2?4:G.speed===4?0:1;toast(G.speed?`Speed ${G.speed}×`:'Paused');ui()};
$('#hIsl').onclick=()=>{if(view==='world'){view='isle';closeSheet()}else{view='world';openSheet('map')}ui()};
$('#hGoal').onclick=()=>openSheet('goals');$('#hDay').onclick=()=>{tabs.city='over';openSheet('city')};$('#hHap').onclick=()=>{tabs.city='over';openSheet('city')};$('#hMoney').onclick=()=>{tabs.city='budget';openSheet('city')};$('#hPop').onclick=()=>{tabs.jobs='cit';openSheet('jobs')};
/* ================= loop ================= */
let lastT=performance.now(),perfT=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(0,(ts-lastT)/1000));lastT=ts;perfT=ts/1000;if(!G)return;
  try{if(G.speed>0){G.tod+=dt*G.speed/DAYLEN;if(G.tod>=1){G.tod-=1;simDay();dayEnd()}}
    const done=finishWork();for(const[I,b]of done){const D=bdef(b);toast(b.lvl>1?`${D.n} reached level ${b.lvl}!`:`${D.n} is finished!`,'good');sfx('done');if(sheet==='info'||sheet==='build')renderSheet();if(b.t==='townhall')sfx('big')}if(done.length)save();
    if(view==='isle'){lifeUpdate(G.isl[G.cur],dt,perfT);ctx.setTransform(DPR,0,0,DPR,0,0);renderIsle(ctx,perfT)}else{ctx.setTransform(DPR,0,0,DPR,0,0);renderWorld(ctx,perfT)}
    hudT-=dt;if(hudT<=0){hudT=.25;ui();drainNotices();if(askQ.length&&$('#modal').hidden)showAsk();
      if(G.pendNot&&lastPend!==G.pendNot.i+':'+G.pendNot.day){lastPend=G.pendNot.i+':'+G.pendNot.day;notableModal()}
      if(sheet==='info')document.querySelectorAll('[data-left]').forEach(el=>{const b=G.isl[G.cur].b.find(x=>x.id===+el.dataset.left);if(b)el.textContent=mmss((b.end-now())/1000)})}
    saveT+=dt;if(saveT>15){saveT=0;save()}}catch(e){console.error(e);if(!frame._err||performance.now()-frame._err>5000){frame._err=performance.now();toast('Small glitch: '+e.message,'bad')}}}
function dayEnd(){G.isl[G.cur]._dirty=true;if(sheet&&['city','jobs','info','goals'].includes(sheet))renderSheet();if(G.day%2===0)save()}
function drainNotices(){if(!G.notice.length)return;const n=G.notice.splice(0,2);for(const[k,m]of n)toast(m,k);if(n.some(x=>x[0]==='gold'))sfx('coin')}
function notableModal(){const p=G.pendNot;if(!p)return;const N=NOTABLES[p.i];modal(`<img src="${portrait(p.i,true)}" alt="" style="width:96px;height:96px;border-radius:20px;align-self:center"><h2>${esc(N.n)} wants to move here!</h2><p><b>${esc(N.r)}.</b> ${esc(N.b)} while living in your city.</p><p class="desc">Famous people need a villa with a free room. They'll wait 12 days.</p><div class="btns"><button class="btn g" id="ny">Welcome them</button><button class="btn" id="nn">Later</button></div>`,box=>{box.querySelector('#nn').onclick=closeModal;box.querySelector('#ny').onclick=()=>{const r=acceptNotable();closeModal();if(r.ok){sfx('big');toast(`${N.n} moved to ${ISLES[r.isl].n}! +2 pearls`,'gold');save()}else toast(r.why+'. Find them later in Collect.','bad')}})}
/* ================= boot ================= */
addEventListener('resize',()=>{resize();if(G&&view==='isle')clampCam()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
document.addEventListener('gesturestart',e=>e.preventDefault());
resize();
window.__city={get G(){return G},addCitizen,settleHomes,upTime,get mode(){return mode},get view(){return view},scr:(x,y)=>[((x+.5)*TS-cam.x)*cam.z+W/2,((y+.5)*TS-cam.y)*cam.z+H/2],advise,needsRoad,isLand,tileAt,simDay,place,canPlace,findSpot,upgrade,canUpgrade,unlockIsland,buildRoads,connect,acceptNotable,finishWork,openSheet,closeSheet,setMode,tap,goIsle,startGame,newGame,save,loadSave,unpack,packSave,totalPop,cityHap,thLvl,roadAdj,dig,activeGoals,rush,demolish,toTile,cam,get view(){return view},set view(v){view=v},renderSheet,tabs,get design(){return design},B,ISLES,designStats,eraChoice};
function boot(data){let st=null;try{if(data&&data.save)st=unpack(data.save)}catch(e){}if(!st)st=loadSave();if(st)startGame(st);else eraChoice()}
try{window.claude?.hot?.snapshot?.(()=>({save:G?packSave():''}))}catch(e){}
setTimeout(()=>{const hot=window.claude&&window.claude.hot;if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{})},60);

</script>
<script>
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&had){const b=document.createElement('button');b.className='btn p';b.textContent='New version ready · Tap to update';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 120px);z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);flex:none';b.onclick=()=>{try{window.__city.save()}catch(e){}location.reload()};document.body.appendChild(b)}})});
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})})}
</script>
