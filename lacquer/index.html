SCREENS.life=()=>{const t=tabs.life;let h=`<div class="kick">Life</div><div class="h1 it" style="margin:4px 0 14px">Live like<br>you mean it.</div><div class="tabs">${[['home','Homes'],['garage','Garage'],['closet','Closet'],['gear','Gear'],['team','Team'],['train','Train'],['coll','Collection']].map(([k,n])=>`<button class="${t===k?'on':''}" data-act="tab" data-k="life" data-v="${k}">${n}</button>`).join('')}</div><div class="stagger">`;
  if(t==='home'){const H=homeOf();h+=`<div class="card" style="padding:0;overflow:hidden"><div class="scene" style="border:0;border-radius:0;aspect-ratio:16/10">${homeSVG(H.id)}</div><div style="padding:12px 14px"><div class="kick">You live in</div><div class="h2 it">${H.n}</div><div class="mut" style="font-size:13px">${H.d}</div><div class="row" style="margin-top:8px;font-size:12.5px"><span class="tag">${H.en} energy/wk</span><span class="tag">+${H.mood} mood</span><span class="tag">${fmt$(H.up)}/wk</span></div></div></div><div class="list" style="margin-top:14px">${HOMES.map(x=>{const own=S.homes.includes(x.id);return`<div class="item"><div class="thumb">${homeSVG(x.id)}</div><div class="m"><b>${x.n}</b><span>${x.en} energy · +${x.img} image · ${fmt$(x.up)}/wk</span></div>${S.home===x.id?'<span class="tag">home</span>':own?`<button class="btn xs" data-act="buy" data-k="home" data-v="${x.id}">Move</button>${x.id!=='flat'?`<button class="btn xs ghost" data-act="sell" data-k="home" data-v="${x.id}">Sell</button>`:''}`:`<button class="btn xs ${S.money>=x.cost?'acid':'ghost'}" data-act="buy" data-k="home" data-v="${x.id}" ${S.money<x.cost?'disabled':''}>${fmt$(x.cost)}</button>`}</div>`}).join('')}</div>`}
  if(t==='garage'){const C=carOf();h+=`<div class="card" style="background:#ffd9a8"><div style="padding:0 10px">${carSVG(C.id)}</div><div class="kick" style="color:var(--ink)">You drive</div><div class="h2 it">${C.n}</div></div><div class="list" style="margin-top:14px">${CARS.map(x=>{const own=S.cars.includes(x.id);return`<div class="item"><div class="thumb" style="width:72px;padding:4px;background:#ffd9a8">${carSVG(x.id)}</div><div class="m"><b>${x.n}</b><span>+${x.img} image · ${fmt$(x.up)}/wk</span></div>${S.car===x.id?'<span class="tag">driving</span>':own?`<button class="btn xs" data-act="buy" data-k="car" data-v="${x.id}">Drive</button>${x.id!=='bike'?`<button class="btn xs ghost" data-act="sell" data-k="car" data-v="${x.id}">Sell</button>`:''}`:`<button class="btn xs ${S.money>=x.cost?'acid':'ghost'}" data-act="buy" data-k="car" data-v="${x.id}" ${S.money<x.cost?'disabled':''}>${fmt$(x.cost)}</button>`}</div>`}).join('')}</div>`}
  if(t==='closet'){h+=`<div class="card" style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center"><div style="border-radius:14px;overflow:hidden;border:1.5px solid var(--ink)">${avatarSVG(S.look)}</div><div><div class="h2 it">Your look</div><p class="mut" style="font-size:13px">Image: <b>${(calcImage(),Math.round(S.image))}</b>. A sharper image means bigger posts and better brand deals.</p></div></div><div style="margin-top:14px">${lookEditor(S.look,LE.tab,true)}</div>`}
  if(t==='gear'){h+=`<p class="mut" style="margin:0 0 12px">Better gear raises the ceiling on production, and unlocks instruments and drum kits in the lab.</p><div class="list">${GEAR.map(G=>{const t2=S.gear[G.id];const nx=t2+1<G.tiers.length?G.cost[t2+1]:0;return`<div class="card"><div class="row"><div class="sp"><div class="kick">${G.n} · ${G.eff}</div><div class="h3">${G.tiers[t2]}</div></div>${nx?`<button class="btn sm ${S.money>=nx?'acid':'ghost'}" data-act="buy" data-k="gear" data-v="${G.id}" ${S.money<nx?'disabled':''}>${fmt$(nx)}</button>`:'<span class="tag">maxed</span>'}</div><div class="row" style="gap:4px;margin-top:10px">${G.tiers.map((_,i)=>`<i style="flex:1;height:8px;border-radius:9px;border:1.5px solid var(--ink);background:${i<=t2?'var(--ink)':'transparent'}"></i>`).join('')}</div>${nx?`<div class="mut" style="font-size:12px;margin-top:6px">Next: ${G.tiers[t2+1]}</div>`:''}</div>`}).join('')}</div>`}
  if(t==='team'){h+=`<p class="mut" style="margin:0 0 12px">A team costs a weekly fee (it grows with your rank) but makes everything easier.</p><div class="list">${TEAM.map(T=>{const on=!!S.team[T.id];const fee=Math.round(T.fee*(1+S.rank*.15));return`<div class="card ${on?'acid':''}"><div class="row"><div class="sp"><div class="h3">${T.n}</div><div style="font-size:13px">${T.d}</div><div class="kick" style="margin-top:4px;${on?'color:var(--ink)':''}">${fmt$(fee)}/week${S.fans<T.req?` · needs ${fmtN(T.req)} fans`:''}</div></div><button class="btn sm ${on?'ghost':''}" data-act="buy" data-k="team" data-v="${T.id}" ${!on&&S.fans<T.req?'disabled':''}>${on?'Let go':'Hire'}</button></div></div>`}).join('')}</div>`}
  if(t==='train'){h+=`<p class="mut" style="margin:0 0 12px">Skills shape every song and show. They also grow by doing.</p><div class="list">${Object.entries(TRAIN).map(([k,T])=>{const cost=Math.round(T.cost*(1+S.skills[k]/30));return`<div class="card"><div class="row"><div class="sp"><div class="kick">${SKILLS[k]}</div><div class="num" style="font-size:22px">${Math.round(S.skills[k])}</div></div><button class="btn sm" data-act="train" data-v="${k}">${T.n}<br>${fmt$(cost)} · ${T.en}⚡</button></div><div class="bar" style="margin-top:8px"><i style="width:${S.skills[k]}%;background:var(--blue)"></i></div></div>`}).join('')}</div>`}
  if(t==='coll'){const plq=S.rel.filter(r=>r.plaque);h+=`${S.auction?(()=>{const m=MEMO.find(x=>x.id===S.auction.id);return`<div class="card ink"><div class="kick" style="color:#9a8f80">This week at auction · ends week ${S.auction.until}</div><div class="h2 it" style="color:${RARC[m.r]}">${esc(m.n)}</div><div style="font-size:13px;color:#bfb3a0">${esc(m.d)} <span class="tag" style="background:${RARC[m.r]}">${m.r}</span></div><button class="btn acid sm" style="margin-top:10px" data-act="auction" ${S.money<S.auction.price?'disabled':''}>Bid ${fmt$(S.auction.price)}</button></div>`})():''}
    <div class="sec"><span class="h2 it">Plaques</span><span class="kick">${plq.length}</span></div>${plq.length?`<div class="grid3">${plq.map(r=>`<div class="plaque"><div class="disc" style="background:${['','radial-gradient(circle,#fff3c4,#e9b949 40%,#8a6414)','radial-gradient(circle,#fff,#c9ced6 40%,#7d8590)','radial-gradient(circle,#fff,#bff3ff 40%,#5ab6d6)'][r.plaque]}"></div><b>${esc(r.title)}</b><span style="opacity:.7">${['','Gold','Platinum','Diamond'][r.plaque]}</span></div>`).join('')}</div>`:`<div class="empty">Gold at 5M streams per track, platinum at 20M, diamond at 100M.</div>`}
    <div class="sec"><span class="h2 it">Memorabilia</span><span class="kick">${Object.keys(S.memo).length}/${MEMO.length}</span></div><div class="grid3">${MEMO.map(m=>`<div class="trophy" style="${S.memo[m.id]?'':'opacity:.35;border-style:dashed'}"><span style="font-size:24px">${S.memo[m.id]?'✦':'?'}</span><span>${S.memo[m.id]?esc(m.n):'???'}</span><span style="color:${RARC[m.r]};font-family:var(--f-mono);font-size:9px;text-transform:uppercase">${m.r}</span></div>`).join('')}</div>
    <div class="sec"><span class="h2 it">Achievements</span><span class="kick">${Object.keys(S.achv).length}/${ACH.length}</span></div><div class="col">${ACH.map(([id,n,dd])=>`<div class="ach ${S.achv[id]?'':'off'}"><span class="ic">${S.achv[id]?'★':'☆'}</span><div><b>${n}</b><div class="mut">${dd}</div></div></div>`).join('')}</div>`}
  return h+'</div>'};
ACT.buy=d=>{const r=buy(d.k,d.v);if(!r.ok){toast(r.why,'bad');return}blip(r.fired?'tap':'coin');if(!r.fired&&(d.k==='home'||d.k==='car'))confetti(30);refresh()};
ACT.sell=d=>{if(d.k==='home')sellHome(d.v);else sellCar(d.v);blip('coin');refresh()};
ACT.train=d=>{const r=train(d.v);if(!r.ok){toast(r.why,'bad');return}toast(`${SKILLS[d.v]} +${r.gain.toFixed(1)}`,'good');blip('up');refresh()};
ACT.auction=()=>{const r=buyAuction();if(r.ok){toast('It\'s yours.','gold');blip('big');confetti(30)}else toast(r.why,'bad');refresh()};

/* ================= look editor (creator + closet) ================= */
const LE={tab:'face'};
function lookEditor(L,tab,closet){const T=[['face','Face'],['hair','Hair'],['style','Style'],['extra','Extras']];const opt=(k,names,cur)=>`<div class="opt">${names.map((n,i)=>`<button class="${cur===i?'on':''}" data-act="lk" data-k="${k}" data-v="${i}">${n}</button>`).join('')}</div>`;
  const sw=(k,cols,cur)=>`<div class="opt" style="grid-template-columns:repeat(auto-fill,minmax(44px,1fr))">${cols.map((c,i)=>`<button class="${cur===i?'on':''}" data-act="lk" data-k="${k}" data-v="${i}" style="height:46px" aria-label="Colour ${i+1}"><span class="sw" style="background:${c}"></span></button>`).join('')}</div>`;
  let h=`<div class="tabs" style="margin-bottom:10px">${T.map(([k,n])=>`<button class="${tab===k?'on':''}" data-act="letab" data-v="${k}">${n}</button>`).join('')}</div>`;const lab=n=>`<div class="kick" style="margin:12px 0 7px">${n}</div>`;
  if(tab==='face')h+=lab('Skin')+sw('skin',SKIN,L.skin)+lab('Face')+opt('face',FACES,L.face)+lab('Eyes')+opt('eyes',EYES,L.eyes)+lab('Brows')+opt('brows',BROWS,L.brows)+lab('Nose')+opt('nose',NOSES,L.nose)+lab('Mouth')+opt('mouth',MOUTHS,L.mouth);
  if(tab==='hair')h+=lab('Hair')+opt('hair',HAIRS,L.hair)+lab('Colour')+sw('hairCol',HAIRC,L.hairCol)+lab('Facial hair')+opt('beard',BEARDS,L.beard);
  if(tab==='style')h+=lab('Style')+`<div class="opt">${Object.entries(STYLES).map(([k,n])=>{const lk=closet&&!S.styles.includes(k);return`<button class="${L.style===k?'on':''}" data-act="lk" data-k="style" data-v="${k}">${n}${lk?`<span class="lock">🔒</span><span style="font-size:9.5px;opacity:.7">${fmt$(STYLE_COST[k])}</span>`:''}</button>`}).join('')}</div>`+lab('Main colour')+sw('c1',CLOTH,L.c1)+lab('Accent colour')+sw('c2',CLOTH,L.c2);
  if(tab==='extra')h+=lab('Glasses')+opt('glasses',GLASSES,L.glasses)+lab('Headwear')+opt('hat',HATS,L.hat)+lab('Ears')+opt('ear',EARS,L.ear)+lab('Details')+opt('mark',MARKS,L.mark)+`<button class="btn ghost wide" style="margin-top:14px" data-act="lk" data-k="random">🎲 Surprise me</button>`;
  return h}
ACT.letab=d=>{LE.tab=d.v;if(CR)crRender();else refresh()};
ACT.lk=d=>{const L=CR?CR.look:S.look;if(d.k==='random'){const r=randomLook();if(!CR){r.style=S.styles.includes(r.style)?r.style:'street'}Object.assign(L,r)}
  else if(d.k==='style'){if(!CR&&!S.styles.includes(d.v)){const r=buy('style',d.v);if(!r.ok){toast(`${STYLES[d.v]} costs ${fmt$(STYLE_COST[d.v])}`,'bad');return}toast(`${STYLES[d.v]} unlocked`,'good')}L.style=d.v}else L[d.k]=+d.v;blip('tap');if(CR)crRender();else refresh()};

/* ================= CREATOR ================= */
let CR=null;
function creator(){CR={step:0,look:randomLook(),name:'',origin:'choir',genre:'pop'};CR.look.style=pick(['street','minimal','vintage','sport']);$('#top').hidden=true;$('#dock').hidden=true;const c=document.createElement('div');c.id='creator';$('#app').appendChild(c);crRender()}
function crRender(){const c=$('#creator');if(!c)return;const sc=c.querySelector('.body')?.scrollTop||0;const L=CR.look;let body='';
  if(CR.step===0)body=`<div class="h2 it" style="margin-bottom:2px">Who are you?</div><p class="mut" style="margin:0 0 6px">Everything can be changed later in your closet.</p>${lookEditor(L,LE.tab,false)}`;
  if(CR.step===1)body=`<div class="h2 it" style="margin-bottom:8px">Your stage name</div><input class="field" id="crN" maxlength="22" value="${esc(CR.name)}" placeholder="Type a name" autocomplete="off"><div class="chips" style="margin-top:8px">${[pick(FN)+' '+pick(LN),pick(MONO),pick(FN).toUpperCase(),'Lil '+pick(FN),pick(FN)+' '+pick(TITLE_A)].map(n=>`<button class="chip" data-act="crname" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <div class="h2 it" style="margin:20px 0 8px">Where it started</div><div class="col">${Object.entries(ORIGINS).map(([k,o])=>`<button class="origin ${CR.origin===k?'on':''}" data-act="crorigin" data-v="${k}"><div class="ic">${{choir:'♪',beat:'▦',poet:'✎',theater:'★',influencer:'◎'}[k]}</div><div class="sp"><b style="font-size:16px">${o.n}</b><div style="font-size:12.5px;opacity:.8">${o.d}</div></div></button>`).join('')}</div>`;
  if(CR.step===2)body=`<div class="h2 it" style="margin-bottom:4px">Your sound</div><p class="mut" style="margin:0 0 12px">Your home genre. You can make anything, anytime.</p><div class="grid2">${GKEYS.map(g=>{const G=GENRES[g];return`<button class="gcard ${CR.genre===g?'on':''}" style="background:${G.col}" data-act="crgenre" data-v="${g}"><b>${G.n}</b><span>${esc(G.blurb)}</span></button>`}).join('')}</div>`;
  c.innerHTML=`<div class="stage"><div class="steps">${[0,1,2].map(i=>`<i class="${i<=CR.step?'on':''}"></i>`).join('')}</div><div class="bgtxt">${esc(CR.name||'a star is born')} ${esc(CR.name||'a star is born')}</div>${avatarSVG(L,{bg:false,cls:'big'})}${CR.name?`<div class="sticker" style="left:16px;bottom:18px;z-index:2;font-size:15px">${esc(CR.name)}</div>`:''}</div>
   <div class="body">${body}</div><div class="foot">${CR.step?`<button class="btn ghost" data-act="crback">${IC.back}</button>`:''}<button class="btn sp" data-act="crnext">${CR.step<2?'Next':'Start my career'} ${IC.arrow}</button></div>`;
  c.querySelector('.body').scrollTop=sc;const n=c.querySelector('#crN');if(n)n.oninput=()=>{CR.name=n.value;const st=c.querySelector('.sticker');if(st)st.textContent=CR.name}}
ACT.crname=d=>{CR.name=d.v;crRender()};ACT.crorigin=d=>{CR.origin=d.v;blip('tap');crRender()};ACT.crgenre=d=>{CR.genre=d.v;blip('tap');crRender()};ACT.crback=()=>{CR.step--;crRender()};
ACT.crnext=()=>{auInit();blip('ok');if(CR.step===1&&!CR.name.trim()){CR.name=pick(FN)+' '+pick(LN)}if(CR.step<2){CR.step++;crRender();$('#creator .body').scrollTop=0;return}
  S=newState({name:CR.name.trim().slice(0,22),look:CR.look,origin:CR.origin,genre:CR.genre});CR=null;$('#creator').remove();save();startApp();
  setTimeout(()=>modal(`<div class="kick">A message from Dot, your first fan</div><div class="h2 it" style="margin:6px 0 10px">Hey ${esc(S.name)}. This is the start.</div><ul class="notes"><li data-s="1">Make songs in the <b>Studio</b>. The lab scores every beat, chord and word.</li><li data-s="2">Release singles, EPs and albums. Good songs climb the <b>Hot 50</b>.</li><li data-s="3">Post on <b>Loop</b>, play shows on <b>Stage</b>, and DM bigger artists for collabs.</li><li data-s="4">Your <b>heat</b> fades every week. Go quiet and you fall off.</li><li data-s="5">When you've used your energy, wrap up the week (top right).</li></ul><button class="btn wide" style="margin-top:12px" data-act="cm">Let's make a record</button>`),400)};

/* ================= THE LAB ================= */
const LAB={open:false,song:null,pat:'A',tab:'drums',rec:false,page:0,sel:0,line:0,hints:0,dirty:false,opts:{}};
const LTABS=[['drums','Drums','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="7" rx="8" ry="3"/><path d="M4 7v9c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/></svg>'],['bass','Bass','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/></svg>'],['chords','Chords','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v10M13 4v10M18 4v10"/></svg>'],['melody','Melody','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'],['lyrics','Lyrics','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg>'],['vocals','Vocals','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>'],['arrange','Arrange','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="5" height="8" rx="1"/><rect x="9" y="8" width="6" height="8" rx="1"/><rect x="17" y="8" width="5" height="8" rx="1"/></svg>'],['mix','Mix','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18M12 3v18M18 3v18"/><rect x="4" y="13" width="4" height="3"/><rect x="10" y="6" width="4" height="3"/><rect x="16" y="15" width="4" height="3"/></svg>']];
const RHY_COL=r=>r?`hsl(${hashS(r)%360} 85% 60%)`:'transparent';
function chordName(song,deg){const sc=SCALE[song.mode];const root=(song.key+sc[deg%7])%12;const third=(sc[(deg+2)%7]-sc[deg%7]+12)%12,fifth=(sc[(deg+4)%7]-sc[deg%7]+12)%12;let q=third===3?(fifth===6?'dim':'m'):'';if(song.sev){const sv=(sc[(deg+6)%7]-sc[deg%7]+12)%12;q+=q==='dim'?'':sv===11?'maj7':'7';if(q==='m7'&&fifth===6)q='m7♭5'}return NOTE[root]+q}
function rowName(song,row){return NOTE[(melMidi(song,row)%12+12)%12]+(Math.floor(melMidi(song,row)/12)-1)}
function openLab(song,opts={}){stopSong();LAB.open=true;LAB.song=song;LAB.pat='A';LAB.tab=opts.tab||'drums';LAB.rec=false;LAB.page=0;LAB.sel=0;LAB.line=0;LAB.hints=0;LAB.dirty=false;LAB.opts=opts;auInit();labRender();$('#lab').classList.add('on')}
ACT.newsong=d=>{if(LAB.open)return;const g=d.g||S.fav;if(d.beat){S.giftBeat=0;const s=presetSong(g,ri(1e9));s.title=randTitle();s.beat=true;openLab(s,{});toast('The beat is loaded. Write lyrics, cut vocals, make it yours.');return}
  if(d.collab&&S.collab){const s=newSong(g);s.collab=S.collab.npc;openLab(s,{});return}
  openSheet(`<span class="h2 it">New ${GENRES[g].n} song</span>`,`<p class="mut" style="margin-top:0">${esc(GENRES[g].blurb)}</p><div class="col"><button class="origin" data-act="labstart" data-g="${g}" data-m="blank"><div class="ic">✎</div><div class="sp"><b>Blank page</b><div style="font-size:12.5px;opacity:.8">Every hit and every chord is yours. Highest originality.</div></div></button><button class="origin" data-act="labstart" data-g="${g}" data-m="starter"><div class="ic">▦</div><div class="sp"><b>Genre starter</b><div style="font-size:12.5px;opacity:.8">A ${GENRES[g].n} groove to build on. Faster, but scored as less original until you change it.</div></div></button></div>`)};
ACT.labstart=d=>{closeSheet();const s=d.m==='starter'?presetSong(d.g,ri(1e9)):newSong(d.g);if(d.m==='starter'){s.title=randTitle();s.lyr={theme:'love',lines:[[],[],[],[]]}}if(S.collab&&!S.collab.used&&npcById(S.collab.npc).genre===d.g)s.collab=S.collab.npc;openLab(s,{})};
function labClose(force){if(LAB.dirty&&!force){modal(`<div class="h2 it">Leave the studio?</div><p>This session isn't mastered yet. Unsaved changes will be lost.</p><div class="row"><button class="btn ghost sp" data-act="cm">Stay</button><button class="btn red sp" data-act="labquit">Leave</button></div>`);return}stopSong();LAB.open=false;LAB.rec=false;$('#lab').classList.remove('on');refresh()}
ACT.labquit=()=>{closeModal();labClose(true)};ACT.labx=()=>labClose();
function labRender(){const s=LAB.song,G=GENRES[s.genre],L=$('#lab');const playing=AU.playing&&!AU.playing.stopped;const body=L.querySelector('.lbody');const sc=body?body.scrollTop:0;
  L.innerHTML=`<div class="lh"><button class="lbtn" data-act="labx" aria-label="Close">${IC.back}</button><div class="lt"><input id="lTitle" value="${esc(s.title)}" maxlength="34" aria-label="Song title"><div class="kick">${G.n} · ${NOTE[s.key]} ${s.mode==='maj'?'major':'minor'} · ${s.bpm} bpm${s.collab?` · feat. ${esc(npcById(s.collab)?.name||'')}`:''}</div></div><button class="play ${playing?'on':''}" data-act="lplay" aria-label="${playing?'Stop':'Play'}">${playing?IC.stop:IC.play}</button></div>
  <div class="lsub"><div class="seg">${[['A','Verse'],['B','Chorus']].map(([k,n])=>`<button class="${LAB.pat===k?'on':''}" data-act="lpat" data-v="${k}">${n}</button>`).join('')}</div><span class="sp"></span><button class="lbtn" data-act="lhint" title="Ask your producer">💡</button><button class="lbtn" data-act="lset" aria-label="Song settings">⚙</button><button class="lbtn on" data-act="lmaster">Master</button></div>

let GAME=null;
function gameShell(title,sub){const g=document.createElement('div');g.id='game';g.innerHTML=`<div class="lh" style="padding:calc(var(--top) + 10px) 14px 6px;display:flex;align-items:center;gap:10px"><button class="lbtn" id="gX" aria-label="Stop">✕</button><div style="flex:1"><div class="disp it" style="font-size:24px;color:#fff">${esc(title)}</div><div class="kick" style="color:#9a8f80" id="gSub">${esc(sub)}</div></div></div><canvas></canvas>`;$('#app').appendChild(g);

const JUDGE=[[45,1,'PERFECT','#d7ff3c'],[95,.75,'GREAT','#7fe7d9'],[160,.4,'OK','#ff9bd2']];

/* ---------- vocal take ---------- */
function vocalTake(song,cb){const pat=song.pat.B.mel.some(v=>v>=0)?'B':song.pat.A.mel.some(v=>v>=0)?'A':null;if(!pat){toast('Write a melody first: the singer needs something to sing','bad');return}
  auInit();const{g,cv}=gameShell(song.vox==='rap'?'Booth · rap take':'Vocal booth','Listen once, then sing it back');const ctx=cv.getContext('2d');
  const mute={vox:true};const P=playSong(song,{mode:'loop',pat,mute});if(!P){g.remove();return}const t00=P.t0,sd=P.sd;
  const notes=[];const mel=song.pat[pat].mel;for(let gi=64;gi<128;gi++){const i=gi%32;if(mel[i]>=0)notes.push({t:t00+gi*sd+swingT(song,gi%16,sd),row:mel[i],hit:null,len:(()=>{let l=1;while(i+l<32&&mel[i+l]<0&&l<6)l++;return l})()})}
  let score=0,extra=0,last=null,lastT=0,done=false,combo=0;
  const lat=()=>(AU.ctx.outputLatency||0)+(AU.ctx.baseLatency||0);
  const tap=()=>{if(done)return;const now=AU.ctx.currentTime-lat();if(now<t00+64*sd-.2)return;let best=null,bd=9;for(const n of notes){if(n.hit!==null)continue;const d=now-n.t;if(Math.abs(d)<bd){bd=Math.abs(d);best=n}}
    const j=best&&judge(now-best.t);if(j){best.hit=j[1];score+=j[1];combo++;voice(AU.ctx.currentTime,melMidi(song,best.row),sd*best.len*.9,song.vox,.9,best.row);last=j;lastT=performance.now()}else{extra++;combo=0;last=[0,0,'OFF','#ff4a1c'];lastT=performance.now()}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});const kd=e=>{if(e.code==='Space'){e.preventDefault();tap()}};document.addEventListener('keydown',kd);
  const iv=setInterval(()=>{if(!AU.playing||AU.playing!==P)return;if(P.step>=60&&!mute.lead){mute.lead=true;$('#gSub').textContent='Your turn: tap as each note hits the line'}},30);
  const finish=(abort)=>{if(done)return;done=true;clearInterval(iv);document.removeEventListener('keydown',kd);stopSong();g.remove();if(abort)return;const n=notes.length||1;for(const x of notes)if(x.hit===null)x.hit=0;const acc=clamp(score/n-extra*.04,0,1);cb(acc)};
  g.querySelector('#gX').onclick=()=>finish(true);
  const minR=Math.min(...notes.map(n=>n.row)),maxR=Math.max(...notes.map(n=>n.row));
  const draw=()=>{if(done)return;const d=cv._d,W=cv.width,H=cv.height;const now=AU.ctx.currentTime-lat();ctx.clearRect(0,0,W,H);
    const hitY=H*.72,speed=H*.5;ctx.fillStyle='#191614';ctx.fillRect(0,0,W,H);
    const listen=now<t00+64*sd-.1;
    ctx.strokeStyle='#efe7d8';ctx.lineWidth=3*d;ctx.beginPath();ctx.moveTo(20*d,hitY);ctx.lineTo(W-20*d,hitY);ctx.stroke();
    for(const n of notes){const y=hitY-(n.t-now)*speed;if(y<-60*d||y>H+40*d)continue;const x=W*.18+(n.row-minR)/Math.max(1,maxR-minR)*W*.64;const h=n.len*sd*speed;
      ctx.fillStyle=n.hit===null?(listen?'#4a433c':'#d7ff3c'):n.hit>0?'#7fe7d9':'#ff4a1c';ctx.globalAlpha=n.hit===null?1:.45;ctx.beginPath();ctx.roundRect(x-16*d,y-h,32*d,h,8*d);ctx.fill();ctx.globalAlpha=1;
      if(n.hit===null&&now-n.t>.2){n.hit=0;combo=0;last=[0,0,'MISS','#ff4a1c'];lastT=performance.now()}}
    ctx.fillStyle='#efe7d8';ctx.font=`600 ${14*d}px 'Space Mono',monospace`;ctx.textAlign='center';ctx.fillText(listen?'LISTEN…':'SING',W/2,hitY+34*d);
    if(last&&performance.now()-lastT<500){ctx.fillStyle=last[3];ctx.font=`900 ${28*d}px 'Unbounded',sans-serif`;ctx.fillText(last[2],W/2,H*.3)}
    if(combo>3){ctx.fillStyle='#ff9bd2';ctx.font=`800 ${16*d}px 'Unbounded',sans-serif`;ctx.fillText(combo+' streak',W/2,H*.3+30*d)}
    const prog=clamp((now-t00)/(128*sd),0,1);ctx.fillStyle='#2e2925';ctx.fillRect(20*d,H-28*d,W-40*d,6*d);ctx.fillStyle='#d7ff3c';ctx.fillRect(20*d,H-28*d,(W-40*d)*prog,6*d);

function liveShow(song,cb){auInit();const{g,cv}=gameShell('Live',`${song.title} · tap the lanes on the beat`);const ctx=cv.getContext('2d');
  const P=playSong(song,{mode:'loop',pat:'B'});if(!P){g.remove();cb(.5);return}const t00=P.t0,sd=P.sd;const pt=song.pat.B;
  const lanes=[['Kick','#ff4a1c',i=>pt.dr.k[i]>0],['Snare','#2b36ff',i=>pt.dr.s[i]>0||pt.dr.c[i]>0],['Hat','#d7ff3c',i=>i%2===0&&(pt.dr.h[i]>0||pt.dr.o[i]>0)]];
  const notes=[];for(let gi=16;gi<128;gi++){const i=gi%16;lanes.forEach((L,li)=>{if(L[2](i))notes.push({t:t00+gi*sd+swingT(song,i,sd),lane:li,hit:null})})}
  if(notes.length<8)for(let gi=16;gi<128;gi+=4)notes.push({t:t00+gi*sd,lane:gi%8===0?0:1,hit:null});
  let score=0,combo=0,maxC=0,hype=.3,done=false,fx=[];const lat=()=>(AU.ctx.outputLatency||0)+(AU.ctx.baseLatency||0);
  const press=li=>{if(done)return;const now=AU.ctx.currentTime-lat();let best=null,bd=9;for(const n of notes){if(n.lane!==li||n.hit!==null)continue;const d=Math.abs(now-n.t);if(d<bd){bd=d;best=n}}const j=best&&judge(now-best.t);
    if(j){best.hit=j[1];score+=j[1];combo++;maxC=Math.max(maxC,combo);hype=clamp(hype+.02*j[1],0,1);fx.push({li,t:performance.now(),txt:j[2],c:j[3]})}else{combo=0;hype=clamp(hype-.03,0,1);fx.push({li,t:performance.now(),txt:'×',c:'#ff4a1c'})}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();press(clamp(Math.floor((e.clientX-r.left)/r.width*3),0,2))});
  const kd=e=>{const k={KeyJ:0,KeyK:1,KeyL:2,ArrowLeft:0,ArrowDown:1,ArrowRight:2}[e.code];if(k!=null){e.preventDefault();press(k)}};document.addEventListener('keydown',kd);
  const finish=abort=>{if(done)return;done=true;document.removeEventListener('keydown',kd);stopSong();g.remove();const acc=notes.length?score/notes.length:0;cb(abort?clamp(acc*.6,0,1):clamp(acc*.8+maxC/notes.length*.2,0,1))};
  g.querySelector('#gX').onclick=()=>finish(true);
  const draw=()=>{if(done)return;const d=cv._d,W=cv.width,H=cv.height;const now=AU.ctx.currentTime-lat();const hitY=H*.8,speed=H*.55,lw=W/3;
    const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0d0b1e');gr.addColorStop(1,'#24120e');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    // crowd glow grows with hype
    ctx.fillStyle=`rgba(255,74,28,${.12+hype*.35})`;for(let i=0;i<18;i++){const x=(i+.5)/18*W,y=H*.06+Math.sin(now*6+i)*hype*8*d;ctx.beginPath();ctx.arc(x,y,(10+hype*8)*d,0,7);ctx.fill()}
    lanes.forEach((L,li)=>{ctx.fillStyle=li%2?'rgba(255,255,255,.03)':'rgba(255,255,255,.06)';ctx.fillRect(li*lw,0,lw,H);ctx.fillStyle=L[1];ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(li*lw+10*d,hitY-6*d,lw-20*d,12*d,6*d);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#efe7d8';ctx.font=`700 ${12*d}px 'Space Mono',monospace`;ctx.textAlign='center';ctx.fillText(L[0].toUpperCase(),li*lw+lw/2,hitY+32*d)});
    for(const n of notes){const y=hitY-(n.t-now)*speed;if(n.hit===null&&now-n.t>.18){n.hit=0;combo=0;hype=clamp(hype-.02,0,1)}if(y<-20*d||y>H||n.hit!==null&&n.hit>0)continue;ctx.fillStyle=n.hit===0?'#4a433c':lanes[n.lane][1];ctx.beginPath();ctx.arc(n.lane*lw+lw/2,y,15*d,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2*d;ctx.stroke()}
    fx=fx.filter(f=>performance.now()-f.t<450);for(const f of fx){const k=(performance.now()-f.t)/450;ctx.globalAlpha=1-k;ctx.fillStyle=f.c;ctx.font=`900 ${18*d}px 'Unbounded',sans-serif`;ctx.fillText(f.txt,f.li*lw+lw/2,hitY-40*d-k*30*d);ctx.globalAlpha=1}
    ctx.fillStyle='#fff';ctx.font=`900 ${22*d}px 'Unbounded',sans-serif`;ctx.fillText(combo>2?combo+'×':'',W/2,H*.2);
    ctx.fillStyle='#2e2925';ctx.fillRect(20*d,H*.12,W-40*d,8*d);ctx.fillStyle='#ff9bd2';ctx.fillRect(20*d,H*.12,(W-40*d)*hype,8*d);ctx.fillStyle='#9a8f80';ctx.font=`600 ${11*d}px 'Space Mono',monospace`;ctx.fillText('CROWD',W/2,H*.12-6*d);
    if(now>t00+128*sd+.3){finish(false);return}requestAnimationFrame(draw)};requestAnimationFrame(draw);GAME={press,finish,notes}}

/* ================= save / load ================= */
const SAVE_KEY='lacquer-save-v1';
function sumOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
/* songs are stored compactly: each pattern becomes one short string */
function packPat(pt){const dr=DRUMS.map(([d])=>pt.dr[d].map(v=>v>=.9?'1':v>0?'g':'0').join('')).join('');const bs=pt.bs.map(v=>v<0?'.':v).join('');const mel=pt.mel.map(v=>v<0?'.':v.toString(36)).join('');
  const off={};if(pt.off)for(const k in pt.off)if(pt.off[k]&&pt.off[k].some(x=>x))off[k]=pt.off[k];return dr+'~'+pt.ch.join('')+'~'+bs+'~'+mel+'~'+(Object.keys(off).length?JSON.stringify(off):'')}
function unpackPat(z){const[dr,ch,bs,mel,off]=z.split('~');const o={dr:{},ch:ch.split('').map(Number),bs:bs.split('').map(c=>c==='.'?-1:+c),mel:mel.split('').map(c=>c==='.'?-1:parseInt(c,36)),off:off?JSON.parse(off):{}};DRUMS.forEach(([d],i)=>{o.dr[d]=dr.slice(i*16,i*16+16).split('').map(c=>c==='1'?1:c==='g'?.6:0)});return o}
function packSave(){const d=JSON.stringify(S,(k,v)=>{if(k[0]==='_')return undefined;if(k==='pat'&&v&&v.A&&v.B)return{z:packPat(v.A)+'|'+packPat(v.B)};
    if(k==='score'&&v&&v.cats)return{total:v.total,grade:v.grade,fit:Math.round(v.fit*100)/100,inst:v.inst,cats:Object.fromEntries(Object.entries(v.cats).map(([a,b])=>[a,Math.round(b)])),notes:(v.notes||[]).slice(0,7).map(n=>({cat:n.cat,good:n.good,msg:n.msg,w:n.w}))};
    if(k==='msgs'&&Array.isArray(v))return v.slice(-14);if(k==='dh')return undefined;return v});return JSON.stringify({v:2,sum:sumOf(d),d,t:Date.now()})}
function fixPats(o){if(!o||typeof o!=='object')return;if(Array.isArray(o)){for(const x of o)fixPats(x);return}if(o.pat&&typeof o.pat.z==='string'){const[a,b]=o.pat.z.split('|');o.pat={A:unpackPat(a),B:unpackPat(b)}}for(const k in o){const v=o[k];if(v&&typeof v==='object'&&k!=='pat')fixPats(v)}}
function unpack(raw){try{const o=typeof raw==='string'?JSON.parse(raw):raw;if(!o||typeof o.d!=='string'||sumOf(o.d)!==o.sum)return null;const st=JSON.parse(o.d);if(st){fixPats(st.vault);fixPats(st.rel)}if(!st||!st.look||!Array.isArray(st.npcs)||typeof st.money!=='number')return null;return repair(st)}catch(e){return null}}
function repair(st){const base=newState({name:st.name||'Nova',look:st.look,origin:st.origin||'choir',genre:st.fav||'pop'});for(const k in base)if(st[k]===undefined||st[k]===null&&base[k]!==null)st[k]=base[k];
  for(const k of['money','fans','heat','energy','mood','image','listeners','sp'])if(!isFinite(st[k]))st[k]=base[k];for(const k in base.skills)if(!isFinite(st.skills[k]))st.skills[k]=base.skills[k];
  st.vault=(st.vault||[]).filter(s=>s&&s.pat&&s.score);st.rel=(st.rel||[]).filter(r=>r&&r.songs&&r.songs.length);for(const g of GKEYS)if(!isFinite(st.trend[g]))st.trend[g]=1;st.usedThisWeek=st.usedThisWeek||{posts:0,gigs:0,songs:0};for(const n of st.npcs)if(!n.prev)n.prev={song:randTitle(),q:60,w:20};return st}

function trySet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function saveNow(){if(!S)return;let p;try{p=packSave()}catch(e){return}
  if(!trySet(SAVE_KEY,p)){try{localStorage.removeItem(SAVE_KEY+'-b')}catch(e){}if(!trySet(SAVE_KEY,p)){S.feed.length=Math.min(S.feed.length,15);S.notes.length=0;for(const R of S.rel)if(S.week-R.week>80)R.weekly=R.weekly.slice(-8);p=packSave();if(!trySet(SAVE_KEY,p)){toast('Storage is full. Make a backup code in Settings.','bad');return}}}
  if(S.week!==lastBakW&&(S.week%3===0||!localStorage.getItem(SAVE_KEY+'-b'))){lastBakW=S.week;if(!trySet(SAVE_KEY+'-b',p)){try{localStorage.removeItem(SAVE_KEY+'-b')}catch(e){}}}}
function loadSave(){for(const k of[SAVE_KEY,SAVE_KEY+'-b']){try{const st=unpack(localStorage.getItem(k));if(st)return st}catch(e){}}return null}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveNow();stopSong()}});addEventListener('pagehide',saveNow);
/* ================= menu music ================= */
let bgmIdx=0,bgmSong=null;
function bgmPick(){const pool=(S?S.rel.slice(-6).flatMap(r=>r.songs).concat(S.vault.slice(-4)):[]).filter(s=>s&&s.pat);if(!pool.length){if(!bgmSong||bgmSong.rel)bgmSong=presetSong(S?S.fav:'lofi',777);return bgmSong}const s=pool[bgmIdx++%pool.length];return s}
function bgmTick(){if(!S||!AU.on||!AU.music||!AU.unlocked||document.hidden)return;if(AU.playing||LAB.open||$('#game')||$('#creator'))return;const s=bgmPick();if(!s)return;const P=playSong(s,{mode:'song',bgm:true,from:Math.max(0,s.arr.indexOf('V')),onEnd:()=>{}});if(P&&s.title&&s.score){const t=document.querySelector('#nowp');if(t){t.textContent='♪ '+s.title;t.hidden=false}}}
setInterval(bgmTick,1500);
/* ================= phone back button ================= */
function uiDepth(){return(!$('#modal').hidden?1:0)+($('#sheet').classList.contains('on')?1:0)+(LAB.open?1:0)+($('#game')?1:0)+(document.querySelector('.reveal')?1:0)}
let histN=0;setInterval(()=>{/* never leave a dark overlay with nothing on it */if($('#scrim').classList.contains('on')&&$('#modal').hidden&&!$('#sheet').classList.contains('on'))$('#scrim').classList.remove('on');if(!$('#modal').hidden&&!$('#modal').firstChild){$('#modal').hidden=true;modalQ=[]}const d=uiDepth();while(histN<d){try{history.pushState({lq:++histN},'')}catch(e){histN=d}}if(d===0)histN=0},300);
addEventListener('popstate',()=>{histN=Math.max(0,histN-1);if(!$('#modal').hidden){closeModal();return}if($('#game')&&GAME){GAME.finish(true);return}const rv=document.querySelector('.reveal');if(rv){ACT.revclose&&ACT.revclose();return}if($('#sheet').classList.contains('on')){closeSheet();return}if(LAB.open){labClose();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if($('#sheet').classList.contains('on'))closeSheet();else if(LAB.open)labClose()}});
/* ================= boot ================= */
function startApp(){$('#top').hidden=false;$('#dock').hidden=false;view='home';$$('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.go==='home'));render(false);if(S.pendingEvt)setTimeout(()=>showEvent(S.pendingEvt),600)}
function boot(){const t=$('#boot .title');t.innerHTML='Lacquer'.split('').map((c,i)=>`<span style="animation-delay:${.15+i*.07}s">${c}</span>`).join('');
  const msgs=['warming up the tubes','dusting the grooves','tuning the strings','pressing your record'];let i=0;const bar=$('#bootBar');
  const iv=setInterval(()=>{i++;bar.style.width=Math.min(100,i*26)+'%';if(msgs[i])$('#bootMsg').textContent=msgs[i];if(i>=4){clearInterval(iv);done()}},480);
  try{AU.on=localStorage.getItem('lacquer-mute')!=='1';AU.music=localStorage.getItem('lacquer-music')!=='0';AU.sfx=localStorage.getItem('lacquer-sfx')!=='0'}catch(e){}
  const done=()=>{const st=loadSave();if(st){S=st;startApp()}else creator();$('#boot').classList.add('out');setTimeout(()=>$('#boot').remove(),950)}}
document.addEventListener('pointerdown',()=>{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()},{passive:true});
window.__lq={get S(){return S},set S(v){S=v},ACT,go,render,refresh,LAB,openLab,labRender,scoreSong,finishSong,makeRelease,nextWeek,presetSong,newSong,newState,save:saveNow,loadSave,unpack,packSave,get GAME(){return GAME},tabs,creator,get CR(){return CR},startApp};
boot();

</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.getRegistration().then(reg=>{if(!reg)return;
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&had){const b=document.createElement('button');b.className='btn acid';b.textContent='New version ready · Tap to update';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:300';b.onclick=()=>{try{saveNow()}catch(e){}location.reload()};document.body.appendChild(b)}})});
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})}
</script>
