<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkyHub">
<meta name="theme-color" content="#0e141b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SkyHub Tycoon</title>
<style>
:root{--ink:#0e141b;--panel:rgba(16,22,29,0.92);--panel2:#141c25;--line:rgba(255,255,255,0.08);--line2:rgba(255,255,255,0.14);--text:#eef3f8;--muted:#8fa1b3;--acc:#ff8a3d;--amber:#f2c230;--mint:#38d39f;--coral:#ff5f57;--sky:#4c9be8;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
 --f:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--f);-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
canvas#cv{position:fixed;inset:0;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
.hidden{display:none!important}
body.menu #hud,body.menu #side,body.menu #bottom,body.menu #ticker,body.menu #toasts,body.menu #sheet,body.menu #live,body.menu #loupe{display:none!important}
.ic{display:block;flex:none}
.muted{color:var(--muted)}.small{font-size:12px}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 8px 24px rgba(0,0,0,.28)}
/* HUD */
#hud{position:fixed;top:calc(var(--st) + 8px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 64px);display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto;border-radius:12px}
#idc{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;min-height:40px}
#idc .code{font:700 13px var(--mono);background:var(--acc);color:#1a0d02;border-radius:7px;padding:5px 6px;letter-spacing:.04em}
#idc b{display:block;font-size:13px;line-height:1.1;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#idc span{font-size:10.5px;color:var(--muted)}
.stars{display:flex;gap:2px}.st{display:block;width:10px;height:10px;background:#36414f;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.st.f{background:var(--amber)}.st.h{background:linear-gradient(90deg,var(--amber) 50%,#36414f 50%)}
.stars.lg .st{width:18px;height:18px}
#money{font:700 15px var(--mono);color:var(--mint);padding:0 11px;display:flex;align-items:center;letter-spacing:-.02em}#money.neg{color:var(--coral)}
#clock{display:flex;flex-direction:column;justify-content:center;padding:0 10px;line-height:1.05}#clock b{font:700 15px var(--mono)}#clock span{font-size:10px;color:var(--muted)}
#wx{display:flex;align-items:center;gap:6px;padding:0 9px;color:#cfe1f2}#wx span{display:flex;flex-direction:column;font-size:10px;color:var(--muted);line-height:1.05}#wx b{color:var(--text);font-size:13px}
#speed{display:flex;align-items:center;padding:3px;gap:2px}
#speed button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#c6d3df}
#speed button.on{background:var(--text);color:var(--ink)}
#ticker{position:fixed;top:calc(var(--st) + 100px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 64px);max-width:560px;z-index:5;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;font-size:12px;line-height:1.3;cursor:pointer}
#ticker i,.rmsg i{font:700 9.5px var(--mono);font-style:normal;color:var(--ink);background:var(--amber);border-radius:4px;padding:2px 4px;flex:none}
#ticker span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#ticker b{color:var(--amber)}
#ticker.flash{animation:fl .6s}@keyframes fl{0%{border-color:var(--amber)}100%{border-color:var(--line)}}
#side{position:fixed;right:calc(var(--sr) + 8px);top:calc(var(--st) + 8px);display:flex;flex-direction:column;gap:6px;z-index:16;max-height:calc(100vh - 200px);overflow-y:auto;scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
#side button{position:relative;width:46px;height:44px;border-radius:12px;display:grid;place-items:center;color:#d8e3ee;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#side button.on{background:var(--text);color:var(--ink)}
#side #bRad{background:#0d2a24;color:#6ff0c6;border-color:#1f6b5a}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#1a0d02;font:700 11px var(--f);display:none;place-items:center;padding:0 4px}
/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);z-index:7;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom>*{pointer-events:auto}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.scrollx::-webkit-scrollbar{display:none}
#cats{border-radius:16px;padding:5px}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px 5px;border-radius:11px;min-width:58px;color:#b8c7d5}
.cat small{font-size:10px;font-weight:600;letter-spacing:.01em}
.cat.on{background:var(--text);color:var(--ink)}
#tray{border-radius:16px;padding:6px;background:var(--panel2)}
.item{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;padding:5px 4px 6px;border-radius:12px;text-align:center;border:1.5px solid transparent;color:var(--text)}
.item img{width:86px;height:66px;border-radius:8px;display:block}
.item b{font-size:11px;font-weight:600;line-height:1.15;margin-top:4px}
.item small{font:600 10px var(--mono);color:var(--amber);margin-top:1px}
.item i{font-size:9.5px;color:var(--muted);font-style:normal;line-height:1.15}
.item.on{border-color:var(--acc);background:rgba(255,138,61,.1)}
.item.locked{opacity:.4}
#opts{border-radius:14px;padding:5px;align-items:center}
.opt{flex:0 0 auto;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;border:1.5px solid transparent;white-space:nowrap}
.opt i{display:inline-block;width:18px;height:18px;border-radius:6px;border:1px solid rgba(255,255,255,.25)}
.opt i.def,.btn.def{background:repeating-linear-gradient(45deg,#fff 0 3px,#d7dde3 3px 6px)!important}
.opt.on{border-color:var(--acc)}
#hint{align-self:center;background:rgba(10,14,19,.75);padding:6px 12px;border-radius:10px;font-size:12px;color:#dfe9f3;display:none;pointer-events:none;text-align:center;max-width:94%}
#undo{align-self:flex-start;display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600}
#toasts{position:fixed;top:calc(var(--st) + 146px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 64px);display:flex;flex-direction:column;gap:5px;z-index:14;pointer-events:none;max-width:440px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--sky);padding:7px 11px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:tin .25s ease;transition:opacity .35s,transform .35s}
.toast.good{border-left-color:var(--mint)}.toast.bad{border-left-color:var(--coral)}.toast.warn{border-left-color:var(--amber)}
.toast.out{opacity:0;transform:translateY(-6px)}@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
/* sheet */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 8px);width:min(96vw,560px);max-height:74vh;background:var(--panel2);border:1px solid var(--line2);border-radius:18px;z-index:15;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:sup .22s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(98vw,900px);max-height:84vh}
@keyframes sup{from{transform:translate(-50%,24px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px 16px;border-bottom:1px solid var(--line)}
.sheet-head span{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sheet-head button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center}
#sheetBody{overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
#sheetBody h4,#rlist h5{margin:14px 0 6px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.btn{padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.small{padding:6px 10px;font-size:12px}
.btn.go{background:var(--acc);color:#1a0d02}
.btn.dis{background:rgba(255,255,255,.04);color:var(--muted)}
.btn.danger{background:rgba(255,95,87,.14);color:#ffb3ae}
.btn.on{background:var(--text);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.row.end{justify-content:flex-end}
.row.sw .btn{width:30px;height:30px;padding:0;border:2px solid rgba(255,255,255,.18)}.row.sw .btn.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card small{color:var(--muted);font-size:11.5px}.card p{margin:2px 0}
.card.offer.renew{border-color:rgba(56,211,159,.4)}
.alhead{display:flex;gap:9px;align-items:center}.alhead b{display:block;font-size:14px}.alhead small{color:var(--muted);font-size:11.5px}
.planeimg{width:100%;height:auto;border-radius:10px;background:#7e858d;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:6px 0}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.kv.big b{font-size:15px}
.note{padding:9px 11px;border-radius:10px;font-size:12.5px;margin:6px 0;background:rgba(76,155,232,.12)}.note.warn{background:rgba(242,194,48,.12);color:#f6dc8a}
.partner{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;background:rgba(255,255,255,.035);margin-bottom:6px}
.pinfo{flex:1;min-width:0}.pinfo b{display:block;font-size:13.5px}.pinfo em{font:600 11px var(--mono);color:var(--muted);font-style:normal}.pinfo small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:5px 0 3px}.bar i{display:block;height:100%}
.tag{font-size:11px;color:var(--muted);padding:4px 8px;border:1px solid var(--line2);border-radius:8px;white-space:nowrap}
.dir .partner{margin-bottom:4px}
/* contract doc */
.doc{background:#f4f1ea;color:#1b2430;border-radius:12px;padding:18px 18px 14px;font-size:13px;position:relative}
.doc .planeimg{background:#d8d3c8;margin:10px 0}
.dochead{display:flex;gap:12px;align-items:center;border-bottom:1px solid #d9d2c3;padding-bottom:12px}
.dochead small{font:700 10px var(--mono);letter-spacing:.08em;color:#8a7f6a}.dochead h3{margin:2px 0;font:700 22px ui-serif,Georgia,serif;letter-spacing:-.01em}.dochead span{color:#5b6672}
.clause{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #e3ddd0}.clause i{font:700 12px var(--mono);color:#a99a7a;font-style:normal;width:16px;flex:none;padding-top:2px}.clause b{font-weight:700}.clause p{margin:2px 0 0;color:#3a4652;line-height:1.45}
.reqs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.reqs b{margin-right:4px}.reqs span{font-size:12px;padding:3px 8px;border-radius:7px}.reqs .ok{background:#dcefe4;color:#1f6b45}.reqs .no{background:#f7dad7;color:#9b2d25}
.doc .kv span{color:#6b7480}.doc .btn{background:#e4ded1;color:#1b2430}.doc .btn.go{background:#1b2430;color:#f4f1ea}.doc .btn.ghost{border-color:#cfc6b4;background:transparent}
.sig{display:flex;align-items:center;gap:10px;margin-top:8px;color:#8a7f6a;font-size:11px;opacity:0}.sig svg{width:160px;height:34px}.sig path{stroke-dasharray:420;stroke-dashoffset:420}
.doc.signed .sig{opacity:1}.doc.signed .sig path{animation:sign .7s ease forwards}@keyframes sign{to{stroke-dashoffset:0}}
/* fids */
.fids{background:#080b0f;border-radius:12px;padding:6px;font:600 11.5px var(--mono);overflow-x:auto}
.fh,.fr{display:grid;grid-template-columns:52px 92px 1fr 1fr 44px 1.2fr;gap:6px;padding:6px 6px;align-items:center;min-width:560px}
.fh{color:#6d7a87;font-size:10px;letter-spacing:.08em;border-bottom:1px solid #1b232c}
.fr{color:#ffd76a;border-bottom:1px solid #121920}.fr i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle}
.fr.s-atgate span:last-child{color:var(--mint)}.fr.s-inbound span:last-child{color:#7fc6ff}.fr.s-cancel span:last-child,.fr.s-divert span:last-child{color:var(--coral)}.fr.s-departed{opacity:.5}
.chk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.chk span{font-size:11px;padding:4px 8px;border-radius:7px;font-weight:600}.chk .ok{background:rgba(56,211,159,.13);color:#9fe9cb}.chk .no{background:rgba(255,95,87,.13);color:#ffb3ae}
.log div{font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}.log .bad{color:#ffb3ae}.log .good{color:#9fe9cb}.log .warn{color:#f6dc8a}.log small{color:var(--muted);font-family:var(--mono)}
/* ratings */
.overall{display:flex;gap:14px;align-items:center;padding:6px 0 10px}.overall .big{font:800 44px var(--f);letter-spacing:-.03em}.overall small{color:var(--muted);display:block;margin-top:4px}
.rcat{padding:8px 0;border-bottom:1px solid var(--line)}.rcat .rt{display:flex;justify-content:space-between;align-items:center}.rcat b{font-size:13px}.rcat small{color:var(--muted);font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.ledger td:last-child{text-align:right;font-family:var(--mono)}.pos{color:var(--mint)}.neg{color:var(--coral)}.tot td{font-weight:700}
.chart{width:100%;height:auto;background:rgba(255,255,255,.03);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stats div{background:rgba(255,255,255,.04);border-radius:10px;padding:10px}.stats b{display:block;font:700 18px var(--mono)}.stats small{color:var(--muted)}
.fxs{display:flex;flex-wrap:wrap;gap:4px}.fxs span{font-size:10.5px;padding:3px 7px;border-radius:6px;background:rgba(56,211,159,.12);color:#9fe9cb}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}.staff div{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}.staff b{display:block;font:700 17px var(--mono)}.staff span{font-size:11.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.toggle div{flex:1}.toggle b{display:block;font-size:13px}.toggle small{color:var(--muted);font-size:11.5px}
.toggle input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#36414f;position:relative;transition:.2s;flex:none}.toggle input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle input:checked{background:var(--mint)}.toggle input:checked::after{left:21px}
.bridges{display:flex;flex-direction:column;gap:6px}.bridges .btn{justify-content:flex-start;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}.bridges .btn small{font-weight:400;font-size:11.5px;color:var(--muted)}.bridges .btn.on small{color:#3b4652}
.brands{display:flex;flex-direction:column;gap:6px}.brand{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.04);border-radius:12px;padding:8px;border:1.5px solid transparent}.brand.on{border-color:var(--mint)}.brand canvas{width:42px;height:42px;flex:none}.brand>div{flex:1}.brand b{display:block;font-size:13.5px}.brand small{color:var(--muted);font-size:11px}
.goals .goal{display:flex;gap:10px;align-items:center;padding:9px;border-radius:10px;background:rgba(255,255,255,.035);margin-bottom:5px}.goal .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--mint);flex:none}.goal b{flex:1;font-size:13px;font-weight:600}.goal small{color:var(--amber);font:600 11px var(--mono)}.goal.done{opacity:.5}
.menu{display:flex;flex-direction:column;gap:6px}.menu .btn{justify-content:flex-start;flex-direction:column;align-items:flex-start;padding:11px 13px;gap:2px}.menu .btn small{font-weight:400;color:var(--muted);font-size:11.5px}.menu .btn.on small{color:#3b4652}
.help{font-size:13px;color:#cfdbe8;line-height:1.5}.help ol{padding-left:18px;margin:4px 0}
.radiolog .rmsg,#rradio .rmsg{display:flex;gap:7px;align-items:flex-start;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.35}.rmsg small{font:600 10px var(--mono);color:var(--muted);padding-top:2px}.rmsg.atc b{color:var(--amber)}.rmsg.plt b{color:#7fc6ff}
/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,12,.55);display:grid;place-items:center;padding:20px}
.mbox{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:20px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox small{font:700 10px var(--mono);letter-spacing:.1em;color:var(--acc)}.mbox h3{margin:6px 0 8px;font-size:20px;letter-spacing:-.01em}.mbox p{color:#c7d4e0;font-size:14px;line-height:1.45;margin:0 0 14px}.mbtns{display:flex;flex-direction:column;gap:7px}.mbtns .btn{padding:12px}
/* radar */
#radar{position:fixed;inset:0;z-index:25;background:#03110f}
#rc{position:absolute;inset:0;touch-action:none}
.rtop{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;gap:5px;align-items:center;flex-wrap:nowrap;z-index:2}
.rtop .lbl{font:700 12px var(--mono);color:#6ff0c6;letter-spacing:.1em;padding:8px 10px;border:1px solid #1f6b5a;border-radius:10px;background:rgba(3,17,15,.85)}
.rtop button{flex:none;padding:8px 10px;border-radius:10px;border:1px solid #1f6b5a;background:rgba(3,17,15,.85);color:#bff5e2;font-size:12px;font-weight:600}
#rclose{margin-left:auto;display:grid;place-items:center;width:38px;height:36px;padding:0!important}
#rlist{position:absolute;top:calc(var(--st) + 56px);right:calc(var(--sr) + 8px);width:min(250px,46vw);max-height:42vh;overflow-y:auto;background:rgba(3,17,15,.85);border:1px solid #1f6b5a;border-radius:12px;padding:4px 10px 8px;font-size:12px}

function geoDist(a,b){ const R=6371, toR=Math.PI/180; const dLat=(b[0]-a[0])*toR, dLon=(b[1]-a[1])*toR; const h=Math.sin(dLat/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function geoBearing(a,b){ const toR=Math.PI/180; const y=Math.sin((b[1]-a[1])*toR)*Math.cos(b[0]*toR); const x=Math.cos(a[0]*toR)*Math.sin(b[0]*toR)-Math.sin(a[0]*toR)*Math.cos(b[0]*toR)*Math.cos((b[1]-a[1])*toR); return (Math.atan2(y,x)/toR+360)%360; }
function geoInterp(a,b,f){ const toR=Math.PI/180; const la1=a[0]*toR,lo1=a[1]*toR,la2=b[0]*toR,lo2=b[1]*toR; const d=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2)); if(d<1e-6) return a.slice();
  const A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d); const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2), y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2), z=A*Math.sin(la1)+B*Math.sin(la2);
  return [Math.atan2(z,Math.sqrt(x*x+y*y))/toR, Math.atan2(y,x)/toR]; }

function shade(hex, amt){ // amt -1..1

function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2)); else ctx.rect(x,y,w,h); }
const NOFX={flaps:0,spoil:false,rev:false};

  blades=blades||2; ctx.save(); ctx.translate(x,y);

    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,0.32,r,0,0,7); ctx.fill(); ctx.strokeStyle='rgba(255,210,60,0.55)'; ctx.lineWidth=0.08; ctx.beginPath(); ctx.ellipse(0,0,0.34,r,0,0,7); ctx.stroke();

}
function drawEngine(ctx,e,s,col,p,t,running,fx){

    ctx.fillStyle='#eef0f2'; rrect(ctx,e.x-e.len,y-e.d/2,e.len,e.d,e.d/2); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=0.06; ctx.stroke();

  const g=ctx.createLinearGradient(0,y-e.d/2,0,y+e.d/2); g.addColorStop(0,'rgba(0,0,0,0.12)'); g.addColorStop(0.35,'rgba(255,255,255,0.28)'); g.addColorStop(1,'rgba(0,0,0,0.25)'); ctx.fillStyle=g; rrect(ctx,e.x-e.len,y-e.d/2,e.len,e.d,e.d*0.42); ctx.fill();
  if(fx.rev){ ctx.fillStyle='#3c4148'; ctx.fillRect(e.x-e.len*0.62,y-e.d/2-0.12,e.len*0.18,e.d+0.24); ctx.fillStyle='rgba(255,255,255,0.4)'; for(let k=0;k<3;k++) ctx.fillRect(e.x-e.len*0.6+k*e.len*0.05,y-e.d/2-0.1,0.06,e.d+0.2); }

  ctx.fillStyle='#2b3036'; ctx.fillRect(e.x-0.06,y-e.d*0.38,0.06,e.d*0.76);

}
function finPts(p){
  const L=p.L, H=p.finH, prop=p.eng[0]==='p', swb = prop?0.35:0.7;
  const xl=-L/2+L*(p.tt?0.2:0.24), xt=-L/2+L*0.01;

}
function finCentroid(p){ const f=finPts(p); let x=0,z=0; f.forEach(q=>{x+=q[0];z+=q[1];}); return [x/4,0,z/4]; }
function drawFin(ctx,p,al,ox,oy,lw){
  const f=finPts(p).map(q=>[q[0]+q[1]*ox, q[1]*oy]);
  ctx.save(); poly(ctx,f); ctx.fillStyle=al.tail; ctx.fill(); ctx.clip();
  const st=al.finStyle, H=p.finH;
  ctx.fillStyle=al.accent;
  if(st==='split'){ poly(ctx,[f[0],f[1],[ (f[1][0]+f[2][0])/2,(f[1][1]+f[2][1])/2 ]]); ctx.fill(); }
  else if(st==='stripes'){ for(let i=1;i<4;i++){ const a=i/4.5; const p1=lerp2(f[0],f[3],a), p2=lerp2(f[1],f[2],a); ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.strokeStyle=al.accent; ctx.lineWidth=H*0.06; ctx.stroke(); } }
  else if(st==='band'){ const p1=lerp2(f[0],f[3],0.15), p2=lerp2(f[1],f[2],0.15), p3=lerp2(f[1],f[2],0.32), p4=lerp2(f[0],f[3],0.32); poly(ctx,[p1,p2,p3,p4]); ctx.fill(); }
  ctx.restore();
  poly(ctx,f); ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=lw; ctx.stroke();
}
function lerp2(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
function liveryFill(ctx,p,al){
  const L=p.L,W=p.W, pat=al.pat;
  const base = (pat==='full')?al.body: (pat==='twotone'?al.body:al.body);
  ctx.fillStyle=base; ctx.fillRect(-L,-W,2*L,2*W);
  switch(pat){
    case 'cheat': ctx.fillStyle=al.accent; ctx.fillRect(-L,-W/2,2*L,W*0.12); ctx.fillRect(-L,W*0.38,2*L,W*0.12); ctx.fillStyle=al.tail; ctx.fillRect(-L,-W/2,2*L,W*0.05); ctx.fillRect(-L,W*0.45,2*L,W*0.05); break;
    case 'crown': ctx.fillStyle=al.tail; ctx.fillRect(-L,-W*0.13,2*L,W*0.26); ctx.fillStyle=al.accent; ctx.fillRect(-L,-W*0.2,2*L,W*0.05); ctx.fillRect(-L,W*0.15,2*L,W*0.05); break;
    case 'belly': ctx.fillStyle=al.tail; ctx.fillRect(-L,-W/2,2*L,W*0.18); ctx.fillRect(-L,W*0.32,2*L,W*0.18); break;
    case 'twotone': ctx.fillStyle=al.tail; ctx.fillRect(-L,-W,L*0.95,2*W); ctx.fillStyle=al.accent; ctx.fillRect(-L*0.05-0.6,-W,0.6,2*W); break;
    case 'swoosh': ctx.fillStyle=al.tail; ctx.beginPath(); ctx.moveTo(L*0.05,-W); ctx.quadraticCurveTo(-L*0.15,0,L*0.1,W); ctx.lineTo(-L,W); ctx.lineTo(-L,-W); ctx.closePath(); ctx.fill(); ctx.fillStyle=al.accent; ctx.beginPath(); ctx.moveTo(L*0.12,-W); ctx.quadraticCurveTo(-L*0.08,0,L*0.17,W); ctx.lineTo(L*0.12,W); ctx.quadraticCurveTo(-L*0.13,0,L*0.07,-W); ctx.fill(); break;
    case 'nose': ctx.fillStyle=al.tail; ctx.fillRect(L/2-W*1.4,-W,W*2,2*W); ctx.fillRect(-L,-W,L*0.75,2*W); ctx.fillStyle=al.accent; ctx.fillRect(-L*0.25,-W,0.5,2*W); break;

// ===================== GROUND & OBJECT DRAWING (tile units) =====================
function thash(x,y){ let h=(x*374761393+y*668265263)^0x5bd1e995; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function box(ctx,x,y,w,d,z0,h,top,side){
  const t=(z0+h)*HF, b=z0*HF;
  if(side){ ctx.fillStyle=side; ctx.fillRect(x,y+d-t,w,t-b); }
  ctx.fillStyle=top; ctx.fillRect(x,y-t,w,d);
}
function cyl(ctx,cx,cy,r,z0,h,top,side){
  const t=(z0+h)*HF,b=z0*HF;
  ctx.fillStyle=side; ctx.fillRect(cx-r,cy-t,2*r,t-b); ctx.beginPath(); ctx.arc(cx,cy-b,r,0,Math.PI); ctx.fill();
  ctx.fillStyle=top; ctx.beginPath(); ctx.arc(cx,cy-t,r,0,7); ctx.fill();
}
// local→world mapping for rotated objects (base footprint W,H; front = +y in local)
function LR(o,lx,ly,lw,lh){ const W=OBJ[o.type].w,H=OBJ[o.type].h;
  switch(o.rot){ case 0:return [o.x+lx,o.y+ly,lw,lh]; case 2:return [o.x+W-lx-lw,o.y+H-ly-lh,lw,lh];
    case 1:return [o.x+H-ly-lh,o.y+lx,lh,lw]; default:return [o.x+ly,o.y+W-lx-lw,lh,lw]; } }
function LP(o,lx,ly){ const W=OBJ[o.type].w,H=OBJ[o.type].h;
  switch(o.rot){ case 0:return [o.x+lx,o.y+ly]; case 2:return [o.x+W-lx,o.y+H-ly]; case 1:return [o.x+H-ly,o.y+lx]; default:return [o.x+ly,o.y+W-lx]; } }
function lbox(ctx,o,lx,ly,lw,lh,z0,h,top,side){ const r=LR(o,lx,ly,lw,lh); box(ctx,r[0],r[1],r[2],r[3],z0,h,top,side); return r; }
function textAt(ctx,txt,x,y,size,col,font){ ctx.save(); ctx.translate(x,y); ctx.scale(size/20,size/20); ctx.font=(font||'bold 20px Arial, sans-serif'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=col; ctx.fillText(txt,0,1); ctx.restore(); }
function fitText(ctx,txt,x,y,maxW,size,col,font){ ctx.save(); ctx.font=(font||'bold 20px Arial, sans-serif'); const w=ctx.measureText(txt).width*size/20; const s=w>maxW?size*maxW/w:size; ctx.restore(); textAt(ctx,txt,x,y,s,col,font); }

// ---------------- ground tiles ----------------
function drawTile(ctx,x,y){
  const g=W.ground[y*MW+x], i=y*MW+x;
  if(g===0){ const v=thash(x,y); ctx.fillStyle = v<0.33?'#7fb85c':v<0.66?'#79b157':'#84bd61'; ctx.fillRect(x,y,1.02,1.02);
    if(v>0.93){ ctx.fillStyle='#6ea24c'; ctx.fillRect(x+0.3,y+0.5,0.12,0.12); ctx.fillRect(x+0.6,y+0.2,0.1,0.1);} return; }
  if(g===1){ ctx.fillStyle=PAVE[W.gcol[i]%PAVE.length]; ctx.fillRect(x,y,1.02,1.02); ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fillRect(x,y,1,0.03); ctx.fillRect(x,y,0.03,1);
    if(thash(x,y)>0.85){ctx.fillStyle='rgba(0,0,0,0.05)'; ctx.fillRect(x+0.2,y+0.3,0.4,0.3);} return; }
  if(g===2){ ctx.fillStyle='#5a5e64'; ctx.fillRect(x,y,1.02,1.02);
    const n=[W.ground[i-MW],W.ground[i+1],W.ground[i+MW],W.ground[i-1]];
    ctx.fillStyle='#f2c230'; const lw=0.07;
    const cnt=n.filter(v=>v===2||v===3).length;
    if(n[0]===2||n[0]===3) ctx.fillRect(x+0.5-lw/2,y,lw,0.5+lw/2);
    if(n[2]===2||n[2]===3) ctx.fillRect(x+0.5-lw/2,y+0.5-lw/2,lw,0.5+lw/2);
    if(n[3]===2||n[3]===3) ctx.fillRect(x,y+0.5-lw/2,0.5+lw/2,lw);
    if(n[1]===2||n[1]===3) ctx.fillRect(x+0.5-lw/2,y+0.5-lw/2,0.5+lw/2,lw);
    if(cnt===0){ ctx.beginPath(); ctx.arc(x+0.5,y+0.5,0.08,0,7); ctx.fill(); }
    ctx.fillStyle='#e9d16b';
    if(n[0]!==2&&n[0]!==3&&n[0]!==1) ctx.fillRect(x,y+0.04,1,0.04);
    if(n[2]!==2&&n[2]!==3&&n[2]!==1) ctx.fillRect(x,y+0.92,1,0.04);
    if(n[3]!==2&&n[3]!==3&&n[3]!==1) ctx.fillRect(x+0.04,y,0.04,1);
    if(n[1]!==2&&n[1]!==3&&n[1]!==1) ctx.fillRect(x+0.92,y,0.04,1);
    return; }
  if(g===3){ const r=W.runways.find(r=>r.id===W.rwid[i]); ctx.fillStyle=r?RUNWAYS[r.tier].col:'#45484d'; ctx.fillRect(x,y,1.02,1.02);
    if(r&&r.tier===0){ ctx.fillStyle='rgba(255,255,255,0.06)'; if((r.dir==='h'?x:y)%2) ctx.fillRect(x,y,1,1); }
    else { const v=thash(x,y); if(v>0.7){ ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(x,y+0.35,1,0.3);} }
    return; }
  if(g===4){ ctx.fillStyle='#3e4248'; ctx.fillRect(x,y,1.02,1.02);
    const h=W.ground[i-1]===4||W.ground[i+1]===4, v=W.ground[i-MW]===4||W.ground[i+MW]===4;
    ctx.fillStyle='rgba(255,255,255,0.75)'; if(h&&!v) ctx.fillRect(x+0.15,y+0.47,0.4,0.06); else if(v&&!h) ctx.fillRect(x+0.47,y+0.15,0.06,0.4);
    return; }
  if(g===5){ const c=W.fcol[i]?PAL[W.fcol[i]-1]:FLOOR_DEF[W.fstyle[i]]; const st=W.fstyle[i];

    switch(st){
      case 0: ctx.fillStyle='rgba(0,0,0,0.06)'; ctx.fillRect(x,y,0.5,0.5); ctx.fillRect(x+0.5,y+0.5,0.5,0.5); ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fillRect(x,y,1,0.02); ctx.fillRect(x,y,0.02,1); break;
      case 1: { ctx.fillStyle='rgba(255,255,255,0.08)'; const v=thash(x,y); ctx.fillRect(x+v*0.7,y+0.2,0.08,0.08); ctx.fillRect(x+0.2,y+v*0.7,0.06,0.06); break; }
      case 2: { ctx.strokeStyle='rgba(120,110,100,0.18)'; ctx.lineWidth=0.025; const v=thash(x,y); ctx.beginPath(); ctx.moveTo(x,y+v); ctx.quadraticCurveTo(x+0.5,y+v*0.3+0.3,x+1,y+1-v); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(x,y,1,0.02); break; }
      case 3: ctx.fillStyle='rgba(0,0,0,0.12)'; for(let k=0;k<4;k++) ctx.fillRect(x,y+k*0.25,1,0.018); ctx.fillRect(x+((x*7+y*3)%4)*0.25,y,0.018,0.25); ctx.fillRect(x+((x*5+y)%4)*0.25,y+0.5,0.018,0.25); break;
      case 4: { ctx.fillStyle='rgba(0,0,0,0.13)'; for(let k=0;k<5;k++){const a=thash(x*7+k,y*3),b=thash(x+k*11,y*5); ctx.fillRect(x+a*0.9,y+b*0.9,0.06,0.06);} ctx.fillStyle='rgba(255,255,255,0.18)'; for(let k=0;k<3;k++){const a=thash(x*3+k,y*13),b=thash(x+k*7,y*2); ctx.fillRect(x+a*0.9,y+b*0.9,0.05,0.05);} break; }
      case 5: ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fillRect(x,y,1,0.5); break;
    }
    if(W.zone[i]===1){ ctx.fillStyle='rgba(212,175,55,0.16)'; ctx.fillRect(x,y,1,1); ctx.fillStyle='rgba(212,175,55,0.35)'; if((x+y)%2===0) ctx.fillRect(x+0.45,y+0.45,0.1,0.1); }
    return; }
}

// ---------------- walls ----------------
function drawWall(ctx,x,y,t,low){
  const w=WALLS[t], h=(low?0.22:WALL_H)*HF, i=y*MW+x;
  const southWall = y+1<MH && W.wall[i+MW]>0 && !low;
  if(!southWall){ ctx.fillStyle=w.s; ctx.fillRect(x,y+1-h,1,h);
    // details
    if(!low){
      if(w.glass||w.door){ ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x+0.1,y+1-h+0.04,0.06,h-0.08); ctx.fillStyle='rgba(60,80,100,0.6)'; ctx.fillRect(x,y+1-h,1,0.03); ctx.fillRect(x+0.98,y+1-h,0.03,h); if(w.door){ctx.fillStyle='rgba(40,60,80,0.7)';ctx.fillRect(x+0.49,y+1-h,0.03,h);} }
      else if(w.brick){ ctx.fillStyle='rgba(0,0,0,0.18)'; for(let k=1;k<5;k++) ctx.fillRect(x,y+1-h+k*h/5,1,0.015); for(let k=0;k<5;k++) ctx.fillRect(x+((k%2)?0.25:0.75),y+1-h+k*h/5,0.015,h/5); }
      else if(w.stone){ ctx.fillStyle='rgba(0,0,0,0.15)'; for(let k=1;k<3;k++) ctx.fillRect(x,y+1-h+k*h/3,1,0.02); ctx.fillRect(x+(thash(x,y)*0.8+0.1),y+1-h,0.02,h/3); ctx.fillRect(x+(thash(y,x)*0.8+0.1),y+1-h*2/3,0.02,h/3); }
      else if(w.wood){ ctx.fillStyle='rgba(0,0,0,0.15)'; for(let k=1;k<6;k++) ctx.fillRect(x+k/6,y+1-h,0.012,h); }
      else if(w.steel){ ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(x,y+1-h,1,0.03); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x+0.5,y+1-h,0.015,h); }
      else if(w.marble){ ctx.strokeStyle='rgba(120,110,100,0.3)'; ctx.lineWidth=0.02; ctx.beginPath(); ctx.moveTo(x,y+1-h*0.7); ctx.quadraticCurveTo(x+0.5,y+1-h*0.2,x+1,y+1-h*0.6); ctx.stroke(); }
      else { ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(x,y+1-0.05,1,0.05); }
    }
  }
  ctx.fillStyle=w.c; ctx.fillRect(x,y-h,1,1);
  if(!w.glass&&!w.door){ ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(x,y-h,1,0.06); }
}

// ---------------- people ----------------
const SKIN=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac','#f5cba7'];
const SHIRT=['#e63946','#457b9d','#2a9d8f','#e9c46a','#f4a261','#6d597a','#264653','#ffb4a2','#90be6d','#577590','#f8f9fa','#3d405b'];
const HAIR=['#2b1d0e','#4a3728','#000000','#b5651d','#e6c07b','#7a7a7a','#8b3a1a'];
function drawPerson(ctx,x,y,a,t){
  const sit=a.sit, bob = a.moving? Math.abs(Math.sin(t*12+a.seed*9))*0.03 : 0, lift=sit?0.12:0;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x,y,0.11,0.05,0,0,7); ctx.fill();
  const by=y-lift*HF-bob;
  if(a.bag && !sit){ ctx.fillStyle=a.bag; ctx.fillRect(x+0.08,y-0.14,0.09,0.13); ctx.fillStyle='#222'; ctx.fillRect(x+0.11,y-0.17,0.03,0.03); }
  if(!sit){ ctx.fillStyle='#2b2d42'; ctx.fillRect(x-0.06,by-0.1,0.05,0.1); ctx.fillRect(x+0.01,by-0.1,0.05,0.1); }
  ctx.fillStyle=a.shirt; rrect(ctx,x-0.08,by-0.27,0.16,0.18,0.05); ctx.fill();
  if(a.prem){ ctx.fillStyle='#fff'; ctx.fillRect(x-0.015,by-0.27,0.03,0.08); }
  ctx.fillStyle=a.skin; ctx.beginPath(); ctx.arc(x,by-0.32,0.065,0,7); ctx.fill();
  ctx.fillStyle=a.hair; ctx.beginPath(); ctx.arc(x,by-0.34,0.066,Math.PI,0); ctx.fill();
}

// ---------------- objects ----------------
function objColor(o,def){ return o.col!=null ? PAL[o.col] : def; }
function person(ctx,p,shirt,t,seed){ drawPerson(ctx,p[0],p[1],{shirt,skin:SKIN[seed%SKIN.length],hair:HAIR[seed%HAIR.length],seed},t); }
function drawObject(ctx,o,t,detail){
  const d=OBJ[o.type], Wd=d.w, Hd=d.h;
  const f=DRAW[d.kind==='shop'?'shop':o.type] || DRAW[d.kind] || DRAW.generic;
  f(ctx,o,d,t,detail,Wd,Hd);

function seatSlots(o){
  const d=OBJ[o.type], v=o.var||0, Wd=d.w; const out=[];
  switch(o.type){
    case 'bench': if(v===1){ for(let k=0;k<6;k++){ out.push([0.25+k*0.5,0.78,0]); out.push([0.25+k*0.5,0.22,2]); } }
      else if(v===2){ for(let k=0;k<6;k++){ const a=Math.PI*(0.15+0.7*k/5); out.push([1.5-Math.cos(a)*1.25,0.75-Math.sin(a)*0.45+0.1,0]); } }
      else if(v===4){ for(let k=0;k<3;k++) out.push([0.5+k,0.55,0]); }
      else for(let k=0;k<6;k++) out.push([0.25+k*0.5,0.6,0]); break;
    case 'sofa': for(let k=0;k<(v===2?3:3);k++) out.push([0.35+k*0.65,0.6,0]); break;
    case 'armchair': out.push([0.5,0.6,0]); break;
    case 'lchair': out.push([0.5,0.6,0]); break;
    case 'lsofa': for(let k=0;k<4;k++) out.push([0.4+k*0.73,0.6,0]); break;
    case 'ltable': out.push([0.5,0.15,2],[1.5,0.15,2],[0.5,1.85,0],[1.5,1.85,0]); break;
    case 'lstools': for(let k=0;k<4;k++) out.push([0.4+k*0.73,0.5,2]); break;
    case 'lpod': out.push([0.5,1.0,0]); break;
  }
  return out;
}

function drawShop(ctx,o,d,t,detail,Wd,Hd){

  if(p.eng==='w2'||p.eng==='w4'||p.eng==='m3'){ const ex=wx+p.rootC*0.35; ctx.fillStyle=ec; rrect(ctx,ex-el*0.4,H*0.42,el,ed,ed*0.45); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=0.08; ctx.stroke(); if(v.engine==='striped'){ ctx.fillStyle=v.tail; ctx.fillRect(ex-el*0.1,H*0.42,el*0.15,ed);} ctx.fillStyle='#596069'; ctx.fillRect(ex-el*0.4-ed*0.3,H*0.42+ed*0.25,ed*0.3,ed*0.5);
    if(p.eng==='w4'){ ctx.globalAlpha=0.6; rrect(ctx,ex-el*0.4-L*0.08,H*0.38,el*0.95,ed*0.9,ed*0.4); ctx.fillStyle=ec; ctx.fill(); ctx.globalAlpha=1; } }
  if(p.eng==='t2'||p.eng==='t3'){ ctx.fillStyle=ec; rrect(ctx,tail+L*0.14,-H*0.62,L*0.13,H*0.42,H*0.2); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=0.06; ctx.stroke(); }
  if(p.eng==='m3'||p.eng==='t3'){ ctx.fillStyle=ec; rrect(ctx,tail+L*0.02,-H*0.55-p.finH*0.1,L*0.12,H*0.35,H*0.15); ctx.fill(); }
  if(p.eng[0]==='p'){ const ex=p.eng==='p1'?nose:wx+p.rootC*0.6; const ey=p.eng==='p1'?0:(p.hw?-H*0.62:H*0.3); ctx.fillStyle=ec; if(p.eng!=='p1'){ rrect(ctx,ex-p.rootC*1.4,ey-H*0.16,p.rootC*1.6,H*0.32,H*0.15); ctx.fill(); } ctx.strokeStyle='rgba(40,40,40,0.6)'; ctx.lineWidth=0.12; ctx.beginPath(); ctx.moveTo(ex+0.25,ey-p.S*0.13); ctx.lineTo(ex+0.25,ey+p.S*0.13); ctx.stroke(); }
  if(p.hw){ ctx.fillStyle='#c9d0d8'; ctx.fillRect(wx-p.rootC*0.7,-H*0.6,p.rootC*1.3,H*0.12); }
  // tail logo
  if(v.logoOnTail!=='none'){ const t=0.55, lx=(fpts[0][0]+(fpts[3][0]-fpts[0][0])*t + fpts[1][0]+(fpts[2][0]-fpts[1][0])*t)/2, ly=-H*0.42-Hf*t; const chord=(fb-ft)*(1-0.58*t); const r=Math.min(Hf*0.3,chord*0.4)*(v.logoOnTail==='big'?1:0.62);
    ctx.save(); poly(ctx,fpts); ctx.clip(); if(al.custom&&curLogo()) drawCustomLogo(ctx,curLogo(),lx,ly,r); else drawLogo(ctx,al.logo,lx,ly,r,al.accent,null,al.name[0]); ctx.restore(); }
  ctx.restore();
}
// ---------- cabin map ----------
function abreast(p,c){ const w=p.Wreal; if(c==='Y') return w<2.2?2:w<2.8?3:w<3.2?4:w<3.6?5:w<4.2?6:w<5.2?7:w<5.8?8:w<6.3?9:10; if(c==='W') return w<3.2?3:w<4.2?6:w<6?7:8; if(c==='J') return w<3.2?2:w<4.2?4:4; return w<4.2?2:4; }
function drawCabin(ctx,p,cfg,W0,H0){
  ctx.clearRect(0,0,W0,H0); const pad=10, len=W0-pad*2, cy=H0/2, fh=Math.min(H0-20,len*p.Wreal/p.L*1.9);
  ctx.fillStyle='#e9edf1'; rrect(ctx,pad,cy-fh/2,len,fh,fh/2); ctx.fill(); ctx.strokeStyle='#9aa4ad'; ctx.lineWidth=1.5; ctx.stroke();
  const cols={F:'#c9a227',J:'#2c4a9a',W:'#2a9d8f',Y:'#7f8c8d'}; let x=pad+len*0.93; const end=pad+len*0.06; const rowsTot={};
  const seq=['F','J','W','Y']; const rowLen={F:2.1,J:1.6,W:1.05,Y:0.8}; let unitsLen=0; for(const c of seq){ const n=cfg[c]||0; if(!n) continue; const rows=Math.ceil(n/abreast(p,c)); rowsTot[c]=rows; unitsLen+=rows*rowLen[c]+1; }
  const k=Math.min(1,(x-end)/Math.max(1,unitsLen*9))*9;
  for(const c of seq){ const n=cfg[c]||0; if(!n) continue; const ab=abreast(p,c), rows=rowsTot[c], rl=rowLen[c]*k; ctx.fillStyle=cols[c]; let left=n;
    for(let r=0;r<rows;r++){ const inRow=Math.min(ab,left); left-=inRow; const sw=(fh*0.78)/ab; for(let s=0;s<inRow;s++){ const aisle=ab>=6?(s>=ab/2?sw*0.35:0):ab>=4?(s>=ab/2?sw*0.3:0):0; ctx.fillRect(x-rl*0.8,cy-fh*0.39+s*sw+aisle-(ab>=4?sw*0.15:0),rl*0.7,sw*0.75); } x-=rl; }
    x-=k*0.9; }
  ctx.fillStyle='#16202b'; ctx.beginPath(); ctx.arc(pad+len-fh*0.25,cy,fh*0.12,0,7); ctx.fill();
}

// ===================== WORLD STATE / BUILD / PATHING =====================
let W = null;
const N = MW*MH;
function newWorld(){
  const w = {
    ground:new Uint8Array(N), gcol:new Uint8Array(N), fstyle:new Uint8Array(N), fcol:new Uint8Array(N),
    wall:new Uint8Array(N), zone:new Uint8Array(N), occ:new Int32Array(N), rwid:new Int16Array(N),
    owned:new Uint8Array((MW/PLOT)*(MH/PLOT)),
    objs:[], runways:[], stands:[], nextId:1,
    money:600000, day:1, time:6*60, rep:50, tier:0, paxTotal:0, flightsTotal:0,
    signed:{}, flights:[], ledger:{}, today:{flights:0,pax:0,paxDep:0}, log:[], history:[], goalsDone:{}, nextGate:1, nextStand:1, nextBag:1,
    stats:{wait:0,waitN:0,lost:0,noSeat:0,divert:0,served:0,satSum:0,satN:0}
  };
  for(const [px,py] of [[1,1],[2,1],[1,2],[2,2]]) w.owned[py*(MW/PLOT)+px]=1;
  return w;
}
const PX = MW/PLOT, PY = MH/PLOT;
function owned(x,y){ return x>=0&&y>=0&&x<MW&&y<MH && W.owned[((y/PLOT)|0)*PX+((x/PLOT)|0)]===1; }
function plotPrice(){ let n=0; for(const v of W.owned) n+=v; return Math.round(150000*Math.pow(1.45,n-4)/1000)*1000; }
let objById = new Map();
function reindex(){ objById=new Map(); for(const o of W.objs) objById.set(o.id,o); }
let walkVer = 1, airVer = 1;
const dirty = new Set(); // chunk keys to redraw
function markDirty(x0,y0,x1,y1){ for(let cy=Math.floor((y0-1)/16);cy<=Math.floor((y1+1)/16);cy++) for(let cx=Math.floor((x0-1)/16);cx<=Math.floor((x1+1)/16);cx++) dirty.add(cx+','+cy); }
function markAllDirty(){ chunkCache.clear(); chunkHi.clear(); }

// ---------- money ----------
function spend(amount, cat){ W.money-=amount; led(cat||'construction',-amount); }
function earn(amount, cat){ W.money+=amount; led(cat,amount); }
function led(cat,v){ W.ledger[cat]=(W.ledger[cat]||0)+v; }
function canAfford(c){ if(W.money>=c) return true; toast('Not enough money ($'+fmt(c)+' needed)','bad'); return false; }

// ---------- object geometry ----------
function objFoot(type,rot){ const d=OBJ[type]; return (rot%2===0)?[d.w,d.h]:[d.h,d.w]; }
const DIRS=[[0,1],[-1,0],[0,-1],[1,0]]; // rot: front direction S,W,N,E
function frontTiles(o){ // candidate interaction tiles, front first
  const d=OBJ[o.type], out=[], [fx,fy]=DIRS[o.rot];
  const cx=o.x+Math.floor((o.w-1)/2), cy=o.y+Math.floor((o.h-1)/2);
  if(fx===0){ const yy=fy>0?o.y+o.h:o.y-1; for(let k=0;k<o.w;k++){ const xx=o.x+((Math.floor(o.w/2)+(k%2?-1:1)*Math.ceil(k/2))%o.w+o.w)%o.w; out.push([xx,yy]); } }
  else { const xx=fx>0?o.x+o.w:o.x-1; for(let k=0;k<o.h;k++){ const yy=o.y+((Math.floor(o.h/2)+(k%2?-1:1)*Math.ceil(k/2))%o.h+o.h)%o.h; out.push([xx,yy]); } }
  return out;
}
function backTile(o){ const [fx,fy]=DIRS[o.rot]; const cx=o.x+Math.floor(o.w/2), cy=o.y+Math.floor(o.h/2);
  if(fx===0) return fy>0?[cx,o.y-1]:[cx,o.y+o.h]; return fx>0?[o.x-1,cy]:[o.x+o.w,cy]; }
function perimeter(o){ const out=[]; for(let x=o.x;x<o.x+o.w;x++){out.push([x,o.y-1]);out.push([x,o.y+o.h]);} for(let y=o.y;y<o.y+o.h;y++){out.push([o.x-1,y]);out.push([o.x+o.w,y]);} return out; }
function computeUse(o){
  const d=OBJ[o.type]; o.ut=-1; o.bt=-1;
  if(d.air||d.kind==='parking'||d.kind==='hydrant'||d.kind==='windsock') return;
  if(!d.solid){ o.ut=(o.y+Math.floor(o.h/2))*MW+o.x+Math.floor(o.w/2); return; }
  for(const [x,y] of frontTiles(o)) if(walkable(x,y)){ o.ut=y*MW+x; break; }
  if(o.ut<0 && d.kind!=='pass') for(const [x,y] of perimeter(o)) if(walkable(x,y)){ o.ut=y*MW+x; break; }
  if(d.kind==='pass'){ const [bx,by]=backTile(o); if(walkable(bx,by)) o.bt=by*MW+bx; }
}
function recomputeUses(){ for(const o of W.objs) computeUse(o); }
function walkable(x,y){ if(x<0||y<0||x>=MW||y>=MH) return false; const i=y*MW+x; if(W.ground[i]!==5) return false; const wl=W.wall[i]; if(wl && wl!==8) return false; const oc=W.occ[i]; if(oc>0){ const o=objById.get(oc); if(o && OBJ[o.type].solid) return false; } return true; }
function inLounge(o){ let n=0; for(let y=o.y;y<o.y+o.h;y++) for(let x=o.x;x<o.x+o.w;x++) if(W.zone[y*MW+x]===1) n++; return n>=Math.ceil(o.w*o.h/2); }

// ---------- placement ----------
function checkPlace(type,x,y,rot){
  const d=OBJ[type], [w,h]=objFoot(type,rot);
  if(d.ap && W.tier<d.ap) return 'Requires '+AP_TIERS[d.ap].n;
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++){
    if(!owned(xx,yy)) return 'Land not owned';
    const i=yy*MW+xx; if(W.occ[i]) return 'Blocked';
    if(W.wall[i]) return 'Wall in the way';
    const g=W.ground[i];
    if(d.air||d.kind==='parking'){ if(g===5) return 'Must be outside'; if(g===3) return 'Not on runway'; if(d.kind==='hydrant'&&g!==1) return 'Place on apron/stand'; }
    else if(d.kind==='windsock'){ if(g===3||g===5) return 'Place on grass'; }
    else if(g!==5) return 'Needs terminal floor';
  }
  return null;
}
function placeObj(type,x,y,rot,col,vr,free){
  const err=checkPlace(type,x,y,rot); if(err){ toast(err,'bad'); return null; }
  const d=OBJ[type]; if(!free && !canAfford(d.cost)) return null;
  if(!free) spend(d.cost);
  const [w,h]=objFoot(type,rot);
  const o={id:W.nextId++,type,x,y,w,h,rot,col:col??null,var:vr||0,brand:null};
  if(type==='gate') o.num=W.nextGate++;
  if(d.kind==='carousel') o.num=W.nextBag++;
  W.objs.push(o); objById.set(o.id,o);
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++){ const i=yy*MW+xx; W.occ[i]=o.id; if((d.air||d.kind==='parking') && W.ground[i]===0 && d.kind!=='windsock'){ W.ground[i]=d.kind==='parking'?4:1; } }
  if(d.kind==='seat') o.slots=new Array(seatSlots(o).length).fill(0);
  markDirty(x,y,x+w,y+h); walkVer++; airVer++; recomputeUses(); FX.place(x+w/2,y+h/2);
  return o;
}
function removeObj(o,refund=true){
  const d=OBJ[o.type];
  for(let yy=o.y;yy<o.y+o.h;yy++) for(let xx=o.x;xx<o.x+o.w;xx++) W.occ[yy*MW+xx]=0;
  W.objs=W.objs.filter(q=>q!==o); objById.delete(o.id);
  if(refund) earn(Math.round(d.cost*0.4),'construction');
  markDirty(o.x,o.y,o.x+o.w,o.y+o.h); walkVer++; airVer++; recomputeUses();
  for(const a of SIM.agents) if(a.obj===o.id){ a.obj=null; a.sit=false; a.state=a.dep?'free':'exit'; a.timer=0; }
}
// paint tools
function paintRect(tool,x0,y0,x1,y1,opt){
  if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0];
  let cost=0, tiles=[];
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    if(!owned(x,y)) continue; const i=y*MW+x, g=W.ground[i];
    switch(tool){
      case 'apron': case 'taxiway': case 'road': {
        if(W.wall[i]||g===3) continue; if(W.occ[i]>0 && g===5) continue; if(W.occ[i]<0 && tool!=='apron') continue;
        const gv = tool==='apron'?1:tool==='taxiway'?2:4;
        if(g===gv && (tool!=='apron'||W.gcol[i]===opt.col)) continue;
        tiles.push(i); cost += tool==='taxiway'?220:tool==='apron'?160:120; break; }
      case 'floor': if(g===3||W.occ[i]<0) continue; if(W.occ[i]>0 && g!==5) continue; if(g===5&&W.fstyle[i]===opt.style&&W.fcol[i]===opt.col) continue; tiles.push(i); cost+=g===5?20:60; break;
      case 'grass': if(g===0||g===3||W.occ[i]) continue; if(W.wall[i]) continue; tiles.push(i); cost+=10; break;
      case 'lounge': if(g!==5) continue; if(W.zone[i]===1) continue; tiles.push(i); cost+=40; break;
      case 'unzone': if(W.zone[i]===0) continue; tiles.push(i); break;
    }
  }
  if(!tiles.length) return;
  if(!canAfford(cost)) return; spend(cost);
  for(const i of tiles){
    switch(tool){
      case 'apron': W.ground[i]=1; W.gcol[i]=opt.col; W.zone[i]=0; break;
      case 'taxiway': W.ground[i]=2; W.zone[i]=0; break;
      case 'road': W.ground[i]=4; W.zone[i]=0; break;
      case 'floor': W.ground[i]=5; W.fstyle[i]=opt.style; W.fcol[i]=opt.col; break;
      case 'grass': W.ground[i]=0; W.zone[i]=0; break;
      case 'lounge': W.zone[i]=1; break;
      case 'unzone': W.zone[i]=0; break;
    }
  }
  markDirty(x0,y0,x1,y1); walkVer++; airVer++; recomputeUses(); FX.place((x0+x1)/2+0.5,(y0+y1)/2+0.5);
}
function wallLine(x0,y0,x1,y1,type,rect){
  const tiles=[];
  if(rect){ if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0];
    for(let x=x0;x<=x1;x++){tiles.push([x,y0]);tiles.push([x,y1]);} for(let y=y0+1;y<y1;y++){tiles.push([x0,y]);tiles.push([x1,y]);} }
  else { if(Math.abs(x1-x0)>=Math.abs(y1-y0)){ y1=y0; const s=Math.sign(x1-x0)||1; for(let x=x0;x!==x1+s;x+=s) tiles.push([x,y0]); } else { x1=x0; const s=Math.sign(y1-y0)||1; for(let y=y0;y!==y1+s;y+=s) tiles.push([x0,y]); } }
  let cost=0; const ok=[];
  for(const [x,y] of tiles){ if(!owned(x,y)) continue; const i=y*MW+x; if(W.occ[i]||W.ground[i]===3||W.wall[i]===type) continue; ok.push(i); cost+=WALLS[type].cost; }
  if(!ok.length) return; if(!canAfford(cost)) return; spend(cost);
  for(const i of ok){ W.wall[i]=type; if(W.ground[i]!==5){ W.ground[i]=5; W.fstyle[i]=0; W.fcol[i]=0; } }
  markDirty(Math.min(x0,x1),Math.min(y0,y1),Math.max(x0,x1),Math.max(y0,y1)); walkVer++; airVer++; recomputeUses(); FX.place((x0+x1)/2,(y0+y1)/2);
}
function buildRoom(x0,y0,x1,y1,wallType,style,col){
  if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0];
  if(x1-x0<2||y1-y0<2){ toast('Room too small','bad'); return; }
  paintRect('floor',x0,y0,x1,y1,{style,col}); wallLine(x0,y0,x1,y1,wallType,true);
}
function removeWalls(x0,y0,x1,y1){ if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0]; let n=0;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ if(!owned(x,y)) continue; const i=y*MW+x; if(W.wall[i]){ earn(Math.round(WALLS[W.wall[i]].cost*0.3),'construction'); W.wall[i]=0; n++; } }
  if(n){ markDirty(x0,y0,x1,y1); walkVer++; recomputeUses(); }
}
function placeRunway(x0,y0,x1,y1,tier){
  const R=RUNWAYS[tier]; if(W.tier<R.ap){ toast('Requires '+AP_TIERS[R.ap].n,'bad'); return; }
  const horiz=Math.abs(x1-x0)>=Math.abs(y1-y0); let x,y,w,h,len;
  if(horiz){ x=Math.min(x0,x1); len=Math.abs(x1-x0)+1; w=len; h=R.w; y=y0-Math.floor(R.w/2); }
  else { y=Math.min(y0,y1); len=Math.abs(y1-y0)+1; h=len; w=R.w; x=x0-Math.floor(R.w/2); }
  if(len<R.minL){ toast(R.n+' needs at least '+R.minL+' tiles length','bad'); return; }
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++){ if(!owned(xx,yy)){toast('Land not owned','bad');return;} const i=yy*MW+xx; if(W.occ[i]||W.wall[i]||W.ground[i]===5||W.ground[i]===3){toast('Area blocked','bad');return;} }
  const cost=w*h*R.cost; if(!canAfford(cost)) return; spend(cost);
  const r={id:W.runways.length? Math.max(...W.runways.map(q=>q.id))+1 : 1, x,y,w,h,dir:horiz?'h':'v',tier,len,busy:null};
  W.runways.push(r);
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++){ const i=yy*MW+xx; W.ground[i]=3; W.rwid[i]=r.id; }
  markDirty(x,y,x+w,y+h); airVer++; FX.place(x+w/2,y+h/2); toast(R.n+' built ('+len*TILE_M*12+' m)','good');
  return r;
}
function removeRunway(r){ for(let yy=r.y;yy<r.y+r.h;yy++) for(let xx=r.x;xx<r.x+r.w;xx++){ const i=yy*MW+xx; W.ground[i]=0; W.rwid[i]=0; }
  W.runways=W.runways.filter(q=>q!==r); earn(Math.round(r.w*r.h*RUNWAYS[r.tier].cost*0.3),'construction'); markDirty(r.x,r.y,r.x+r.w,r.y+r.h); airVer++; }
function placeStand(cls,x,y,rot){
  if(W.tier<STAND_AP[cls]){ toast('Requires '+AP_TIERS[STAND_AP[cls]].n,'bad'); return; }
  const s=STAND_SIZE[cls];
  for(let yy=y;yy<y+s;yy++) for(let xx=x;xx<x+s;xx++){ if(!owned(xx,yy)){toast('Land not owned','bad');return;} const i=yy*MW+xx; if(W.occ[i]||W.wall[i]||W.ground[i]===5||W.ground[i]===3){toast('Area blocked','bad');return;} }
  if(!canAfford(STAND_COST[cls])) return; spend(STAND_COST[cls]);
  const st={id:W.nextId++,cls,x,y,s,rot,num:W.nextStand++,bridge:false,hydrant:false,plane:null,resv:null};
  W.stands.push(st);
  for(let yy=y;yy<y+s;yy++) for(let xx=x;xx<x+s;xx++){ const i=yy*MW+xx; W.occ[i]=-st.id; if(W.ground[i]!==1) W.ground[i]=1; }
  markDirty(x,y,x+s,y+s); airVer++; FX.place(x+s/2,y+s/2);
  return st;
}
function removeStand(st){ if(st.plane){ toast('A plane is parked here','bad'); return; }
  for(let yy=st.y;yy<st.y+st.s;yy++) for(let xx=st.x;xx<st.x+st.s;xx++) W.occ[yy*MW+xx]=0;
  W.stands=W.stands.filter(q=>q!==st); earn(Math.round(STAND_COST[st.cls]*0.4),'construction'); markDirty(st.x,st.y,st.x+st.s,st.y+st.s); airVer++; }
function standAt(x,y){ const v=W.occ[y*MW+x]; if(v<0) return W.stands.find(s=>s.id===-v); return null; }
function bulldoze(x,y){
  if(!owned(x,y)) return;
  const i=y*MW+x, v=W.occ[i];
  if(v>0){ const o=objById.get(v); if(o){ removeObj(o); FX.poof(o.x+o.w/2,o.y+o.h/2); } return; }
  if(v<0){ const st=standAt(x,y); if(st){ removeStand(st); FX.poof(x,y);} return; }
  if(W.wall[i]){ removeWalls(x,y,x,y); FX.poof(x+0.5,y+0.5); return; }

}

// Radar coordinates: km, x = east, y = north, origin = airport reference point.
const NATO=['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel','India','Juliett','Kilo','Lima','Mike','November','Oscar','Papa','Quebec','Romeo','Sierra','Tango','Uniform','Victor','Whiskey','X-ray','Yankee','Zulu'];
const FIX_NAMES=['ODRAX','BELUN','KOSIV','TAPEX','MIRAN','LUBEX','VESAN','RIDOS','NIMKA','ARSEL','GOLUX','PEKIM'];
function cityByCode(c){ const r=CITIES.find(q=>q[0]===c); if(r) return r; if(typeof MFG!=='undefined'&&MFG[c]) return [c,MFG[c][0],MFG[c][1],MFG[c][2]]; return null; }
function siteLL(){ return [W.site.lat,W.site.lon]; }
function ll2km(lat,lon){ const s=W.site; let dl=lon-s.lon; if(dl>180) dl-=360; if(dl<-180) dl+=360; return [dl*111.32*Math.cos(s.lat*Math.PI/180),(lat-s.lat)*110.57]; }
function km2ll(x,y){ const s=W.site; return [s.lat+y/110.57, s.lon+x/(111.32*Math.cos(s.lat*Math.PI/180))]; }
function compass(localHdg){ return ((90+localHdg*180/Math.PI)%360+360)%360; }
function angDiff(a,b){ return ((a-b+540)%360)-180; }
function callsign(f){ const al=AIRLINES[f.al], p=PLANE_BY[f.pt]; return al.radio+' '+f.no+(p.radio?' '+p.radio:''); }
function csShort(f){ return AIRLINES[f.al].code+f.no; }
function atisLetter(){ return NATO[Math.floor(now()/120)%26]; }
function qnh(){ return 1013+Math.round(Math.sin(W.day*1.7+W.time/300)*9); }
function windStr(){ const w=W.weather; return (w.kt<3?'calm':Math.round(w.wind/10)*10+' degrees '+Math.round(w.kt)+' knots'); }

// ---------------- radio ----------------
let lastRadioSfx=0;
function radio(freq,who,f,text){
  if(!W) return; const cs=f?csShort(f):'';
  W.radio.push({t:now(),freq,who,cs,text,al:f?f.al:null}); if(W.radio.length>120) W.radio.splice(0,W.radio.length-120);
  if(UI.onRadio) UI.onRadio();

}
function rwFor(f){ return f.trk&&f.trk.rw ? rwName(f.trk.rw) : (W.runways[0]?rwName(W.runways[0]):'--'); }

// ---------------- runway geometry in km ----------------
function rwGeom(r){ const a=rwAxis(r); const thr=tile2km(a.sx,a.sy); const end=tile2km(a.sx+a.ax*a.len,a.sy+a.ay*a.len); const u=[Math.cos(a.hdg),-Math.sin(a.hdg)]; return {thr,end,u,perp:[-u[1],u[0]],hdg:compass(a.hdg),a}; }
function approachPts(r,side){ const g=rwGeom(r); const s=side||1;
  const P=(along,lat)=>[g.thr[0]-g.u[0]*along+g.perp[0]*lat*s, g.thr[1]-g.u[1]*along+g.perp[1]*lat*s];
  return {faf:P(16,0), base:P(24,10), hold:P(34,22), g}; }

// ---------------- arrival tracks ----------------
function spawnArrivalTrack(f,rw){
  const c=cityByCode(f.city)||CITIES[0]; const brg=geoBearing(siteLL(),[c[2],c[3]]); const dist=Math.min(620,Math.max(160,geoDist(siteLL(),[c[2],c[3]])));
  const br=brg*Math.PI/180; const x=Math.sin(br)*dist, y=Math.cos(br)*dist;
  const tr={id:++SIM.tid,kind:'arr',f,al:AIRLINES[f.al],p:PLANE_BY[f.pt],x,y,alt:Math.min(37000,dist*85+8000),spd:13,hdg:(brg+180)%360,phase:'cruise',rw,trail:[],ga:0,holdT:0,said:{}};
  const g=rwGeom(rw); const side=( (x-g.thr[0])*g.perp[0]+(y-g.thr[1])*g.perp[1] )>=0?1:-1; tr.side=side; tr.pts=approachPts(rw,side);
  SIM.tracks.push(tr); f.trk=tr; f.status='inbound'; return tr;
}
function travelTime(f){ const c=cityByCode(f.city)||CITIES[0]; const dist=Math.min(620,Math.max(160,geoDist(siteLL(),[c[2],c[3]]))); return (dist-130)/13+(130-24)/6.2+(24-16)/5+16/4.3+6; }
function steer(tr,tx,ty,dt,turnRate){ const want=(Math.atan2(tx-tr.x,ty-tr.y)*180/Math.PI+360)%360; const d=angDiff(want,tr.hdg); const m=(turnRate||90)*dt; tr.hdg=(tr.hdg+Math.max(-m,Math.min(m,d))+360)%360; const r=tr.hdg*Math.PI/180; tr.x+=Math.sin(r)*tr.spd*dt; tr.y+=Math.cos(r)*tr.spd*dt; return Math.hypot(tx-tr.x,ty-tr.y); }
function seqSlot(tr){ // assign landing slot on runway respecting wake separation
  const rw=tr.rw; const eta=now()+ (Math.hypot(tr.pts.base[0]-tr.x,tr.pts.base[1]-tr.y)/6.2) + 8/5 + 16/4.3;
  const lead=rw.lastLander? PLANE_BY[rw.lastLander] : null; let sep=lead?wakeSep(lead,tr.p)+4.3:2; const deps=SIM.planes.filter(q=>q.rw===rw&&['holdshort','taxiOut','push'].includes(q.state)).length; if(deps) sep+=Math.min(9,3.5*deps); const w=W.weather.type; if(w==='storm') sep+=1; if(w==='fog') sep+=1; if(w==='snow') sep+=0.6;
  const slot=Math.max(eta,(rw.lastSlot||0)+sep); rw.lastSlot=slot; rw.lastLander=tr.p.id; tr.slot=slot; tr.eta0=eta; return slot-eta; }
function visMinOk(rw){ return W.weather.vis >= ILS[rw.ils|0].vis; }
function updateTrack(tr,dt){
  const f=tr.f, al=tr.al;
  if(tr.trail.length===0 || Math.hypot(tr.trail[tr.trail.length-1][0]-tr.x,tr.trail[tr.trail.length-1][1]-tr.y)>(Math.hypot(tr.x,tr.y)>60?6:0.8)){ tr.trail.push([tr.x,tr.y]); if(tr.trail.length>14) tr.trail.shift(); }
  if(tr.kind==='dep') return updateDepTrack(tr,dt);
  if(!W.runways.includes(tr.rw)){ const r=pickRunway(tr.p); if(r){ tr.rw=r; tr.pts=approachPts(r,tr.side); } else { divert(tr,'runway closed'); return; } }
  const P=tr.pts, d0=Math.hypot(tr.x,tr.y);
  switch(tr.phase){
    case 'cruise': { steer(tr,P.base[0],P.base[1],dt,40); tr.alt=Math.max(12000,Math.min(tr.alt,d0*95+6000)); tr.spd=13;
      if(d0<135){ tr.phase='star'; const hold=seqSlot(tr); tr.needHold=hold>1.2;
        radio('APP','P',f,W.site.name+' Approach, '+callsign(f)+', descending flight level '+Math.round(tr.alt/1000)*10+', information '+atisLetter()+'.');
        radio('APP','A',f,callsign(f)+', '+W.site.name+' Approach, radar contact. Descend altitude 7000, expect ILS runway '+rwName(tr.rw)+(tr.needHold?', expect holding at '+FIX_NAMES[tr.rw.id%12]:'')+'.'); }
      break; }
    case 'star': { const tgt=tr.needHold?P.hold:P.base; const dd=steer(tr,tgt[0],tgt[1],dt,60); tr.spd=Math.max(6,tr.spd-dt*0.6); tr.alt=Math.max(tr.needHold?7000:5000,tr.alt-dt*1300);
      if(dd<2){ if(!tr.needHold && !pickStand(tr.p,tr.al,tr.f)){ tr.needHold=true; radio('APP','A',tr.f,callsign(tr.f)+', no stand available yet, hold as published.'); }
        if(tr.needHold){ tr.phase='hold'; tr.ha=0; radio('APP','A',f,callsign(f)+', hold at '+FIX_NAMES[tr.rw.id%12]+' as published, expect further clearance at '+clockStr(tr.slot-6)+'.'); radio('APP','P',f,'Holding at '+FIX_NAMES[tr.rw.id%12]+', '+callsign(f)+'.'); } else { tr.phase='base'; clearApproach(tr); } }
      break; }
    case 'hold': { tr.holdT+=dt; tr.ha+=dt*0.55; const c=P.hold; const g=P.g; // racetrack approximated by ellipse aligned with final course
      const ex=Math.cos(tr.ha)*7, ey=Math.sin(tr.ha)*3; const tx=c[0]+g.u[0]*ex+g.perp[0]*ey, ty=c[1]+g.u[1]*ex+g.perp[1]*ey; tr.hdg=(Math.atan2(tx-tr.x,ty-tr.y)*180/Math.PI+360)%360; tr.x+= (tx-tr.x)*Math.min(1,dt*3); tr.y+=(ty-tr.y)*Math.min(1,dt*3); tr.spd=5.5; tr.alt=7000;
      if(now()>=tr.slot-((Math.hypot(P.base[0]-c[0],P.base[1]-c[1]))/6+8/5+16/4.3) && visMinOk(tr.rw) && pickStand(tr.p,tr.al,tr.f)){ tr.phase='base'; clearApproach(tr); }
      if(tr.holdT>55){ divert(tr, !visMinOk(tr.rw)?'weather below ILS minima':!pickStand(tr.p,tr.al,tr.f)?'no free stand':'holding too long'); }
      break; }
    case 'base': { const dd=steer(tr,P.faf[0],P.faf[1],dt,70); tr.spd=Math.max(5,tr.spd-dt*0.4); tr.alt=Math.max(3000,tr.alt-dt*900);
      if(dd<1.2){ tr.phase='final'; tr.alt=3000; radio('APP','A',f,callsign(f)+', contact '+W.site.name+' Tower 118.7, good day.'); radio('TWR','P',f,W.site.name+' Tower, '+callsign(f)+', established ILS runway '+rwName(tr.rw)+'.'); }
      break; }
    case 'final': { const g=P.g; const d=Math.hypot(g.thr[0]-tr.x,g.thr[1]-tr.y);
      steer(tr,g.thr[0],g.thr[1],dt,40); tr.spd=Math.max(p_vref(tr.p),tr.spd-dt*0.3); tr.alt=Math.max(0,d*172);
      if(d<8 && !tr.said.land){ const ok=!tr.rw.busy||(SIM.planes.find(q=>q.id===tr.rw.busy)||{}).state==='taxiIn'; if(ok&&visMinOk(tr.rw)){ tr.said.land=1; radio('TWR','A',f,callsign(f)+', wind '+windStr()+', runway '+rwName(tr.rw)+', cleared to land.'); radio('TWR','P',f,'Cleared to land runway '+rwName(tr.rw)+', '+callsign(f)+'.'); } }
      if(d<2.7){ const bp=tr.rw.busy?SIM.planes.find(q=>q.id===tr.rw.busy):null; const blocked=(bp&&bp.state!=='taxiIn')||!visMinOk(tr.rw)||(SIM.planes.some(q=>q.rw===tr.rw&&(q.state==='lineup'||q.state==='takeoff')));
        if(blocked||!tr.said.land){ goAround(tr); break; }
        tr.rw.busy='T'+tr.id; tr.phase='local'; spawnLocalArrival(tr,d); }
      break; }
    case 'missed': { const g=P.g; const dd=steer(tr,tr.mx,tr.my,dt,50); tr.alt=Math.min(4000,tr.alt+dt*1500); tr.spd=Math.min(7,tr.spd+dt*1.2);
      if(dd<2){ tr.phase='star'; tr.needHold=true; seqSlot(tr); }
      break; }
    case 'local': { const pl=SIM.planes.find(q=>q.trk===tr); if(!pl){ tr.gone=true; break; } const k=tile2km(pl.x,pl.y); const g=P.g; // compress: show the final few km
      if(pl.state==='final'){ const dl=pl.distT/17; tr.x=g.thr[0]-g.u[0]*dl; tr.y=g.thr[1]-g.u[1]*dl; tr.alt=dl*172; tr.spd=4; } else { tr.x=k[0]; tr.y=k[1]; tr.alt=0; tr.spd=0.5; tr.gone=pl.state==='turn'; }
      break; }
  }
}
function p_vref(p){ return [3.4,3.7,4.1,4.3,4.5,4.7][p.cls]; }
function clearApproach(tr){ const f=tr.f; const g=tr.pts.g; const hdg=Math.round(((g.hdg+(tr.side>0?-30:30))+360)%360/10)*10||360;
  radio('APP','A',f,callsign(f)+', turn '+(tr.side>0?'left':'right')+' heading '+hdg+', descend 3000 feet, cleared ILS approach runway '+rwName(tr.rw)+'.');
  radio('APP','P',f,(tr.side>0?'Left':'Right')+' heading '+hdg+', 3000, cleared ILS '+rwName(tr.rw)+', '+callsign(f)+'.'); }
function goAround(tr){ const f=tr.f, g=tr.pts.g; tr.ga++; tr.phase='missed'; tr.said={}; tr.mx=g.thr[0]+g.u[0]*12+g.perp[0]*8*tr.side; tr.my=g.thr[1]+g.u[1]*12+g.perp[1]*8*tr.side;
  radio('TWR','A',f,callsign(f)+', go around, I say again, go around. Climb 3000 feet, runway heading.'); radio('TWR','P',f,'Going around, '+callsign(f)+'.');
  W.stats.goaround=(W.stats.goaround||0)+1; notify(csShort(f)+' went around'+(visMinOk(tr.rw)?' — runway occupied':' — visibility below ILS minima'),'warn');
  if(tr.ga>=3) divert(tr,'repeated missed approaches'); }
function divert(tr,why){ if(tr.f.own){ ownDivert(tr,why); return; } const f=tr.f; f.status='divert'; W.stats.divert++; tr.phase='divert'; const st=W.stands.find(s=>s.id===f.stand); if(st&&st.resv===f.id) st.resv=null;
  radio('APP','P',f,callsign(f)+', we are diverting to alternate, '+why+'.'); notify(AIRLINES[f.al].name+' '+csShort(f)+' diverted: '+why,'bad'); partnerSat(f.al,-8); tr.gone=true;
  addWorldFlight(f.al,f.pt,km2ll(tr.x,tr.y),pickCityNear(400).slice(2),true); }
function spawnLocalArrival(tr,dkm){
  const rw=tr.rw, a=rwAxis(rw), p=tr.p, f=tr.f;
  const st=pickStand(p,AIRLINES[f.al],f); if(st){ st.resv=f.id; f.stand=st.id; }
  const dist=46; const pl={id:SIM.pid++,f,p,al:AIRLINES[f.al],trk:tr,x:a.sx-a.ax*dist,y:a.sy-a.ay*dist,hdg:a.hdg,alt:8,spd:12,state:'final',rw,st,timer:0,running:true,wait:0,distT:dist,flaps:1};
  rw.busy=pl.id; SIM.planes.push(pl);
}
// ---------------- departures ----------------
function spawnDepTrack(pl){
  const g=rwGeom(pl.rw); const f=pl.f; const c=cityByCode(f.city)||CITIES[0];
  const tr={id:++SIM.tid,kind:'dep',f,al:pl.al,p:pl.p,x:g.end[0]+g.u[0]*0.5,y:g.end[1]+g.u[1]*0.5,alt:1500,spd:5,hdg:g.hdg,phase:'climb',trail:[],dest:[c[2],c[3]],said:{}};
  SIM.tracks.push(tr);
  radio('TWR','A',f,callsign(f)+', contact Departure 124.35, good day.'); radio('DEP','P',f,W.site.name+' Departure, '+callsign(f)+', passing '+(1500)+' climbing 6000.');
}
function updateDepTrack(tr,dt){
  tr.spd=Math.min(13,tr.spd+dt*1.2); tr.alt=Math.min(37000,tr.alt+dt*2600); const d=Math.hypot(tr.x,tr.y);
  const dk=ll2km(tr.dest[0],tr.dest[1]);
  if(d<8){ const r=tr.hdg*Math.PI/180; tr.x+=Math.sin(r)*tr.spd*dt; tr.y+=Math.cos(r)*tr.spd*dt; }
  else { if(!tr.said.dir){ tr.said.dir=1; radio('DEP','A',tr.f,callsign(tr.f)+', radar contact, climb flight level 240, proceed direct '+(cityByCode(tr.f.city)||['','destination'])[1].toUpperCase()+'.'); } steer(tr,dk[0],dk[1],dt,30); }
  if(d>320||(d>40&&Math.hypot(tr.x-dk[0],tr.y-dk[1])<30)){ tr.gone=true; if(tr.f.own) ownLeaveRadar(tr); else addWorldFlight(tr.f.al,tr.f.pt,km2ll(tr.x,tr.y),tr.dest,true); }
}
// ---------------- world traffic (cosmetic, but includes your departures continuing) ----------------
function addWorldFlight(al,pt,a,b,mine){ const d=geoDist(a,b); if(d<50) return; SIM.world.push({al,pt,a,b,f:0,d,spd:14,mine:!!mine,id:++SIM.tid}); }
function pickCityNear(maxKm){ const c=CITIES.filter(c=>{ const d=geoDist(siteLL(),[c[2],c[3]]); return d>150&&d<maxKm; }); return c.length?pick(c):CITIES.slice().sort((a,b)=>geoDist(siteLL(),[a[2],a[3]])-geoDist(siteLL(),[b[2],b[3]]))[1]; }
function seedWorld(){ SIM.world=[]; for(let k=0;k<110;k++) spawnRandomWorld(true); }
function spawnRandomWorld(randomProgress){
  const s=siteLL(); let a,b;
  for(let tries=0;tries<25;tries++){ a=pick(CITIES); b=pick(CITIES); if(a===b) continue; if(Math.random()<0.45){ const m=geoInterp([a[2],a[3]],[b[2],b[3]],0.5); if(geoDist(m,s)>1800) continue; } break; }
  const al=pick(AIRLINES.filter(a=>!a.own)); const fl=al.fleet.filter(id=>PLANE_BY[id].cls>=2); const pt=fl.length?pick(fl):'a320n';
  addWorldFlight(al.id,pt,[a[2],a[3]],[b[2],b[3]],false); if(randomProgress) SIM.world[SIM.world.length-1].f=Math.random();
}
function updateWorld(dt){
  for(const w of SIM.world){ w.f+=w.spd*dt/w.d; if(w.f>=1) w.gone=true; }
  if(SIM.world.some(w=>w.gone)) SIM.world=SIM.world.filter(w=>!w.gone);
  let n=0; for(const w of SIM.world) if(!w.mine) n++; while(n<110){ spawnRandomWorld(false); n++; }
}
function updateATC(dt){
  for(const tr of SIM.tracks) updateTrack(tr,dt);
  if(SIM.tracks.some(t=>t.gone)) SIM.tracks=SIM.tracks.filter(t=>!t.gone);
  updateWorld(dt);
}

function updateCleaner(c,dt){
  if(c.state==='idle'){ let best=-1,bd=1e9; for(const i of SIM.dirtList){ const d=Math.abs(i%MW-c.x)+Math.abs((i/MW|0)-c.y); if(d<bd&&!SIM.cleaners.some(q=>q!==c&&q.target===i)){ bd=d; best=i; } } if(best>=0&&walkMap&&walkMap[best]){ c.target=best; c.state='go'; } else if(best>=0){ W.dirt[best]=0; SIM.dirtList.delete(best); } else { c.t+=dt; if(c.t>8){ c.t=0; const j=objById.get(c.home); if(j&&j.ut>=0){ c.target=j.ut; c.state='go'; c.home2=1; } } } return; }
  if(c.state==='go'){ const r=buggyStep(c,dt,1.3); c.moving=true; if(r){ c.moving=false; if(W.dirt[c.target]){ c.state='clean'; c.t=1.2; } else c.state='idle'; } return; }

}

function rollWeather(force){
  const w=W.weather; const cl=CLIMATE[(W.site&&W.site.climate)||'temperate']; const names=['clear','cloudy','rain','storm','fog','snow'];
  let tot=cl.w.reduce((s,v)=>s+v,0), r=Math.random()*tot, k=0; for(;k<6;k++){ r-=cl.w[k]; if(r<=0) break; }
  let type=names[Math.min(5,k)]; const hr=W.time/60; if(type==='fog' && hr>11 && hr<20 && Math.random()<0.6) type='cloudy';
  w.type=type; w.temp=Math.round(rnd(cl.t[0],cl.t[1])-(type==='snow'?8:0)); if(type==='snow'&&w.temp>1) w.temp=-1;
  w.wind=Math.round(((w.wind||270)+rnd(-60,60)+360)%360); w.kt=type==='storm'?rnd(22,38):type==='fog'?rnd(0,5):rnd(3,16);
  w.vis={clear:10,cloudy:8,rain:4,storm:2.5,fog:rnd(0.1,0.6),snow:1.2}[type]; w.next=now()+rnd(180,420);
  // runway in use follows the wind
  for(const r of W.runways){ const fwd=r.dir==='h'?90:180; const rev=Math.abs(angDiff(fwd,w.wind))>90; if(rev!==!!r.rev){ if(!r.busy && !SIM.tracks.some(t=>t.rw===r&&['final','base','local'].includes(t.phase))){ r.rev=rev; r.lastSlot=0; for(const t of SIM.tracks) if(t.rw===r&&t.kind==='arr') t.pts=approachPts(r,t.side); radio('ATIS','A',null,'Runway in use changed to '+rwName(r)+', wind '+windStr()+'.'); } } }
  if(type==='storm'&&!force) notify('Thunderstorm moving in — expect arrival delays','warn'); if(type==='fog'&&!force) notify('Fog: visibility '+(w.vis*1000|0)+' m. Arrivals need ILS on the runway.','warn'); if(type==='snow'&&!force) notify('Snowfall — departures need de-icing','warn');
}

  if(L.transport>0) earn(W.today.paxDep*L.transport*20,'transport');

  // partners: renewals and departures

    if(otp<p.minOTP && p.flights>6) partnerSat(id,-3);

function curve(t){ return 0.35+0.65*(1-Math.exp(-t/70)); }

function airlineTick(dt){

      case 'air': { const L=ac.leg; L.f+=AIR_SPEED*dt/L.d; const rem=L.d*(1-L.f);
        if(L.to==='HOME'){ if(rem<=600||L.f>=1){ L.f=Math.max(0,1-600/L.d); ownStartHomeArrival(ac); } }

  if(!WM_RINGS){ WM_RINGS=decodeWM(WM_LAND); WM_LINES=decodeWM(WM_BORD); }
  g.fillStyle='#0b1620'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(255,255,255,0.05)'; for(let lo=-180;lo<=180;lo+=30){ const x=siteProj(0,lo,w,h)[0]; const y0=siteProj(78,0,w,h)[1], y1=siteProj(-58,0,w,h)[1]; g.beginPath(); g.moveTo(x,y0); g.lineTo(x,y1); g.stroke(); }
  g.fillStyle='#1d3140'; g.strokeStyle='#2c4a5e';
  for(const r of WM_RINGS){ if(r.every(p=>p[1]<-58)) continue; g.beginPath(); let px=null; r.forEach((p,i)=>{ const [x,y]=siteProj(Math.max(-60,p[1]),p[0],w,h); if(i===0||Math.abs(x-px)>w/2) g.moveTo(x,y); else g.lineTo(x,y); px=x; }); g.fill(); g.stroke(); }
  SITES.forEach((s,i)=>{ const [x,y]=siteProj(s[2],s[3],w,h); const on=i===SITE_SEL; g.fillStyle=on?'#ff8a3d':'#f2c230'; g.beginPath(); g.arc(x,y,on?7:4.5,0,7); g.fill(); if(on){ g.strokeStyle='#fff'; g.lineWidth=2; g.stroke(); g.lineWidth=1; g.fillStyle='#fff'; g.font='600 12px -apple-system,system-ui'; g.fillText(s[0],x+10,y+4); } });
  if(SITE_SEL===-1&&UI.customSite){ const [x,y]=siteProj(UI.customSite.lat,UI.customSite.lon,w,h); g.fillStyle='#ff8a3d'; g.beginPath(); g.arc(x,y,7,0,7); g.fill(); g.strokeStyle='#fff'; g.stroke(); }
}
function currentSite(){ if(SITE_SEL>=0){ const s=SITES[SITE_SEL]; return {name:s[0],country:s[1],lat:s[2],lon:s[3],climate:s[4],demand:s[5]}; } return UI.customSite; }
function renderSiteCard(){ const s=currentSite(); const near=CITIES.filter(c=>geoDist([s.lat,s.lon],[c[2],c[3]])<2500).length;
  const code=(s.name.normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3)||'NEW').toUpperCase();
  $('#sitecard').innerHTML='<small>'+(s.country||'Custom location')+' · '+s.lat.toFixed(2)+'°, '+s.lon.toFixed(2)+'°</small><h2>'+s.name+'</h2>'+
   '<div class="kv"><span>Climate</span><b>'+s.climate[0].toUpperCase()+s.climate.slice(1)+'</b><span>Passenger demand</span><b>'+(s.demand>=1.3?'Very high':s.demand>=1.1?'High':s.demand>=0.9?'Medium':'Modest')+'</b><span>Cities within 2,500 km</span><b>'+near+'</b></div>'+
   '<label class="fld"><span>Airport name</span><input id="apname" maxlength="28" value="'+s.name+'"></label><label class="fld sm"><span>Code</span><input id="apcode" maxlength="3" value="'+code+'"></label>'+
   '<div class="row"><button class="btn go" id="goStarter">Start with an airfield</button><button class="btn" id="goEmpty">Empty land</button></div>';
  const go=(st)=>{ const nm=($('#apname').value||s.name).trim(); const cd=($('#apcode').value||code).toUpperCase().replace(/[^A-Z]/g,'').slice(0,3)||code; newGame(st,{...s,name:nm,code:cd}); };
  $('#goStarter').onclick=()=>go(true); $('#goEmpty').onclick=()=>go(false);
  const list=$('#sitelist'); list.innerHTML=''; SITES.forEach((x,i)=>{ const b=el('button','chip'+(i===SITE_SEL?' on':''),x[0]); b.onclick=()=>{ SITE_SEL=i; drawSiteMap(); renderSiteCard(); }; list.appendChild(b); });
}
(function(){ const c=$('#sc'); c.addEventListener('click',e=>{ const r=c.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top, w=r.width, h=r.height;
  let best=-1,bd=18; SITES.forEach((s,i)=>{ const [px,py]=siteProj(s[2],s[3],w,h); const d=Math.hypot(px-x,py-y); if(d<bd){bd=d;best=i;} });
  if(best>=0) SITE_SEL=best; else { const G=siteGeo(w,h); const lon=(x-G.ox)/G.sc-180, lat=78-(y-G.oy)/G.sc; if(lon<-180||lon>180||lat<-58||lat>78) return; SITE_SEL=-1; const nc=CITIES.slice().sort((a,b)=>geoDist([lat,lon],[a[2],a[3]])-geoDist([lat,lon],[b[2],b[3]]))[0];
    UI.customSite={name:'Near '+nc[1],country:'',lat:+lat.toFixed(2),lon:+lon.toFixed(2),climate:climateFor(lat),demand:1.0}; }
  drawSiteMap(); renderSiteCard(); }); })();
// ---------------- loop ----------------
let last=performance.now(), hudT=0, saveT=0, panelT=0;
function frame(ts){
  const rdt=Math.min(0.1,(ts-last)/1000); last=ts; SIM.t+=rdt;
  try{
    if(W){
      let g=rdt*UI.speed; const steps=Math.max(1,Math.ceil(g/0.25)); const sd=g/steps; if(g>0) for(let k=0;k<steps;k++) simTick(sd,rdt/steps);
      const pm=Math.min(3,Math.max(1,UI.speed*1.2)); for(const f of SIM.fx){ f.x+=f.vx*rdt*pm*0.5; f.y+=f.vy*rdt*pm*0.5; f.vx*=0.98; f.vy*=0.98; f.life-=rdt*(f.k==='txt'||f.k==='spark'?1:pm*0.6); } if(SIM.fx.length) SIM.fx=SIM.fx.filter(f=>f.life>0);
      const wr=W.weather.wind*Math.PI/180, ws=(W.weather.kt||5)*0.02*Math.max(0.3,UI.speed); for(const c of CLOUDS){ c.x-=Math.sin(wr)*ws*rdt*10; c.y+=Math.cos(wr)*ws*rdt*10; if(c.x<-40) c.x+=MW+80; if(c.x>MW+40) c.x-=MW+80; if(c.y<-40) c.y+=MH+80; if(c.y>MH+40) c.y-=MH+80; }
      hudT+=rdt; if(hudT>0.25){ hudT=0; if(UI.playing) updateHUD(); }
      panelT+=rdt; if(panelT>0.6){ panelT=0; if(RADAR.open) RADAR.updatePanel(); }
      saveT+=rdt; if(saveT>30){ saveT=0; saveGame(true); }
      if(RADAR.open) RADAR.draw(); else render();
    }
  }catch(e){ console.error(e); if(!frame.errShown){ frame.errShown=1; toast('Something went wrong: '+e.message,'bad',6000); } }
  requestAnimationFrame(frame);
}
function boot(){
  wireHUD(); buildCats(); setSpeed(1);
  const has=!!localStorage.getItem(SAVE_KEY);
  $('#btnCont').style.display=has?'block':'none';
  $('#btnCont').onclick=()=>{ UI.quiet=false; if(loadGame()){ setSpeed(1); refreshTray(); buildCats(); $('#start').classList.add('hidden'); document.body.classList.remove('menu'); UI.playing=true; updateTier(); scheduleIfEmpty(); updateHUD(); UI.updateUndo(); } else toast('Save could not be loaded','bad'); };
  $('#btnNew').onclick=()=>showSitePicker(); $('#siteBack').onclick=()=>{ $('#site').classList.add('hidden'); $('#start').classList.remove('hidden'); };
  // attract-mode preview behind the start screen
  W=newWorld(); W.site=makeSite({name:'Ljubljana',country:'Slovenia',lat:46.22,lon:14.46,climate:'temperate',demand:1,code:'LJU'}); reindex(); buildStarter(); walkVer++; recomputeUses(); seedWorld(); rollWeather(true); W.weather.type='clear';
  cam.x=64; cam.y=52; cam.z=Math.max(7,VW/70); W.time=9*60;
  UI.quiet=true; for(const id of [0,7,8]){ W.partners[id]={start:1,end:99,fpd:5,fleet:AIRLINES[id].fleet.filter(f=>PLANE_BY[f].cls<=1).concat(['crj200','cj3']),routes:['VIE','ZRH','MUC'],landingMul:1,paxMul:1,minOTP:0,sat:70,flights:0,ontime:0}; }
  scheduleDay(); for(const f of W.flights) f.arr-=200; W.settings.sound=false; UI.quiet=true;
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && UI.playing) saveGame(true); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function scheduleIfEmpty(){ const ds=W.day*1440; if(!W.flights.some(f=>f.arr>=ds)){ for(const id of activePartners()) genFlights(id,Math.max(now()+80,ds+5.5*60),ds+22.5*60); } }
document.addEventListener('gesturestart',e=>e.preventDefault()); document.addEventListener('dblclick',e=>e.preventDefault());
boot();

</script>
