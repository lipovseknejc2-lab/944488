<div class="bg"><i></i><i></i><i></i></div>
<div id="splash"><div class="bg"><i></i><i></i><i></i></div><div class="sp-in"><div class="sp-logo"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="spb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a95ff"/><stop offset="1" stop-color="#0a4fd6"/></linearGradient><linearGradient id="sph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#spb)"/><rect width="512" height="512" rx="115" fill="url(#sph)"/><g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" d="M317.7 165.4A118 118 0 1 0 365.4 286.5"/><path class="draw d2" pathLength="1" d="M214 262L258 306L396 168"/></g></svg></div><div class="wordmark">Grady</div><div class="sp-bar"><i id="spBar"></i></div><div class="sp-status" id="spStatus">Zaganjam</div></div></div>
<div id="app"></div>
<div class="dock"><nav id="nav"></nav><button class="fab" id="fab" aria-label="Dodaj"></button></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
/* ============ PODATKI ============ */
const KEY='gradient-v1';
const TYPES=['Test','Pisno','Ustno','Projekt','Domača naloga','Drugo'];
const PALETTE=['#007aff','#5856d6','#34c759','#ff9500','#ff2d55','#af52de','#30b0c7','#ffcc00','#8e8e93'];
const SLO_THR=[50,63,76,89];
const DEF={subjects:[],grades:[],upcoming:[],log:[],settings:{name:'Grady',user:'',theme:'auto',accent:'#007aff',min:1,max:5,pass:2,defW:1,dec:2,alert:3,thr:SLO_THR.slice(),mode:'grade'},custom:{},matura:null};
const $=s=>document.querySelector(s);
const CHART_URL='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
let _mk=0;
function MARK(bg=true){const i='m'+(++_mk);return`<svg viewBox="0 0 512 512" aria-hidden="true">${bg?`<defs><linearGradient id="${i}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a95ff"/><stop offset="1" stop-color="#0a4fd6"/></linearGradient><linearGradient id="${i}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#${i}a)"/><rect width="512" height="512" rx="115" fill="url(#${i}b)"/>`:''}<g fill="none" stroke="${bg?'#fff':'currentColor'}" stroke-width="${bg?44:52}" stroke-linecap="round" stroke-linejoin="round"><path d="M317.7 165.4A118 118 0 1 0 365.4 286.5"/><path d="M214 262L258 306L396 168"/></g></svg>`}
const PROGS=['Gimnazija','Strokovna šola','Poklicna šola'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>localISO(new Date());
let S=load();
function load(){let s;try{const d=JSON.parse(localStorage.getItem(KEY));if(d)s={...structuredClone(DEF),...d,settings:{...DEF.settings,...d.settings}}}catch(e){}s=s||structuredClone(DEF);if(s.settings.name==='Gradient')s.settings.name='Grady';fixThr(s.settings);return s}
function fixThr(st){const n=st.max-st.min;if(!Array.isArray(st.thr)||st.thr.length!==n)st.thr=n===4?SLO_THR.slice():Array.from({length:n},(_,i)=>Math.round(50+i*(40/Math.max(1,n-1))))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Shranjevanje ni uspelo')}}
function logA(t){S.log.unshift({t,at:new Date().toISOString()});S.log=S.log.slice(0,200)}

/* ============ ANALITIKA ============ */
const St=()=>S.settings;
const subj=id=>S.subjects.find(s=>s.id===id);
const byDate=(a,b)=>a.date.localeCompare(b.date)||(a.at||'').localeCompare(b.at||'');
const gradesOf=sid=>S.grades.filter(g=>g.sid===sid).sort(byDate);
function wavg(l){let s=0,w=0;l.forEach(g=>{s+=g.val*g.w;w+=g.w});return w?s/w:null}
function overall(l=S.grades){const a=S.subjects.map(s=>wavg(l.filter(g=>g.sid===s.id))).filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y)/a.length:null}
const clamp=v=>Math.min(St().max,Math.max(St().min,v));
const pct=v=>v==null?null:(v-St().min)/(St().max-St().min)*100;
const f=(v,d=St().dec)=>v==null||isNaN(v)?'–':(+v).toFixed(d).replace('.',',');
const fp=v=>v==null||isNaN(v)?'–':Math.round(v)+' %';
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function pctToGrade(p){let g=St().min;St().thr.forEach((t,i)=>{if(p>=t)g=St().min+i+1});return g}
function gradeMinPct(g){return g<=St().min?0:St().thr[g-St().min-1]}
function regress(y){const n=y.length;if(!n)return{slope:0,next:null,fit:[]};if(n<2)return{slope:0,next:y[0],fit:[y[0]]};let sx=0,sy=0,sxy=0,sxx=0;y.forEach((v,x)=>{sx+=x;sy+=v;sxy+=x*v;sxx+=x*x});const sl=(n*sxy-sx*sy)/((n*sxx-sx*sx)||1),ic=(sy-sl*sx)/n;return{slope:sl,next:clamp(ic+sl*n),fit:y.map((_,x)=>ic+sl*x)}}
function stdev(v){if(v.length<2)return 0;const m=mean(v);return Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length-1))}
const consistency=v=>v.length<2?null:Math.max(0,100-stdev(v)/((St().max-St().min)/2)*100);
function needed(l,target,w=1){let s=0,W=0;l.forEach(g=>{s+=g.val*g.w;W+=g.w});return(target*(W+w)-s)/w}
function needInfo(l,target,w){const v=needed(l,target,w);if(v>St().max+1e-9)return null;const g=Math.max(St().min,Math.ceil(v-1e-9));return{g,p:gradeMinPct(g)}}
function running(l){let s=0,w=0;return l.map(g=>{s+=g.val*g.w;w+=g.w;return s/w})}
function gkey(v){const p=pct(v);return p<12.5?'--g1':p<37.5?'--g2':p<62.5?'--g3':p<87.5?'--g4':'--g5'}
const gcol=v=>v==null?'var(--muted)':`var(${gkey(v)})`;
const gtext=v=>['--g3','--g4'].includes(gkey(v))?'#1c1c1e':'#fff';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const gcolHex=v=>css(gkey(v));
function subjStats(s){const l=gradesOf(s.id),vals=l.map(g=>g.val),avg=wavg(l),r=regress(vals);
 const recent=vals.slice(-3),prev=vals.slice(-6,-3);const trend=recent.length&&prev.length?mean(recent)-mean(prev):r.slope;
 const up=S.upcoming.filter(u=>u.sid===s.id&&u.exp);const proj=up.length?wavg([...l,...up.map(u=>({val:+u.exp,w:+u.w||1}))]):avg;
 const pcts=l.filter(g=>g.pct!=null).map(g=>g.pct);
 return{l,vals,avg,pct:pct(avg),r,trend,final:avg==null?null:Math.round(avg),proj,cons:consistency(vals),avgPct:mean(pcts),pcts}}
function timeline(){const all=[...S.grades].sort(byDate),dates=[...new Set(all.map(g=>g.date))];return dates.map(d=>({d,v:overall(all.filter(g=>g.date<=d))}))}
const dObj=d=>new Date(d+'T00:00');
const fmtD=d=>dObj(d).toLocaleDateString('sl-SI',{day:'numeric',month:'short'});
const fmtL=d=>dObj(d).toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long'});
const daysTo=d=>Math.round((dObj(d)-dObj(today()))/864e5);
const dniW=n=>n===1?'dan':n===2?'dneva':n<=4?'dnevi':'dni';
const dniA=n=>n===1?'dan':n===2?'dneva':'dni';
const dniG=n=>n===1?'dneva':'dni';

/* nujnost testa */
function urg(d){const a=St().alert;
 if(d<0)return{c:'var(--u0)',k:'past',t:'čaka vpis'};
 if(d===0)return{c:'var(--u1)',k:'now',t:'danes'};
 if(d===1)return{c:'var(--u1)',k:'now',t:'jutri'};
 if(d<=a)return{c:'var(--u2)',k:'soon',t:`čez ${d} ${dniA(d)}`};
 if(d<=7)return{c:'var(--u3)',k:'week',t:`čez ${d} ${dniA(d)}`};
 return{c:'var(--u4)',k:'later',t:`čez ${d} ${dniA(d)}`}}
const upSorted=()=>[...S.upcoming].sort(byDate);
function upInfo(u){const s=subj(u.sid),l=s?gradesOf(s.id):[],d=daysTo(u.date),cur=wavg(l),w=+u.w||1,R=cur==null?null:Math.round(cur);
 const keep=R!=null?needInfo(l,R-0.5,w):null,better=R!=null&&R<St().max?needInfo(l,R+0.5,w):undefined;
 const what=[];for(let g=St().min;g<=St().max;g++)what.push([g,wavg([...l,{val:g,w}])]);
 return{s,l,d,cur,R,keep,better,what,ug:urg(d),w}}
function chip(label,info){if(info===null)return`<div class="need no"><span>${label}</span><b>ni dosegljivo</b></div>`;if(info.g<=St().min)return`<div class="need ok"><span>${label}</span><b>varno</b></div>`;return`<div class="need"><span>${label}</span><b>≥ ${info.p} %</b><small>ocena ${info.g}</small></div>`}
function needChips(x){if(x.R==null)return'';let h=chip(`Ohraniš ${x.R}`,x.keep);if(x.better!==undefined)h+=chip(`Dvigneš na ${x.R+1}`,x.better);return`<div class="needs">${h}</div>`}
const badgeIn=d=>d<0?`<b>!</b><span>vpiši</span>`:d===0?`<b>0</b><span>danes</span>`:`<b>${d}</b><span>${dniW(d)}</span>`;

/* ============ GRAFI ============ */
let charts=[];
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;if(!window.Chart){el.parentElement.innerHTML='<p class="sub empty">Grafi se prikažejo, ko je naprava povezana z internetom.</p>';return}
 Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=css('--muted');Chart.defaults.borderColor=css('--sep');
 cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},animation:chartAnim?{duration:450}:false},cfg.options||{});charts.push(new Chart(el,cfg))}
const yScale=()=>({min:St().min,max:St().max,ticks:{stepSize:1},grid:{color:css('--sep')}});
const xNoGrid={grid:{display:false}};

/* ============ IKONE / NAVIGACIJA ============ */
const IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
upcoming:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/>',
subjects:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
analysis:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
plus:'<path d="M12 5v14M5 12h14"/>',matura:'<path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9.5V15"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const tabs=()=>[['home','Pregled'],['upcoming','Testi'],['subjects','Predmeti'],['analysis','Analiza'],...(S.profile?.level==='ss'?[['matura','Matura']]:[])];
function renderNav(k){$('#nav').innerHTML=tabs().map(([t,n])=>`<a href="#${t}" data-tab="${t}" class="${k===t||(t==='subjects'&&k==='subject')||(t==='matura'&&k==='matura')?'on':''}">${svg(t)}${n}</a>`).join('');
 $('#nav').querySelectorAll('a').forEach(a=>a.onclick=e=>{if((location.hash.slice(1)||'home')===a.dataset.tab){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}})}
function header(title,eyebrow,extra=''){return`<header class="top"><div class="grow"><div class="eyebrow">${eyebrow||''}</div><h1>${title}</h1></div>${extra}<button class="icon-btn" onclick="location.hash='nastavitve'" aria-label="Nastavitve">${svg('gear')}</button></header>`}
let curView='home';
let curRoute=null,chartAnim=true;const scrollMem={};try{history.scrollRestoration='manual'}catch(e){}
function render(){const v=S.profile?(location.hash.slice(1)||'home'):'__ob',same=v===curRoute,y=window.scrollY;if(curRoute&&!same)scrollMem[curRoute]=y;
 destroyCharts();applyTheme();$('.dock').hidden=!S.profile;chartAnim=!same;if(!same){const m=$('#modal');clearTimeout(_ct);m.classList.remove('open','closing');m.innerHTML=''}
 if(!S.profile){vOnboard();if(!same)window.scrollTo(0,0);curRoute=v;return}
 const [k,id]=v.split(':');curView=k;renderNav(k);const A=$('#app');if(same)A.classList.remove('enter');
 const views={home:vHome,subjects:vSubjects,subject:()=>vSubject(id),analysis:vAnalysis,upcoming:vUpcoming,nastavitve:vSettings,matura:()=>id?vMaturaSubj(id):vMatura()};(views[k]||vHome)();
 $('#fab').innerHTML=svg('plus');$('#fab').setAttribute('aria-label',k==='upcoming'?'Dodaj test':'Dodaj oceno');
 window.scrollTo(0,same?y:(id?0:(scrollMem[v]||0)));
 if(!same){A.classList.remove('enter');void A.offsetWidth;A.classList.add('enter');countUp()}
 curRoute=v}
function countUp(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,d=+el.dataset.d||0,t0=performance.now(),dur=700;if(isNaN(n))return;const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(n*e,d);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
window.addEventListener('hashchange',render);
function applyTheme(){S.settings.name='Grady';const t=St().theme,dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches),r=document.documentElement;r.dataset.theme=dark?'dark':'light';r.style.setProperty('--accent',St().accent);const m=$('meta[name=theme-color]');if(m)m.content=dark?'#09090c':'#eef0f5';document.title='Grady'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>St().theme==='auto'&&render());
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900)}
function ringSvg(p,c){const r=41,C=2*Math.PI*r,o=C*(1-Math.max(0,Math.min(100,p||0))/100);return`<svg class="ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--fill)" stroke-width="9"/><circle class="arc" style="--c:${C}" cx="48" cy="48" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${o}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700">${p==null?'–':Math.round(p)+'%'}</text></svg>`}
const trendPill=t=>t>0.05?`<span class="pill up">▲ ${f(t,2)}</span>`:t<-0.05?`<span class="pill down">▼ ${f(Math.abs(t),2)}</span>`:`<span class="pill">stabilno</span>`;
const gBadge=(v,label)=>`<div class="badge" style="background:${gcol(v)};color:${gtext(v)}">${label??v}</div>`;

/* ============ PREGLED ============ */
function alertCard(u,more){const x=upInfo(u),d=x.d;
 const big=d===0?'<b class="w">Danes</b>':d===1?'<b class="w">Jutri</b>':`<b>${d}</b><span>${dniW(d)}</span>`;
 return`<div class="card alert ${x.ug.k}" style="--uc:${x.ug.c}" onclick="location.hash='upcoming'">
 <div class="row" style="margin-bottom:12px"><span class="live"></span><span class="lbl">${d<=1?'Test je tik pred vrati':'Prihaja test'}</span>${more?`<span class="sub" style="margin-left:auto">+${more} ${more===1?'test':more===2?'testa':'testi'}</span>`:''}</div>
 <div class="row" style="gap:16px;align-items:center"><div class="count">${big}</div><div class="grow"><div class="subj">${esc(x.s?.name||'?')}</div><div class="sub">${esc(u.title||'Test')}</div><div class="sub">${fmtL(u.date)}</div></div></div>
 ${u.topics&&u.topics.length?`<div class="topics">${u.topics.slice(0,6).map(t=>`<span>${esc(t)}</span>`).join('')}${u.topics.length>6?`<span>+${u.topics.length-6}</span>`:''}</div>`:''}
 ${x.R!=null?needChips(x):`<p class="sub mt">Prva ocena pri tem predmetu.</p>`}</div>`}
function stripHtml(){let h='';for(let i=0;i<14;i++){const dt=new Date();dt.setDate(dt.getDate()+i);const iso=localISO(dt),t=S.upcoming.filter(u=>u.date===iso),u=t.length?urg(i):null;
 h+=`<button class="day ${i===0?'today':''} ${u?'has':''}" style="${u?'--uc:'+u.c:''}" onclick="location.hash='upcoming'" aria-label="${fmtL(iso)}${t.length?', testov: '+t.length:''}"><span>${i===0?'danes':dt.toLocaleDateString('sl-SI',{weekday:'short'}).replace('.','')}</span><b>${dt.getDate()}</b></button>`}return h}
function upRow(u){const x=upInfo(u);return`<div class="li" onclick="location.hash='upcoming'"><div class="dbadge" style="--uc:${x.ug.c}">${badgeIn(x.d)}</div><div class="grow"><div class="t">${esc(x.s?.name||'?')}</div><div class="sub">${esc(u.title||'Test')} · ${fmtD(u.date)}</div>${topicLine(u.topics)}</div><span class="tag" style="--uc:${x.ug.c}">${x.ug.t}</span></div>`}
function vHome(){const hello=St().user?`Živjo, ${esc(St().user)}`:'Grady',ds=`${MARK()}${new Date().toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long'})}`;
 if(!S.subjects.length){$('#app').innerHTML=header(hello,ds)+`<div class="card" style="padding:22px"><h2>Začni tukaj</h2><p class="sub">Dodaj predmete, vpisuj ocene ali odstotke s testov in spremljaj, kdaj te čaka naslednji test.</p><div class="row wrap mt"><button class="btn primary" onclick="subjectForm()">Dodaj predmet</button><button class="btn" onclick="demo()">Poskusi z demo podatki</button></div></div>`;return}
 const ups=upSorted(),fut=ups.filter(u=>daysTo(u.date)>=0),past=ups.filter(u=>daysTo(u.date)<0),urgent=fut.filter(u=>daysTo(u.date)<=St().alert);
 const ov=overall(),tl=timeline(),st=S.subjects.map(s=>({s,...subjStats(s)})).filter(x=>x.avg!=null),sorted=[...st].sort((a,b)=>b.avg-a.avg);
 const allVals=S.grades.map(g=>g.val),allPct=S.grades.filter(g=>g.pct!=null).map(g=>g.pct);
 const projOv=st.length?mean(st.map(x=>x.proj??x.avg)):null,trendOv=tl.length>=2?tl[tl.length-1].v-tl[Math.max(0,tl.length-4)].v:0;
 $('#app').innerHTML=header(hello,ds)+`
 ${urgent.length?alertCard(urgent[0],urgent.length-1):''}
 ${past.length?`<div class="card banner" onclick="location.hash='upcoming'"><div class="dbadge" style="--uc:var(--u0)"><b>${past.length}</b><span>${past.length===1?'test':'testi'}</span></div><div class="grow"><div class="t" style="font-weight:600">Vpiši rezultate</div><div class="sub">${past.length===1?'En test je že mimo':'Nekaj testov je že mimo'} in še nima ocene.</div></div><span class="link">Vpiši</span></div>`:''}
 <section><div class="sh"><h2>Prihajajoči testi</h2><a href="#upcoming">Vsi</a></div>
 <div class="card" style="padding:0"><div class="strip">${stripHtml()}</div></div>
 ${fut.length?`<div class="card list">${fut.slice(urgent.length?1:0,urgent.length?4:3).map(upRow).join('')||'<p class="sub" style="padding:8px 0">Drugih testov ni.</p>'}</div>`:`<div class="card empty"><p class="sub" style="margin-top:0">Ni načrtovanih testov.</p><button class="btn primary sm" onclick="upForm()">Dodaj test</button></div>`}
 </section>
 ${maturaCard()?`<section>${maturaCard()}</section>`:''}
 <section><div class="sh"><h2>Uspeh</h2><a href="#analysis">Analiza</a></div>

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function progKey(){const p=S.profile;if(!p||p.level!=='ss')return null;return p.program==='Strokovna šola'?'ss':p.program==='Poklicna šola'?'pok':'gim'}
function catFor(sid){const s=subj(sid),k=progKey();if(!s||!k)return null;const n=norm(s.name),set=TOP[k],keys=Object.keys(set);const key=keys.find(x=>norm(x)===n)||keys.find(x=>n.startsWith(norm(x)));return key?set[key]:null}
function topicLine(t){if(!t||!t.length)return'';return`<div class="tline">Snov: <b>${t.slice(0,3).map(esc).join(' · ')}</b>${t.length>3?` +${t.length-3}`:''}</div>`}
function topicPickerHtml(){return`<div class="flabel">Snov</div><div class="tchips" id="tpSel"></div><div id="tpCat"></div><div class="row mt"><input id="tpIn" placeholder="Dodaj svojo temo" enterkeyhint="done"><button type="button" class="icon-btn" id="tpAdd" aria-label="Dodaj temo">${svg('plus')}</button></div><input type="hidden" name="topics" id="tpVal">`}
function mountTopics(initial,getSid){let sel=[...(initial||[])],yr=null,lastSid=getSid();
 const draw=()=>{const sid=getSid();if(sid!==lastSid){sel=[];yr=null;lastSid=sid}const cat=catFor(sid),cus=(S.custom&&S.custom[sid])||[];
  $('#tpVal').value=JSON.stringify(sel);
  $('#tpSel').innerHTML=sel.length?sel.map((t,i)=>`<button type="button" class="tchip on sel" data-r="${i}">${esc(t)}</button>`).join(''):'<span class="sub" style="margin-left:4px">Snov še ni izbrana.</span>';
  let h='';
  if(cat){const ys=Object.keys(cat).map(Number);if(yr==null||!ys.includes(yr))yr=ys.includes(S.profile?.grade)?S.profile.grade:ys[0];
   if(ys.length>1)h+=`<div class="seg mt" id="tpYr">${ys.map(y=>`<button type="button" data-y="${y}" class="${y===yr?'on':''}">${y}. letnik</button>`).join('')}</div>`;
   const list=(cat[yr]||[]).filter(t=>!sel.includes(t));h+=`<div class="tchips mt">${list.map(t=>`<button type="button" class="tchip" data-a="${esc(t)}">${esc(t)}</button>`).join('')||'<span class="sub">Vse teme so izbrane.</span>'}</div>`}
  const cl=cus.filter(t=>!sel.includes(t));if(cl.length)h+=`<div class="flabel">Tvoje teme</div><div class="tchips">${cl.map(t=>`<button type="button" class="tchip" data-a="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  if(!cat)h+=`<p class="sub" style="margin:8px 4px 0">${progKey()?'Za ta predmet ni uradnega seznama tem.':'Uradne teme so na voljo za srednje šole.'} Dodaj svojo temo.</p>`;
  $('#tpCat').innerHTML=h;
  document.querySelectorAll('#tpSel [data-r]').forEach(b=>b.onclick=()=>{sel.splice(+b.dataset.r,1);draw()});
  document.querySelectorAll('#tpCat [data-a]').forEach(b=>b.onclick=()=>{sel.push(b.dataset.a);draw()});
  document.querySelectorAll('#tpYr [data-y]').forEach(b=>b.onclick=()=>{yr=+b.dataset.y;draw()})};
 const add=()=>{const v=$('#tpIn').value.trim(),sid=getSid();if(!v)return;if(!sel.includes(v))sel.push(v);S.custom=S.custom||{};S.custom[sid]=S.custom[sid]||[];if(!S.custom[sid].includes(v)&&!(catFor(sid)&&Object.values(catFor(sid)).flat().includes(v)))S.custom[sid].push(v);$('#tpIn').value='';draw()};
 $('#tpAdd').onclick=add;$('#tpIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
 draw();return draw}
const readTopics=fd=>{try{return JSON.parse(fd.topics||'[]')}catch(e){return[]}};
function topicStats(grades){const m={};grades.forEach(g=>(g.topics||[]).forEach(t=>{(m[t]=m[t]||[]).push(g)}));return Object.entries(m).map(([t,gs])=>({t,avg:wavg(gs),p:mean(gs.filter(g=>g.pct!=null).map(g=>g.pct)),n:gs.length,sid:gs[0].sid})).sort((a,b)=>a.avg-b.avg||b.n-a.n)}
function topicRows(rows,showSubj){return rows.map(r=>`<div class="li" style="cursor:default"><div class="grow"><div class="row between"><span class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.t)}</span><b style="color:${gcol(r.avg)};font-variant-numeric:tabular-nums">${f(r.avg)}</b></div><div class="sub">${showSubj?esc(subj(r.sid)?.name||'')+' · ':''}${r.n} ${r.n===1?'ocena':r.n===2?'oceni':r.n<=4?'ocene':'ocen'}${r.p!=null?' · Ø '+fp(r.p):''}</div><div class="bar"><i style="width:${pct(r.avg)}%;background:${gcol(r.avg)}"></i></div></div></div>`).join('')}

 <section><div class="sh"><h2>Poskusni testi</h2></div><div class="card"><div class="grid"><div><label for="mpP" style="margin-top:0">Rezultat v %</label><input id="mpP" type="number" inputmode="decimal" min="0" max="100" placeholder="npr. 72"></div><div><label for="mpD" style="margin-top:0">Datum</label><input id="mpD" type="date" value="${today()}"></div></div><input id="mpN" class="mt" placeholder="Opomba, npr. matura 2024 pola 1"><button class="btn primary full" id="mpAdd">Dodaj rezultat</button></div>
 ${s.prac.length>1?`<div class="card"><div class="chart sm"><canvas id="cMP"></canvas></div></div>`:''}
 ${s.prac.length?`<div class="card list">${[...s.prac].reverse().map(p=>`<div class="li" style="cursor:default"><div class="badge" style="background:var(--fill);font-size:15px">${Math.round(p.pct)}</div><div class="grow"><div class="t">${fp(p.pct)}${s.goal!=null?` <span class="sub">${p.pct>=s.goal?'cilj dosežen':`do cilja ${f(s.goal-p.pct,0)} %`}</span>`:''}</div><div class="sub">${fmtD(p.date)}${p.note?' · '+esc(p.note):''}</div></div><button class="link" data-pd="${p.id}" style="font-size:13px">Izbriši</button></div>`).join('')}</div>`:''}</section>`;
 const sv=()=>save();
 $('#mTg').onchange=e=>{s.target=e.target.value?+e.target.value:null;sv();toast('Cilj shranjen')};
 $('#mGoal').onchange=e=>{const v=e.target.value;s.goal=v===''?null:Math.max(0,Math.min(100,+v));sv();render()};
 document.querySelectorAll('.chk').forEach(el=>{const tog=()=>{const k=el.dataset.t;if(s.done[k])delete s.done[k];else s.done[k]=true;window._tog=k;sv();render();window._tog=null};el.onclick=e=>{if(e.target.closest('[data-del]'))return;tog()};el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}}});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del;s.custom=s.custom.filter(x=>x!==k);delete s.done[k];sv();render()});
 const addT=()=>{const v=$('#mTopic').value.trim();if(!v)return;if(!t.includes(v))s.custom.push(v);sv();render()};$('#mTopicAdd').onclick=addT;$('#mTopic').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addT()}};
 $('#mpAdd').onclick=()=>{const p=$('#mpP').value;if(p===''||+p<0||+p>100)return toast('Vpiši rezultat med 0 in 100 %');s.prac.push({id:uid(),date:$('#mpD').value||today(),pct:+p,note:$('#mpN').value.trim()});s.prac.sort(byDate);sv();render();toast('Rezultat dodan')};
 document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{s.prac=s.prac.filter(x=>x.id!==b.dataset.pd);sv();render()});
 if(s.prac.length>1)mk('cMP',{type:'line',data:{labels:s.prac.map(p=>fmtD(p.date)),datasets:[{data:s.prac.map(p=>p.pct),borderColor:St().accent,backgroundColor:St().accent+'22',fill:true,tension:.3,pointRadius:4},...(s.goal!=null?[{data:s.prac.map(()=>s.goal),borderColor:css('--g5'),borderDash:[6,5],pointRadius:0,borderWidth:1.5}]:[])]},options:{scales:{y:{min:0,max:100,ticks:{callback:v=>v+' %'},grid:{color:css('--sep')}},x:xNoGrid}}})}
function maturaCard(){const p=S.profile;if(!p||p.level!=='ss'||(!S.matura&&(p.grade||0)<3))return'';
 if(!S.matura)return`<div class="card banner" onclick="location.hash='matura'"><div class="dbadge" style="--uc:var(--accent)"><b>${Math.max(0,daysTo('2027-05-29'))>99?'·':Math.max(0,daysTo('2027-05-29'))}</b><span>matura</span></div><div class="grow"><div class="t" style="font-weight:600">Pripravi se na maturo</div><div class="sub">Izberi predmete, ravni in cilje.</div></div><span class="link">Nastavi</span></div>`;
 const nx=nextMatDate(S.matura.type),r=mean(S.matura.subs.map(mastery).filter(v=>v!=null));
 return`<div class="card banner" onclick="location.hash='matura'">${ringSvg(r??0,'var(--accent)').replace('class="ring"','class="ring" style="width:56px;height:56px"')}<div class="grow"><div class="t" style="font-weight:600">Matura ${MAT_YEAR}</div><div class="sub">${nx?`${esc(nx.t)} čez ${daysTo(nx.d)} ${dniA(daysTo(nx.d))}`:'Koledar za to leto je zaključen'}</div></div><span class="link">Odpri</span></div>`}

/* ============ UVOD (PROFIL) ============ */
let OB={step:0,name:'',level:'os',grade:null,program:'Gimnazija',school:'',subs:null,custom:''};
function presetSubs(){const g=OB.grade||1;
 if(OB.level==='os'){if(g<=5)return['*Slovenščina','*Matematika','*Angleščina',g<=3?'*Spoznavanje okolja':'*Naravoslovje in tehnika',...(g>=4?['*Družba']:[]),'Likovna umetnost','Glasbena umetnost','Šport'];
  if(g<=7)return['*Slovenščina','*Matematika','*Angleščina','*Zgodovina','*Geografija','*Naravoslovje','*Tehnika in tehnologija',g===6?'Gospodinjstvo':'Domovinska in državljanska kultura in etika','Likovna umetnost','Glasbena umetnost','Šport'];
  return['*Slovenščina','*Matematika','*Angleščina','*Zgodovina','*Geografija','*Biologija','*Kemija','*Fizika',...(g===8?['Domovinska in državljanska kultura in etika']:[]),'Likovna umetnost','Glasbena umetnost','Šport']}
 if(OB.program==='Gimnazija')return['*Slovenščina','*Matematika','*Angleščina','*Nemščina','*Zgodovina','*Geografija','*Biologija','*Kemija','*Fizika',...(g===1?['Informatika','Glasba','Likovna umetnost']:[]),...(g===2?['Psihologija']:[]),...(g===3?['Sociologija']:[]),...(g===4?['Filozofija']:[]),'Športna vzgoja'];
 if(OB.program==='Strokovna šola')return['*Slovenščina','*Matematika','*Angleščina','*Zgodovina','*Fizika','*Kemija','*Strokovni modul 1','*Strokovni modul 2','Športna vzgoja'];
 return['*Slovenščina','*Matematika','*Angleščina','*Družboslovje','*Naravoslovje','*Strokovni modul','Športna vzgoja']}
const gradeLbl=(lv,g)=>lv==='os'?`${g}. razred`:`${g}. letnik`;
function vOnboard(){const s=OB.step,steps=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;let h='';
 if(s===0)h=`<div class="logo">${MARK()}</div><h1>Pozdravljen v Grady</h1><p class="lead">Ocene, testi in napredek na enem mestu. Vse ostane samo na tvoji napravi.</p>
 <div class="card"><label for="obName" style="margin-top:0">Kako ti je ime?</label><input id="obName" value="${esc(OB.name)}" placeholder="Tvoje ime" autocomplete="given-name" enterkeyhint="next"></div>
 <button class="btn primary full" id="obNext">Naprej</button><button class="btn full" id="obDemo">Najprej poskusi z demo podatki</button>`;
 if(s===1){const n=OB.level==='os'?9:4;h=`${steps}<h1>Katero šolo obiskuješ?</h1><p class="lead">Glede na to ti predlagam predmete.</p>
 <div class="choice">${[['os','Osnovna šola','1. do 9. razred'],['ss','Srednja šola','1. do 4. letnik']].map(([k,t,d])=>`<button type="button" data-l="${k}" class="${OB.level===k?'on':''}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>
 ${OB.level==='ss'?`<div class="flabel">Program</div><div class="tchips" id="obProg">${PROGS.map(p=>`<button type="button" class="tchip ${OB.program===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>`:''}
 <div class="flabel">${OB.level==='os'?'Razred':'Letnik'}</div><div class="tchips" id="obGr">${Array.from({length:n},(_,i)=>i+1).map(g=>`<button type="button" class="tchip ${OB.grade===g?'on':''}" data-g="${g}">${g}.</button>`).join('')}</div>
 <label for="obSchool">Ime šole <span style="font-weight:400">(neobvezno)</span></label><input id="obSchool" value="${esc(OB.school)}" placeholder="npr. Gimnazija Bežigrad">
 ${OB.level==='ss'?`<p class="sub mt" style="margin-left:4px">Maturo boš nastavil v zavihku Matura.</p>`:''}
 <div class="row mt"><button class="btn" id="obBack">Nazaj</button><button class="btn primary grow" id="obNext">Naprej</button></div>`}
 if(s===2){if(S.subjects.length)h=`${steps}<h1>Predmeti so že tu</h1><p class="lead">Imaš ${S.subjects.length} predmetov iz prejšnje uporabe. Urejaš jih lahko kadar koli.</p><div class="row"><button class="btn" id="obBack">Nazaj</button><button class="btn primary grow" id="obDone">Začni</button></div>`;
  else{if(!OB.subs)OB.subs=presetSubs().map(x=>({n:x.replace('*',''),on:x[0]==='*'}));const c=OB.subs.filter(x=>x.on).length;
  h=`${steps}<h1>Tvoji predmeti</h1><p class="lead">Označi predmete, ki jih imaš letos. Kasneje lahko dodaš ali odstraniš katerega koli.</p>
  <div class="card"><div class="tchips" id="obSubs">${OB.subs.map((x,i)=>`<button type="button" class="tchip ${x.on?'on':''}" data-i="${i}">${esc(x.n)}</button>`).join('')}</div>
  <div class="row mt"><input id="obCustom" placeholder="Dodaj svoj predmet" value="${esc(OB.custom)}" enterkeyhint="done"><button class="icon-btn" id="obAdd" type="button" aria-label="Dodaj predmet">${svg('plus')}</button></div></div>
  <div class="row mt"><button class="btn" id="obBack">Nazaj</button><button class="btn primary grow" id="obDone">Začni z ${c} ${c===1?'predmetom':'predmeti'}</button></div>`}}
 $('#app').innerHTML=`<div class="ob">${h}<div class="brand">${MARK()}Grady</div></div>`;
 const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
 const nm=$('#obName');if(nm){nm.oninput=e=>OB.name=e.target.value;nm.onkeydown=e=>{if(e.key==='Enter')$('#obNext').click()};if(!OB.name)setTimeout(()=>nm.focus(),50)}
 const sc=$('#obSchool');if(sc)sc.oninput=e=>OB.school=e.target.value;
 const cu=$('#obCustom');if(cu){cu.oninput=e=>OB.custom=e.target.value;cu.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#obAdd').click()}}}
 on('obNext',()=>{if(s===0&&!OB.name.trim()){toast('Vpiši svoje ime');return}if(s===1&&!OB.grade){toast(OB.level==='os'?'Izberi razred':'Izberi letnik');return}OB.step++;vOnboard()});
 on('obBack',()=>{OB.step--;vOnboard()});
 on('obDemo',()=>{S.profile={name:'Demo',level:'ss',grade:3,program:'Gimnazija',school:'',at:new Date().toISOString()};S.settings.user='Demo';save();demo()});
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(OB.level!==b.dataset.l){OB.level=b.dataset.l;OB.grade=null;OB.subs=null}vOnboard()});
 document.querySelectorAll('#obProg [data-p]').forEach(b=>b.onclick=()=>{OB.program=b.dataset.p;OB.subs=null;vOnboard()});
 document.querySelectorAll('#obGr [data-g]').forEach(b=>b.onclick=()=>{OB.grade=+b.dataset.g;OB.subs=null;vOnboard()});
 document.querySelectorAll('#obSubs [data-i]').forEach(b=>b.onclick=()=>{const x=OB.subs[+b.dataset.i];x.on=!x.on;vOnboard()});
 on('obAdd',()=>{const n=OB.custom.trim();if(!n)return;if(!OB.subs.some(x=>x.n.toLowerCase()===n.toLowerCase()))OB.subs.push({n,on:true});OB.custom='';vOnboard()});
 on('obDone',()=>{if(!S.subjects.length){const pick=OB.subs.filter(x=>x.on);if(!pick.length){toast('Izberi vsaj en predmet');return}pick.forEach((x,i)=>S.subjects.push({id:uid(),name:x.n,color:PALETTE[i%PALETTE.length],target:null}))}
  S.profile={name:OB.name.trim(),level:OB.level,grade:OB.grade,program:OB.level==='ss'?OB.program:null,school:OB.school.trim(),at:new Date().toISOString()};S.settings.user=S.profile.name;logA('Ustvarjen profil');save();location.hash='home';render();toast(`Dobrodošel, ${S.profile.name}`)})}

/* ============ ZAGON ============ */
function loadChart(){return new Promise(res=>{if(window.Chart)return res(true);let done=0;const fin=v=>{if(!done){done=1;res(v)}};const s=document.createElement('script');s.src=CHART_URL;s.onload=()=>fin(true);s.onerror=()=>fin(false);document.head.appendChild(s);setTimeout(()=>fin(!!window.Chart),7000)})}
async function boot(){const st=$('#spStatus'),bar=$('#spBar'),t0=performance.now(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,ms));
 const step=(t,p)=>{st.textContent=t;bar.style.width=p+'%'};
 applyTheme();step('Nalagam tvoje podatke',22);await wait(reduce?0:260);
 step('Pripravljam grafe',52);const ok=await loadChart();
 step('Računam analizo',80);S.subjects.forEach(subjStats);await wait(reduce?0:200);
 step('Skoraj pripravljeno',100);render();
 const el=performance.now()-t0,min=reduce?0:1550;if(el<min)await wait(min-el);
 const sp=$('#splash');sp.classList.add('out');setTimeout(()=>sp.remove(),500);if(!ok&&S.grades.length)toast('Grafi bodo na voljo, ko boš povezan')}
boot();
/*SW*/if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
