<html lang="en">

<style>
/*FONTS*/
:root{color-scheme:dark;--bg:#141311;--bg2:#1a1917;--card:#201f1c;--card2:#272522;--card3:#2f2d29;--line:rgba(239,232,220,.09);--line2:rgba(239,232,220,.16);--fill:rgba(239,232,220,.06);--text:#efe8dc;--ink2:#cbc3b6;--muted:#8f877b;
 --accent:#e2825c;--blue:#79a9ea;--green:#68c38f;--yellow:#e9c35a;--violet:#a690ea;--red:#ef6d5e;--grid:rgba(239,232,220,.045);--grid2:rgba(239,232,220,.08);
 --serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif;--hand:'Caveat',cursive;--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
 --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.56,.64,1);--r:16px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.6);--glt:rgba(255,255,255,.035);--gl-hi:rgba(255,255,255,.06);--gl-edge:rgba(239,232,220,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
h1{font:400 40px/1.05 var(--serif);margin:0;letter-spacing:-.01em}h2{font:600 17px/1.3 var(--sans);margin:0}h3{font:400 24px/1.15 var(--serif);margin:0}
.sub{color:var(--muted)}.sm{font-size:12.5px}.mono{font-family:var(--mono);letter-spacing:.02em}.hand{font:600 26px/1 var(--hand);color:var(--accent)}.grow{flex:1}
.tag{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}.row{display:flex;gap:8px;align-items:center;margin-top:14px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}
label{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin:14px 0 6px}label em{font-style:normal;color:var(--muted);font-weight:500}.flabel{font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--card2);color:var(--text);font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .3s var(--spring),background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.96)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.primary:hover{background:#fff}.btn.danger{color:var(--red)}label.btn{margin:0;font-size:14px;color:var(--text)}label.btn.sm{font-size:13px}.btn.full{width:100%}.btn.big{min-height:48px;font-size:15.5px;padding:10px 22px}.btn.sm{min-height:32px;padding:5px 12px;font-size:13px}.btn .ic{width:17px;height:17px}.btn .rxi{width:17px;height:17px}
.btn:disabled,.icon-btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;cursor:pointer;color:var(--text);transition:transform .3s var(--spring),background .2s;flex:none}.icon-btn:hover{background:var(--card3)}.icon-btn:active{transform:scale(.92)}.icon-btn.sm{width:32px;height:32px;border-radius:10px}.icon-btn .ic{width:18px;height:18px}
.lnk{border:none;background:none;color:var(--accent);font-weight:650;cursor:pointer;padding:0}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);gap:2px}.seg button,.seg label{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:6px 12px;border-radius:9px;color:var(--ink2);font-weight:650;font-size:13px;cursor:pointer;margin:0}.seg .ic{width:16px;height:16px}
.seg button.on,.seg label:has(input:checked){background:var(--card3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.3)}.seg input{position:absolute;opacity:0;pointer-events:none}.seg.wide{display:flex}.seg.wide label{flex:1;justify-content:center}.seg.sm button{padding:5px 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;background:var(--fill);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink2)}.pill .ic{width:13px;height:13px}.pubp{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.card{background:linear-gradient(170deg,var(--card2),var(--card) 55%);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.dots{margin:8px 0 0;padding-left:18px;color:var(--ink2)}.dots li{margin:4px 0}.dots.sm{font-size:13px}
.lab{display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lc,var(--muted))}.lab .ic{width:16px;height:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:650;font-size:14px;z-index:99;transition:.35s var(--ease);pointer-events:none;max-width:80vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
/* marks and shared bits */
.hubm{fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}.hubm .ha{stroke:var(--text);stroke-width:4}.hubm .hb{stroke:var(--accent);stroke-width:3.6}.hubm .hp{fill:var(--accent);stroke:none}
.fig{width:100%;height:100%;color:var(--text)}.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pkpic{--pc:var(--accent);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--pc) 16%,var(--bg));color:var(--pc);overflow:hidden;border:1px solid color-mix(in srgb,var(--pc) 26%,transparent)}
.pkpic svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pkpic.img img{width:100%;height:100%;object-fit:cover}.pkpic.md{width:40px;height:40px;border-radius:12px}.pkpic.lg{width:52px;height:52px;border-radius:16px}.pkpic.sm{width:30px;height:30px;border-radius:9px}
.rxi{width:20px;height:20px;display:block}.rxi .f{fill:color-mix(in srgb,var(--rf) 62%,var(--card));stroke:var(--text);stroke-width:1.5;stroke-linejoin:round}.rxi .s{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.rxu{font-size:15px}
.rxs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.rx{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 5px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-size:12px;font-weight:700}.rx .rxi{width:16px;height:16px}
.pltag{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;font:700 9.5px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}
.chp{--cc:var(--blue);display:flex;align-items:center;gap:7px;width:100%;min-height:36px;padding:5px 10px 5px 7px;border-radius:12px;border:1px solid color-mix(in srgb,var(--cc) 12%,transparent);background:color-mix(in srgb,var(--cc) 6%,transparent);color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:4px;text-align:left}
.chh{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:8px;font-weight:750;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}.chn{flex:1}.chp em{font-style:normal;font-size:11px;color:var(--muted)}
.chp.on{color:var(--text);background:color-mix(in srgb,var(--cc) 16%,var(--card));border-color:color-mix(in srgb,var(--cc) 36%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 9%,transparent),0 8px 20px -10px color-mix(in srgb,var(--cc) 60%,transparent)}.chp.on .chh{background:var(--cc);color:var(--bg)}
/* ===== sign in and license ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(380px,1.1fr) minmax(380px,520px);}
.authart{position:relative;overflow:hidden;background:var(--bg2);border-right:1px solid var(--line);color:var(--text);padding:48px;display:flex;flex-direction:column}
.gridart{position:absolute;inset:0;width:100%;height:100%;color:var(--text)}.authlogo{position:relative;display:flex;gap:14px;align-items:center}.authlogo b{display:block;font:400 30px/1 var(--serif)}.authlogo span{color:var(--muted)}
.authfig{position:relative;width:190px;height:190px;margin:auto 0 0 auto;opacity:.95}.authpts{position:relative;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px;max-width:440px}.authpts li{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);color:var(--ink2);font-size:14px}.authpts b{color:var(--text)}
.authf{align-self:center;padding:48px;max-width:520px;width:100%}.authf h1{margin-bottom:6px}.authf .btn{margin-top:22px}.authf .sub.sm{margin-top:12px;text-align:center}
.auth.lic{display:grid;place-items:center;grid-template-columns:1fr;background:radial-gradient(circle at 30% 10%,rgba(226,130,92,.08),transparent 50%),var(--bg);padding:40px}.licwrap{max-width:720px;width:100%}.licwrap h1{margin-bottom:6px}.licwrap .liccard{margin:24px 0}
.liccard{position:relative;border-radius:22px;padding:26px 28px 22px 46px;background:linear-gradient(160deg,#2a2723,#1f1d1a);border:1px solid var(--line2);box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05) inset;overflow:hidden}
.liccard::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}
.liccard.fresh{animation:licin .9s var(--ease) both}@keyframes licin{from{opacity:0;transform:translateY(24px) rotate(-1.5deg)}}
.licperf{position:absolute;left:18px;top:14px;bottom:14px;border-left:2px dashed var(--line2)}
.lichead{position:relative;display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}.lichead b{display:block;font:400 22px/1 var(--serif)}.lichead span{font:700 10.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.licno{margin-left:auto;font:600 15px/1 var(--mono)!important;letter-spacing:.12em!important;color:var(--text)!important;padding:8px 12px;border:1px solid var(--line2);border-radius:10px}
.licbody{position:relative;display:grid;grid-template-columns:120px 1fr 1fr;gap:20px;padding:18px 0;align-items:start}.licfig{width:120px;height:120px}
.licbody dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.licbody dt{font:700 10px/1.9 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.licbody dd{margin:0;font-weight:600}
.licrights{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:13.5px;color:var(--ink2)}.licrights li{display:flex;gap:8px;align-items:center}.licrights .ic{width:16px;height:16px;color:var(--green)}
.licfoot{position:relative;display:flex;align-items:center;gap:20px;border-top:1px solid var(--line);padding-top:14px}.licsig{font:600 34px/1 var(--hand);color:var(--accent);transform:rotate(-4deg)}.licbar{display:flex;gap:2px;height:30px;align-items:stretch;flex:1;max-width:220px}.licbar i{background:var(--ink2);opacity:.8}
.licseal{width:96px;height:96px;margin-left:auto;transform:rotate(-12deg);animation:seal .7s .6s var(--spring) both}.liccard:not(.fresh) .licseal{animation:none}@keyframes seal{from{opacity:0;transform:rotate(-12deg) scale(1.6)}}
.licseal .s1{fill:none;stroke:var(--accent);stroke-width:2}.licseal .s2{fill:none;stroke:var(--accent);stroke-width:1;opacity:.6}.licseal text{font:700 8.6px var(--mono);letter-spacing:.14em;fill:var(--accent)}.licseal .ha{stroke:var(--accent);stroke-width:4;fill:none}.licseal .hb{stroke:var(--accent);stroke-width:3.6;fill:none;stroke-linecap:round}.licseal .hp{fill:var(--accent)}
/* ===== shell ===== */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.brand b{display:block;font:400 19px/1 var(--serif)}.brand span{font:700 9.5px/1.8 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}.nv{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;border:none;background:none;color:var(--ink2);font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.nv:hover{background:var(--fill);color:var(--text)}.nv.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}.nv.on .ic{color:var(--accent)}.nv em{margin-left:auto;font:600 11px var(--mono);font-style:normal;color:var(--muted)}
.side .btn.full{margin-top:4px}.acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 8px;border-top:1px solid var(--line)}.aini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 20%,var(--bg));color:var(--accent);font-weight:750;font-size:13px}
.acct b{display:block;font-size:14px}.acct span{font:600 11px var(--mono);color:var(--muted);letter-spacing:.06em}.sidelink{display:flex;align-items:center;gap:8px;padding:6px 8px;color:var(--muted);text-decoration:none;font-size:13.5px}.sidelink:hover{color:var(--text)}
.main{min-width:0}.pg{padding:34px 40px 60px;max-width:1240px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.hd .hand{display:block;margin-bottom:6px}.hdr{display:flex;gap:8px}
.licchip{display:inline-flex;gap:7px;align-items:center;font:600 12.5px var(--mono);letter-spacing:.08em;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);color:var(--ink2)}.licchip.claim{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);cursor:pointer;font-family:var(--sans);letter-spacing:0}.licchip .ic{width:16px;height:16px;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.tile{padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(170deg,var(--card2),var(--card));display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.tile .big{font:650 40px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}.tile .sub{font-size:12.5px}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:22px}.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:-6px}
.chart{width:100%;height:auto;display:block}.cg{stroke:var(--line);stroke-dasharray:3 4}.ct{fill:var(--muted);font:600 9.5px var(--mono)}.cb{transform-box:fill-box;transform-origin:bottom;animation:grow .7s calc(var(--i)*30ms) var(--ease) both}.cb.s{fill:var(--blue)}.cb.t{fill:var(--green)}@keyframes grow{from{transform:scaleY(0)}}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.starts button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;transition:transform .3s var(--spring),border-color .2s}.starts button:hover{border-color:var(--line2)}.starts button:active{transform:scale(.97)}.starts .ic{width:22px;height:22px;color:var(--accent);margin-bottom:6px}.starts b{font-size:14.5px}.starts span{font-size:12.5px;color:var(--muted)}
.ptable{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.pth,.ptr{display:grid;grid-template-columns:40px 1.6fr 1fr .6fr .6fr .6fr .8fr;gap:12px;align-items:center;padding:10px 16px}.pth{grid-template-columns:1.6fr 1fr .6fr .6fr .6fr .8fr;padding-left:68px;font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.ptr{width:100%;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink2);font-size:13.5px}.ptr:last-child{border-bottom:none}.ptr:hover{background:var(--fill)}.ptr b{color:var(--text);font-size:14.5px}
.empty{display:flex;gap:22px;align-items:center}.empty .fig{width:130px;height:130px;flex:none}.empty h3{margin-bottom:4px}.empty .btn{margin-top:12px}
.fbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.search{position:relative;flex:1;max-width:420px}.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}.search input{padding-left:38px!important}
.note{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding:14px 18px}.note .ic{color:var(--blue)}.note p{margin:0;color:var(--ink2);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(170deg,var(--card2),var(--card));box-shadow:var(--sh);transition:border-color .2s,transform .3s var(--ease);animation:rise .45s var(--ease) both}.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}.pct{display:flex;gap:12px;align-items:center}.pct b{display:block;font-size:16px}.pct span{font-size:12.5px;color:var(--muted)}.pcard p{margin:0;color:var(--ink2);font-size:14px;line-height:1.45;min-height:40px}
.pcm{display:flex;flex-wrap:wrap;gap:5px}.pca{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}.pcs{font-size:11px;color:var(--muted)}
.licpage{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
/* ===== studio ===== */
.v-studio .main,.v-test .main{height:100vh;overflow:hidden}
.studio,.bench{display:flex;flex-direction:column;height:100vh}
.stbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.picbtn{border:none;background:none;padding:0;cursor:pointer;border-radius:12px;transition:transform .3s var(--spring)}.picbtn:hover{transform:scale(1.05)}
.stname{max-width:240px;font:400 22px/1 var(--serif)!important;background:none!important;border:1px solid transparent!important;padding:6px 8px!important}.stname:hover{border-color:var(--line)!important}.stname:focus{border-color:var(--accent)!important}
.svst{font-size:11px;color:var(--muted);margin-right:4px}.bt b{display:block;font:400 19px/1.1 var(--serif)}.bt span{font-size:10.5px;color:var(--muted);letter-spacing:.12em}
.stbody{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 310px}.m-code .stbody{grid-template-columns:1fr 340px}
.pal{border-right:1px solid var(--line);overflow-y:auto;padding:12px;background:var(--bg2)}.pal .search{max-width:none;margin-bottom:10px}
