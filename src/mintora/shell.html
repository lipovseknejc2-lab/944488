<style>
/*FONTS*/
/* ================= tokens ================= */
:root{
 --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--f-text:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--f-hand:'Caveat',cursive;
 --bg:#F6F7F5;--panel:#FFFFFF;--panel2:#FBFBFA;--side:#EFF1EE;--sunken:#F1F3F0;--line:#E3E6E1;--line2:#D3D8D1;--text:#0E1512;--ink2:#38423D;--muted:#6B756F;--faint:#9AA39D;
 --mint:#12C48B;--mint-ink:#078A60;--mint-soft:#DDF7EC;--violet:#6D5DFC;--violet-soft:#ECE9FF;--amber:#E39A22;--amber-soft:#FCF0DA;--red:#E5484D;--red-soft:#FDE6E6;--blue:#2F7BEA;--blue-soft:#E3EEFD;--pink:#E0558F;
 --sel:rgba(18,196,139,.14);--focus:0 0 0 3px rgba(18,196,139,.28);
 --r-s:7px;--r:10px;--r-l:14px;--r-xl:20px;
 --sh-1:0 1px 1px rgba(16,24,20,.04),0 1px 3px rgba(16,24,20,.06);--sh-2:0 1px 2px rgba(16,24,20,.05),0 8px 24px -6px rgba(16,24,20,.12);--sh-3:0 2px 6px rgba(16,24,20,.06),0 24px 60px -12px rgba(16,24,20,.28);
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.5,1);
 --side-w:248px;color-scheme:light}
:root[data-theme=dark]{--bg:#0B0E0D;--panel:#121615;--panel2:#151A18;--side:#0E1211;--sunken:#0F1312;--line:#1F2624;--line2:#2B3431;--text:#EDF2EF;--ink2:#C3CCC7;--muted:#8A958F;--faint:#5D6863;
 --mint:#2EE6A6;--mint-ink:#2EE6A6;--mint-soft:rgba(46,230,166,.12);--violet:#8F82FF;--violet-soft:rgba(143,130,255,.14);--amber:#F2B347;--amber-soft:rgba(242,179,71,.13);--red:#FF6369;--red-soft:rgba(255,99,105,.13);--blue:#5B9BFF;--blue-soft:rgba(91,155,255,.13);
 --sel:rgba(46,230,166,.14);--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 1px 2px rgba(0,0,0,.4),0 10px 30px -8px rgba(0,0,0,.6);--sh-3:0 30px 80px -10px rgba(0,0,0,.75);color-scheme:dark}
/* Blueprint: everything turns into a technical drawing */
body.bp{--bg:#0C2A66;--panel:rgba(10,36,92,.82);--panel2:rgba(12,42,104,.9);--side:#09214F;--sunken:rgba(6,24,66,.6);--line:rgba(160,195,255,.18);--line2:rgba(170,205,255,.32);--text:#EAF1FF;--ink2:#C5D6F5;--muted:#8FA9D8;--faint:#6C88BD;
 --mint:#7FE3FF;--mint-ink:#7FE3FF;--mint-soft:rgba(127,227,255,.12);--violet:#B6A8FF;--violet-soft:rgba(182,168,255,.14);--sel:rgba(127,227,255,.16);--focus:0 0 0 3px rgba(127,227,255,.3);
 --sh-1:none;--sh-2:0 12px 40px -12px rgba(0,8,30,.7);--sh-3:0 30px 80px -10px rgba(0,8,30,.8);color-scheme:dark}
/* ================= base ================= */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden;transition:background .5s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
::selection{background:var(--sel)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.mono,code,kbd{font-family:var(--f-mono);font-size:.92em}.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hand{font-family:var(--f-hand);font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s{width:15px;height:15px}.ic.l{width:22px;height:22px}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
/* ================= app frame ================= */
#app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;transition:grid-template-columns .35s var(--ease)}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:background .5s var(--ease)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;cursor:pointer}
.brand .mark{width:30px;height:30px;flex:none}.brand b{font:600 19px/1 var(--f-display);letter-spacing:-.035em}
.brand .tier{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:block}
.ws{margin:2px 10px 10px;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh-1);cursor:pointer;transition:border-color .2s}
.ws:hover{border-color:var(--line2)}.ws .wsl{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--f-display);color:#fff;flex:none}
.ws div{min-width:0;flex:1}.ws b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ws span{font-size:11.5px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav .grp{font:600 10.5px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);color:var(--ink2);font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
.nav a.on .ic{color:var(--mint-ink)}
.nav a .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.nav a .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.nav a .lk{margin-left:auto;color:var(--faint)}.nav a .lk .ic{width:14px;height:14px}
.sidefoot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
.bpbtn{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r);background:#0C2A66;color:#EAF1FF;border:1px solid #1D4192;position:relative;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.bpbtn::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(170,205,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(170,205,255,.12) 1px,transparent 1px);background-size:10px 10px;pointer-events:none}
.bpbtn>*{position:relative}.bpbtn b{font:600 13px var(--f-display);display:block}.bpbtn span{font:500 10.5px var(--f-mono);color:#8FB3F0;letter-spacing:.04em}
.bpbtn .ic{color:#7FE3FF}.bpbtn:hover{border-color:#3A63C2}
.me{display:flex;align-items:center;gap:9px;padding:4px 4px;border-radius:var(--r-s);cursor:pointer}.me:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}.me b{font-size:13px;display:block;line-height:1.2}.me span{font-size:11.5px;color:var(--muted)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#bar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px 0 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);position:relative;z-index:5}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}.crumbs b{color:var(--text);font-weight:600}.crumbs a:hover{color:var(--text)}.crumbs .ic{width:14px;height:14px;color:var(--faint)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:280px;height:34px;padding:0 8px 0 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;cursor:text;transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--line2)}.search kbd{margin-left:auto}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--panel2);color:var(--muted);font:500 11px var(--f-mono)}
.credpill{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font:600 13px var(--f-mono);cursor:pointer;transition:transform .3s var(--spring),border-color .2s}
.credpill:hover{border-color:var(--line2)}.credpill .coin{width:18px;height:18px}.credpill.bump{animation:bump .6s var(--spring)}@keyframes bump{40%{transform:scale(1.08)}}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--ink2);position:relative;transition:background .15s,border-color .15s}
.ibtn:hover{background:var(--panel);border-color:var(--line)}.ibtn .badge-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
#view{flex:1;overflow:auto;position:relative;scroll-behavior:smooth}
.page{padding:28px 32px 64px;max-width:1440px;margin:0 auto;animation:pin .4s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}.ph .grow{min-width:0}.ph p{margin:6px 0 0;color:var(--muted)}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mint-ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
/* ================= components ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--sh-1);transition:transform .25s var(--spring),background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--text) 22%,var(--line2))}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.pri:hover{background:color-mix(in srgb,var(--text) 86%,var(--mint))}
.btn.mint{background:var(--mint);color:#04261A;border-color:color-mix(in srgb,var(--mint) 70%,#000)}.btn.mint:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}.btn.ghost:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.btn.danger{color:var(--red)}.btn.danger.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:var(--r-s)}.btn.lg{height:42px;padding:0 20px;font-size:14.5px;border-radius:12px}.btn.full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:border-color .2s,box-shadow .2s,transform .3s var(--spring)}
.card.pad{padding:18px 20px}.card.hov{cursor:pointer}.card.hov:hover{border-color:var(--line2);box-shadow:var(--sh-2)}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.ch h3{font-size:14px}.ch .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:16px 18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:16px}.mt2{margin-top:24px}.mb{margin-bottom:16px}.sp{height:16px}
.sep{height:1px;background:var(--line);margin:14px 0}
.kpi{padding:16px 18px;position:relative;overflow:hidden}.kpi .l{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:500}.kpi .l .ic{width:15px;height:15px}
.kpi .v{font:600 28px/1.1 var(--f-display);letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}.kpi .d{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.kpi .spark{position:absolute;right:16px;top:16px;width:92px;height:30px;opacity:.95}
.delta{display:inline-flex;align-items:center;gap:2px;font:600 11.5px var(--f-mono);padding:2px 6px;border-radius:6px}.delta.up{color:var(--mint-ink);background:var(--mint-soft)}.delta.dn{color:var(--red);background:var(--red-soft)}.delta.eq{color:var(--muted);background:var(--sunken)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.live{color:var(--mint-ink);background:var(--mint-soft);border-color:transparent}.badge.draft{color:var(--amber);background:var(--amber-soft);border-color:transparent}.badge.arch{color:var(--muted)}.badge.vio{color:var(--violet);background:var(--violet-soft);border-color:transparent}.badge.red{color:var(--red);background:var(--red-soft);border-color:transparent}.badge.blue{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;border:1px solid var(--line);color:var(--ink2)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 12px var(--f-display);flex:none;position:relative;overflow:hidden}
.av .st{position:absolute;right:0;bottom:0;width:30%;height:30%;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2px var(--panel)}
.avs{display:flex}.avs .av{box-shadow:0 0 0 2px var(--panel)}.avs .av+.av{margin-left:-7px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunken);border:1px solid var(--line);position:relative}
.seg button{position:relative;z-index:1;height:26px;padding:0 11px;border:none;background:none;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--text)}.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--panel);box-shadow:var(--sh-1),0 0 0 1px var(--line);transition:left .3s var(--ease),width .3s var(--ease)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{height:38px;padding:0 12px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--muted);position:relative}.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text)}.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.tabs button .cnt{font:500 11px var(--f-mono);color:var(--faint);margin-left:5px}
.tgl{position:relative;width:36px;height:22px;flex:none;border-radius:99px;background:var(--line2);border:none;padding:0;transition:background .25s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.tgl.on{background:var(--mint)}.tgl.on::after{transform:translateX(14px)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}.field .hint{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;height:36px;padding:0 11px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--panel);transition:border-color .15s,box-shadow .15s;outline:none}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--mint);box-shadow:var(--focus)}.inp.err{border-color:var(--red)}
.inp-pre{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--panel);overflow:hidden}.inp-pre:focus-within{border-color:var(--mint);box-shadow:var(--focus)}
.inp-pre span{padding:0 10px;color:var(--muted);font:500 12.5px var(--f-mono);background:var(--sunken);height:34px;display:grid;place-items:center;border-right:1px solid var(--line)}.inp-pre input{border:none;height:34px;padding:0 10px;flex:1;min-width:0;background:none;outline:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:26px;height:26px;border-radius:50%;border:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .25s var(--spring)}.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text)}.sw:hover{transform:scale(1.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--text)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}.tbl tbody tr:hover{background:color-mix(in srgb,var(--text) 2.5%,transparent)}.tbl tr.click{cursor:pointer}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;color:var(--muted)}.empty .fig{width:120px;height:120px;color:var(--text);margin-bottom:6px}.empty b{color:var(--text);font:600 16px var(--f-display);margin-bottom:4px}.empty p{margin:0 0 14px;max-width:360px}
.note{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--line);font-size:13px;color:var(--ink2)}.note .ic{color:var(--mint-ink);margin-top:1px}
.pbar{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden}.pbar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--mint));transition:width .8s var(--ease)}
.lst{display:flex;flex-direction:column}.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:none}.li.click{cursor:pointer}.li.click:hover{background:color-mix(in srgb,var(--text) 2.5%,transparent)}
.li b{font-weight:600;font-size:13.5px}.li .sub{font-size:12px;color:var(--muted)}
/* menus, modals, drawers, palette, toasts */
#ov{position:fixed;inset:0;z-index:50;display:none}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,12,10,.36);backdrop-filter:blur(2px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{position:absolute;left:50%;top:50%;width:min(560px,calc(100vw - 40px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-3);animation:pop .35s var(--spring)}
.modal.wide{width:min(860px,calc(100vw - 40px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
.modal .mh{display:flex;align-items:center;gap:12px;padding:18px 22px 12px}.modal .mh h2{font-size:18px}.modal .mh p{margin:3px 0 0;color:var(--muted);font-size:13px}.modal .mh .x{margin-left:auto}
.modal .mb{padding:6px 22px 18px;overflow:auto}.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 var(--r-xl) var(--r-xl)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--sh-3);display:flex;flex-direction:column;animation:din .4s var(--ease)}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.pal{position:absolute;left:50%;top:14vh;width:min(620px,calc(100vw - 40px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden;animation:palin .3s var(--spring)}
@keyframes palin{from{opacity:0;transform:translateX(-50%) scale(.98)}}
.pal .pi{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}.pal .pi input{flex:1;height:54px;border:none;background:none;outline:none;font-size:16px}
.pal .pl{max-height:380px;overflow:auto;padding:6px}.pal .pg{font:600 10.5px var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.pal .po{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}.pal .po.on{background:var(--sel)}.pal .po .k{margin-left:auto;display:flex;gap:4px}.pal .po .ic{color:var(--muted)}
.pal .pf{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);background:var(--panel2)}
.menu{position:fixed;z-index:60;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-3);animation:menin .18s var(--ease)}
@keyframes menin{from{opacity:0;transform:translateY(-4px)}}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:none;background:none;border-radius:7px;font-size:13px;text-align:left}.menu button:hover{background:var(--sel)}.menu button.danger{color:var(--red)}.menu hr{border:none;height:1px;background:var(--line);margin:4px 2px}
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--sh-3);animation:tin .4s var(--spring);pointer-events:auto}
.toast .ic{color:var(--mint)}.toast.out{animation:tout .3s ease forwards}@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}@keyframes tout{to{opacity:0;transform:translateY(6px)}}
.tip{position:fixed;z-index:90;pointer-events:none;padding:6px 9px;border-radius:7px;background:var(--text);color:var(--bg);font-size:12px;font-weight:500;box-shadow:var(--sh-2);white-space:nowrap}
/* charts */
.chart{width:100%;display:block;overflow:visible}.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--faint);font:500 10.5px var(--f-mono)}
.chart .area{opacity:.16}.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.chart .ln2{fill:none;stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.chart .hl{stroke:var(--text);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}.chart .dotp{opacity:0;transition:opacity .15s}.chart.hov .hl,.chart.hov .dotp{opacity:1}
.chart .bar{transition:opacity .2s}.chart .bar:hover{opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px}
/* product covers */
.cover{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;display:block}.cover svg{width:100%;height:100%;display:block}
/* score gauge */
.gauge{position:relative;width:200px;height:200px;flex:none}.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .gt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.gauge .gt b{font:600 54px/1 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.gauge .gt span{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.factor{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;padding:7px 0;font-size:13px}.factor b{font:600 12.5px var(--f-mono);text-align:right}
/* dashboard hero */
.hero{display:flex;gap:28px;align-items:center;padding:24px 26px;position:relative;overflow:hidden}
.hero .art{position:absolute;right:-20px;bottom:-30px;width:300px;height:220px;opacity:.9;pointer-events:none}
.hero h2{font-size:22px}.hero .grade{font:600 12px var(--f-mono);padding:4px 9px;border-radius:7px}
/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{overflow:hidden;display:flex;flex-direction:column}.pcard .cover{border-radius:0;border-bottom:1px solid var(--line)}.pcard .pb{padding:13px 15px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .pb b{font:600 15px var(--f-display);letter-spacing:-.015em}.pcard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.pcard .price{font:600 13px var(--f-mono);color:var(--text);margin-left:auto}
.pcard .cover .badge{position:absolute;left:10px;top:10px;box-shadow:var(--sh-1)}
/* storefront editor */
.editor{display:grid;grid-template-columns:270px 1fr 320px;height:calc(100vh - 56px);overflow:hidden}
.editor>aside{border-right:1px solid var(--line);background:var(--panel2);overflow:auto;padding:14px}.editor>aside.ins{border-right:none;border-left:1px solid var(--line)}
.editor .canvas{overflow:auto;background:var(--sunken);padding:24px;display:flex;justify-content:center;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:18px 18px}
.blk{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px;font-size:13px;font-weight:500;cursor:grab;transition:border-color .15s,transform .25s var(--spring),box-shadow .15s}
.blk:hover{border-color:var(--line2)}.blk.on{border-color:var(--mint);box-shadow:var(--focus)}.blk .h{color:var(--faint)}.blk .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}.blk:hover .acts,.blk.on .acts{opacity:1}
.blk .acts button{width:24px;height:24px;border:none;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted)}.blk .acts button:hover{background:var(--sunken);color:var(--text)}
.blk.drag{opacity:.4}.blk.over{border-color:var(--mint);transform:translateY(2px)}
.addblk{display:grid;grid-template-columns:1fr 1fr;gap:6px}.addblk button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:9px;border-radius:9px;border:1px dashed var(--line2);background:none;font-size:12px;font-weight:600;color:var(--ink2);text-align:left}.addblk button:hover{border-color:var(--mint);color:var(--text)}
.frame{width:100%;max-width:980px;background:#fff;border-radius:12px;box-shadow:var(--sh-3);overflow:hidden;transition:max-width .45s var(--ease);flex:none;align-self:flex-start}
.frame.mob{max-width:390px}.frame,.sfwrap{container-type:inline-size}
@container (max-width:720px){.sf .shero{grid-template-columns:1fr}.sf .sgrid{grid-template-columns:1fr 1fr}.sf h1{font-size:32px}.sf .s-in{padding:32px 26px}}
@container (max-width:460px){.sf .sgrid,.sf .sgal{grid-template-columns:1fr}.sf h1{font-size:28px}.sf .s-in{padding:26px 18px}}
.frame .chrome{height:34px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#F2F3F1;border-bottom:1px solid #E3E5E1}.frame .chrome i{width:10px;height:10px;border-radius:50%;background:#DADDD8}.frame .chrome span{margin:0 auto;font:500 11px var(--f-mono);color:#7A827D;background:#fff;padding:3px 12px;border-radius:6px;border:1px solid #E3E5E1}
/* public storefront (rendered from design tokens) */
.sf{--a:#12C48B;--sbg:#FFFFFF;--ssf:#F5F6F4;--stx:#0E1512;--smu:#66706A;--srad:14px;--sfont:var(--f-display);background:var(--sbg);color:var(--stx);font-family:var(--f-text);position:relative}
.sf .s-in{max-width:880px;margin:0 auto;padding:44px 40px}.frame.mob .sf .s-in{padding:30px 20px}
.sf h1,.sf h2,.sf h3{font-family:var(--sfont);color:var(--stx)}.sf h1{font-size:40px;letter-spacing:-.035em;line-height:1.05}.frame.mob .sf h1{font-size:30px}.sf h2{font-size:24px;margin-bottom:16px}
.sf p{color:var(--smu)}.sf .sbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:calc(var(--srad) * .7);background:var(--a);color:#fff;font-weight:700;border:none;font-size:15px}
.sf .sbtn.alt{background:none;color:var(--stx);box-shadow:inset 0 0 0 1.5px currentColor}
.sf .shero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}.frame.mob .sf .shero{grid-template-columns:1fr}
.sf .scov{border-radius:var(--srad);overflow:hidden;aspect-ratio:4/3;box-shadow:0 20px 50px -20px rgba(0,0,0,.35)}.sf .scov svg{width:100%;height:100%;display:block}
.sf .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.frame.mob .sf .sgrid{grid-template-columns:1fr}
.sf .scard{background:var(--ssf);border-radius:var(--srad);padding:18px}.sf .scard b{display:block;font-family:var(--sfont);font-size:16px;margin:8px 0 4px}.sf .scard p{margin:0;font-size:13.5px}
.sf .sico{width:34px;height:34px;border-radius:calc(var(--srad) * .6);display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a)}
.sf .sq{font-family:var(--sfont);font-size:17px;line-height:1.4;color:var(--stx);margin:0 0 12px}
.sf .sprice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.sf .tier{border:1.5px solid color-mix(in srgb,var(--stx) 12%,transparent);border-radius:var(--srad);padding:20px}.sf .tier.best{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 14%,transparent)}
.sf .tier .amt{font:700 34px var(--sfont);letter-spacing:-.03em}.sf .tier ul{list-style:none;padding:0;margin:12px 0 16px;font-size:13.5px;color:var(--smu)}.sf .tier li{padding:4px 0;display:flex;gap:8px}.sf .tier li::before{content:"";width:14px;height:14px;flex:none;margin-top:3px;border-radius:50%;background:color-mix(in srgb,var(--a) 22%,transparent)}
.sf details{border-bottom:1px solid color-mix(in srgb,var(--stx) 10%,transparent);padding:14px 0}.sf summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}.sf summary::after{content:"+";color:var(--a);font-size:18px;line-height:1}.sf details[open] summary::after{content:"−"}.sf details p{margin:8px 0 0}
.sf .sbio{display:flex;gap:18px;align-items:center;background:var(--ssf);border-radius:var(--srad);padding:22px}
.sf .scta{text-align:center;background:var(--stx);color:var(--sbg);border-radius:var(--srad);padding:40px 24px}.sf .scta h2{color:var(--sbg)}.sf .scta p{color:color-mix(in srgb,var(--sbg) 70%,transparent)}
.sf .sgal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sf .sgal div{aspect-ratio:1;border-radius:var(--srad);overflow:hidden}.sf .sgal svg{width:100%;height:100%;display:block}
.sf .pat-grid{background-image:linear-gradient(color-mix(in srgb,var(--stx) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--stx) 6%,transparent) 1px,transparent 1px);background-size:28px 28px}
.sf .pat-dots{background-image:radial-gradient(color-mix(in srgb,var(--stx) 12%,transparent) 1.2px,transparent 1.2px);background-size:18px 18px}
.sf .blkwrap{position:relative;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s;cursor:pointer}.sf .blkwrap:hover{outline-color:color-mix(in srgb,var(--mint) 60%,transparent)}.sf .blkwrap.on{outline-color:var(--mint)}
.sf .blkwrap .blab{position:absolute;left:8px;top:8px;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--mint);color:#04261A;padding:3px 6px;border-radius:5px;opacity:0;transition:opacity .15s;z-index:2}.sf .blkwrap:hover .blab,.sf .blkwrap.on .blab{opacity:1}
/* plugin outputs on the storefront */
.pl-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;font-weight:700;font-size:13.5px;color:#fff;background:var(--a)}
.pl-banner.dark{background:var(--stx);color:var(--sbg)}.pl-banner .cd{font-family:var(--f-mono);font-weight:500;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.18)}
.pl-proof{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 12px;border-radius:99px;background:var(--ssf);font-size:13px;font-weight:600}.pl-proof i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent)}
.pl-code{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border:1.5px dashed var(--a);border-radius:10px;font-weight:700;font-size:13px}.pl-code code{font-size:13px;color:var(--a)}
.pl-sticky{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--sbg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid color-mix(in srgb,var(--stx) 10%,transparent);z-index:3}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 56px)}.chat.hub{grid-template-columns:72px 240px 1fr 250px}
.chat aside{border-right:1px solid var(--line);background:var(--panel2);overflow:auto;padding:12px 10px}
.chl{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer}.chl:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}.chl.on{background:var(--sel);color:var(--text)}.chl .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mint);color:#04261A;font:600 10.5px/18px var(--f-mono);text-align:center}
.chl .hash{color:var(--faint)}.chl.unread{color:var(--text);font-weight:700}
.msgs{display:flex;flex-direction:column;min-height:0}.msgs .mh2{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}.msgs .mh2 b{font:600 15px var(--f-display)}
.mlist{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:11px;padding:6px 8px;border-radius:9px;animation:pin .3s var(--ease)}.msg:hover{background:color-mix(in srgb,var(--text) 2.5%,transparent)}
.msg .who{display:flex;align-items:baseline;gap:8px}.msg .who b{font-size:13.5px}.msg .who .t{font-size:11px;color:var(--faint)}.msg .tx{font-size:13.5px;color:var(--ink2);white-space:pre-wrap;word-wrap:break-word}
.msg.cont{padding-top:0}.msg.cont .av{visibility:hidden;height:0}
.msg .role{font:600 10px var(--f-mono);padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.msg.sys .tx{color:var(--muted);font-style:italic}.msg.bot .who b::after{content:"BOT";margin-left:6px;font:600 9px var(--f-mono);padding:1px 4px;border-radius:4px;background:var(--violet);color:#fff;vertical-align:1px}
.typing{font-size:12px;color:var(--muted);padding:2px 30px;height:20px}
.compose{padding:12px 20px 18px}.compose .cbox{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--panel)}.compose .cbox:focus-within{border-color:var(--mint);box-shadow:var(--focus)}
.compose textarea{flex:1;border:none;outline:none;background:none;resize:none;height:22px;max-height:140px;padding:5px 0;line-height:1.45}
.mcard{display:flex;gap:12px;align-items:center;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:12px;max-width:380px;background:var(--panel2);cursor:pointer}.mcard .cover{width:86px;flex:none}.mcard b{font:600 14px var(--f-display);display:block}
.hubrail{background:var(--side)!important;padding:12px 0!important;display:flex;flex-direction:column;align-items:center;gap:8px}
.hubi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font:600 15px var(--f-display);cursor:pointer;position:relative;transition:border-radius .3s var(--ease),transform .3s var(--spring)}.hubi:hover{border-radius:12px}
.hubi.on::before{content:"";position:absolute;left:-12px;width:4px;height:28px;border-radius:0 4px 4px 0;background:var(--text)}.hubi.add{background:var(--panel);color:var(--mint-ink);border:1px dashed var(--line2)}
.memb{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;font-size:13px;cursor:pointer}.memb:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}.memb .rl{font-size:11px;color:var(--muted)}
.rolehd{font:600 10.5px var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px;display:flex;align-items:center;gap:6px}.rolehd i{width:8px;height:8px;border-radius:50%}
.hubban{height:110px;border-radius:12px;margin-bottom:10px;position:relative;overflow:hidden}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.kcol{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;min-height:200px;transition:background .2s,border-color .2s}.kcol.over{border-color:var(--mint);background:var(--mint-soft)}
.kcol .kh{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:600;font-size:13px}.kcol .kh i{width:9px;height:9px;border-radius:50%}.kcol .kh .cnt{font:500 11px var(--f-mono);color:var(--muted)}.kcol .kh .ibtn{margin-left:auto;width:26px;height:26px}
.kcard{padding:12px 13px;margin-bottom:8px;cursor:grab}.kcard b{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}.kcard p{margin:0 0 10px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .km{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}.kcard.drag{opacity:.4;transform:rotate(1.5deg)}
.vote{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font:600 11.5px var(--f-mono);color:var(--ink2)}.vote.on{color:var(--mint-ink);border-color:var(--mint)}
/* credits */
.wallet{padding:26px;position:relative;overflow:hidden;background:var(--text);color:var(--bg);border:none}
.wallet .big{font:600 56px/1 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.wallet .muted{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.wallet .coins{position:absolute;right:24px;top:20px;width:170px;height:170px;opacity:.95}
.shopi{display:flex;flex-direction:column;gap:8px;padding:16px}.shopi .si{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunken);color:var(--c,var(--mint-ink))}.shopi b{font:600 15px var(--f-display)}.shopi p{margin:0;color:var(--muted);font-size:12.5px;flex:1}
.cost{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--f-mono)}
/* blueprint */
body.bp #main{background-color:#0C2A66;background-image:linear-gradient(rgba(160,195,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(160,195,255,.07) 1px,transparent 1px),linear-gradient(rgba(160,195,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(160,195,255,.13) 1px,transparent 1px);background-size:16px 16px,16px 16px,80px 80px,80px 80px;background-position:-1px -1px}
body.bp #bar{background:rgba(9,33,79,.72)}body.bp .card{backdrop-filter:blur(2px);border-style:solid}body.bp .btn.pri{background:#EAF1FF;color:#0C2A66;border-color:#EAF1FF}body.bp .btn.mint{background:#7FE3FF;color:#06204F;border-color:#7FE3FF}
body.bp h1,body.bp h2,body.bp h3{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}body.bp .page h1{font-size:24px}
body.bp .eyebrow{color:#7FE3FF}body.bp .tbl th{background:rgba(6,24,66,.5)}body.bp .nav a.on{background:rgba(127,227,255,.1);box-shadow:inset 0 0 0 1px rgba(127,227,255,.3)}
body.bp .inp,body.bp .inp-pre{background:rgba(6,24,66,.55)}body.bp .seg{background:rgba(6,24,66,.5)}body.bp .seg .thumb{background:rgba(127,227,255,.14);box-shadow:inset 0 0 0 1px rgba(127,227,255,.35)}
.bpframe{position:relative}.bpframe::before,.bpframe::after{content:"";position:absolute;width:12px;height:12px;border-color:#7FE3FF;border-style:solid;pointer-events:none}.bpframe::before{left:-1px;top:-1px;border-width:2px 0 0 2px}.bpframe::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.dim{position:absolute;font:500 10px var(--f-mono);color:#7FE3FF;display:flex;align-items:center;gap:6px;white-space:nowrap}.dim.h{left:0;right:0;justify-content:center}.dim.h::before,.dim.h::after{content:"";flex:1;height:1px;background:rgba(127,227,255,.6)}
.dim.v{top:0;bottom:0;flex-direction:column;justify-content:center;writing-mode:vertical-rl}.dim.v::before,.dim.v::after{content:"";flex:1;width:1px;background:rgba(127,227,255,.6)}
.nodes{position:relative;min-height:330px}.node{position:absolute;width:220px;padding:12px 14px;border:1.5px solid rgba(170,205,255,.5);border-radius:10px;background:rgba(9,33,79,.92);font-size:12.5px;box-shadow:0 10px 30px -10px rgba(0,8,30,.8)}
.node .nt{font:600 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#7FE3FF;margin-bottom:6px;display:flex;align-items:center;gap:6px}.node b{display:block;font:600 14px var(--f-mono);font-weight:500}.node .np{color:#A8BFE8;margin-top:4px;font-family:var(--f-mono);font-size:11.5px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.trig{border-color:#7FE3FF}.node.act{border-color:#B6A8FF}.node.act .nt{color:#B6A8FF}.node.tgt{border-color:#7DF0B8}.node.tgt .nt{color:#7DF0B8}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.wires path{fill:none;stroke:rgba(127,227,255,.75);stroke-width:1.5;stroke-dasharray:6 5;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}
.code{font:500 12.5px/1.65 var(--f-mono);background:#071B45;color:#D9E6FF;border:1px solid rgba(160,195,255,.22);border-radius:10px;padding:0;position:relative;overflow:hidden}
.code .lines{position:absolute;left:0;top:0;bottom:0;width:40px;padding:12px 0;text-align:right;color:#4E6FA8;background:rgba(0,10,40,.35);border-right:1px solid rgba(160,195,255,.14);user-select:none;white-space:pre;overflow:hidden}
.code textarea,.code pre{margin:0;padding:12px 14px 12px 52px;font:inherit;width:100%;min-height:320px;border:none;outline:none;background:none;color:inherit;resize:vertical;white-space:pre;tab-size:2;overflow:auto}
.code .hlt{position:absolute;inset:0;pointer-events:none;color:transparent}
.tk-k{color:#FF9FD2}.tk-s{color:#9BF0C3}.tk-n{color:#FFD58A}.tk-p{color:#7FE3FF}.tk-c{color:#5F7DB5}
.console{font:500 12px/1.6 var(--f-mono);background:#04122F;color:#A8BFE8;border-radius:10px;padding:10px 12px;min-height:120px;max-height:220px;overflow:auto;border:1px solid rgba(160,195,255,.18)}.console .ok{color:#7DF0B8}.console .err{color:#FF8A93}.console .t{color:#4E6FA8}
.lic{position:relative;border-radius:18px;padding:26px;background:#0A2560;border:1px solid rgba(160,195,255,.35);overflow:hidden;color:#EAF1FF}
.lic::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(160,195,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(160,195,255,.08) 1px,transparent 1px);background-size:12px 12px}
.lic>*{position:relative}.lic .key{font:500 20px var(--f-mono);letter-spacing:.08em;color:#7FE3FF}
.designprev{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
/* misc */
.coinic{width:16px;height:16px;flex:none}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;font:500 10px var(--f-mono);color:var(--faint)}.heat i{aspect-ratio:1;border-radius:3px;background:var(--mint)}
.funnel{display:flex;flex-direction:column;gap:10px}.fstep{display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:12px;font-size:13px}.fstep .fb{height:30px;border-radius:7px;background:var(--sunken);overflow:hidden}.fstep .fb i{display:flex;align-items:center;padding-left:10px;height:100%;border-radius:7px;color:#fff;font:600 12px var(--f-mono);transition:width .9s var(--ease)}
.locked{position:relative}.locked .lockov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(5px);border-radius:inherit;z-index:2;padding:20px}
.locked .lockov b{font:600 16px var(--f-display)}
.perm{display:grid;grid-template-columns:1.6fr repeat(6,1fr);font-size:12.5px}.perm>div{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.perm>div:nth-child(7n+1){justify-content:flex-start;font-weight:500}.perm .hd{font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ck{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-ink)}.ck.no{background:none;color:var(--faint)}
.shortcut-list{display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:13px}
.welcome{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--bg);animation:fade .4s}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0E1512;transition:opacity .5s ease}.splash.out{opacity:0;pointer-events:none}.splash svg{width:84px;height:84px}
.splash .sm-a{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s var(--ease) forwards}.splash .sm-b{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .8s var(--ease) .45s forwards}.splash .sm-d{transform-origin:center;transform-box:fill-box;animation:popd .5s var(--spring) .95s both}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes popd{from{transform:scale(0)}}
@media (max-width:1180px){.editor{grid-template-columns:230px 1fr 280px}.chat.hub{grid-template-columns:64px 210px 1fr}.chat.hub .mem-side{display:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){:root{--side-w:68px}#side .brand b,#side .brand .tier,#side .ws div,#side .nav .grp,#side .nav a span,#side .nav a .cnt,#side .nav a .dot,#side .nav a .lk,#side .bpbtn div,#side .me div{display:none}#side .nav a{justify-content:center}#side .ws{justify-content:center}.search{width:180px}.g3{grid-template-columns:1fr 1fr}.span4,.span5,.span7,.span8{grid-column:span 12}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

 <aside id="side"></aside>
 <main id="main"><header id="bar"></header><div id="view" tabindex="-1"></div></main>
