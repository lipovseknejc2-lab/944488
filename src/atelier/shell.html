/* quick panel: a glass drawer docked to the right screen edge, with a pull-tab on its left side */

.rail.off{transform:translate(calc(100% - 26px - env(safe-area-inset-right)),-50%)}.rail.off .rbtns{opacity:0;pointer-events:none}
@keyframes railIn{from{opacity:0;transform:translate(20px,-35%)}}

.cd{flex:none;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--fill2);color:var(--ink2);white-space:nowrap}.cd.soon{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:color-mix(in srgb,var(--yellow) 70%,var(--text))}.cd.urgent{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.dgrid>.card{margin:0}
.dcard{display:flex;flex-direction:column;gap:4px;padding:14px;transition:transform .16s}.dcard:active{transform:scale(.97)}.dcard .dn{font-size:15.5px;line-height:1.25;margin-top:6px}.dcard em{font-style:normal;color:var(--accent);font-weight:650}.dcard .pbar{margin:6px 0 2px;height:6px}
.dstack{position:relative;width:46px;height:40px}.dstack i,.dstack b{position:absolute;inset:0;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--dc) 55%,transparent);background:var(--card2)}.dstack i:nth-child(1){transform:rotate(-9deg) translate(-2px,1px)}.dstack i:nth-child(2){transform:rotate(6deg) translate(2px,0)}
.dstack b{display:grid;place-items:center;color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,var(--card2))}.dstack .ic{width:20px;height:20px}
.dhero .grid3{margin-bottom:6px}.dhero .kpi{padding:4px 2px}
.cform{display:flex;flex-direction:column;gap:8px}.cform .btn{align-self:flex-start}
.fcd .t{white-space:normal}.fcb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxes{display:flex;gap:3px;flex:none}.boxes i{width:6px;height:6px;border-radius:50%;background:var(--fill2)}.boxes i.on{background:var(--green)}
.subj{padding:8px 14px}.srow{display:grid;grid-template-columns:minmax(70px,30%) 1fr 34px 22px;align-items:center;gap:10px;width:100%;border:none;background:none;padding:9px 0;text-align:left;cursor:pointer;color:var(--text)}.srow+.srow{border-top:1px solid var(--line)}
.srow .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow b{text-align:right;font-variant-numeric:tabular-nums}.srow .ic{width:16px;height:16px;color:var(--violet)}
.studyrow{display:flex;align-items:center;gap:14px;margin-top:10px}.studyrow .sfi{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}.studyrow b{font-size:16.5px}
/* review: the card flips in 3D, grades sit under it */
.review .rvh{align-items:center}.rvh .pbar{height:6px}.rvn{font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.flip{position:relative;height:min(52vh,380px);perspective:1400px;cursor:pointer;margin-bottom:14px}
.fface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 22px;text-align:center;border-radius:26px;background:var(--card2);border:1px solid var(--line);box-shadow:var(--sh);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s var(--ease);border-top:5px solid var(--dc)}
.fface p{margin:0;font-family:var(--serif);font-size:clamp(22px,6.4vw,30px);line-height:1.25;max-height:72%;overflow:auto;white-space:pre-wrap}.fface.back{transform:rotateY(180deg)}.fface.back p{font-family:var(--sans);font-size:clamp(18px,5vw,22px);color:var(--ink2)}
.flip.on .front{transform:rotateY(-180deg)}.flip.on .back{transform:rotateY(0)}
.flip.next{animation:cardin .45s var(--ease)}@keyframes cardin{from{opacity:0;transform:translateX(26px) rotate(1.5deg)}}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;animation:rise .35s var(--ease)}.grade button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--gc) 45%,transparent);background:color-mix(in srgb,var(--gc) 10%,var(--card2));color:var(--text);cursor:pointer;transition:transform .14s}.grade button:active{transform:scale(.94)}
.grade b{font-size:15px;color:var(--gc)}.grade span{font-size:11.5px;color:var(--muted)}
.rdone .fig{width:150px;height:150px}
@media(prefers-reduced-motion:reduce){.fface{transition:none}}
@media(max-width:380px){h1{font-size:30px}.grid3{gap:6px}.kpi .v{font-size:22px}#tabs a{font-size:9.5px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.drawn path,#splash path,.uline path,.ln{stroke-dashoffset:0!important}}
</style>
</head>
