<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deep Lens">
<meta name="theme-color" content="#04121c">
<title>Deep Lens</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){if(!('serviceWorker' in navigator)||location.protocol==='file:')return;try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})();</script>
<style>
:root{--ink:#040d14;--panel:rgba(7,22,32,.86);--panel2:rgba(14,36,50,.9);--line:rgba(231,194,125,.22);--brass:#e7c27d;--brass2:#b8904a;--foam:#eaf2ef;--mute:#8ea6ae;--coral:#ff7a59;--bio:#6ff3e6;--good:#7be495;--bad:#ff6b6b;--serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--foam);font-family:var(--sans);touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font-family:var(--sans);color:var(--foam);border:0;background:none;cursor:pointer;touch-action:manipulation}
input[type=range]{touch-action:manipulation;-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:30px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(234,242,239,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brass);margin-top:-9px;box-shadow:0 0 0 4px rgba(231,194,125,.18)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(234,242,239,.22)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brass);border:0}
.serif{font-family:var(--serif)}
/* HOME */
#home{pointer-events:auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 14px);background:linear-gradient(180deg,rgba(2,10,16,.55),rgba(2,10,16,0) 32%,rgba(2,10,16,0) 52%,rgba(2,10,16,.88))}
.topchips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(4,16,24,.6);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip b{color:var(--brass);font-weight:600}
.title{margin-top:auto;text-align:left}
.title h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,14vw,78px);line-height:.9;margin:0;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.title h1 i{color:var(--brass);font-style:italic}
.title p{margin:8px 0 0;color:var(--mute);font-family:var(--serif);font-style:italic;font-size:15px}
.diveBtn{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,#e7c27d,#c99a4f);color:#1b1206;box-shadow:0 10px 40px rgba(231,194,125,.25)}
.diveBtn .l{font-family:var(--serif);font-size:30px;letter-spacing:.02em}
.diveBtn .r{text-align:right;font-size:12px;line-height:1.35;font-weight:600;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--foam);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tile svg{width:24px;height:24px;stroke:var(--brass);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:6px;background:var(--coral);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* PAGE */
#page{pointer-events:auto;background:radial-gradient(120% 70% at 50% 0%,#0d2a3a 0%,#06141e 55%,#040c12 100%)}
#page::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.07;mix-blend-mode:overlay}
.phead{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.phead h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;flex:1}
.phead .chip{font-size:12px}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 14px calc(var(--sb) + 30px);position:relative;z-index:1}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:20px}
.muted{color:var(--mute);font-size:13px}
.btn{background:linear-gradient(135deg,#e7c27d,#c99a4f);color:#1b1206;font-weight:700;border-radius:12px;padding:11px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--foam);border:1px solid var(--line);font-weight:600}
.btn.dis,.btn:disabled{opacity:.38;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.pips{display:flex;gap:4px;margin:6px 0}
.pips i{width:18px;height:6px;border-radius:3px;background:rgba(234,242,239,.15)}
.pips i.on{background:var(--brass)}
.sec{font-family:var(--serif);font-style:italic;color:var(--brass);font-size:15px;margin:18px 2px 8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#0a1a24}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.gb{position:absolute;left:5px;top:5px;font-family:var(--serif);font-weight:700;font-size:15px;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.gS{color:#ffd76a}.gA{color:#7be495}.gB{color:#6ff3e6}.gC{color:#c8d4d8}.gD{color:#ff8a7a}
.ph .tag{position:absolute;right:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.6);padding:2px 5px;border-radius:5px}
.bars2 .b{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.bars2 .b span{width:86px;color:var(--mute)}
.bars2 .b i{flex:1;height:6px;border-radius:3px;background:rgba(234,242,239,.12);position:relative;overflow:hidden}
.bars2 .b i em{position:absolute;inset:0 auto 0 0;background:var(--brass);border-radius:3px}
.note{font-size:13px;padding:4px 0 4px 18px;position:relative;color:#cfdcdc}
.note:before{content:'';position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--mute)}
.note.g:before{background:var(--good)}.note.b:before{background:var(--coral)}
/* HUD */
#hud{pointer-events:none}
#hud>*{pointer-events:auto}
.hudTop{position:absolute;top:calc(var(--st) + 8px);left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.depthbox{background:rgba(2,10,16,.5);border:1px solid var(--line);border-radius:14px;padding:6px 12px 7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dl{font-size:9px;letter-spacing:.22em;color:var(--mute)}
.dn{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ds{font-size:11px;color:var(--mute)}
.ds b{color:var(--brass);font-weight:600}
.hbars{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hbar{height:16px;border-radius:8px;background:rgba(2,10,16,.55);border:1px solid var(--line);position:relative;overflow:hidden}
.hbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4fd0c0,#7be495);transition:width .2s}
.hbar.bat i{background:linear-gradient(90deg,#c99a4f,#e7c27d)}
.hbar span{position:absolute;left:8px;top:0;font-size:9px;line-height:15px;letter-spacing:.18em;color:#fff;text-shadow:0 1px 2px #000}
#sonar{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:rgba(2,14,18,.55)}
#warn{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,30,.55));transition:opacity .2s}
#warnTxt{position:absolute;top:calc(var(--st) + 112px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.2em;color:#ff8a7a;pointer-events:none;text-shadow:0 1px 4px #000}
.diveCtl{position:absolute;right:10px;top:calc(var(--st) + 130px);display:flex;flex-direction:column;align-items:center;gap:8px}
#diveTrack{width:46px;height:200px;border-radius:23px;background:rgba(2,10,16,.55);border:1px solid var(--line);position:relative;touch-action:none}
#diveTrack .mid{position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--line)}
#diveTrack .lbl{position:absolute;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.12em;color:var(--mute)}
#diveThumb{position:absolute;left:5px;width:34px;height:34px;border-radius:50%;background:var(--brass);box-shadow:0 0 18px rgba(231,194,125,.5);display:flex;align-items:center;justify-content:center;color:#1b1206;font-weight:800;font-size:16px;pointer-events:none}
#turbo{width:54px;height:40px;border-radius:12px;background:rgba(2,10,16,.55);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.05em}
#turbo.on{background:var(--coral);border-color:var(--coral)}
.hudBot{position:absolute;bottom:calc(var(--sb) + 16px);right:12px;display:flex;align-items:flex-end;gap:12px}
#btnCam{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,#e7c27d 31% 38%,rgba(2,10,16,.6) 39%);border:2px solid var(--brass);box-shadow:0 0 24px rgba(231,194,125,.35)}
#btnSurf{position:absolute;left:12px;top:calc(var(--st) + 102px);font-size:11px;letter-spacing:.12em;padding:8px 12px;border-radius:10px;background:rgba(2,10,16,.55);border:1px solid var(--line)}
#rollCt{position:absolute;right:96px;bottom:calc(var(--sb) + 22px);font-size:12px;color:var(--mute);pointer-events:none;text-align:right}
#rollCt b{font-family:var(--serif);font-size:22px;color:var(--foam);display:block}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(234,242,239,.25);background:rgba(2,10,16,.25);display:none;pointer-events:none}
#joyK{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(234,242,239,.5)}
#hud.cam .diveCtl,#hud.cam #btnSurf,#hud.cam .hudBot,#hud.cam #rollCt,#hud.cam #sonar{display:none}
#hud.cam #hint{bottom:auto;top:calc(var(--st) + 96px);max-width:80%}
#hint{position:absolute;left:16px;bottom:calc(var(--sb) + 110px);max-width:60%;font-family:var(--serif);font-style:italic;font-size:15px;color:#d8e4e2;pointer-events:none;text-shadow:0 2px 8px #000;transition:opacity .6s}
/* viewfinder */
#vf{position:absolute;inset:0;display:none;pointer-events:none}
#vf.on{display:block}
#vfFrame{position:absolute;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.42)}
#vfFrame i{position:absolute;width:22px;height:22px;border:2px solid #fff}
#vfFrame .tl{left:-2px;top:-2px;border-right:0;border-bottom:0}#vfFrame .tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
#vfFrame .bl{left:-2px;bottom:-2px;border-right:0;border-top:0}#vfFrame .br{right:-2px;bottom:-2px;border-left:0;border-top:0}
#vfFrame .g{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.1%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.7%,transparent 66.9%),linear-gradient(180deg,transparent 33.1%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.7%,transparent 66.9%)}
#vfFrame .cx{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border:1px solid rgba(255,255,255,.6);border-radius:50%}
#vfMeter{position:absolute;top:-30px;left:0;right:0;display:flex;justify-content:space-between;font-size:11px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 3px #000}
#vfEv{position:relative;width:110px;height:12px;border-bottom:1px solid rgba(255,255,255,.6)}
#vfEv b{position:absolute;bottom:0;width:2px;height:10px;background:var(--brass);transition:left .15s}
#vfLbl{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
#vfPanel{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(var(--sb) + 12px);background:linear-gradient(0deg,rgba(2,8,12,.92),rgba(2,8,12,.6));pointer-events:auto;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mute);letter-spacing:.12em}
.vrow label{width:44px;color:var(--brass)}
.vbtns{display:flex;align-items:center;gap:7px;margin-top:6px}
.vb{height:40px;min-width:46px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.vb.on{background:var(--brass);color:#1b1206}
.vb.off{opacity:.35}
#vfShoot{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);background-clip:padding-box;margin-left:auto;box-shadow:0 0 0 2px #fff}
#vfShoot:active{transform:scale(.94)}
#tapF{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #ffd76a;border-radius:6px;pointer-events:none;opacity:0}
#tapF.go{animation:tf .7s ease-out}
#tapF.miss{border-color:rgba(255,255,255,.5)}
@keyframes tf{0%{opacity:1;transform:scale(1.6)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (max-height:520px){#vfPanel{display:flex;flex-wrap:wrap;column-gap:14px;padding-top:4px}#vfPanel .vrow{flex:1 1 40%}#vfPanel .vbtns{flex:1 1 100%;margin-top:0}#vfShoot{width:52px;height:52px}.vb{height:34px}}
#flashFx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#shutFx{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 50vmax #000;transition:box-shadow .08s}
/* modal + toast */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,6,10,.7);pointer-events:auto;padding:18px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:20}
#modal.on{display:flex}
#mbox{width:100%;max-width:420px;max-height:88vh;overflow-y:auto;touch-action:pan-y;background:linear-gradient(180deg,#0f2b3a,#081822);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#mbox h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 8px}
#toasts{position:absolute;top:calc(var(--st) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:rgba(6,20,30,.92);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;max-width:88%;animation:tin .35s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast b{color:var(--brass)}
.toast.gold{border-color:var(--brass);background:linear-gradient(135deg,rgba(60,44,14,.95),rgba(20,16,8,.95))}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
/* editor */
.edWrap{display:flex;flex-direction:column;align-items:center}
#edCv{width:min(92vw,420px);height:min(92vw,420px);border-radius:6px;touch-action:none;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.gradeRow{display:flex;gap:12px;align-items:center;width:min(92vw,420px);margin:12px 0 4px}
.bigG{font-family:var(--serif);font-size:46px;width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;width:min(92vw,420px);margin:8px 0}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:600}
.tabs button.on{background:var(--brass);color:#1b1206}
.sl{width:min(92vw,420px)}
.sl .r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.sl .r span:first-child{width:78px}
.sl .r span:last-child{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--foam)}
.filters{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;width:min(92vw,420px);padding-bottom:4px}
.filters button{flex:0 0 auto;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px}
.filters button.on{border-color:var(--brass);color:var(--brass)}
.mag{display:flex;gap:12px;align-items:center}
.mast{width:54px;height:72px;border-radius:4px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--serif);font-size:9px;font-weight:700;text-align:center;line-height:1;color:#fff;flex:0 0 auto;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.cover{width:100%;max-width:260px;display:block;margin:10px auto;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.post{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.post img{width:100%;display:block}
.post .pb{padding:10px 12px}
.cm{font-size:13px;margin:4px 0}.cm b{margin-right:5px}
.trophy{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:11px;gap:4px}
.cdx{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(231,194,125,.1)}
.cdx canvas{width:72px;height:44px;flex:0 0 auto}
.vd{display:flex;gap:3px;margin-top:4px}
.vd i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(234,242,239,.25)}
.rar0{color:#c8d4d8}.rar1{color:#7be495}.rar2{color:#6fb8ff}.rar3{color:#c88aff}.rar4{color:#ffc95a}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <section id="home" class="screen">
    <div class="topchips">
      <div class="chip">◈ <b id="hCoins">0</b></div>
      <div class="chip">♥ <b id="hFol">0</b> followers</div>
      <div class="chip">Season <b id="hSeason">1</b></div>
      <button class="chip" id="btnMute" style="margin-left:auto">♪</button>
    </div>
    <div class="title">
      <h1 class="serif">Deep<br><i>Lens</i></h1>
      <p id="hTag">A photographer's descent into the trench.</p>
    </div>
    <button class="diveBtn" id="btnDive"><span class="l">Dive</span><span class="r" id="diveInfo"></span></button>
    <div class="grid" id="navGrid"></div>
  </section>

  <section id="hud" class="screen">
    <div class="hudTop">
      <div class="depthbox"><div class="dl">DEPTH</div><div class="dn" id="hDepth">0</div><div class="ds">m · safe <b id="hMax">0</b></div></div>
      <div class="hbars">
        <div class="hbar"><i id="hHull"></i><span>HULL</span></div>
        <div class="hbar bat"><i id="hBat"></i><span>POWER</span></div>
      </div>
      <canvas id="sonar" width="168" height="168"></canvas>
    </div>
    <div id="warn"></div><div id="warnTxt"></div>
    <button id="btnSurf">▲ SURFACE</button>
    <div class="diveCtl">
      <div id="diveTrack"><span class="lbl" style="top:6px">UP</span><div class="mid"></div><span class="lbl" style="bottom:6px">DIVE</span><div id="diveThumb">▼</div></div>
      <button id="turbo">FAST</button>

 if(G.joy&&G.joy.id===e.pointerId){let dx=e.clientX-G.joy.ox,dy=e.clientY-G.joy.oy;const m=Math.hypot(dx,dy),mx=50;if(m>mx){dx*=mx/m;dy*=mx/m}G.joy.dx=dx/mx;G.joy.dy=dy/mx;$('#joyK').style.transform=`translate(${dx}px,${dy}px)`}});

// ================= loop =================
let last=performance.now(),fpsA=60;
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;fpsA=fpsA*.95+(1/Math.max(.001,dt))*.05;G.frame++;
 try{const ts=G.camMode?.35:1;const d2=dt*ts;G.t+=d2;
  if(G.mode==='dive'){updDive(dt);if(G.camMode)updCam(dt)}else{G.cam.y=165+Math.sin(G.t*.05)*25;G.cam.x=tCenter(G.cam.y)+Math.sin(G.t*.06)*70}
  const ox=G.cam.x,oy=G.cam.y;
  updCreatures(d2);
  const dx=(G.cam.x-G.lastV.x)*G.sc,dy=(G.cam.y-G.lastV.y)*G.sc;G.lastV={x:G.cam.x,y:G.cam.y};
  for(const s of G.snow){s.x-=dx*s.z*1.2;s.y-=dy*s.z*1.2;s.y+=d2*7*s.z;s.x+=Math.sin(G.t*.7+s.z*9)*.08;if(s.x<0)s.x+=W;if(s.x>W)s.x-=W;if(s.y<0)s.y+=H;if(s.y>H)s.y-=H}
  for(let i=G.bub.length-1;i>=0;i--){const b=G.bub[i];b.y-=d2*(38+b.r*8);b.x+=Math.sin(G.t*5+b.ph)*d2*12;b.l-=d2*.45;if(b.l<=0||b.y<2)G.bub.splice(i,1)}
  if(shake>0)shake-=dt;

  if(G.mode==='dive'&&now-lastHud>90){lastHud=now;updHud()}
  edTick()}catch(err){console.error(err)}
 requestAnimationFrame(loop)}
