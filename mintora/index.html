/* ================= tokens ================= */
:root{
 --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--f-text:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--f-hand:'Caveat',cursive;
 --bg:#F6F7F5;--panel:#FFFFFF;--panel2:#FBFBFA;--side:#EFF1EE;--sunken:#F1F3F0;--line:#E3E6E1;--line2:#D3D8D1;--text:#0E1512;--ink2:#38423D;--muted:#6B756F;--faint:#9AA39D;
 --mint:#12C48B;--mint-ink:#078A60;--mint-soft:#DDF7EC;--violet:#6D5DFC;--violet-soft:#ECE9FF;--amber:#E39A22;--amber-soft:#FCF0DA;--red:#E5484D;--red-soft:#FDE6E6;--blue:#2F7BEA;--blue-soft:#E3EEFD;--pink:#E0558F;
 --sel:rgba(18,196,139,.14);--focus:0 0 0 3px rgba(18,196,139,.28);
 --r-s:7px;--r:10px;--r-l:14px;--r-xl:20px;
 --sh-1:0 1px 1px rgba(16,24,20,.04),0 1px 3px rgba(16,24,20,.06);--sh-2:0 1px 2px rgba(16,24,20,.05),0 8px 24px -6px rgba(16,24,20,.12);--sh-3:0 2px 6px rgba(16,24,20,.06),0 24px 60px -12px rgba(16,24,20,.28);
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.5,1);
 --side-w:248px;color-scheme:light}
:root[data-theme=dark]{--bg:#0B0E0D;--panel:#121615;--panel2:#151A18;--side:#0E1211;--sunken:#0F1312;--line:#1F2624;--line2:#2B3431;--text:#EDF2EF;--ink2:#C3CCC7;--muted:#8A958F;--faint:#5D6863;
 --mint:#2EE6A6;--mint-ink:#2EE6A6;--mint-soft:rgba(46,230,166,.12);--violet:#8F82FF;--violet-soft:rgba(143,130,255,.14);--amber:#F2B347;--amber-soft:rgba(242,179,71,.13);--red:#FF6369;--red-soft:rgba(255,99,105,.13);--blue:#5B9BFF;--blue-soft:rgba(91,155,255,.13);
 --sel:rgba(46,230,166,.14);--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 1px 2px rgba(0,0,0,.4),0 10px 30px -8px rgba(0,0,0,.6);--sh-3:0 30px 80px -10px rgba(0,0,0,.75);color-scheme:dark}
/* Blueprint: everything turns into a technical drawing */
body.bp{--bg:#0C2A66;--panel:rgba(10,36,92,.82);--panel2:rgba(12,42,104,.9);--side:#09214F;--sunken:rgba(6,24,66,.6);--line:rgba(160,195,255,.18);--line2:rgba(170,205,255,.32);--text:#EAF1FF;--ink2:#C5D6F5;--muted:#8FA9D8;--faint:#6C88BD;
 --mint:#7FE3FF;--mint-ink:#7FE3FF;--mint-soft:rgba(127,227,255,.12);--violet:#B6A8FF;--violet-soft:rgba(182,168,255,.14);--sel:rgba(127,227,255,.16);--focus:0 0 0 3px rgba(127,227,255,.3);
 --sh-1:none;--sh-2:0 12px 40px -12px rgba(0,8,30,.7);--sh-3:0 30px 80px -10px rgba(0,8,30,.8);color-scheme:dark}
/* ================= base ================= */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden;transition:background .5s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
::selection{background:var(--sel)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.mono,code,kbd{font-family:var(--f-mono);font-size:.92em}.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hand{font-family:var(--f-hand);font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s{width:15px;height:15px}.ic.l{width:22px;height:22px}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
/* ================= app frame ================= */
#app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;transition:grid-template-columns .35s var(--ease)}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:background .5s var(--ease)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;cursor:pointer}
.brand .mark{width:30px;height:30px;flex:none}.brand b{font:600 19px/1 var(--f-display);letter-spacing:-.035em}
.brand .tier{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:block}
.ws{margin:2px 10px 10px;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh-1);cursor:pointer;transition:border-color .2s}
.ws:hover{border-color:var(--line2)}.ws .wsl{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--f-display);color:#fff;flex:none}
.ws div{min-width:0;flex:1}.ws b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ws span{font-size:11.5px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav .grp{font:600 10.5px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);color:var(--ink2);font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
.nav a.on .ic{color:var(--mint-ink)}
.nav a .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.nav a .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.nav a .lk{margin-left:auto;color:var(--faint)}.nav a .lk .ic{width:14px;height:14px}
.sidefoot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
.bpbtn{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r);background:#0C2A66;color:#EAF1FF;border:1px solid #1D4192;position:relative;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.bpbtn::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(170,205,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(170,205,255,.12) 1px,transparent 1px);background-size:10px 10px;pointer-events:none}
.bpbtn>*{position:relative}.bpbtn b{font:600 13px var(--f-display);display:block}.bpbtn span{font:500 10.5px var(--f-mono);color:#8FB3F0;letter-spacing:.04em}
.bpbtn .ic{color:#7FE3FF}.bpbtn:hover{border-color:#3A63C2}

/* ---- core.js ---- */
/* Mintora core: state, storage, router, credits and small helpers.
   Saved data: localStorage 'mintora-v1' (and 'mintora-backup'). Bump VERSION and add a step to migrate() when the shape changes. */

const KEY='mintora-v1',BACKUP='mintora-backup',VERSION=1;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=a=>a.reduce((x,y)=>x+y,0);
const DAY=864e5;
const dayKey=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
/* a seeded random generator, so the demo data is the same for everyone */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* storage that falls back to memory when blocked */
const LS={m:{},get(k){try{return localStorage.getItem(k)}catch(e){return this.m[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.m[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete this.m[k]}}};
let S=null;

 if(!s){try{const b=LS.get(BACKUP);s=b?JSON.parse(b):null}catch(e){s=null}}
 S=s?migrate(s):seed();if(!s)save()}
function migrate(s){s.v=s.v||1;
 /* future: if(s.v<2){...;s.v=2} */
 const d=DEF();for(const k in d)if(s[k]===undefined)s[k]=d[k];
 s.settings=Object.assign(d.settings,s.settings||{});s.credits=Object.assign(d.credits,s.credits||{});s.bp=Object.assign(d.bp,s.bp||{});

let _saveT=0,_backupAt=0;

function money(v,{c,dec}={}){c=c||(S&&S.settings.currency)||'USD';const [a,b]=CUR[c]||CUR.USD;const n=Math.abs(v),d=dec??(n<100&&n%1?2:n>=1e4?0:n%1?2:0);
 return(v<0?'−':'')+a+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+(b?' '+b:'')}
function short(v){const n=Math.abs(v);return(v<0?'−':'')+(n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':Math.round(n)+'')}
const moneyShort=v=>{const [a,b]=CUR[S.settings.currency]||CUR.USD;return a+short(v)+(b?b:'')};
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const nfmt=v=>Math.round(v).toLocaleString('en-US');

const ftime=t=>new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
const plural=(n,w,p)=>`${nfmt(n)} ${n===1?w:(p||w+'s')}`;

function spend(amt,why){if(S.credits.balance<amt){toast(`You need ${nfmt(amt-S.credits.balance)} more credits`,'coins');return false}S.credits.balance-=amt;S.credits.spent+=amt;S.credits.log.unshift({at:Date.now(),amt:-amt,why});save();bumpCredits();return true}

/* activity feed */
function act(kind,text,ref){S.activity.unshift({id:uid(),at:Date.now(),kind,text,ref:ref||''});if(S.activity.length>300)S.activity.length=300;saveSoon()}

document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();go(a.getAttribute('href'))});
let _rendering=false;
function render(){if(_rendering)return;_rendering=true;try{const bp=route.k==='bp';document.body.classList.toggle('bp',bp);
  const P=PAGES[route.k]||PAGES.dash;const t0=performance.now();let html='';
  try{html=P.view(...route.a)}catch(err){console.error(err);html=`<div class="page"><div class="empty"><b>Something went wrong</b><p class="mono sm">${esc(err.message)}</p><a class="btn" href="#/dash">Back to the dashboard</a></div></div>`}
  $('#view').innerHTML=html;side();bar();try{P.after&&P.after(...route.a)}catch(err){console.error(err)}
  window._lastRender=performance.now()-t0}finally{_rendering=false}}
function rerender(){const v=$('#view'),y=v.scrollTop;render();v.scrollTop=y}

function dailySeries(days,fn){const out=[];for(let d=days-1;d>=0;d--){const t=startOfDay(Date.now())-d*DAY;out.push(fn(t,dayKey(t)))}return out}
function revSeries(days,pid){const by={};for(const o of S.orders){if(o.r||(pid&&o.p!==pid))continue;const k=dayKey(o.t);by[k]=(by[k]||0)+o.a}return dailySeries(days,(t,k)=>by[k]||0)}

 const view=cid||HV[id]||h.channels.find(c=>c.type==='text')?.id||h.channels[0].id;HV[id]=view;const c=h.channels.find(x=>x.id===view),proj=view.startsWith('proj:')?h.projects.find(p=>'proj:'+p.id===view):null,set=view==='settings';
 if(c)c.unread=0;const r=myRole(h);
 return`<div class="chat hub"><aside class="hubrail">${S.hubs.filter(x=>x.joined).map(x=>`<span class="hubi ${x.id===id?'on':''}" style="background:${x.color}" onclick="go('hub/${x.id}')" data-tip="${esc(x.name)}">${esc(x.icon)}</span>`).join('')}<span class="hubi add" onclick="hubForm()" data-tip="New hub">${ic('plus')}</span><span class="hubi add" onclick="go('hubs')" data-tip="Discover">${ic('search','s')}</span></aside>
 <aside><div class="hubban" style="height:84px">${hubArt(h)}</div><div class="row" style="padding:0 4px 8px"><b style="font:600 15px var(--f-display)">${esc(h.name)}</b>${canHub(h,'roles')||canHub(h,'channels')?`<button class="ibtn" style="margin-left:auto;width:28px;height:28px" onclick="go('hub/${id}/settings')" aria-label="Hub settings">${ic('gear','s')}</button>`:''}</div>
 <div class="xs muted" style="padding:0 6px 10px">Your role: <b style="color:${r?.color}">${esc(r?.name||'Member')}</b></div>
 <div class="rolehd">Channels${canHub(h,'channels')?`<button class="ibtn" style="margin-left:auto;width:22px;height:22px" onclick="newHubChannel('${id}')" aria-label="New channel">${ic('plus','s')}</button>`:''}</div>
 ${h.channels.map(x=>`<div class="chl ${x.id===view?'on':''} ${x.unread?'unread':''}" onclick="go('hub/${id}/${x.id}')"><span class="hash">${ic(x.type==='announce'?'mega':'hash','s')}</span>${esc(x.name)}${x.unread?`<span class="cnt">${x.unread}</span>`:''}</div>`).join('')}
 <div class="rolehd">Projects${canHub(h,'projects')?`<button class="ibtn" style="margin-left:auto;width:22px;height:22px" onclick="newHubProject('${id}')" aria-label="New project">${ic('plus','s')}</button>`:''}</div>
 ${h.projects.map(p=>`<div class="chl ${view==='proj:'+p.id?'on':''}" onclick="go('hub/${id}/proj:${p.id}')">${ic('folder','s')}<span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span><span class="xs mono faint">${Math.round(p.progress*100)}%</span></div>`).join('')||'<div class="xs faint" style="padding:4px 9px">No projects yet</div>'}
 ${h.plugins.length?`<div class="rolehd">Plugins</div>${h.plugins.map(pid=>{const x=S.bp.plugins.find(y=>y.id===pid);return x?`<div class="chl" style="cursor:default">${ic('plug','s')}${esc(x.name)}</div>`:''}).join('')}`:''}</aside>
 ${set?hubSettings(h):proj?hubProject(h,proj):`<section class="msgs"><div class="mh2">${ic(c.type==='announce'?'mega':'hash')}<b>${esc(c.name)}</b><span class="muted sm">${c.type==='announce'?'Announcements':esc(h.desc).slice(0,60)}</span><button class="btn sm" style="margin-left:auto" onclick="addHubMember('${id}')">${ic('uplus','s')} Add people</button></div>
 <div class="mlist" id="ml">${msgList(c.msgs,x=>personAny(x),x=>roleOf(h,x))}</div><div class="typing" id="typ"></div>
 ${c.type==='announce'&&!canHub(h,'announce')?`<div class="compose"><div class="note sm">${ic('lock','s')}<span>Only ${h.roles.filter(r=>r.perms.includes('announce')||r.perms.includes('manage')).map(r=>r.name).join(' and ')} can post here.</span></div></div>`
 :`<div class="compose"><div class="cbox"><textarea id="ci" rows="1" placeholder="Message #${esc(c.name)} · type / for commands" aria-label="Message"></textarea><button class="btn pri sm" onclick="hubSend('${id}','${c.id}')" aria-label="Send">${ic('send','s')}</button></div><div class="xs faint" style="margin-top:6px">${hubCmds(h).map(x=>`<code>/${x[0]}</code>`).join(' ')}</div></div>`}</section>`}
 <aside class="mem-side">${h.roles.map(rl=>{const M=h.members.filter(m=>m.role===rl.id);return M.length?`<div class="rolehd"><i style="background:${rl.color}"></i>${esc(rl.name)} · ${M.length}</div>${M.slice(0,40).map(m=>{const p=personAny(m.id);return`<div class="memb" onclick="hubMemberMenu(event,'${id}','${m.id}')">${avatar(p,26,m.id==='me'||p.status==='online')}<span style="color:${rl.color==='#8A958F'?'inherit':rl.color};font-weight:500">${esc(p.name)}</span></div>`}).join('')}`:''}).join('')}</aside></div>`},
after(id){const ml=$('#ml');if(ml)ml.scrollTop=ml.scrollHeight;const ci=$('#ci');if(ci){ci.focus();ci.oninput=()=>{ci.style.height='22px';ci.style.height=Math.min(140,ci.scrollHeight)+'px'};ci.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();hubSend(id,HV[id])}}}side();hubSettingsBind(id)}};
function hubCmds(h){const base=[['help','List the commands'],['project','Start a project: /project Name'],['invite','Add someone: /invite name'],['roll','Roll a die']];h.plugins.forEach(pid=>{const x=S.bp.plugins.find(y=>y.id===pid);x&&x.actions.filter(a=>a.type==='command').forEach(a=>base.push([a.cmd.replace(/^\//,''),'From '+x.name]))});return base}
function hubSend(id,cid){const h=hub(id),c=h.channels.find(x=>x.id===cid),ci=$('#ci'),t=ci.value.trim();if(!t)return;ci.value='';ci.style.height='22px';
 if(t.startsWith('/')){const [cmd,...rest]=t.slice(1).split(' '),arg=rest.join(' ').trim();const bot=(text,name='Hub')=>c.msgs.push({id:uid('m'),who:'bot',bot:true,botName:name,text,t:Date.now()});
  if(cmd==='help')bot(hubCmds(h).map(([k,d])=>`/${k}  ${d}`).join('\n'));
  else if(cmd==='project'){if(!canHub(h,'projects')){bot('Your role cannot start projects.')}else{const p={id:uid('hp'),name:arg||'New project',desc:'Started from chat.',members:['me'],status:'active',progress:0};h.projects.push(p);bot(`Project “${p.name}” started. Join it from the sidebar.`)}}
  else if(cmd==='invite'){addHubMember(id,arg);return}
  else if(cmd==='roll')bot(`${S.me.name.split(' ')[0]} rolled a ${1+Math.floor(Math.random()*6)}.`);
  else{let hit=false;h.plugins.forEach(pid=>{const x=S.bp.plugins.find(y=>y.id===pid);x&&x.actions.filter(a=>a.type==='command'&&a.cmd.replace(/^\//,'')===cmd).forEach(a=>{bot(fill(a.reply,{name:S.me.name.split(' ')[0],hub:h.name}),x.name);hit=true;bpLog(x,`/${cmd} answered in ${h.name}`)})});if(!hit)bot(`There is no /${cmd} here. Type /help.`)}
  save();rerender();return}
 c.msgs.push({id:uid('m'),who:'me',text:t,t:Date.now()});earn('message',1);save();rerender();
 const others=h.members.filter(m=>m.id!=='me');if(others.length&&c.type!=='announce'){const m=others[Math.floor(Math.random()*others.length)],p=personAny(m.id);setTimeout(()=>{const ty=$('#typ');if(ty&&HV[id]===cid)ty.textContent=`${p.name.split(' ')[0]} is typing…`},800);
  setTimeout(()=>{c.msgs.push({id:uid('m'),who:m.id,text:['Love this!','Same here, thanks for sharing.','Great question, following.','That worked for me too.','Can you share a screenshot?','Welcome!'][Math.floor(Math.random()*6)],t:Date.now()});save();if(route.k==='hub'&&HV[id]===cid)rerender()},2200+Math.random()*1500)}}
const fill=(s,v)=>String(s||'').replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
function addHubMember(id,pre=''){const h=hub(id),pool=[...S.team.map(m=>({id:m.id,name:m.name,sub:m.title})),...S.customers.slice(0,140).map(c=>({id:c.id,name:c.name,sub:'Customer'}))].filter(p=>!h.members.some(m=>m.id===p.id));
 modal('Add people to '+h.name,`<div class="inp-pre" style="margin-bottom:10px"><span>${ic('search','s')}</span><input id="amQ" placeholder="Search teammates and customers" value="${esc(pre)}"></div><div class="card" style="box-shadow:none;max-height:320px;overflow:auto"><div class="lst" id="amL"></div></div>
 <div class="field mt"><label>Role</label><select class="inp" id="amR">${h.roles.filter(r=>r.id!=='admin'||canHub(h,'roles')).map(r=>`<option value="${r.id}" ${r.id===(h.roles.find(x=>x.id==='customer')?'customer':h.roles.at(-1).id)?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`);
 const draw=()=>{const q=$('#amQ').value.toLowerCase();$('#amL').innerHTML=pool.filter(p=>!q||p.name.toLowerCase().includes(q)).slice(0,30).map(p=>`<div class="li click" data-id="${p.id}">${avatar(p,28)}<div class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(p.sub)}</div></div><button class="btn sm">${ic('plus','s')} Add</button></div>`).join('')||'<div class="li muted">Everyone is already here</div>'};draw();$('#amQ').oninput=draw;
 $('#amL').onclick=e=>{const li=e.target.closest('[data-id]');if(!li)return;const pid=li.dataset.id;let role=$('#amR').value;h.members.push({id:pid,role});pool.splice(pool.findIndex(p=>p.id===pid),1);hubJoined(h,pid);save();li.remove();toast(`${personAny(pid).name} added`,'uplus')};
 _ovStack=[()=>{if(route.k==='hub')rerender()}]}
/* when someone joins: plugins can welcome them and give them a role */
function hubJoined(h,pid){const p=personAny(pid),gen=h.channels.find(c=>c.type==='text')||h.channels[0];gen.msgs.push({id:uid('m'),who:pid,text:`${p.name} joined the hub.`,t:Date.now(),sys:true});
 h.plugins.forEach(id=>{const x=S.bp.plugins.find(y=>y.id===id);if(!x||x.trigger!=='join')return;x.actions.forEach(a=>{if(a.type==='welcome'){gen.msgs.push({id:uid('m'),who:'bot',bot:true,botName:x.name,text:fill(a.message,{name:p.name.split(' ')[0],hub:h.name}),t:Date.now()+1});bpLog(x,`Welcomed ${p.name} in ${h.name}`)}
  if(a.type==='autorole'){const r=h.roles.find(r=>r.name.toLowerCase()===String(a.role).toLowerCase()||r.id===a.role);const m=h.members.find(m=>m.id===pid);if(r&&m){m.role=r.id;bpLog(x,`Gave ${p.name} the ${r.name} role`)}}})});
 act('hub',`${p.name} joined ${h.name}`,'hub/'+h.id)}
function hubMemberMenu(e,id,pid){const h=hub(id),p=personAny(pid);if(pid==='me'){menu(e,[{t:'You: '+(myRole(h)?.name||''),ic:'user'}]);return}
 const items=[{t:p.name,ic:'user',fn:()=>mem(pid)?personDrawer(pid):customerDrawer(pid)}];if(canHub(h,'roles')){items.push('-');h.roles.forEach(r=>items.push({t:'Role: '+r.name+(roleOf(h,pid)?.id===r.id?'  ✓':''),ic:'shield',fn:()=>{h.members.find(m=>m.id===pid).role=r.id;save();toast(`${p.name.split(' ')[0]} is now ${r.name}`,'shield');rerender()}}))}
 if(canHub(h,'kick'))items.push('-',{t:'Remove from hub',ic:'trash',danger:true,fn:()=>{h.members=h.members.filter(m=>m.id!==pid);save();toast('Removed','trash');rerender()}});menu(e,items)}
function newHubChannel(id){const h=hub(id);modal('New channel',`<div class="field"><label>Name</label><div class="inp-pre"><span>#</span><input id="hcN" placeholder="showcase"></div></div><div class="field"><label>Type</label>${seg('hcT',[['text','Text'],['announce','Announcements']],'text','hcType')}</div>`,{foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="hcGo">Create</button>`});
 segInit($('#ov'));let ty='text';window.hcType=v=>ty=v;$('#hcGo').onclick=()=>{const n=$('#hcN').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');if(!n)return;const c={id:uid('hc'),name:n,type:ty,msgs:[]};h.channels.push(c);save();closeOv();go(`hub/${id}/${c.id}`)}}
function newHubProject(id){const h=hub(id);modal('Start a project',`<div class="field"><label>Name</label><input class="inp" id="hpN" placeholder="Community preset pack"></div><div class="field"><label>Goal</label><textarea class="inp" id="hpD" placeholder="What are we making together?"></textarea></div>`,{foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="hpGo">Start</button>`});
 $('#hpGo').onclick=()=>{const n=$('#hpN').value.trim();if(!n)return;const p={id:uid('hp'),name:n,desc:$('#hpD').value.trim()||'A shared project.',members:['me'],status:'active',progress:0};h.projects.push(p);act('hub',`Started ${n} in ${h.name}`);save();closeOv();go(`hub/${id}/proj:${p.id}`)}}
function hubProject(h,p){const inP=p.members.includes('me');return`<section class="msgs" style="overflow:auto"><div class="mh2">${ic('folder')}<b>${esc(p.name)}</b><span class="badge live">${p.status}</span></div><div style="padding:22px;max-width:720px">
 <p style="margin-top:0">${esc(p.desc)}</p><div class="row" style="margin:16px 0 8px"><span class="lbl">Progress</span><b class="num mono" style="margin-left:auto">${Math.round(p.progress*100)}%</b></div><input type="range" min="0" max="100" value="${Math.round(p.progress*100)}" style="width:100%;accent-color:var(--mint)" ${inP?'':'disabled'} oninput="hubProg('${h.id}','${p.id}',this.value)">
 <div class="row" style="margin:20px 0 10px"><span class="lbl">Members · ${p.members.length}</span><button class="btn sm ${inP?'':'mint'}" style="margin-left:auto" onclick="hubProjJoin('${h.id}','${p.id}')">${inP?'Leave project':'Join project'}</button></div>
 <div class="card" style="box-shadow:none"><div class="lst">${p.members.map(id=>{const x=personAny(id),r=roleOf(h,id);return`<div class="li">${avatar(x,28)}<b class="grow">${esc(x.name)}</b>${r?`<span class="badge" style="color:${r.color}">${esc(r.name)}</span>`:''}</div>`}).join('')}</div></div>
 ${inP?`<div class="row mt"><select class="inp" id="hpAdd" style="max-width:280px"><option value="">Add a hub member…</option>${h.members.filter(m=>!p.members.includes(m.id)).map(m=>`<option value="${m.id}">${esc(personAny(m.id).name)}</option>`).join('')}</select><button class="btn" onclick="const v=$('#hpAdd').value;if(v){hub('${h.id}').projects.find(x=>x.id==='${p.id}').members.push(v);save();rerender()}">${ic('plus','s')} Add</button></div>`:''}</div></section>`}
function hubProg(hid,pid,v){const p=hub(hid).projects.find(x=>x.id===pid);p.progress=v/100;if(p.progress>=1)p.status='done';saveSoon();const b=$('.msgs .mh2 + div .num');if(b)b.textContent=v+'%'}
function hubProjJoin(hid,pid){const p=hub(hid).projects.find(x=>x.id===pid);p.members=p.members.includes('me')?p.members.filter(x=>x!=='me'):[...p.members,'me'];save();rerender()}

 return`<section class="msgs" style="overflow:auto"><div class="mh2">${ic('gear')}<b>Hub settings</b></div><div style="padding:18px 22px;max-width:860px">
 <div class="tabs">${[['roles','Roles'],['members','Members'],['design','Design'],['plugins','Plugins']].map(([k,n])=>`<button class="${HS.tab===k?'on':''}" data-hs="${k}">${n}</button>`).join('')}</div>
 ${HS.tab==='roles'?`${h.roles.map(r=>`<div class="card" style="padding:14px 16px;margin-bottom:10px;box-shadow:none"><div class="row"><input type="color" value="${r.color}" data-rc="${r.id}" style="width:26px;height:26px;border:none;background:none;padding:0" aria-label="Role colour"><input class="inp" style="max-width:200px;height:32px;font-weight:600" value="${esc(r.name)}" data-rn="${r.id}"><span class="muted xs">${plural(h.members.filter(m=>m.role===r.id).length,'member')}</span>${['admin','member'].includes(r.id)?'':`<button class="btn sm ghost danger" style="margin-left:auto" data-rdel="${r.id}">${ic('trash','s')}</button>`}</div>
   <div class="chips" style="margin-top:10px">${Object.entries(PERM_N).map(([k,n])=>`<button class="chip ${r.perms.includes(k)?'on':''}" data-rp="${r.id}" data-k="${k}" ${r.id==='admin'?'disabled':''}>${n}</button>`).join('')}</div></div>`).join('')}<button class="btn" data-radd>${ic('plus','s')} New role</button>`

 :L?(mine.length?mine.map(x=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">${ic('plug')}<div class="grow"><b>${esc(x.name)}</b><div class="muted xs">${esc(actSummary(x))}</div></div>${tgl(h.plugins.includes(x.id),`hubPlug_${x.id.replace(/\W/g,'')}`,'Install '+x.name)}</div>`).join(''):`<div class="empty">${figure('build')}<b>No hub plugins yet</b><p>Welcome bots, auto roles and slash commands are built in Blueprint.</p><a class="btn pri" href="#/bp/plugins">Open Blueprint</a></div>`)
 :`<div class="note">${ic('lock')}<span>Hub plugins (welcome bots, auto roles, slash commands) need a Blueprint license. <a href="#/bp/license" style="font-weight:600;color:var(--mint-ink)">Get Blueprint</a></span></div>`}</div></section>`}
function hubSettingsBind(id){const h=hub(id);if(!h||HV[id]!=='settings')return;const box=$('.msgs');if(!box)return;
 box.onclick=e=>{const t=e.target.closest('[data-hs],[data-rp],[data-rdel],[data-radd],[data-kick],[data-hd]');if(!t)return;
  if(t.dataset.hs){HS.tab=t.dataset.hs;rerender();return}
  if(t.dataset.rp){const r=h.roles.find(x=>x.id===t.dataset.rp),k=t.dataset.k;r.perms=r.perms.includes(k)?r.perms.filter(x=>x!==k):[...r.perms,k];t.classList.toggle('on');save();return}
  if(t.dataset.rdel){const rid=t.dataset.rdel;h.members.forEach(m=>{if(m.role===rid)m.role='member'});h.roles=h.roles.filter(r=>r.id!==rid);save();rerender();return}
  if(t.dataset.radd!==undefined){h.roles.splice(h.roles.length-1,0,{id:uid('r'),name:'New role',color:AVC[h.roles.length%AVC.length],perms:[]});save();rerender();return}
  if(t.dataset.kick){h.members=h.members.filter(m=>m.id!==t.dataset.kick);save();toast('Removed','trash');rerender();return}

 S.bp.plugins.forEach(x=>{window[`hubPlug_${x.id.replace(/\W/g,'')}`]=on=>{h.plugins=on?[...new Set([...h.plugins,x.id])]:h.plugins.filter(i=>i!==x.id);x.hubInstalls=S.hubs.filter(y=>y.plugins.includes(x.id)).length;save();toast(on?`${x.name} installed in ${h.name}`:`${x.name} removed`,'plug')}})}

 const series=(()=>{const days=60,by={};C.log.forEach(l=>{const k=dayKey(l.at);by[k]=(by[k]||0)+l.amt});let bal=C.balance;const out=[];for(let d=0;d<days;d++){out.unshift(bal);bal-=by[dayKey(Date.now()-d*DAY)]||0}return out})();

 <div class="card span7"><div class="ch"><h3>Balance, last 60 days</h3></div><div class="cb">${lineChart([series],{labels:series.map((_,i)=>dayLabel(60,i)),fmt:short,cols:['var(--mint)'],id:'crC',h:200})}</div></div></div>
 <h3 class="mt2" style="margin-bottom:12px">Spend</h3><div class="grid g3">${SHOP.map(s=>{const own=s.id==='license'&&licensed()||s.id==='insights'&&insightsOn()||s.id==='domain'&&S.settings.domain;return`<div class="card shopi" style="--c:${s.c}"><span class="si">${ic(s.ic)}</span><b>${s.n}</b><p>${s.d}</p><div class="row"><span class="cost">${coinIc()} ${nfmt(s.cost)}</span><button class="btn sm ${own?'':'pri'}" style="margin-left:auto" onclick="shopBuy('${s.id}')" ${own&&s.id!=='insights'?'disabled':''}>${own?(s.id==='insights'?'Open':'Active'):'Use'}</button></div></div>`}).join('')}</div>
 <div class="grid g12 mt2"><div class="card span4"><div class="ch"><h3>How you earn</h3></div><div class="lst">${[['Each sale',5,'cart'],['Daily check-in',50,'spark'],['Publish a product',100,'rocket'],['Launch a roadmap project',150,'map'],['Create a hub',60,'hub'],['Publish a plugin',80,'plug'],['Publish a storefront',40,'page'],['Invite a teammate',30,'uplus'],['Save a design blueprint',40,'palette'],['Send a message',1,'chat']].map(([n,a,i])=>`<div class="li">${ic(i,'s')}<span class="grow sm">${n}</span><b class="mono sm" style="color:var(--mint-ink)">+${a}</b></div>`).join('')}</div></div>
 <div class="card span8" style="overflow:hidden"><div class="ch"><h3>History</h3><div class="acts">${seg('crF',[['all','All'],['in','Earned'],['out','Spent']],CR.f,'crFilter')}</div></div><div style="max-height:440px;overflow:auto"><table class="tbl"><tbody>${log.slice(0,120).map(l=>`<tr><td style="width:36px"><span style="width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:${l.amt>0?'var(--mint-soft)':'var(--sunken)'};color:${l.amt>0?'var(--mint-ink)':'var(--ink2)'}">${ic(l.amt>0?'plus':'minus','s')}</span></td><td>${esc(l.why)}</td><td class="muted">${ago(l.at)}</td><td class="r num"><b style="color:${l.amt>0?'var(--mint-ink)':'var(--text)'}">${l.amt>0?'+':''}${nfmt(l.amt)}</b></td></tr>`).join('')}</tbody></table></div></div></div></div>`},
after(){segInit();const C=S.credits;chartHover('crC',[(()=>{const days=60,by={};C.log.forEach(l=>{const k=dayKey(l.at);by[k]=(by[k]||0)+l.amt});let bal=C.balance;const out=[];for(let d=0;d<days;d++){out.unshift(bal);bal-=by[dayKey(Date.now()-d*DAY)]||0}return out})()],Array.from({length:60},(_,i)=>dayLabel(60,i)),v=>nfmt(v)+' credits',['Balance'])}};

function shopBuy(id){const s=SHOP.find(x=>x.id===id);if(id==='insights'&&insightsOn()){go('analytics');return}s.fn()}
function boostForm(){modal('Boost a product',`<p class="muted" style="margin-top:0">Featured products get more visits from Mintora discovery for seven days.</p><div class="col" style="gap:6px">${S.products.filter(p=>p.status==='live').map(p=>`<label class="row" style="padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer"><input type="radio" name="bst" value="${p.id}" style="accent-color:var(--mint)"><span class="cover" style="width:46px;border-radius:6px">${cover(p,{big:1})}</span><b class="grow">${esc(p.name)}</b>${p.boost>Date.now()?`<span class="badge live">Boosted</span>`:''}</label>`).join('')}</div>`,{foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="bsGo">${ic('rocket','s')} Boost for 200</button>`});
 $('#bsGo').onclick=()=>{const v=$('input[name=bst]:checked');if(!v){toast('Pick a product','info');return}const p=prod(v.value);if(!spend(200,'Boost: '+p.name))return;p.boost=Math.max(Date.now(),p.boost||0)+7*DAY;const k=dayKey(Date.now());S.views[p.id][k]=(S.views[p.id][k]||0)+120;act('credits',`Boosted ${p.name}`);save();closeOv();toast(`${p.name} is boosted for 7 days`,'rocket');rerender()}}

function brandKit(){if(!spend(150,'Brand kit export'))return;const w=S.workspace,kit=`<!-- ${w.name} brand kit, made with Mintora -->\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Space Grotesk, sans-serif"><rect width="600" height="340" fill="#F6F7F5"/><g transform="translate(40 40) scale(2.4)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${MARK.hex}" stroke="#0E1512" stroke-width="2.2"/><path d="${MARK.m}" stroke="${w.color}" stroke-width="2.2"/><circle cx="26.8" cy="9.4" r="2.3" fill="${w.color}"/></g><text x="140" y="92" font-size="40" font-weight="600" fill="#0E1512">${esc(w.name)}</text>${[w.color,'#0E1512','#F6F7F5','#6D5DFC'].map((c,i)=>`<rect x="${40+i*130}" y="190" width="110" height="80" rx="12" fill="${c}" stroke="#E3E6E1"/><text x="${40+i*130}" y="292" font-size="13" fill="#66706A">${c}</text>`).join('')}</svg>`;
 download(w.name.toLowerCase().replace(/\W+/g,'-')+'-brand-kit.svg',kit,'image/svg+xml');act('credits','Exported the brand kit');save();toast('Brand kit downloaded','download');rerender()}

/* Mintora Blueprint: the licensed studio for plugins (storefronts, hubs, the dashboard) and design systems */
const licensed=()=>!!(S&&S.bp.license);
const TARGETS={page:['Storefront','page','Runs on product pages'],hub:['Hub','hub','Runs inside hubs'],app:['Dashboard','dash','Adds widgets to your dashboard']};
const TRIGGERS={page:[['load','When the page loads'],['purchase','After a purchase']],hub:[['join','When someone joins'],['command','On a slash command'],['publish','When a product goes live']],app:[['always','Always on']]};
const ACTIONS={
 banner:{t:'page',n:'Top banner',ic:'mega',f:[['text','Text','Launch week: everything 20% off'],['tone','Tone','accent',['accent','dark']]]},
 countdown:{t:'page',n:'Countdown',ic:'clock',f:[['label','Label','Launch price ends in'],['hours','Hours','48','num']]},
 discount:{t:'page',n:'Discount code',ic:'tag',f:[['code','Code','LAUNCH20'],['pct','Percent off','20','num']]},

 sticky:{t:'page',n:'Sticky buy bar',ic:'cart',f:[['text','Text','Ready when you are']]},
 welcome:{t:'hub',n:'Welcome message',ic:'wave',f:[['message','Message','Welcome, {name}! Start in #general and say hi.']]},
 autorole:{t:'hub',n:'Give a role',ic:'shield',f:[['role','Role','Member']]},
 command:{t:'hub',n:'Slash command',ic:'term',f:[['cmd','Command','/links'],['reply','Reply','Docs, templates and the roadmap: mintora.shop/{hub}']]},
 announce:{t:'hub',n:'Announcement',ic:'mega',f:[['text','Text','New on the shelf: {product}. Have a look!']]},
 widget:{t:'app',n:'Metric widget',ic:'chart',f:[['metric','Metric','revenue',['revenue','orders','visitors','conversion','score','goal']],['label','Label','Revenue today'],['goal','Goal (for goal tracker)','10000','num']]}};
IC.wave=IC.chat;
const TEMPLATES=[
 {n:'Launch countdown',d:'A banner with a live countdown to the end of launch pricing.',target:'page',trigger:'load',actions:[{type:'banner',text:'Launch week pricing',tone:'accent'},{type:'countdown',label:'Ends in',hours:48}]},
 {n:'Discount code',d:'Shows a code under the button and applies it at checkout.',target:'page',trigger:'load',actions:[{type:'discount',code:'LAUNCH20',pct:20}]},
 {n:'Social proof',d:'A live line with how many people bought this week.',target:'page',trigger:'load',actions:[{type:'proof',text:'{n} people bought this week'}]},
 {n:'Sticky buy bar',d:'A buy bar that follows the reader down the page.',target:'page',trigger:'load',actions:[{type:'sticky',text:'Ready when you are'}]},
 {n:'Welcome bot',d:'Greets every new member by name.',target:'hub',trigger:'join',actions:[{type:'welcome',message:'Welcome, {name}! Start in #general and say hi.'}]},
 {n:'Auto role',d:'Gives new members a role the moment they join.',target:'hub',trigger:'join',actions:[{type:'autorole',role:'Customer'}]},
 {n:'Slash command',d:'Answers a custom /command in any channel.',target:'hub',trigger:'command',actions:[{type:'command',cmd:'/links',reply:'Docs, templates and the roadmap: mintora.shop/{hub}'}]},
 {n:'Launch announcer',d:'Posts in your hubs when a product goes live.',target:'hub',trigger:'publish',actions:[{type:'announce',text:'New on the shelf: {product}. Have a look!'}]},
 {n:'Revenue goal',d:'A dashboard widget that tracks a monthly goal.',target:'app',trigger:'always',actions:[{type:'widget',metric:'goal',label:'Monthly goal',goal:10000}]}];
function actSummary(x){return x.actions.map(a=>{const A=ACTIONS[a.type];return A?A.n+(a.type==='countdown'?` ${a.hours}h`:a.type==='discount'?` ${a.code}`:a.type==='command'?` ${a.cmd}`:''):a.type}).join(' · ')||'No actions yet'}
function bpLog(x,msg,lvl='ok'){x.runs=(x.runs||0)+1;S.bp.logs.unshift({at:Date.now(),pid:x.id,name:x.name,msg,lvl});if(S.bp.logs.length>200)S.bp.logs.length=200;saveSoon()}
/* ---- plugins at work ---- */
function pagePlugins(p){const out={banner:'',proof:'',code:'',sticky:'',discount:null};if(!licensed())return out;
 (p.page.plugins||[]).map(id=>S.bp.plugins.find(x=>x.id===id)).filter(x=>x&&x.status==='published'&&x.target==='page').forEach(x=>x.actions.forEach(a=>{
  if(a.type==='banner'){const cd=x.actions.find(b=>b.type==='countdown');out.banner+=`<div class="pl-banner ${a.tone==='dark'?'dark':''}">${ic('bolt','s')}<span>${esc(a.text)}</span>${cd?`<span>${esc(cd.label)}</span><span class="cd" data-end="${cdEnd(x,cd)}">--:--:--</span>`:''}</div>`}
  if(a.type==='countdown'&&!x.actions.some(b=>b.type==='banner'))out.banner+=`<div class="pl-banner dark">${ic('clock','s')}<span>${esc(a.label)}</span><span class="cd" data-end="${cdEnd(x,a)}">--:--:--</span></div>`;
  if(a.type==='proof'){const n=ordersIn(7,0,p.id).length;out.proof+=`<div class="pl-proof"><i></i>${esc(fill(a.text,{n:Math.max(n,1)}))}</div>`}
  if(a.type==='discount'){out.discount={code:a.code,pct:+a.pct||0};out.code+=`<div class="pl-code">${ic('tag','s')}Use <code>${esc(a.code)}</code> for ${+a.pct||0}% off</div>`}
  if(a.type==='sticky')out.sticky=`<div class="pl-sticky"><b style="font-family:var(--sfont)">${esc(p.name)}</b><span style="color:var(--smu);font-size:13px">${esc(a.text)}</span><button class="sbtn" style="margin-left:auto;height:38px" onclick="checkout('${p.id}')">${money(p.price)}</button></div>`}));return out}
function cdEnd(x,a){const len=(+a.hours||24)*3600e3,start=x.published||x.updated||Date.now();let end=start+len;while(end<Date.now())end+=len;return end}
let _cdT=0;function startCountdowns(){clearInterval(_cdT);const tick=()=>{const L=$$('.cd[data-end]');if(!L.length){clearInterval(_cdT);return}L.forEach(el=>{const s=Math.max(0,Math.floor((+el.dataset.end-Date.now())/1000));el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')})};tick();_cdT=setInterval(tick,1000)}
function pluginEvent(kind,ctx={}){if(!licensed())return;S.bp.plugins.filter(x=>x.status==='published').forEach(x=>{
 if(x.target==='page'&&ctx.pid&&prod(ctx.pid)?.page.plugins.includes(x.id)){if(kind==='load')x.runs=(x.runs||0)+1;if(kind==='purchase')bpLog(x,`Purchase on ${prod(ctx.pid).name}`)}
 if(x.target==='hub'&&x.trigger==='publish'&&kind==='publish'){const p=prod(ctx.pid);S.hubs.filter(h=>h.plugins.includes(x.id)).forEach(h=>{const ch=h.channels.find(c=>c.type==='announce')||h.channels[0];x.actions.filter(a=>a.type==='announce').forEach(a=>{ch.msgs.push({id:uid('m'),who:'bot',bot:true,botName:x.name,text:fill(a.text,{product:p.name,hub:h.name}),t:Date.now()});ch.unread=(ch.unread||0)+1;bpLog(x,`Announced ${p.name} in ${h.name}`)})})}})}
function pluginWidgets(){if(!licensed())return'';return S.bp.plugins.filter(x=>x.status==='published'&&x.target==='app'&&x.dash!==false).flatMap(x=>x.actions.filter(a=>a.type==='widget').map(a=>{
 const m=a.metric,L=m==='goal'?ordersIn(new Date().getDate()):ordersIn(1);let v,sub='';
 if(m==='revenue'){v=money(revOf(L))}else if(m==='orders'){v=nfmt(L.length)}else if(m==='visitors'){v=short(viewsIn(null,1))}else if(m==='conversion'){const vv=viewsIn(null,1);v=pct(vv?L.length/vv:0,2)}else if(m==='score'){v=perfScore().score+'/100'}else{const r=revOf(L),g=+a.goal||1;v=money(r);sub=`<div class="pbar" style="margin-top:10px"><i style="width:${Math.min(100,r/g*100)}%"></i></div><div class="d">${pct(Math.min(1,r/g),0)} of ${money(g)} this month</div>`}
 return`<div class="card kpi" style="border-style:dashed"><div class="l">${ic('plug')} ${esc(a.label)} <span class="badge vio" style="margin-left:auto;height:18px;font-size:10px">${esc(x.name)}</span></div><div class="v">${v}</div>${sub||'<div class="d">Live from your plugin</div>'}</div>`})).join('')}
/* ---- license ---- */
function keyCheck(k){return(hashN(k)%46656).toString(36).toUpperCase().padStart(3,'0')}
function makeKey(){const a=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'X'),b=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'Z');return`MNT-BP-${a}-${b}-${keyCheck(a+b)}`}
function keyOK(k){const m=/^MNT-BP-([A-Z0-9]{4})-([A-Z0-9]{4})-([A-Z0-9]{3})$/.exec(String(k).trim().toUpperCase());return!!m&&keyCheck(m[1]+m[2])===m[3]}
function grantLicense(tier,key){S.bp.license={tier,key:key||makeKey(),at:Date.now(),seats:tier==='studio'?5:1};act('plugin',`Blueprint ${tier} license activated`);notify('Blueprint is unlocked','key','bp');save()}
function buyLicense(){if(licensed())return;if(!spend(2000,'Blueprint license (Solo)'))return;grantLicense('solo');toast('Blueprint unlocked','key');go('bp')}
function enterKey(){const v=$('#bpKey').value.trim().toUpperCase();if(!keyOK(v)){$('#bpKey').parentNode.style.borderColor='#FF8A93';$('#bpKeyE').textContent='That key is not valid. It looks like MNT-BP-XXXX-XXXX-XXX.';return}grantLicense('studio',v);toast('License key accepted','key');go('bp')}
function bpGate(what){return`<div class="page"><div class="lic bpframe" style="max-width:720px;margin:40px auto;text-align:center;padding:44px">${bpMark(64)}<h1 style="margin:18px 0 8px;font:500 26px var(--f-mono)">${esc(what)} needs a license</h1><p style="color:#A8BFE8;max-width:460px;margin:0 auto 22px">Blueprint is the builder side of Mintora: plugins for storefronts, hubs and your dashboard, and design systems made from scratch.</p><a class="btn mint lg" href="#/bp/license">${ic('key','s')} Get a license</a></div></div>`}
/* ---- overview ---- */
PAGES.bp={crumbs:(s,id)=>{const base=[['Blueprint','#/bp']];if(!s)return[['Blueprint']];if(s==='plugin')return[...base,['Plugins','#/bp/plugins'],[S.bp.plugins.find(x=>x.id===id)?.name||'Plugin']];if(s==='design')return[...base,['Designs','#/bp/designs'],[design(id)?.name||'Design']];return[...base,[{plugins:'Plugins',designs:'Designs',license:'License',docs:'Reference'}[s]||s]]},
view(s,id){if(s==='license')return bpLicense();if(s==='docs')return bpDocs();if(!licensed()&&s)return bpGate(s==='plugin'||s==='plugins'?'Plugin Studio':'Design Studio');
 if(s==='plugins')return bpPlugins();if(s==='plugin')return pluginStudio(id);if(s==='designs')return bpDesigns();if(s==='design')return designStudio(id);return bpHome()},
after(s,id){segInit();if(s==='plugin')studioAfter(id);if(s==='design')designAfter(id);if(!s)startCountdowns()}};
function bpHome(){const L=licensed(),P=S.bp.plugins,inst=sum(P.map(x=>(x.installs||0)+(x.hubInstalls||0)+(x.target==='app'&&x.status==='published'?1:0))),runs=sum(P.map(x=>x.runs||0));
 return`<div class="page"><div class="grid g12" style="align-items:stretch">
 <div class="card span8 bpframe" style="padding:30px;position:relative;overflow:hidden"><div class="eyebrow">${ic('bp','s')} Mintora Blueprint ${L?`· ${esc(S.bp.license.tier.toUpperCase())} LICENSE`:''}</div>
  <h1 style="font:500 34px/1.15 var(--f-mono);letter-spacing:-.02em;max-width:540px">Draw the parts of Mintora that are yours.</h1><p style="color:var(--ink2);max-width:520px;margin:12px 0 22px">Plugins that run on your storefronts, inside your hubs and on your dashboard. Design systems you build from scratch and apply anywhere.</p>
  <div class="row">${L?`<button class="btn mint" onclick="newPlugin()">${ic('plug','s')} New plugin</button><button class="btn" onclick="newDesign()">${ic('palette','s')} New design</button>`:`<a class="btn mint lg" href="#/bp/license">${ic('key','s')} Get a license</a>`}<a class="btn ghost" href="#/bp/docs">${ic('code','s')} Reference</a></div>
  <div style="position:absolute;right:28px;top:26px;width:190px;height:190px">${bpSchematicMark()}</div></div>
 <div class="card span4" style="padding:20px"><div class="lbl" style="margin-bottom:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--mint)">Status</div>
  ${[['License',L?S.bp.license.tier.toUpperCase():'NONE'],['Plugins',P.length],['Published',P.filter(x=>x.status==='published').length],['Installs',inst],['Runs',nfmt(runs)],['Designs',S.bp.designs.length]].map(([k,v])=>`<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--line);font-family:var(--f-mono);font-size:13px"><span style="color:var(--muted)">${k}</span><b style="margin-left:auto;font-weight:500">${v}</b></div>`).join('')}</div></div>

 <div class="grid g12 mt2"><div class="card span7"><div class="ch"><h3>Start from a template</h3><a class="acts btn ghost sm" href="#/bp/plugins">All plugins ${ic('right','s')}</a></div><div class="lst">${TEMPLATES.slice(0,5).map((t,i)=>`<div class="li click" onclick="${L?`newPlugin(${i})`:"go('bp/license')"}"><span style="width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--mint)">${ic(TARGETS[t.target][1],'s')}</span><div class="grow"><b style="font-family:var(--f-mono);font-weight:500">${esc(t.n)}</b><div class="sub">${esc(t.d)}</div></div>${ic(L?'plus':'lock','s')}</div>`).join('')}</div></div>
 <div class="card span5"><div class="ch"><h3>Console</h3><span class="acts xs faint mono">${S.bp.logs.length} events</span></div><div class="cb"><div class="console">${S.bp.logs.slice(0,14).map(l=>`<div><span class="t">${ftime(l.at)}</span> <span class="${l.lvl}">●</span> <b>${esc(l.name)}</b> ${esc(l.msg)}</div>`).join('')||'<span class="t">// Plugin runs and test results show up here.</span>'}</div></div></div></div></div>`}

function bpPlugins(){const P=S.bp.plugins;return`<div class="page"><div class="ph"><div class="grow"><div class="eyebrow">${ic('plug','s')} Plugin Studio</div><h1>Plugins</h1><p>Each plugin is a trigger and a list of actions, with a target where it runs.</p></div><div class="acts"><button class="btn mint" onclick="newPlugin()">${ic('plus','s')} From scratch</button></div></div>
 ${P.length?`<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${P.map(x=>`<div class="card hov bpframe" style="padding:16px" onclick="go('bp/plugin/${x.id}')"><div class="row"><span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--mint)">${ic(TARGETS[x.target][1],'s')}</span><div class="grow"><b style="font:500 15px var(--f-mono)">${esc(x.name)}</b><div class="xs muted mono">v${x.version} · ${TARGETS[x.target][0]}</div></div><span class="badge ${x.status==='published'?'live':'draft'}"><i class="bd"></i>${x.status}</span></div>
  <p class="muted sm" style="margin:12px 0">${esc(x.desc||actSummary(x))}</p><div class="row xs mono muted"><span>${esc(TRIGGERS[x.target].find(t=>t[0]===x.trigger)?.[1]||x.trigger)}</span><span style="margin-left:auto">${nfmt(x.runs||0)} runs</span></div></div>`).join('')}</div>`:`<div class="card"><div class="empty">${figure('build',{acc:'#7FE3FF'})}<b>No plugins yet</b><p>Start from a template below or from scratch.</p></div></div>`}
 <h3 class="mt2" style="margin-bottom:12px">Templates</h3><div class="grid g3">${TEMPLATES.map((t,i)=>`<button class="card hov" style="padding:16px;text-align:left" onclick="newPlugin(${i})"><div class="row" style="margin-bottom:8px">${ic(TARGETS[t.target][1],'s')}<span class="xs mono" style="color:var(--mint)">${TARGETS[t.target][0].toUpperCase()}</span></div><b style="font:500 14px var(--f-mono)">${esc(t.n)}</b><p class="muted sm" style="margin:6px 0 0">${esc(t.d)}</p></button>`).join('')}</div></div>`}
function newPlugin(i){if(!licensed()){go('bp/license');return}const t=i!=null?TEMPLATES[i]:{n:'Untitled plugin',d:'',target:'page',trigger:'load',actions:[]};const x={id:uid('pl'),name:t.n,desc:t.d,target:t.target,trigger:t.trigger,actions:JSON.parse(JSON.stringify(t.actions)),status:'draft',version:'0.1.0',created:Date.now(),updated:Date.now(),runs:0,installs:0};S.bp.plugins.unshift(x);save();go('bp/plugin/'+x.id)}
/* the studio: form on the left, schematic and manifest in the middle, preview and install on the right */
let PS={tab:'manifest'};
function manifest(x){return JSON.stringify({name:x.name,version:x.version,description:x.desc||'',target:x.target,trigger:x.trigger,actions:x.actions},null,2)}
function pluginStudio(id){const x=S.bp.plugins.find(p=>p.id===id);if(!x)return`<div class="page"><div class="empty"><b>Plugin not found</b><a class="btn" href="#/bp/plugins">Back</a></div></div>`;
 return`<div class="page" style="max-width:none;padding:20px 24px 40px"><div class="row" style="margin-bottom:16px"><span style="width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--mint)">${ic('plug')}</span><div><h1 style="font-size:20px">${esc(x.name)}</h1><div class="xs mono muted">${x.id} · v${x.version} · updated ${ago(x.updated)}</div></div><span class="badge ${x.status==='published'?'live':'draft'}" style="margin-left:8px"><i class="bd"></i>${x.status}</span>
 <div class="row" style="margin-left:auto"><button class="btn" onclick="testPlugin('${id}')">${ic('play','s')} Test run</button><button class="btn ghost danger" onclick="delPlugin('${id}')">${ic('trash','s')}</button><button class="btn mint" onclick="publishPlugin('${id}')">${ic('rocket','s')} ${x.status==='published'?'Publish update':'Publish'}</button></div></div>
 <div class="grid" style="grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start">
 <div class="card" style="padding:16px;position:sticky;top:0" id="psF">${studioForm(x)}</div>
 <div class="col" style="gap:16px;min-width:0"><div class="card bpframe" style="padding:16px"><div class="row" style="margin-bottom:10px"><b style="font:500 13px var(--f-mono)">SCHEMATIC</b><span class="xs mono faint" style="margin-left:auto">trigger → actions → target</span></div><div id="psN">${schematic(x)}</div></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start"><div class="card" style="padding:0;overflow:hidden"><div class="tabs" style="margin:0;padding:0 12px">${[['manifest','manifest.json'],['console','Console'],['code','plugin.js']].map(([k,n])=>`<button class="${PS.tab===k?'on':''}" data-pst="${k}" style="font-family:var(--f-mono);font-weight:500;font-size:12.5px">${n}</button>`).join('')}<span id="psErr" class="xs mono" style="margin-left:auto;align-self:center;color:#7DF0B8;max-width:60%;text-align:right">✓ valid</span></div>
  <div style="padding:12px" id="psT">${studioTab(x)}</div></div>
  <div class="col" style="gap:16px"><div class="card" style="padding:16px"><b style="font:500 13px var(--f-mono)">PREVIEW</b><div style="margin-top:12px" id="psP">${pluginPreview(x)}</div></div>
  <div class="card" style="padding:16px"><b style="font:500 13px var(--f-mono)">INSTALL</b><div style="margin-top:10px" id="psI">${installList(x)}</div></div></div></div></div></div></div>`}
function studioForm(x){const acts=Object.entries(ACTIONS).filter(([,a])=>a.t===x.target);
 return`<div class="field"><label>Name</label><input class="inp" data-pf="name" value="${esc(x.name)}"></div><div class="field"><label>Description</label><textarea class="inp" data-pf="desc" style="min-height:60px">${esc(x.desc||'')}</textarea></div>
 <div class="field"><label>Runs on</label><div class="chips">${Object.entries(TARGETS).map(([k,[n,i]])=>`<button class="chip ${x.target===k?'on':''}" data-tgt="${k}">${ic(i,'s')} ${n}</button>`).join('')}</div></div>
 <div class="field"><label>Trigger</label><select class="inp" data-pf="trigger">${TRIGGERS[x.target].map(([k,n])=>`<option value="${k}" ${x.trigger===k?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="lbl" style="margin:4px 0 8px">Actions</div>${x.actions.map((a,i)=>{const A=ACTIONS[a.type];if(!A)return'';return`<div style="border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px"><div class="row" style="margin-bottom:8px">${ic(A.ic,'s')}<b class="sm">${A.n}</b><button class="ibtn" style="margin-left:auto;width:24px;height:24px" data-rma="${i}" aria-label="Remove action">${ic('x','s')}</button></div>
  ${A.f.map(([k,n,def,opt])=>Array.isArray(opt)?`<select class="inp" style="height:32px;margin-bottom:6px" data-ai="${i}" data-ak="${k}">${opt.map(o=>`<option ${a[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input class="inp" style="height:32px;margin-bottom:6px" placeholder="${esc(n)}" ${opt==='num'?'type="number"':''} data-ai="${i}" data-ak="${k}" value="${esc(a[k]??'')}" aria-label="${esc(n)}">`).join('')}</div>`}).join('')}
 <select class="inp" id="psAdd"><option value="">+ Add an action…</option>${acts.map(([k,a])=>`<option value="${k}">${a.n}</option>`).join('')}</select>
 <div class="xs muted" style="margin-top:10px">Placeholders: <code>{name}</code> <code>{hub}</code> <code>{product}</code> <code>{n}</code></div>`}
function schematic(x){const tl=TRIGGERS[x.target].find(t=>t[0]===x.trigger)?.[1]||x.trigger,n=Math.max(1,x.actions.length),H=Math.max(200,n*108+20),tg=x.target==='page'?S.products.filter(p=>p.page.plugins.includes(x.id)).map(p=>p.name):x.target==='hub'?S.hubs.filter(h=>h.plugins.includes(x.id)).map(h=>h.name):['Dashboard'];
 const ay=i=>12+i*108,ty=H/2-40;
 return`<div class="nodes" style="height:${H}px"><svg class="wires" viewBox="0 0 900 ${H}" preserveAspectRatio="none">${x.actions.map((_,i)=>`<path d="M250 ${H/2}C300 ${H/2} 300 ${ay(i)+34} 350 ${ay(i)+34}"/><path d="M570 ${ay(i)+34}C620 ${ay(i)+34} 620 ${H/2} 670 ${H/2}"/>`).join('')}</svg>
 <div class="node trig" style="left:2%;top:${ty}px;width:25%"><div class="nt">${ic('bolt','s')} Trigger</div><b>${esc(x.trigger)}</b><div class="np">${esc(tl)}</div></div>
 ${x.actions.map((a,i)=>`<div class="node act" style="left:39%;top:${ay(i)}px;width:24%"><div class="nt">${ic(ACTIONS[a.type]?.ic||'code','s')} Action ${i+1}</div><b>${esc(a.type)}</b><div class="np">${esc(Object.entries(a).filter(([k])=>k!=='type').map(([k,v])=>`${k}: ${v}`).join(' · ').slice(0,70))}</div></div>`).join('')||`<div class="node act" style="left:39%;top:${ty}px;width:24%;border-style:dashed"><div class="nt">Action</div><b>none yet</b><div class="np">Add one on the left</div></div>`}
 <div class="node tgt" style="left:74%;top:${ty}px;width:25%"><div class="nt">${ic(TARGETS[x.target][1],'s')} Target</div><b>${TARGETS[x.target][0].toLowerCase()}</b><div class="np">${tg.length?esc(tg.slice(0,3).join(', ')):'not installed yet'}</div></div></div>`}
function hiJSON(s){return esc(s).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g,(m,str,colon,kw,num)=>str?(colon?`<span class="tk-p">${str}</span>${colon}`:`<span class="tk-s">${str}</span>`):kw?`<span class="tk-k">${kw}</span>`:`<span class="tk-n">${num}</span>`)}
function studioTab(x){if(PS.tab==='console')return`<div class="console" id="psC" style="min-height:300px;max-height:340px">${S.bp.logs.filter(l=>l.pid===x.id).slice(0,40).map(l=>`<div><span class="t">${ftime(l.at)}</span> <span class="${l.lvl}">●</span> ${esc(l.msg)}</div>`).join('')||'<span class="t">// Press Test run to simulate the trigger.</span>'}</div>`;
 if(PS.tab==='code')return`<div class="code"><div class="lines">${genCode(x).split('\n').map((_,i)=>i+1).join('\n')}</div><pre>${hiJS(genCode(x))}</pre></div>`;
 const j=manifest(x);return`<div class="code"><div class="lines" id="psL">${j.split('\n').map((_,i)=>i+1).join('\n')}</div><pre class="hlt" id="psH" aria-hidden="true">${hiJSON(j)}\n</pre><textarea id="psJ" spellcheck="false" aria-label="Plugin manifest">${esc(j)}</textarea></div>`}
function genCode(x){return`// Generated from manifest.json · ${x.name} v${x.version}\nimport { definePlugin } from '@mintora/blueprint'\n\nexport default definePlugin({\n  target: '${x.target}',\n  on: '${x.trigger}',\n  async run(ctx) {\n${x.actions.map(a=>`    await ctx.${a.type}(${JSON.stringify(Object.fromEntries(Object.entries(a).filter(([k])=>k!=='type')))})`).join('\n')||'    // add actions in the studio'}\n  }\n})\n`}
function hiJS(s){return esc(s).replace(/(\/\/.*)|('(?:[^'\\]|\\.)*')|(&quot;(?:[^&]|&(?!quot;))*?&quot;)|\b(import|from|export|default|async|await|const|return)\b|\b(\d+)\b/g,(m,c,s1,s2,k,n)=>c?`<span class="tk-c">${c}</span>`:s1||s2?`<span class="tk-s">${s1||s2}</span>`:k?`<span class="tk-k">${k}</span>`:`<span class="tk-n">${n}</span>`)}
function validate(o){const e=[];if(typeof o!=='object'||!o)return['The manifest must be an object'];if(!o.name||typeof o.name!=='string')e.push('"name" is required');if(!TARGETS[o.target])e.push('"target" must be page, hub or app');else if(!TRIGGERS[o.target].some(t=>t[0]===o.trigger))e.push(`"trigger" for ${o.target} must be ${TRIGGERS[o.target].map(t=>t[0]).join(' or ')}`);
 if(!Array.isArray(o.actions))e.push('"actions" must be a list');else o.actions.forEach((a,i)=>{const A=ACTIONS[a&&a.type];if(!A)e.push(`actions[${i}].type "${a&&a.type}" is unknown`);else if(A.t!==o.target)e.push(`actions[${i}] "${a.type}" does not run on ${o.target}`)});if(o.version&&!/^\d+\.\d+\.\d+$/.test(o.version))e.push('"version" must look like 1.0.0');return e}
function pluginPreview(x){if(x.target==='app')return`<div class="grid" style="gap:10px">${(()=>{const was=x.status;x.status='published';const h=pluginWidgets.call(null);x.status=was;return h})()||'<p class="muted sm">Add a metric widget.</p>'}</div>`;
 if(x.target==='hub'){const h={name:'Your hub'};const lines=x.actions.map(a=>a.type==='welcome'?['bot',fill(a.message,{name:'Ava',hub:h.name})]:a.type==='autorole'?['sys',`Ava got the ${a.role} role`]:a.type==='command'?['cmd',a.cmd,fill(a.reply,{hub:'your-hub',name:'Ava'})]:a.type==='announce'?['bot',fill(a.text,{product:'Orbit UI Kit',hub:h.name})]:['sys',a.type]);
  return`<div style="border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:13px">${lines.map(l=>l[0]==='cmd'?`<div style="margin:4px 0"><b>Ava</b> <code>${esc(l[1])}</code></div><div style="margin:4px 0 8px;padding-left:10px;border-left:2px solid var(--violet)"><b style="color:var(--violet)">${esc(x.name)}</b> ${esc(l[2])}</div>`:l[0]==='bot'?`<div style="margin:4px 0;padding-left:10px;border-left:2px solid var(--violet)"><b style="color:var(--violet)">${esc(x.name)}</b> ${esc(l[1])}</div>`:`<div class="muted" style="font-style:italic;margin:4px 0">${esc(l[1])}</div>`).join('')||'<span class="muted">Add an action.</span>'}</div>`}
 const p=S.products.find(q=>q.status==='live')||S.products[0];if(!p)return'<p class="muted sm">Create a product to preview.</p>';const was=x.status,had=p.page.plugins.includes(x.id);x.status='published';if(!had)p.page.plugins.push(x.id);const out=pagePlugins(p);x.status=was;if(!had)p.page.plugins=p.page.plugins.filter(i=>i!==x.id);
 return`<div class="sf" style="${designVars(design(p.page.design).tokens)};border-radius:10px;overflow:hidden;border:1px solid var(--line2)">${out.banner}<div style="padding:16px"><b style="font-family:var(--sfont);font-size:18px">${esc(p.name)}</b><div style="margin-top:10px"><button class="sbtn" style="height:36px;font-size:13px">Get it · ${money(p.price)}</button></div>${out.proof}${out.code}</div>${out.sticky.replace('position:sticky','position:relative')}</div>`}
function installList(x){if(x.status!=='published')return`<p class="muted sm" style="margin:0">Publish the plugin to install it.</p>`;
 if(x.target==='app')return`<div class="row"><span class="grow sm">Show on my dashboard</span>${tgl(x.dash!==false,'psDash','Show on dashboard')}</div>`;
 const L=x.target==='page'?S.products.filter(p=>p.status!=='archived').map(p=>[p.id,p.name,p.page.plugins.includes(x.id)]):S.hubs.filter(h=>h.joined&&canHub(h,'manage')).map(h=>[h.id,h.name,h.plugins.includes(x.id)]);
 return L.map(([id,n,on])=>`<label class="row" style="padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer"><input type="checkbox" ${on?'checked':''} data-inst="${id}" style="accent-color:var(--mint)"><span class="grow sm">${esc(n)}</span></label>`).join('')||'<p class="muted sm">Nothing to install on yet.</p>'}
function psDash(on){const x=S.bp.plugins.find(p=>p.id===route.a[1]);x.dash=on;save();toast(on?'Widget on the dashboard':'Widget hidden','dash')}
function studioAfter(id){const x=S.bp.plugins.find(p=>p.id===id);if(!x)return;const F=$('#psF');
 const refresh=(form)=>{x.updated=Date.now();saveSoon();$('#psN').innerHTML=schematic(x);$('#psP').innerHTML=pluginPreview(x);startCountdowns();if(PS.tab==='manifest'&&form!=='json'&&$('#psJ')){const j=manifest(x);$('#psJ').value=j;$('#psH').innerHTML=hiJSON(j)+'\n';$('#psL').textContent=j.split('\n').map((_,i)=>i+1).join('\n')}else if(PS.tab==='code'){$('#psT').innerHTML=studioTab(x)}if(form==='full'||form==='json'){F.innerHTML=studioForm(x)}};
 F.oninput=e=>{const t=e.target;if(t.dataset.pf){x[t.dataset.pf]=t.value;if(t.dataset.pf==='trigger')refresh();else refresh()}else if(t.dataset.ai!=null){const a=x.actions[+t.dataset.ai];a[t.dataset.ak]=t.type==='number'?+t.value:t.value;refresh()}};F.onchange=F.oninput;
 F.onclick=e=>{const tg=e.target.closest('[data-tgt]'),rm=e.target.closest('[data-rma]');if(tg&&tg.dataset.tgt!==x.target){x.target=tg.dataset.tgt;x.trigger=TRIGGERS[x.target][0][0];x.actions=x.actions.filter(a=>ACTIONS[a.type].t===x.target);refresh('full');$('#psI').innerHTML=installList(x)}if(rm){x.actions.splice(+rm.dataset.rma,1);refresh('full')}};
 F.addEventListener('change',e=>{if(e.target.id==='psAdd'&&e.target.value){const k=e.target.value,A=ACTIONS[k],a={type:k};A.f.forEach(([f,,def,opt])=>a[f]=opt==='num'?+def:def);x.actions.push(a);refresh('full')}});
 $$('[data-pst]').forEach(b=>b.onclick=()=>{PS.tab=b.dataset.pst;$$('[data-pst]').forEach(y=>y.classList.toggle('on',y===b));$('#psT').innerHTML=studioTab(x);bindJSON()});
 const bindJSON=()=>{const J=$('#psJ');if(!J)return;const H=$('#psH'),Ln=$('#psL'),E=$('#psErr');J.onscroll=()=>{H.scrollTop=J.scrollTop;H.scrollLeft=J.scrollLeft;Ln.scrollTop=J.scrollTop};
  J.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const s=J.selectionStart;J.value=J.value.slice(0,s)+'  '+J.value.slice(J.selectionEnd);J.selectionStart=J.selectionEnd=s+2;J.oninput()}};
  J.oninput=()=>{H.innerHTML=hiJSON(J.value)+'\n';Ln.textContent=J.value.split('\n').map((_,i)=>i+1).join('\n');let o,errs;try{o=JSON.parse(J.value);errs=validate(o)}catch(err){errs=[err.message.replace(/^JSON\.parse: /,'')]}
   if(errs.length){E.style.color='#FF8A93';E.textContent='✕ '+errs[0];return}E.style.color='#7DF0B8';E.textContent='✓ valid';Object.assign(x,{name:o.name,version:o.version||x.version,desc:o.description||'',target:o.target,trigger:o.trigger,actions:o.actions});refresh('json')}};bindJSON();
 $('#psI').onchange=e=>{const t=e.target;if(!t.dataset.inst)return;const id2=t.dataset.inst;if(x.target==='page'){const p=prod(id2);p.page.plugins=t.checked?[...new Set([...p.page.plugins,x.id])]:p.page.plugins.filter(i=>i!==x.id);x.installs=S.products.filter(q=>q.page.plugins.includes(x.id)).length}else{const h=hub(id2);h.plugins=t.checked?[...new Set([...h.plugins,x.id])]:h.plugins.filter(i=>i!==x.id);x.hubInstalls=S.hubs.filter(q=>q.plugins.includes(x.id)).length}
  bpLog(x,`${t.checked?'Installed on':'Removed from'} ${x.target==='page'?prod(id2).name:hub(id2).name}`);save();$('#psN').innerHTML=schematic(x);toast(t.checked?'Installed':'Removed','plug')};startCountdowns()}
function testPlugin(id){const x=S.bp.plugins.find(p=>p.id===id),errs=validate({...JSON.parse(manifest(x))});PS.tab='console';
 if(errs.length)bpLog(x,'Test failed: '+errs[0],'err');else{bpLog(x,`Test: trigger "${x.trigger}" fired`);x.actions.forEach((a,i)=>bpLog(x,`Test: action ${i+1} ${a.type} ran in ${2+Math.floor(Math.random()*9)} ms`));if(!x.actions.length)bpLog(x,'Test: no actions to run','err')}
 save();rerender();toast(errs.length?'Test failed':'Test passed',errs.length?'x':'check')}
function bump(v){const p=String(v||'0.1.0').split('.').map(Number);p[1]++;p[2]=0;if(p[0]===0&&p[1]>=1){p[0]=1;p[1]=0}return p.join('.')}
function publishPlugin(id){const x=S.bp.plugins.find(p=>p.id===id),errs=validate(JSON.parse(manifest(x)));if(errs.length){toast(errs[0],'x');return}if(!x.actions.length){toast('Add at least one action','info');return}
 const first=x.status!=='published';x.status='published';x.version=first&&x.version.startsWith('0.')?'1.0.0':bump(x.version);x.published=x.published||Date.now();x.updated=Date.now();if(first){earn('plugin');act('plugin',`Published the ${x.name} plugin`,'bp/plugin/'+id)}bpLog(x,`Published v${x.version}`);
 if(x.target==='app'&&x.dash===undefined)x.dash=true;save();toast(first?`${x.name} published · +80 credits`:`v${x.version} published`,'rocket');rerender()}
async function delPlugin(id){const x=S.bp.plugins.find(p=>p.id===id);if(!await confirmBox(`Delete ${x.name}?`,'It is removed from every storefront and hub it runs on.',{ok:'Delete',danger:true}))return;S.bp.plugins=S.bp.plugins.filter(p=>p.id!==id);S.products.forEach(p=>p.page.plugins=p.page.plugins.filter(i=>i!==id));S.hubs.forEach(h=>h.plugins=h.plugins.filter(i=>i!==id));save();toast('Deleted','trash');go('bp/plugins')}

function lum(h){const c=h.replace('#','').match(/.{2}/g).map(x=>{const v=parseInt(x,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){try{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}catch(e){return 1}}

 ${row('Email','Receipts and sign-in',`<input class="inp" style="max-width:340px" type="email" value="${esc(S.me.email)}" onchange="if(/^\\S+@\\S+\\.\\S+$/.test(this.value)){S.me.email=this.value;save();toast('Saved')}else{this.classList.add('err');toast('Check the email','info')}">`)}
 ${row('Handle','Your storefront address',`<div class="inp-pre" style="max-width:340px"><span>mintora.shop/</span><input value="${esc(S.me.handle)}" onchange="S.me.handle=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')||S.me.handle;save();toast('Saved')"></div>`)}</div>
 <div class="card pad mt"><h2>Workspace</h2>${row('Name','',`<input class="inp" style="max-width:340px" value="${esc(S.workspace.name)}" onchange="S.workspace.name=this.value.trim()||S.workspace.name;S.workspace.initials=initials(S.workspace.name);save();rerender()">`)}
 ${row('Colour','Used for your workspace badge and brand kit',`<div class="swatches">${AVC.slice(0,8).map(c=>`<button class="sw ${S.workspace.color===c?'on':''}" style="background:${c}" onclick="S.workspace.color='${c}';save();rerender()" aria-label="${c}"></button>`).join('')}</div>`)}
 ${row('Currency','For prices and reports',seg('stCur',[['USD','USD $'],['EUR','EUR €'],['GBP','GBP £']],S.settings.currency,'setCur'))}
 ${row('Custom domain','',S.settings.domain?`<span class="badge live">${ic('globe','s')} ${esc(S.settings.domain)}</span>`:`<button class="btn sm" onclick="domainForm()">${ic('globe','s')} Connect · 500 credits</button>`)}</div>`}
function setCur(v){S.settings.currency=v;save();toast('Currency: '+v,'coins');rerender()}
function setLook(){return`<div class="card pad"><h2>Appearance</h2>${row('Theme','Follow the system or pick one',seg('stTh',[['light',ic('sun','s')+' Light'],['dark',ic('moon','s')+' Dark'],['system','System']],S.settings.theme,'setTheme'))}
 ${row('Live sales','Show new sales as they arrive',tgl(!window._noSim&&S.settings.notif!==false,'setLive','Live sales'))}
 ${row('Keyboard','Everything is reachable from the keyboard',`<button class="btn sm" onclick="shortcuts()">${ic('cmd','s')} Show shortcuts</button>`)}</div>`}
function setTheme(v){S.settings.theme=v;applyTheme();save();bar()}
function setLive(on){S.settings.notif=on;window._noSim=!on;save()}
function setDev(){const K=S.api.keys,H=S.api.hooks,D=S.api.deliveries;return`<div class="card pad"><div class="row"><h2>API keys</h2><button class="btn sm pri" style="margin-left:auto" onclick="newKey()">${ic('plus','s')} New key</button></div><p class="muted sm">For your own apps and scripts. A key is shown once.</p>
 <div class="card" style="box-shadow:none;margin-top:10px"><div class="lst">${K.map(k=>`<div class="li">${ic('key','s')}<div class="grow"><b>${esc(k.name)}</b><div class="sub mono">${k.prefix}••••••••${k.tail} · created ${fdate(k.at)}${k.last?' · used '+ago(k.last):''}</div></div><button class="btn sm ghost danger" onclick="revokeKey('${k.id}')">Revoke</button></div>`).join('')||'<div class="li muted sm">No keys</div>'}</div></div></div>
 <div class="card pad mt"><div class="row"><h2>Webhooks</h2><button class="btn sm pri" style="margin-left:auto" onclick="newHook()">${ic('plus','s')} Endpoint</button></div><p class="muted sm">Mintora calls your URL when something happens.</p>
 <div class="card" style="box-shadow:none;margin-top:10px"><div class="lst">${H.map(h=>`<div class="li">${ic('webhook','s')}<div class="grow"><b class="mono" style="font-weight:500">${esc(h.url)}</b><div class="sub">${h.events.map(e=>`<code>${e}</code>`).join(' ')}</div></div>${tgl(h.on,`hookOn_${h.id.replace(/\W/g,'')}`,'Endpoint on')}<button class="btn sm" onclick="testHook('${h.id}')">Send test</button><button class="ibtn" onclick="delHook('${h.id}')" aria-label="Delete">${ic('trash','s')}</button></div>`).join('')||'<div class="li muted sm">No endpoints</div>'}</div></div>
 ${D.length?`<div class="lbl" style="margin:16px 0 8px">Recent deliveries</div><div class="console" style="background:var(--sunken);color:var(--ink2);border-color:var(--line)">${D.slice(0,8).map(d=>`<div><span class="faint">${ftime(d.at)}</span> <b style="color:${d.ok?'var(--mint-ink)':'var(--red)'}">${d.code}</b> ${esc(d.event)} → ${esc(d.url)} <span class="faint">${d.ms} ms</span></div>`).join('')}</div>`:''}</div>
 <div class="card pad mt" style="display:flex;align-items:center;gap:14px">${ic('code','l')}<div class="grow"><b>Blueprint reference</b><div class="muted sm">Plugin manifests, events, REST endpoints and webhook signatures.</div></div><a class="btn" href="#/bp/docs">Open</a></div>`}
function newKey(){modal('New API key',`<div class="field"><label>Name</label><input class="inp" id="nkN" placeholder="Zapier, my CLI…"></div>`,{foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="nkGo">Create</button>`});
 $('#nkGo').onclick=()=>{const n=$('#nkN').value.trim()||'Untitled key',raw='mk_live_'+Array.from({length:28},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');S.api.keys.push({id:uid('k'),name:n,prefix:'mk_live_',tail:raw.slice(-4),at:Date.now()});save();closeOv();
  modal('Copy your key',`<p class="muted" style="margin-top:0">This is the only time it is shown. Store it somewhere safe.</p><div class="inp-pre"><span>${ic('key','s')}</span><input class="mono" readonly value="${raw}" onclick="this.select()"></div>`,{foot:`<button class="btn pri" onclick="copyText('${raw}');closeOv()">${ic('copy','s')} Copy and close</button>`,onClose:()=>rerender()})}}
async function revokeKey(id){if(!await confirmBox('Revoke this key?','Apps using it stop working right away.',{ok:'Revoke',danger:true}))return;S.api.keys=S.api.keys.filter(k=>k.id!==id);save();rerender()}
function newHook(){const EV=['order.created','refund.created','product.published','hub.member_joined'];modal('New endpoint',`<div class="field"><label>URL</label><input class="inp mono" id="nhU" placeholder="https://example.com/hooks/mintora"></div><div class="field"><label>Events</label><div class="col" style="gap:6px">${EV.map((e,i)=>`<label class="row sm"><input type="checkbox" value="${e}" ${i<2?'checked':''} style="accent-color:var(--mint)"><code>${e}</code></label>`).join('')}</div></div>`,{foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="nhGo">Add endpoint</button>`});
 $('#nhGo').onclick=()=>{const u=$('#nhU').value.trim();if(!/^https:\/\/[^\s/]+\.[^\s]+/.test(u)){$('#nhU').classList.add('err');toast('Use an https URL','info');return}const ev=$$('#ov input[type=checkbox]:checked').map(x=>x.value);if(!ev.length){toast('Pick at least one event','info');return}S.api.hooks.push({id:uid('w'),url:u,events:ev,on:true,at:Date.now()});save();closeOv();rerender()}}
function testHook(id){const h=S.api.hooks.find(x=>x.id===id),ok=h.on;S.api.deliveries.unshift({at:Date.now(),url:h.url,event:h.events[0],code:ok?200:'off',ok,ms:ok?40+Math.floor(Math.random()*160):0});if(S.api.deliveries.length>50)S.api.deliveries.length=50;save();toast(ok?'Test delivered: 200':'Endpoint is off',ok?'check':'x');rerender()}
function delHook(id){S.api.hooks=S.api.hooks.filter(x=>x.id!==id);save();rerender()}
function setData(){const kb=Math.round((LS.get(KEY)||'').length/1024);return`<div class="card pad"><h2>Your data</h2>${row('Stored on this device',`${kb} KB in this browser`,`<div class="row"><button class="btn" onclick="exportData()">${ic('download','s')} Export JSON</button><label class="btn">${ic('upload','s')} Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div>`)}
 ${row('Orders','Every order as a spreadsheet',`<button class="btn" onclick="exportCSV()">${ic('download','s')} Export CSV</button>`)}
 ${row('Start over','Replaces everything with a fresh demo workspace',`<button class="btn danger" onclick="resetAll()">${ic('refresh','s')} Reset workspace</button>`)}</div>`}
function exportData(){download(`mintora-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S),'application/json');toast('Workspace exported','download')}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.products)||!o.credits)throw new Error('Not a Mintora export');LS.set(BACKUP,JSON.stringify(S));S=migrate(o);save();toast('Workspace imported','upload');go('dash')}catch(e){toast('That file is not a Mintora export','x')}};r.readAsText(f)}
async function resetAll(){if(!await confirmBox('Reset the workspace?','Everything is replaced with a fresh demo. A backup of the current data is kept on this device.',{ok:'Reset',danger:true}))return;LS.set(BACKUP,JSON.stringify(S));S=seed();save();toast('Fresh workspace','refresh');go('dash')}

/* ---- boot.js ---- */
/* Boot: load, catch up on the days you were away, welcome first-time makers, start the live feed */
function welcome(){const w=document.createElement('div');w.className='welcome';w.id='welcome';
 w.innerHTML=`<div style="width:min(980px,calc(100vw - 48px));display:grid;grid-template-columns:1.05fr .95fr;gap:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:var(--sh-3)">
 <div style="padding:44px 44px 36px;display:flex;flex-direction:column"><div class="row" style="gap:12px">${mark()}<b style="font:600 22px var(--f-display);letter-spacing:-.035em">mintora</b></div>
  <h1 style="font-size:38px;margin:34px 0 10px;letter-spacing:-.04em">Make it. Sell it.<br>Grow it together.</h1><p class="muted" style="margin:0 0 26px;font-size:15px">Mintora is the workshop for digital products: storefronts, sales, analytics, your team and your community in one place. Blueprint lets you build the parts that are only yours.</p>
  <div class="field"><label for="wN">Your name</label><input class="inp" id="wN" value="${esc(S.me.name)}"></div><div class="field"><label for="wW">Studio or brand</label><input class="inp" id="wW" value="${esc(S.workspace.name)}"></div>
  <button class="btn pri lg" id="wGo" style="margin-top:6px">Open my workspace ${ic('arrow','s')}</button><p class="xs faint" style="margin:14px 0 0">The workspace starts with demo products and six months of sample sales so every screen has something to show. Reset it any time in Settings.</p></div>
 <div style="background:#0C2A66;position:relative;overflow:hidden;padding:40px;display:flex;flex-direction:column;justify-content:flex-end;color:#EAF1FF"><div style="position:absolute;inset:0;background-image:linear-gradient(rgba(170,205,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(170,205,255,.08) 1px,transparent 1px),linear-gradient(rgba(170,205,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(170,205,255,.15) 1px,transparent 1px);background-size:14px 14px,14px 14px,70px 70px,70px 70px"></div>
  <div style="position:absolute;right:30px;top:30px;width:230px;height:230px">${bpSchematicMark()}</div>
  <div style="position:relative">${[['dash','Performance score','One number for the health of your shop'],['page','Storefronts','A page for every product, designed by you'],['hub','Hubs','Communities with roles, admins and projects'],['plug','Blueprint','Plugins and designs, from scratch']].map(([i,t,d])=>`<div class="row" style="padding:10px 0;border-top:1px dashed rgba(160,195,255,.25)"><span style="color:#7FE3FF">${ic(i)}</span><div><b style="font:500 14px var(--f-mono)">${t}</b><div style="color:#A8BFE8;font-size:12.5px">${d}</div></div></div>`).join('')}</div></div></div>`;
 document.body.appendChild(w);$('#wN').focus();
 $('#wGo').onclick=()=>{const n=$('#wN').value.trim(),ws=$('#wW').value.trim();if(n)S.me.name=n;if(ws){S.workspace.name=ws;S.workspace.initials=initials(ws)}S.settings.onboarded=true;save();w.style.transition='opacity .4s';w.style.opacity='0';setTimeout(()=>w.remove(),400);render();toast('Welcome to Mintora','spark')}}
function boot(){load();applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='system'){applyTheme();bar()}})}catch(e){}
 catchUpDays();window._noSim=S.settings.notif===false;route=parse(location.hash);render();save();
 setTimeout(()=>{const s=$('#splash');s&&s.classList.add('out');setTimeout(()=>s&&s.remove(),600)},1150);
 if(!S.settings.onboarded)setTimeout(welcome,900);liveSales();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){catchUpDays();save()}});window.addEventListener('beforeunload',save)}
window.addEventListener('error',e=>{console.error(e.error||e.message)});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();

</script>
</body>
</html>
