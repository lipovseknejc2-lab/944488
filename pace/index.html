<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PACE">
<meta name="theme-color" content="#F6F4F9">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="PACE: your money, your progress. A gamified digital banking demo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>PACE</title>
<style>/* PACE design system. Layout idea: one calm column on phones, a rail plus two columns on wide screens.
   Violet is the single accent; neutrals lean violet; one radius family (14 / 22 / 28). */
:root{
  --bg:#F6F4F9; --surface:#FFFFFF; --surface2:#EFECF5; --ink:#17141F; --ink2:#5E5873; --ink3:#8A849F; --line:#E4DFEE;
  --accent:#6C3CF0; --accent-ink:#FFFFFF; --deep:#2A1170; --accent-soft:#EDE7FF; --lav:#D9C9FF; --warm:#FBFAF7;
  --good:#17895D; --good-soft:#DDF4EA; --bad:#CF3F58; --bad-soft:#FCE4E8; --warn:#A8700B; --warn-soft:#FBEFD2;
  --chart1:#4B22C8; --chart2:#B7A3FF; --shadow:0 1px 2px rgba(23,20,31,.05),0 8px 24px rgba(42,17,112,.07);
  --display:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F0C17; --surface:#191525; --surface2:#231E34; --ink:#F5F2FB; --ink2:#B6AFCC; --ink3:#7F7898; --line:#2E2844;
  --accent:#8C68FF; --accent-ink:#120A2B; --deep:#2A1170; --accent-soft:#2A2152; --lav:#4B3A8C; --warm:#1F1A2E;
  --good:#4FD3A0; --good-soft:#12362B; --bad:#FF8296; --bad-soft:#3E1824; --warn:#E8B04A; --warn-soft:#3A2D10;
  --chart1:#9F82FF; --chart2:#4A3C86; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display);letter-spacing:-.02em}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;max-width:560px;margin:0 auto;position:relative}
#view{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 16px 28px;scroll-behavior:smooth}
.screen{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.noanim .screen,.noanim *{animation-duration:.001s!important;transition-duration:.001s!important}
/* nav */
#nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab));gap:2px;position:relative;z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;color:var(--ink3);font-size:11px;font-weight:600;transition:color .2s,background .2s}
#nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#nav .brand{display:none}
/* generic */
h1{font:700 26px/1.15 var(--display);letter-spacing:-.025em}
h2{font:700 17px/1.2 var(--display);letter-spacing:-.015em}
h3{font:650 14px/1.2 var(--display)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .col{display:flex;flex-direction:column;gap:10px} .grow{flex:1;min-width:0}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:12px} .sec>.head{display:flex;align-items:baseline;justify-content:space-between}
.link{color:var(--accent);font-weight:650;font-size:13.5px;padding:4px 2px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.list{background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:15px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .15s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.45;pointer-events:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)} .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.block{width:100%} .btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pts{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 9px 2px 6px;border-radius:999px;font-size:13px}
.pts svg{width:14px;height:14px;fill:currentColor;stroke:none}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:3px}.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink2);transition:all .2s}.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative}
.badge{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);background:var(--accent);color:var(--accent-ink)}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .8s var(--ease)}
.bar.thick{height:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:9px;font:800 20px var(--display);letter-spacing:-.03em}.logo svg{width:34px;height:34px}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);padding:6px 4px 6px 0;margin-bottom:6px}
.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
/* account card */
.acct{position:relative;border-radius:28px;padding:20px 20px 16px;background:var(--deep);color:#fff;overflow:hidden;isolation:isolate;box-shadow:0 14px 30px rgba(42,17,112,.28)}
.acct::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0,#6C3CF0 0,rgba(108,60,240,0) 60%)}
.acct svg.bg{position:absolute;right:-26px;top:-24px;width:190px;height:190px;z-index:-1;opacity:.32}
.acct .lab{font-size:13px;opacity:.78;font-weight:600;display:flex;align-items:center;gap:7px}
.acct .big{font:800 38px/1.1 var(--display);letter-spacing:-.035em;margin:8px 0 2px}
.acct .id{font-size:12.5px;opacity:.7}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 0 9px;border-radius:16px;background:rgba(255,255,255,.14);font-size:12px;font-weight:700;color:#fff;transition:background .2s,transform .15s var(--spring)}
.qa button:active{transform:scale(.95);background:rgba(255,255,255,.24)}
/* savings card */
.sav{position:relative;border-radius:28px;padding:18px;background:var(--accent-soft);border:1px solid var(--line);overflow:visible;margin-top:60px;display:flex;flex-direction:column;gap:12px}
.sav .txt{width:60%;min-height:104px}
.sav .big{font:800 27px/1.1 var(--display);letter-spacing:-.03em;margin:6px 0 2px;color:var(--ink)}
.sav .mas{position:absolute;right:8px;top:-56px;width:40%;max-width:190px;cursor:pointer}
.sav .prog{display:flex;flex-direction:column;gap:10px}
.sav .stage{display:inline-flex;gap:6px;align-items:center}
.bubble{position:absolute;right:14px;top:-26px;background:var(--surface);color:var(--ink);padding:7px 11px;border-radius:14px 14px 4px 14px;font-size:12.5px;font-weight:650;box-shadow:var(--shadow);max-width:60%;animation:rise .3s var(--ease);z-index:2;border:1px solid var(--line)}
.mascot{display:block;width:100%;aspect-ratio:240/304;user-select:none;-webkit-user-select:none}.mascot svg{display:block;width:100%;height:100%;overflow:visible}
/* tiles & rows */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);transition:transform .15s var(--spring)}
.tile:active{transform:scale(.95)} .tile .ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);position:relative}
.tile .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px}
.tx{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.tx .ib{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tx .ib.in{background:var(--good-soft);color:var(--good)} .tx .ib.bad{background:var(--bad-soft);color:var(--bad)}
.tx .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tx .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:700 15.5px var(--display);text-align:right;white-space:nowrap}.amt.in{color:var(--good)}.amt.dec{color:var(--ink3);text-decoration:line-through}
.day{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}
.setrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.setrow .ib{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--spring)}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(20px)}
/* payment cards */
.cards-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 14px;margin:0 -16px;scrollbar-width:none}.cards-scroll::-webkit-scrollbar{display:none}
.pcard{flex:none;width:min(84%,340px);aspect-ratio:1.586;border-radius:20px;padding:18px;position:relative;scroll-snap-align:center;overflow:hidden;isolation:isolate;color:#fff;box-shadow:0 12px 26px rgba(23,20,31,.25);transition:transform .3s var(--ease),filter .3s;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.pcard.sel{transform:translateY(-3px)} .pcard.frozen{filter:saturate(.25) brightness(.9)}
.pcard .pn{font:600 16.5px var(--display);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.pcard .meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;opacity:.88}
.pcard .meta b{display:block;font:700 13px var(--display);letter-spacing:.03em;opacity:1}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.pcard .chip-ic{width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#f3dc9d,#c9a24b);margin-top:8px;opacity:.9}
.pcard .stamp{position:absolute;inset:0;display:grid;place-items:center;font:800 14px var(--display);letter-spacing:.2em;background:rgba(20,16,32,.45);z-index:2}
.cd-violet{background:linear-gradient(145deg,#4B22C8,#2A1170)} .cd-white{background:#F7F5FB;color:#1c1830;border:1px solid #E1DCEC} .cd-black{background:#15121C}
.cd-lavender{background:linear-gradient(150deg,#C9B6FF,#8E6BFF);color:#1c1042} .cd-metal{background:linear-gradient(135deg,#454059 0,#2A2638 45%,#5B556F 100%)}
.pcard::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid currentColor;opacity:.07;z-index:-1}
.pcard::after{content:"";position:absolute;left:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;border:18px solid currentColor;opacity:.06;z-index:-1}
.cd-metal::before{opacity:.12}
.rcard{border-radius:24px;padding:20px;position:relative;overflow:hidden;color:#fff;isolation:isolate;box-shadow:0 14px 30px rgba(23,20,31,.25);min-height:216px;display:flex;flex-direction:column;justify-content:space-between;transition:background .6s}
.rcard .lv{font:800 12px var(--display);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.rcard .pb{font:800 40px/1 var(--display);letter-spacing:-.03em}
.rc-member{background:linear-gradient(150deg,#5C45B5,#3A2A86)}.rc-silver{background:linear-gradient(150deg,#8E8AA6,#4F4B66)}.rc-gold{background:linear-gradient(150deg,#C79A2C,#6C4E10)}
.rc-platinum{background:linear-gradient(150deg,#69798F,#2C3547)}.rc-elite{background:linear-gradient(150deg,#17102C,#3A1C9E 60%,#6C3CF0)}
.rcard svg.deco{position:absolute;right:-30px;bottom:-30px;width:220px;height:220px;opacity:.18;z-index:-1}
.rcard .rings{position:absolute;inset:0;z-index:-1;opacity:.14}
.lvl-dots{display:flex;gap:6px}.lvl-dots i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.28)}.lvl-dots i.on{background:#fff}
/* rewards */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rw{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .2s var(--spring)}.rw:active{transform:scale(.98)}
.rw .art{aspect-ratio:16/10;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}.rw .art svg{width:44px;height:44px}
.rw .bd{padding:11px 12px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.rw.lock{opacity:.6}
.ladder{display:flex;flex-direction:column}
.ms{display:flex;gap:12px;align-items:center;padding:9px 0}.ms .dotm{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink3);flex:none}.ms.on .dotm{background:var(--accent);color:var(--accent-ink)}
/* charts */
.chart{position:relative}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:600 10.5px var(--body);fill:var(--ink3)} .chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:650;padding:6px 9px;border-radius:9px;transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:600}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cat{display:grid;grid-template-columns:124px 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:13px}.cat .bar{height:10px}
/* overlays */
#scrim{position:fixed;inset:0;background:rgba(15,12,23,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;max-height:92%;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;transition:transform .38s var(--ease);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 4px;flex:none}
#sheet .body{overflow-y:auto;padding:8px 18px calc(22px + var(--sab));-webkit-overflow-scrolling:touch}
#flow{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:560px;margin:0 auto;animation:rise .3s var(--ease)}
#flow.on{display:flex}
#flow .fh{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 12px) 16px 8px}
#flow .fb{flex:1;overflow-y:auto;padding:8px 18px 18px}
#flow .ff{padding:10px 18px calc(16px + var(--sab))}
.steps{display:flex;gap:5px;padding:0 18px 6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--surface2)}.steps i.on{background:var(--accent)}
.opt{display:flex;align-items:center;gap:13px;padding:13px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);width:100%;text-align:left;transition:border-color .2s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ib{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.keys button{height:54px;border-radius:16px;font:700 22px var(--display);background:var(--surface);border:1px solid var(--line);transition:transform .12s}.keys button:active{transform:scale(.94);background:var(--accent-soft)}
.amount{font:800 52px/1 var(--display);letter-spacing:-.04em;text-align:center;padding:16px 0 6px;min-height:84px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.input{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%;font-size:16px}.input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-weight:650;font-size:13px;padding:8px 12px;background:var(--bad-soft);border-radius:12px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0}.kv span:first-child{color:var(--ink2)}.kv span:last-child{font-weight:650;text-align:right}
.ok-ring{width:104px;height:104px;margin:0 auto}
.ok-ring circle{fill:none;stroke:var(--good);stroke-width:6;stroke-dasharray:302;stroke-dashoffset:302;animation:dash .7s .1s var(--ease) forwards;transform:rotate(-90deg);transform-origin:center}
.ok-ring path{fill:none;stroke:var(--good);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dash .45s .65s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:calc(var(--sat) + 10px);left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:16px;font-weight:650;font-size:13.5px;max-width:min(92%,420px);box-shadow:0 10px 28px rgba(0,0,0,.28);animation:toastin .4s var(--spring) both}
.toast.out{animation:toastout .3s forwards}@keyframes toastin{from{opacity:0;transform:translateY(-16px) scale(.96)}}@keyframes toastout{to{opacity:0;transform:translateY(-10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
#cele{position:fixed;inset:0;z-index:80;background:rgba(15,12,23,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:24px;text-align:center;color:#fff}
#cele.on{display:flex;animation:rise .3s var(--ease)}#cele .mascot{width:min(62vw,250px)}
#splash{position:fixed;inset:0;z-index:100;background:var(--deep);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;transition:opacity .45s .1s,visibility .45s .1s}
#splash.off{opacity:0;visibility:hidden}#splash .mascot{width:120px}#splash .wm{font:800 30px var(--display);letter-spacing:.22em;margin-left:.22em}#splash .tg{font-size:11.5px;letter-spacing:.2em;opacity:.7;font-weight:700}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}.empty .mascot{width:120px}
.skel{background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}@keyframes sh{to{background-position:-200% 0}}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.help-i{display:flex;flex-direction:column;gap:4px;padding:14px}
.hero-pts{display:flex;align-items:flex-end;justify-content:space-between}
.stage-row{display:flex;gap:6px}.stage-row>div{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);position:relative}.stage-row .mascot{width:100%;filter:grayscale(1) opacity(.45)}.stage-row .on .mascot{filter:none}.stage-row .cur{color:var(--accent)}
/* wide layout */
@media (min-width:980px){
  #app{max-width:1180px;grid-template-columns:230px 1fr;grid-template-rows:1fr}
  #nav{grid-column:1;grid-row:1;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:24px 14px;gap:6px}
  #nav button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:14.5px}
  #nav .brand{display:flex;align-items:center;gap:10px;font:800 22px var(--display);padding:4px 10px 22px;letter-spacing:-.03em}#nav .brand svg{width:36px;height:36px}
  #view{grid-column:2;grid-row:1;padding:28px 36px 40px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:start}.home-grid .full{grid-column:1/-1}
  .shop{grid-template-columns:repeat(3,1fr)} .logo-h{display:none}
  #sheet{max-width:520px;border-radius:28px;bottom:auto;top:50%;transform:translate(-50%,-40%) scale(.97);opacity:0;pointer-events:none;max-height:86%}
  #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #flow{max-width:520px;inset:4vh auto;left:50%;margin:0;transform:translateX(-50%);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
}
@media (max-width:360px){.tiles{grid-template-columns:repeat(5,1fr);gap:5px}.tile{font-size:10.5px}.acct .big{font-size:32px}}
@media (prefers-reduced-motion:reduce){.screen,.toast,#cele.on,#flow{animation:none}}

.ov{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-bottom:18px}.ov>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 11px;min-width:0}.ov small{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.02em}.ov b{display:block;font:750 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}.ov b.pt{color:var(--accent)}
.setrow[data-act]{cursor:pointer}
</style>
</head>
<body>
<div id="app"><main id="view" tabindex="-1"></main><nav id="nav" aria-label="Main"></nav></div>
<div id="scrim"></div><div id="sheet" role="dialog" aria-modal="true"></div><div id="flow" role="dialog" aria-modal="true" aria-label="Payment"></div>
<div id="cele" role="dialog" aria-live="polite"></div><div id="toasts" aria-live="polite"></div><canvas id="fx"></canvas>
<div id="splash"><div class="mascot" data-st="3" data-anim="greeting"></div><div class="wm">PACE</div><div class="tg">YOUR MONEY. YOUR PROGRESS.</div></div>
<script>/* PACE mascot "Pip": drawn frame by frame.
   Every frame is its own SVG drawing built from a pose table: body geometry (width, height) is redrawn,
   limbs are redrawn at new angles, eyes and mouths are swapped for separately drawn shapes.
   Nothing is bitmap-scaled and the outline width, eye size and purple details stay constant. */
const Mascot = (() => {
  const INK = '#251656', BODY = '#F4F1FA', BELLY = '#FFFFFF', PURPLE = '#6C3CF0', LAV = '#D9C9FF', DEEP = '#3A1C9E',
        EYE = '#241A3B', GOLD = '#E8B94A';
  const CX = 120, GROUND = 238, OUT = 3;
  const STAGES = [
    { n: 'Beginner', w: 118, h: 104, L: 4, arm: 17, r: 0 },
    { n: 'Growing', w: 114, h: 116, L: 10, arm: 23, r: 0 },
    { n: 'Active', w: 110, h: 128, L: 18, arm: 29, r: 0 },
    { n: 'Advanced', w: 112, h: 134, L: 24, arm: 35, r: 0 },
    { n: 'Elite', w: 112, h: 140, L: 28, arm: 40, r: 0 }
  ];
  const D = { dy: 0, sx: 0, sy: 0, lean: 0, lg: 1, fl: [0, 0], fr: [0, 0], sp: 0, aL: 10, aR: 10, bL: 0, bR: 0,
    eyes: 'open', mouth: 'smile', gx: 0, gy: 0, bwL: null, bwR: null, buL: 0, buR: 0, cr: 0, fx: [], st: 0, sil: 0, tilt: 0, hold: null };

  const f1 = n => Math.round(n * 10) / 10;
  const P = (d, o = '') => `<path d="${d}" ${o}/>`;
  const rot = (a, x, y, inner) => a ? `<g transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})">${inner}</g>` : inner;

  function bodyPath(cx, top, bb, w) {
    const h = bb - top, hw = w / 2;
    return `M${cx} ${f1(top)}C${f1(cx + w * .43)} ${f1(top)} ${f1(cx + hw)} ${f1(top + h * .26)} ${f1(cx + hw)} ${f1(top + h * .58)}` +
      `C${f1(cx + hw)} ${f1(top + h * .9)} ${f1(cx + w * .31)} ${f1(bb)} ${cx} ${f1(bb)}` +
      `C${f1(cx - w * .31)} ${f1(bb)} ${f1(cx - hw)} ${f1(top + h * .9)} ${f1(cx - hw)} ${f1(top + h * .58)}` +
      `C${f1(cx - hw)} ${f1(top + h * .26)} ${f1(cx - w * .43)} ${f1(top)} ${cx} ${f1(top)}Z`;
  }
  const leaf = (len, wid) => `M0 0C${wid} ${-len * .3} ${wid * .7} ${-len * .82} 0 ${-len}C${-wid * .7} ${-len * .82} ${-wid} ${-len * .3} 0 0Z`;

  /* ---------- parts ---------- */
  function crest(stage, x, y, sway, w) {
    const st = `fill="${PURPLE}" stroke="${INK}" stroke-width="${OUT}" stroke-linejoin="round"`;
    const t = (a, len, wid, ox = 0) => `<g transform="translate(${ox} 0) rotate(${a})"><path d="${leaf(len, wid)}" ${st}/></g>`;
    let g = '';
    if (stage === 1) g = t(0, 24, 9);
    else if (stage === 2) g = t(-14, 21, 8, -6) + t(8, 28, 10, 3);
    else if (stage === 3) g = t(-28, 22, 8, -9) + t(26, 22, 8, 9) + t(0, 33, 11);
    else if (stage === 4) g = t(-40, 24, 8, -12) + t(-18, 32, 9, -5) + t(18, 32, 9, 5) + t(40, 24, 8, 12) + t(0, 40, 12);
    else g = t(-54, 22, 7, -16) + t(-32, 31, 8, -9) + t(-11, 40, 9, -3) + t(11, 40, 9, 3) + t(32, 31, 8, 9) + t(54, 22, 7, 16) + t(0, 48, 12);
    const hl = stage >= 3 ? `<path d="M${-3} ${-8}Q${-5} ${-20} ${-1} ${-30}" stroke="${LAV}" stroke-width="3" stroke-linecap="round" fill="none"/>` : '';
    return `<g transform="translate(${f1(x)} ${f1(y + 3)})">${rot(sway, 0, 0, g + hl)}</g>`;
  }
  function eye(kind, x, y, gx, gy, side) {
    const sw = `stroke="${EYE}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
    const shine = (px, py, s = 1) => `<circle cx="${f1(px - 3 * s)}" cy="${f1(py - 4 * s)}" r="${3.2 * s}" fill="#fff"/><circle cx="${f1(px + 3)}" cy="${f1(py + 4)}" r="1.6" fill="#fff"/>`;
    const px = x + gx, py = y + gy;
    switch (kind) {
      case 'open': return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="8" ry="10.5" fill="${EYE}"/>${shine(px + 0, py)}`.replace(`cx="${f1(x)}" cy="${f1(y)}"`, `cx="${f1(x + gx * .5)}" cy="${f1(y + gy * .5)}"`);
      case 'wide': return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="9.5" ry="12" fill="${EYE}"/>${shine(x, y, 1.15)}`;
      case 'sadeye': return `<ellipse cx="${f1(x)}" cy="${f1(y + 1)}" rx="8" ry="10.5" fill="${EYE}"/><circle cx="${f1(x - 2)}" cy="${f1(y - 3)}" r="4.4" fill="#fff"/><circle cx="${f1(x + 3)}" cy="${f1(y + 4)}" r="2" fill="#fff"/>`;
      case 'half': return `<path d="M${x - 8} ${y - 1}A8 9.5 0 0 0 ${x + 8} ${y - 1}Z" fill="${EYE}"/><path d="M${x - 8.5} ${y - 1}H${x + 8.5}" ${sw}/><circle cx="${f1(x - 2.5)}" cy="${f1(y + 3)}" r="2.2" fill="#fff"/>`;
      case 'blink': return `<path d="M${x - 8} ${y + 1}H${x + 8}" ${sw}/>`;
      case 'closed': return `<path d="M${x - 8} ${y - 1}Q${x} ${y + 7} ${x + 8} ${y - 1}" ${sw}/>`;
      case 'happy': return `<path d="M${x - 8} ${y + 4}Q${x} ${y - 9} ${x + 8} ${y + 4}" ${sw}/>`;
      case 'squint': { const d = side < 0 ? 1 : -1; return `<path d="M${x - 7 * d} ${y - 7}L${x + 6 * d} ${y}L${x - 7 * d} ${y + 7}" ${sw}/>`; }
      case 'star': return `<path d="M${x} ${y - 13}L${x + 3.6} ${y - 3.6}L${x + 13} ${y}L${x + 3.6} ${y + 3.6}L${x} ${y + 13}L${x - 3.6} ${y + 3.6}L${x - 13} ${y}L${x - 3.6} ${y - 3.6}Z" fill="${PURPLE}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`;
      case 'up': return `<ellipse cx="${f1(x + gx * .5)}" cy="${f1(y - 2)}" rx="8" ry="10.5" fill="${EYE}"/><circle cx="${f1(x + gx * .5 - 2)}" cy="${f1(y - 6)}" r="3.4" fill="#fff"/><circle cx="${f1(x + gx * .5 + 3)}" cy="${f1(y + 3)}" r="1.5" fill="#fff"/>`;
    }
    return '';
  }
  function brow(a, x, y, side) {
    if (a === null || a === undefined) return '';
    const ang = a * side * -1; // positive a = inner end up
    return `<g transform="rotate(${ang} ${x} ${y})"><path d="M${x - 7} ${y}H${x + 7}" stroke="${EYE}" stroke-width="3.4" stroke-linecap="round"/></g>`;
  }
  function mouth(kind, x, y) {
    const sw = `stroke="${EYE}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
    const tongue = (cx, cy, rx) => `<path d="M${cx - rx} ${cy}Q${cx} ${cy - rx * .9} ${cx + rx} ${cy}Q${cx} ${cy + rx * .55} ${cx - rx} ${cy}Z" fill="#F08AB2"/>`;
    switch (kind) {
      case 'smile': return `<path d="M${x - 8} ${y}Q${x} ${y + 8} ${x + 8} ${y}" ${sw}/>`;
      case 'tiny': return `<path d="M${x - 4.5} ${y + 1}Q${x} ${y + 5} ${x + 4.5} ${y + 1}" ${sw}/>`;
      case 'smirk': return `<path d="M${x - 7} ${y + 2}Q${x + 1} ${y + 7} ${x + 8} ${y - 2}" ${sw}/>`;
      case 'flat': return `<path d="M${x - 6} ${y + 2}H${x + 6}" ${sw}/>`;
      case 'sad': return `<path d="M${x - 7} ${y + 5}Q${x} ${y - 3} ${x + 7} ${y + 5}" ${sw}/>`;
      case 'wobble': return `<path d="M${x - 8} ${y + 3}Q${x - 4} ${y - 1} ${x} ${y + 3}Q${x + 4} ${y + 7} ${x + 8} ${y + 3}" ${sw}/>`;
      case 'o': return `<ellipse cx="${x}" cy="${y + 3}" rx="4.4" ry="5" fill="${EYE}"/>`;
      case 'grin': return `<path d="M${x - 11} ${y - 2}Q${x} ${y + 2} ${x + 11} ${y - 2}Q${x + 9} ${y + 13} ${x} ${y + 13}Q${x - 9} ${y + 13} ${x - 11} ${y - 2}Z" fill="${EYE}" stroke="${EYE}" stroke-width="2" stroke-linejoin="round"/><clipPath id="c${Math.round(x)}${Math.round(y)}g"><path d="M${x - 11} ${y - 2}Q${x} ${y + 2} ${x + 11} ${y - 2}Q${x + 9} ${y + 13} ${x} ${y + 13}Q${x - 9} ${y + 13} ${x - 11} ${y - 2}Z"/></clipPath><g clip-path="url(#c${Math.round(x)}${Math.round(y)}g)">${tongue(x, y + 12, 6)}</g>`;
      case 'cheer': return `<path d="M${x - 14} ${y - 3}Q${x} ${y + 2} ${x + 14} ${y - 3}Q${x + 12} ${y + 16} ${x} ${y + 16}Q${x - 12} ${y + 16} ${x - 14} ${y - 3}Z" fill="${EYE}" stroke="${EYE}" stroke-width="2" stroke-linejoin="round"/><clipPath id="c${Math.round(x)}${Math.round(y)}c"><path d="M${x - 14} ${y - 3}Q${x} ${y + 2} ${x + 14} ${y - 3}Q${x + 12} ${y + 16} ${x} ${y + 16}Q${x - 12} ${y + 16} ${x - 14} ${y - 3}Z"/></clipPath><g clip-path="url(#c${Math.round(x)}${Math.round(y)}c)">${tongue(x, y + 15, 8)}<path d="M${x - 11} ${y - 2}H${x + 11}" stroke="#fff" stroke-width="3"/></g>`;
      case 'pant': return `<path d="M${x - 8} ${y}Q${x} ${y + 3} ${x + 8} ${y}Q${x + 6} ${y + 9} ${x} ${y + 9}Q${x - 6} ${y + 9} ${x - 8} ${y}Z" fill="${EYE}" stroke="${EYE}" stroke-width="2" stroke-linejoin="round"/>`;
      case 'yawn': return `<ellipse cx="${x}" cy="${y + 6}" rx="7.5" ry="10" fill="${EYE}"/><ellipse cx="${x}" cy="${y + 11}" rx="4.6" ry="3.6" fill="#F08AB2"/>`;
      case 'sleep': return `<ellipse cx="${x}" cy="${y + 3}" rx="3.4" ry="2.6" fill="${EYE}"/>`;
      case 'sleepbig': return `<ellipse cx="${x}" cy="${y + 4}" rx="4.4" ry="4" fill="${EYE}"/>`;
    }
    return '';
  }
  function sparkle(x, y, s, col = PURPLE) {
    return `<path d="M${x} ${y - s}Q${x + s * .18} ${y - s * .18} ${x + s} ${y}Q${x + s * .18} ${y + s * .18} ${x} ${y + s}Q${x - s * .18} ${y + s * .18} ${x - s} ${y}Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${col}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  function limb(x1, y1, a, bend, len, side, stage, band) {
    const rad = d => d * Math.PI / 180;
    const l1 = len * .56, l2 = len * .5;
    const dirx = s => side * Math.sin(rad(s)), diry = s => Math.cos(rad(s));
    const ex = x1 + dirx(a) * l1, ey = y1 + diry(a) * l1;
    const a2 = a + bend * (side < 0 ? 1 : -1) * -1;
    const hx = ex + dirx(a2) * l2, hy = ey + diry(a2) * l2;
    const pts = `M${f1(x1)} ${f1(y1)}L${f1(ex)} ${f1(ey)}L${f1(hx)} ${f1(hy)}`;
    let g = `<path d="${pts}" stroke="${INK}" stroke-width="${12 + OUT * 2}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>` +
      `<path d="${pts}" stroke="${BODY}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    if (band) { const bx = hx - dirx(a2) * 6, by = hy - diry(a2) * 6; g += `<path d="M${f1(bx - dirx(a2) * 3)} ${f1(by - diry(a2) * 3)}L${f1(bx + dirx(a2) * 3)} ${f1(by + diry(a2) * 3)}" stroke="${PURPLE}" stroke-width="12.5" stroke-linecap="butt"/>`; }
    return { g, hx, hy, a2 };
  }
  function foot(x, y, stage, flip) {
    const sneaker = stage >= 2;
    const rx = stage === 1 ? 13 : 15, ry = stage === 1 ? 7 : 8;
    let g = `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${rx}" ry="${ry}" fill="${PURPLE}" stroke="${INK}" stroke-width="${OUT}"/>`;
    if (sneaker) g += `<path d="M${f1(x - rx + 3)} ${f1(y + ry - 3)}Q${f1(x)} ${f1(y + ry + 0.5)} ${f1(x + rx - 3)} ${f1(y + ry - 3)}" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
    if (stage >= 4) g += `<path d="M${f1(x - 4)} ${f1(y - 3)}H${f1(x + 5)}" stroke="${LAV}" stroke-width="2.4" stroke-linecap="round"/>`;
    return g;
  }
  function fxLayer(list, X) {
    let g = '';
    list.forEach(e => {
      const [k, a, b, c] = Array.isArray(e) ? e : [e];
      if (k === 'sweat') g += `<path d="M${X.cx + X.hw - 4 + (a || 0)} ${X.top + 14 + (b || 0)}q5 9 0 13q-5 -4 0 -13z" fill="#BFE3FF" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;
      if (k === 'tear') g += `<path d="M${X.cx - 22 + (a || 0)} ${X.top + X.h * .44 + 12 + (b || 0)}q4 8 0 11q-4 -3 0 -11z" fill="#BFE3FF" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
      if (k === 'zzz') {
        const n = a || 1; let z = '';
        for (let i = 0; i < n; i++) { const s = 9 + i * 4, zx = X.cx + X.hw - 6 + i * 11, zy = X.top - 4 - i * 17; z += `<path d="M${zx} ${zy}h${s}l${-s} ${s}h${s}" stroke="${PURPLE}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`; }
        g += z;
      }
      if (k === 'dust') { const d = a || 0; g += [-1, 1].map(s => `<circle cx="${CX + s * (46 + d * 5)}" cy="${GROUND - 3 - d * 1.5}" r="${6 - d * .8}" fill="#E7E1F5"/><circle cx="${CX + s * (60 + d * 7)}" cy="${GROUND - 1 - d}" r="${4 - d * .5}" fill="#E7E1F5"/>`).join(''); }
      if (k === 'sparkles') { const t = a || 0; [[-62, -18, 9], [66, -34, 11], [-48, -62, 7], [56, -78, 8], [0, -92, 10]].forEach((p, i) => { const s = p[2] * (.6 + .4 * Math.sin(t + i)); g += sparkle(CX + p[0], X.top + 40 + p[1] - ((t * 3 + i * 5) % 14), s, i % 2 ? LAV : PURPLE); }); }
      if (k === 'burst') { const r0 = a || 20, r1 = r0 + (b || 24); let l = ''; for (let i = 0; i < 12; i++) { const an = i * 30 * Math.PI / 180; l += `<path d="M${f1(CX + Math.cos(an) * r0)} ${f1(X.mid + Math.sin(an) * r0)}L${f1(CX + Math.cos(an) * r1)} ${f1(X.mid + Math.sin(an) * r1)}" stroke="${i % 2 ? LAV : PURPLE}" stroke-width="5" stroke-linecap="round"/>`; } g += l; }
      if (k === 'ring') g += `<ellipse cx="${CX}" cy="${X.mid}" rx="${a}" ry="${a * 1.05}" fill="none" stroke="${LAV}" stroke-width="${b || 5}"/>`;
      if (k === 'think') { const n = a || 3; const dots = [[X.cx + X.hw + 4, X.top + 30, 4], [X.cx + X.hw + 14, X.top + 12, 6], [X.cx + X.hw + 12, X.top - 24, 17]]; dots.slice(0, n).forEach((d, i) => { g += `<circle cx="${d[0]}" cy="${d[1]}" r="${d[2]}" fill="#fff" stroke="${INK}" stroke-width="2.4"/>`; }); if (n >= 3) g += `<path d="M${X.cx + X.hw + 7} ${X.top - 30}q0 -6 5 -6t5 5q0 4 -5 7v3" stroke="${PURPLE}" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle cx="${X.cx + X.hw + 12}" cy="${X.top - 14}" r="1.9" fill="${PURPLE}"/>`; }

  tapPip: () => { const m = $('.mascot[data-live]'); if (!m || !m._p) return; const list = ['greeting', 'happy', 'thinking', 'training', 'celebrating']; const a = list[(m._n = ((m._n || 0) + 1)) % list.length]; pipPlay(a); say(SAYS[Math.floor(Math.random() * SAYS.length)]); snd('tap'); },
  collect: () => { goTab('rewards'); const r = Store.dailyCheckin(); if (r.ok) afterOp(r); },
  daily: () => afterOp(Store.dailyCheckin()), claim: el => afterOp(Store.claimChallenge(el.dataset.id)),
  cardsTab: el => { R.cardsTab = el.dataset.t; render(); snd('tap'); }, selCard: el => { R.selCard = el.dataset.id; const sc = $('#cs'), x = sc ? sc.scrollLeft : 0; renderKeep = true; render(); const n = $('#cs'); if (n) n.scrollLeft = x; snd('tap'); },

  doNewGoal: () => { const r = Store.createGoal({ name: val('f-name'), target: parseEuro(val('f-amt')), locked: $('#f-lock').checked }); if (!r.ok) return setErr(r.error), snd('err'); closeSheet(); afterOp(r); toast('Goal created', 'flag'); },
  doEditGoal: el => { const r = Store.editGoal(el.dataset.id, { name: val('f-name'), target: parseEuro(val('f-amt')) }); if (!r.ok) return setErr(r.error); closeSheet(); afterOp(r); },
  delGoal: el => { const r = Store.deleteGoal(el.dataset.id); if (!r.ok) { toast(r.error, 'info'); snd('err'); return; } closeSheet(); afterOp(r); toast('Goal deleted'); },
  doTarget: () => { const r = Store.setSavingsTarget(parseEuro(val('f-amt'))); if (!r.ok) return setErr(r.error); closeSheet(); afterOp(r); },
  doRename: el => { const r = Store.cardPatch(el.dataset.id, { name: val('f-name') }); if (!r.ok) return setErr(r.error); closeSheet(); afterOp(r); },
  doLimits: el => { const r = Store.setLimits(el.dataset.id, parseEuro(val('f-tx')), parseEuro(val('f-mo'))); if (!r.ok) return setErr(r.error), snd('err'); closeSheet(); afterOp(r); toast('Limits saved'); },
  kindPick: el => { $$('#sheet .seg button').forEach(b => b.setAttribute('aria-pressed', b === el)); }, designPick: el => { $$('#sheet .chip[data-act=designPick]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  doAddCard: () => { const kind = $('#kp').getAttribute('aria-pressed') === 'true' ? 'physical' : 'virtual', d = $('#sheet .chip[aria-pressed=true]').dataset.k; const r = Store.addCard({ name: val('f-name'), design: d, kind }); if (!r.ok) return setErr(r.error); R.selCard = r.card.id; closeSheet(); afterOp(r); toast('Card created'); },
  doRedeem: el => { const r = Store.redeem(el.dataset.id); if (!r.ok) return setErr(r.error), snd('err'); snd('up'); confetti(70); S = Store.get(); render(); openSheet('redeemed', { name: r.redemption.name, code: r.redemption.code, pts: r.redemption.pts, noFocus: true }); },
  doRules: () => { const m = { ptsPerBlock: 1, blockCents: 100, milestoneBonus: 1, goalBonus: 1, challengeBonus: 1, dailyBonus: 1, dailyCap: 1 }; for (const k in m) { const v = Math.round(parseFloat(String(val('r-' + k)).replace(',', '.')) * m[k]); const r = Store.setRule(k, k === 'blockCents' ? Math.max(100, v) : v); if (!r.ok) return setErr(r.error); } closeSheet(); afterOp({ events: [] }); toast('Rules saved'); },
  defRules: () => { Object.assign(S.rules, Store.DEFAULT_RULES); Store.save(); closeSheet(); render(); toast('Defaults restored'); },
  doReset: () => { S = Store.reset(); R.stack = []; R.tab = 'home'; closeSheet(); render(); toast('Demo data reset'); },
  /* payment flow */
  ftype: el => { F.type = el.dataset.t; F.steps = stepsFor(F.type); F.step = 2; F.rcpt = null; if (F.type === 'online' || F.type === 'card') { const c = S.cards.find(x => x.def && x.status === 'active') || S.cards.find(x => x.status === 'active'); F.src = c ? c.id : 'chk'; } else F.src = 'chk'; drawFlow(); snd('tap'); },
  fdir: el => { F.dir = el.dataset.k; F.rcpt = null; F.rcpt2 = null; drawFlow(); }, fwho: el => { F.rcpt = el.dataset.id; if (F.rcpt === F.rcpt2) F.rcpt2 = null; drawFlow(); snd('tap'); }, fwho2: el => { F.rcpt2 = el.dataset.id; drawFlow(); snd('tap'); },
  fsrc: el => { F.src = el.dataset.id; drawFlow(); snd('tap'); }, fnext: () => { F.step++; drawFlow(); snd('tap'); },
  fback: () => { if (F.step > 1 && !(F.steps.length && F.step === 2 && F.type && F.steps[0] === 'type' && false)) { F.step--; if (F.step < 1) F.step = 1; drawFlow(); } else closeFlow(); },
  key: el => { const k = el.dataset.k; if (k === 'del') F.amt = F.amt.slice(0, -1); else if (k === '.') { if (!F.amt.includes('.')) F.amt = (F.amt || '0') + '.'; } else if (!(F.amt.includes('.') && F.amt.split('.')[1].length >= 2) && F.amt.replace('.', '').length < 8) F.amt = (F.amt === '0' ? '' : F.amt) + k; drawFlow(); snd('tap'); },
  fconfirm: () => runFlow(), fdone: () => { const r = F.res; closeFlow(); if (r) { const rs = deferred.splice(0); rs.forEach(x => afterOp(x, { quiet: false })); } }, fretry: () => { F.res = null; F.step = F.steps.indexOf('review') + 1; drawFlow(); },

let renderKeepGlobal = false;
document.addEventListener('click', e => {

});
document.addEventListener('input', e => {
  if (SH.name === 'deposit' && (e.target.id === 'f-amt' || e.target.id === 'f-goal')) lockBox();
});

function lockBox() { const g = Store.goalById(val('f-goal')), b = $('#lockbox'); if (!b) return; b.innerHTML = g && g.locked && !g.committed ? `<label class="row" style="gap:10px;margin:4px 0 12px;align-items:flex-start"><input type="checkbox" id="f-consent" style="width:20px;height:20px;accent-color:var(--accent);margin-top:2px"><span class="small"><b>This is a locked commitment.</b> I understand this money cannot be withdrawn until ${esc(g.name)} reaches ${E(g.target)}.</span></label>` : g && g.locked ? `<p class="small muted" style="margin:4px 0 10px">Locked commitment: withdrawals open at ${E(g.target)}.</p>` : ''; }
document.addEventListener('keydown', e => { const t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('div[data-act]')) { e.preventDefault(); t.click(); } if (e.key === 'Escape') { if (F.on) closeFlow(); else closeSheet(); } });
/* chart tooltips */
document.addEventListener('pointermove', chartTip); document.addEventListener('pointerdown', chartTip);
function chartTip(e) { const c = e.target.closest && e.target.closest('.chart'); $$('.chart .tip').forEach(t => { if (!c || t.parentNode !== c) t.style.opacity = 0; }); if (!c) return; const d = e.target.closest('[data-tip]'), tip = $('.tip', c); if (!d) { tip.style.opacity = 0; return; } const r = c.getBoundingClientRect(); tip.textContent = d.dataset.tip; tip.style.left = Math.min(Math.max(70, e.clientX - r.left), r.width - 70) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.style.opacity = 1; }
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') render(); });

/* ---------- life: Pip does small things now and then ---------- */
setInterval(() => { if (document.hidden || SH.name || F.on || $('#cele').classList.contains('on')) return; const m = $('.mascot[data-live]'); if (!m || !m._p || m._p.anim !== 'idle') return; if (nightNow()) return; if (Math.random() < .55) pipPlay(['thinking', 'greeting', 'happy', 'training'][Math.floor(Math.random() * 4)]); }, 15000);

function boot() {
  $('#nav').innerHTML = NavigationBar();
  const sp = $('#splash'); sp.querySelector('.mascot').dataset.st = '3'; mountMascots(sp); sp.querySelector('.mascot')._p.play('greeting', 'idle');

  const k = Store.dayKey(Date.now()); if (S.lastOpen !== k) { S.lastOpen = k; Store.save(); }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
window.PACE = { A, R, render, get S() { return S; }, openFlow, F, goTab };
boot();
