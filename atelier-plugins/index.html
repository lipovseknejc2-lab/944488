:root{color-scheme:dark;--bg:#141311;--bg2:#1a1917;--card:#201f1c;--card2:#272522;--card3:#2f2d29;--line:rgba(239,232,220,.09);--line2:rgba(239,232,220,.16);--fill:rgba(239,232,220,.06);--text:#efe8dc;--ink2:#cbc3b6;--muted:#8f877b;
 --accent:#e2825c;--blue:#79a9ea;--green:#68c38f;--yellow:#e9c35a;--violet:#a690ea;--red:#ef6d5e;--grid:rgba(239,232,220,.045);--grid2:rgba(239,232,220,.08);
 --serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif;--hand:'Caveat',cursive;--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
 --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.56,.64,1);--r:16px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.6);--glt:rgba(255,255,255,.035);--gl-hi:rgba(255,255,255,.06);--gl-edge:rgba(239,232,220,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
h1{font:400 40px/1.05 var(--serif);margin:0;letter-spacing:-.01em}h2{font:600 17px/1.3 var(--sans);margin:0}h3{font:400 24px/1.15 var(--serif);margin:0}
.sub{color:var(--muted)}.sm{font-size:12.5px}.mono{font-family:var(--mono);letter-spacing:.02em}.hand{font:600 26px/1 var(--hand);color:var(--accent)}.grow{flex:1}
.tag{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ic{width:20px;height:20px;flex:none}.row{display:flex;gap:8px;align-items:center;margin-top:14px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}
label{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin:14px 0 6px}label em{font-style:normal;color:var(--muted);font-weight:500}.flabel{font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--card2);color:var(--text);font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .3s var(--spring),background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.96)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.primary:hover{background:#fff}.btn.danger{color:var(--red)}label.btn{margin:0;font-size:14px;color:var(--text)}label.btn.sm{font-size:13px}.btn.full{width:100%}.btn.big{min-height:48px;font-size:15.5px;padding:10px 22px}.btn.sm{min-height:32px;padding:5px 12px;font-size:13px}.btn .ic{width:17px;height:17px}.btn .rxi{width:17px;height:17px}
.btn:disabled,.icon-btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;cursor:pointer;color:var(--text);transition:transform .3s var(--spring),background .2s;flex:none}.icon-btn:hover{background:var(--card3)}.icon-btn:active{transform:scale(.92)}.icon-btn.sm{width:32px;height:32px;border-radius:10px}.icon-btn .ic{width:18px;height:18px}
.lnk{border:none;background:none;color:var(--accent);font-weight:650;cursor:pointer;padding:0}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);gap:2px}.seg button,.seg label{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:6px 12px;border-radius:9px;color:var(--ink2);font-weight:650;font-size:13px;cursor:pointer;margin:0}.seg .ic{width:16px;height:16px}
.seg button.on,.seg label:has(input:checked){background:var(--card3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.3)}.seg input{position:absolute;opacity:0;pointer-events:none}.seg.wide{display:flex}.seg.wide label{flex:1;justify-content:center}.seg.sm button{padding:5px 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;background:var(--fill);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink2)}.pill .ic{width:13px;height:13px}.pubp{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.card{background:linear-gradient(170deg,var(--card2),var(--card) 55%);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.dots{margin:8px 0 0;padding-left:18px;color:var(--ink2)}.dots li{margin:4px 0}.dots.sm{font-size:13px}
.lab{display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lc,var(--muted))}.lab .ic{width:16px;height:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:650;font-size:14px;z-index:99;transition:.35s var(--ease);pointer-events:none;max-width:80vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
/* marks and shared bits */
.hubm{fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}.hubm .ha{stroke:var(--text);stroke-width:4}.hubm .hb{stroke:var(--accent);stroke-width:3.6}.hubm .hp{fill:var(--accent);stroke:none}
.fig{width:100%;height:100%;color:var(--text)}.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pkpic{--pc:var(--accent);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--pc) 16%,var(--bg));color:var(--pc);overflow:hidden;border:1px solid color-mix(in srgb,var(--pc) 26%,transparent)}
.pkpic svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pkpic.img img{width:100%;height:100%;object-fit:cover}.pkpic.md{width:40px;height:40px;border-radius:12px}.pkpic.lg{width:52px;height:52px;border-radius:16px}.pkpic.sm{width:30px;height:30px;border-radius:9px}

.chks{padding:6px 12px 14px;display:grid;gap:4px;overflow:auto}.chk{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:left;font-size:13.5px;cursor:pointer;color:var(--text)}.chk .ic{width:16px;height:16px}.chk.err .ic{color:var(--red)}.chk.warn .ic{color:var(--yellow)}.chk.ok .ic{color:var(--green)}
/* code editor */
.cedwrap{display:flex;flex-direction:column;min-width:0;min-height:0}.ced{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:52px 1fr;background:var(--bg);overflow:hidden}
.cedg{padding:16px 0;text-align:right;font:13.5px/1.7 var(--mono);color:var(--muted);opacity:.6;overflow:hidden;border-right:1px solid var(--line);background:var(--bg2)}.cedg span{display:block;padding-right:12px}
.cedh,.ced textarea{grid-column:2;grid-row:1;margin:0;padding:16px 18px;font:13.5px/1.7 var(--mono);white-space:pre;overflow:auto;tab-size:2;border:none;border-radius:0}
.cedh{color:var(--ink2);pointer-events:none}.ced textarea{background:transparent!important;color:transparent;caret-color:var(--accent);resize:none;outline:none;box-shadow:none!important;border:none!important;padding:16px 18px!important}
.cedmsg{flex:none;display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--bg2)}.cedmsg .ic{width:16px;height:16px}.cedmsg.ok .ic{color:var(--green)}.cedmsg.err{color:var(--red)}
.apii{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:border-color .2s}.apii:hover{border-color:var(--accent)}.apii code{display:block;font:600 12px var(--mono);color:var(--accent);margin-bottom:3px}.apii span{font-size:12.5px;color:var(--muted)}
/* ===== bench ===== */
.bbody{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr 300px}.bside{overflow-y:auto;padding:14px;border-right:1px solid var(--line);background:var(--bg2)}.bside.r{border-right:none;border-left:1px solid var(--line)}.bside .flabel:first-child{margin-top:4px}
.bm{display:flex;gap:9px;align-items:center;padding:6px 4px}.bm b{display:block;font-size:13.5px}.bm span{font-size:11.5px;color:var(--muted)}.bav{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:750;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg))}
.bchat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.bmsgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}.bmsg{display:flex;gap:10px;align-items:flex-start;max-width:640px;animation:rise .35s var(--ease)}.bmsg.me{align-self:flex-end;flex-direction:row-reverse}
.bb{padding:9px 13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);min-width:0}.bmsg.me .bb{background:color-mix(in srgb,var(--blue) 22%,var(--card))}.bmsg.pl .bb{border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
.bw{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:2px}.bt2{white-space:pre-wrap;font-size:14.5px}.pinm{font-size:9.5px;color:var(--accent)}
.bmsg.pickable .bb{cursor:pointer;outline:1px dashed var(--accent);outline-offset:2px}.bfile{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg2);margin:2px 0}.bfile b{display:block;font-size:13.5px}.bfile span{font-size:12px;color:var(--muted)}
.bempty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);max-width:380px}.bempty .fig{width:140px;height:140px}.bempty b{font:400 22px var(--serif);color:var(--text)}
.bacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}.bpick{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:8px 16px 0}.bpick button[data-rk]{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}.bpick button.on{border-color:var(--accent)}.bpick .rxi{width:22px;height:22px}
.bcomp{display:flex;gap:8px;padding:12px 16px 16px}.bcomp select{width:120px;flex:none}.bcomp input{flex:1}
.vt{width:100%;border-collapse:collapse;font-size:12.5px}.vt th{font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px}.vt th:first-child{text-align:left}.vt td{padding:6px 4px;border-top:1px solid var(--line);text-align:right}.vt td:first-child{text-align:left;font-weight:600}
.gv{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-top:1px solid var(--line)}
.blog{display:grid;gap:6px}.bl{padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);animation:rise .3s var(--ease)}.bl b{display:block;font-size:13px}.bl span{font-size:10.5px;color:var(--muted)}.bl em{display:block;font-style:normal;color:var(--red);font-size:12px;margin-top:4px}.bl.err{border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.blc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.blc button{border:1px solid var(--line2);background:var(--bg);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:10px;cursor:pointer}
/* ===== modals ===== */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px}#modal .scrim{position:absolute;inset:0;background:rgba(6,5,4,.6);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}#modal.on .scrim{opacity:1}
.mdl{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:24px;padding:22px 24px 24px;box-shadow:0 40px 80px -30px rgba(0,0,0,.9);transform:translateY(16px) scale(.98);opacity:0;transition:.35s var(--ease)}#modal.on .mdl{transform:none;opacity:1}
.mdl.sm{width:min(460px,100%)}.mdl.wide{width:min(860px,100%)}.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}.mh h2{font:400 26px/1.15 var(--serif)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choose label{margin:0;cursor:pointer}.choose input{position:absolute;opacity:0}.choose span{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);height:100%;transition:border-color .2s,box-shadow .2s}.choose .ic{color:var(--accent);width:22px;height:22px}.choose b{font-size:15px;color:var(--text)}.choose em{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}
.choose input:checked+span{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.picgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.picgrid button,.picup{border:1px solid var(--line);background:var(--bg2);border-radius:16px;padding:10px;display:grid;place-items:center;cursor:pointer;margin:0;transition:border-color .2s}.picgrid button.on{border-color:var(--accent)}.picup{gap:4px;font-size:12px;color:var(--muted)}.picup .ic{width:22px;height:22px}
.share{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:14px 0 4px}.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}.qrbox>div:first-child{background:#fff;border-radius:20px;padding:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}.pkqr{width:340px;height:340px;display:block}.qrmeta{font-size:11px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:12px;color:var(--ink2);font-size:14.5px}.steps b{color:var(--text)}.steps em{font-style:normal;color:var(--accent);font-weight:650}
.warnbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 12%,transparent);color:var(--yellow);font-size:13.5px;margin:8px 0}.warnbox .ic{width:18px;height:18px}
.imp{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.impcam{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#0c0b0a;border:1px solid var(--line)}.impcam video{width:100%;height:100%;object-fit:cover}.impcam span{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-size:13px;background:rgba(0,0,0,.5);padding:6px;border-radius:10px}.imp label{margin-top:0}.imp textarea{font:12.5px var(--mono)}
@media(max-width:1100px){.tiles{grid-template-columns:1fr 1fr}.dgrid,.licpage{grid-template-columns:1fr}.stbody{grid-template-columns:200px 1fr 270px}.bbody{grid-template-columns:190px 1fr 250px}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.auth{grid-template-columns:1fr}.authart{min-height:320px}.authfig{display:none}.pg{padding:24px 18px}.share,.imp{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

   if(L==='channel')return ev.ch?ev.ch.name:'';if(L==='group')return snap.group?snap.group.name:'';if(L==='text')return ev.text||'';if(L==='command')return ev.cmd||'';if(L==='args')return a.join(' ');

const pv=(t,p)=>t==='react'?(p?`<span class="nrx">${PK.rxSvg(p)}</span>`:'any'):t==='bool'?(p?'yes':'no'):esc(String(p??'')).slice(0,46)||'<em>empty</em>';

 <div class="ndh">${st?'':'<i class="pin in" data-in title="In"></i>'}<span class="ndi"><svg viewBox="0 0 24 24"><path d="${d.i}"/></svg></span><b>${esc(d.l)}</b><em>${esc(n.id.toUpperCase().replace('N','N-'))}</em></div>

function wirePath(a,b){const dx=Math.max(50,Math.abs(b[0]-a[0])*.5);return`M${a[0]} ${a[1]}C${a[0]+dx} ${a[1]} ${b[0]-dx} ${b[1]} ${b[0]} ${b[1]}`}

function drawWires(){const pl=curPl(),svg=$('#wires');if(!svg||!pl)return;const G=nodesOf(pl);
 svg.innerHTML=G.links.map(l=>{const a=$(`.nd[data-n="${l.a}"] .pin.out[data-port="${l.ap||'next'}"]`),b=$(`.nd[data-n="${l.b}"] .pin.in`);if(!a||!b)return'';const d=wirePath(pinXY(a),pinXY(b));
  return`<g class="wire w-${l.ap||'next'} ${V.selL===l.id?'sel':''} ${V.lit.has(l.a)&&V.lit.has(l.b)?'lit':''}" data-l="${l.id}"><path class="wh" d="${d}"/><path class="wp" d="${d}"/></g>`}).join('')}
function applyView(){const w=$('#world'),c=$('#cv');if(!w||!c)return;w.style.transform=`translate(${V.pan.x}px,${V.pan.y}px) scale(${V.z})`;const g=20*V.z;c.style.backgroundSize=`${g}px ${g}px,${g*5}px ${g*5}px`;c.style.backgroundPosition=`${V.pan.x}px ${V.pan.y}px,${V.pan.x}px ${V.pan.y}px`;const z=$('#zv');if(z)z.textContent=Math.round(V.z*100)+'%'}
function zoomAt(f,cx,cy){const c=$('#cv').getBoundingClientRect();cx=cx??c.width/2;cy=cy??c.height/2;const nz=Math.min(2,Math.max(.3,V.z*f));V.pan.x=cx-(cx-V.pan.x)*nz/V.z;V.pan.y=cy-(cy-V.pan.y)*nz/V.z;V.z=nz;applyView()}
function fitView(){const pl=curPl(),G=nodesOf(pl),c=$('#cv');if(!c||!G.nodes.length)return;const xs=G.nodes.map(n=>n.x),ys=G.nodes.map(n=>n.y),x0=Math.min(...xs)-40,y0=Math.min(...ys)-40,x1=Math.max(...xs)+300,y1=Math.max(...ys)+200,r=c.getBoundingClientRect();
 V.z=Math.min(1.2,Math.max(.3,Math.min(r.width/(x1-x0),r.height/(y1-y0))));V.pan.x=(r.width-(x1-x0)*V.z)/2-x0*V.z;V.pan.y=(r.height-(y1-y0)*V.z)/2-y0*V.z;applyView()}

function vTest(){const pl=curPl(),s=sim(),ch=s.channels.find(c=>c.id===s.ch)||s.channels[0],M=s.msgs[ch.id]||[],inf=PK.info(pl),vars=simVars();
 after(bindBench);
 return`<div class="bench"><header class="stbar"><button class="icon-btn" onclick="go('studio')" aria-label="Back to the studio">${ic('back')}</button>${PK.picHtml(pl,'md')}<div class="bt"><b>${esc(pl.name)}</b><span class="mono">TEST BENCH · ${pl.mode==='code'?'CODE':'NODES'} · DAY ${Object.keys(s.day).length?Math.round(s.clock/864e5)+1:1}</span></div><span class="grow"></span>
 <button class="btn" onclick="go('studio')">${ic('nodes',2)} Studio</button><button class="btn" onclick="if(confirm('Start the bench over? Values and messages are cleared.')){delete H.sims[curPl().id];save();render()}">${ic('undo',2)} Start over</button><button class="btn primary" onclick="shareModal('${pl.id}')">${ic('qr',2)} Send to Atelier</button></header>
 <div class="bbody"><aside class="bside"><div class="flabel">Channels</div>${s.channels.map(c=>`<button class="chp ${c.id===ch.id?'on':''}" style="--cc:${c.type==='files'?'var(--green)':c.type==='announce'?'var(--accent)':'var(--blue)'}" onclick="sim().ch='${c.id}';render()"><span class="chh">#</span><span class="chn">${esc(c.name)}</span>${(s.msgs[c.id]||[]).length?`<em class="mono">${(s.msgs[c.id]||[]).length}</em>`:''}</button>`).join('')}
  <div class="flabel">Members</div>${s.members.map(m=>`<div class="bm"><span class="bav" style="--c:${m.col}">${esc(m.name[0])}</span><div><b>${esc(m.name.split(' ')[0])}${m.id==='me'?' (you)':''}</b><span>${m.roles.length?m.roles.map(esc).join(', '):'Member'}</span></div></div>`).join('')}</aside>
 <section class="bchat"><div class="bmsgs" id="bM">${M.length?M.map(m=>bMsg(m,ch)).join(''):`<div class="bempty">${figure('duo',{acc:'var(--accent)'})}<b>A pretend group, just for testing</b><span>Write as any member, or use the buttons above the box. ${inf.cmds.length?'Try '+inf.cmds.map(c=>'/'+c).join(', ')+'.':''}</span></div>`}</div>
  <div class="bacts"><button class="btn sm" onclick="benchJoin()">${ic('addp',2)} Someone joins</button><button class="btn sm" onclick="benchReact()">${PK.rxSvg('star')} React</button><label class="btn sm">${ic('file',2)} Share a file<input type="file" id="bF" hidden></label><button class="btn sm" onclick="benchRole()">${ic('shield',2)} Give a role</button><button class="btn sm" onclick="benchDay()">${ic('sun',2)} Next day</button><button class="btn sm" onclick="benchTick()">${ic('clock',2)} An hour later</button><button class="btn sm" onclick="simFire({k:'install',user:{id:'me',name:sim().members[0].name}},'Plugin added')">${ic('plug',2)} Plugin added</button></div>
  ${V.rx?`<div class="bpick">${PK.REACTS.map(r=>`<button data-rk="${r[0]}" class="${V.rx===r[0]?'on':''}" title="${r[1]}">${PK.rxSvg(r[0])}</button>`).join('')}<span class="sub sm">${V.rx===true?'Pick a reaction, then a message.':'Now click a message.'}</span><button class="btn sm" onclick="V.rx=null;render()">Cancel</button></div>`:''}
  <form class="bcomp" id="bC"><select id="bAs" aria-label="Write as">${s.members.map(m=>`<option value="${m.id}" ${s.as===m.id?'selected':''}>${esc(m.name.split(' ')[0])}</option>`).join('')}</select><input id="bI" placeholder="Message #${esc(ch.name)}${inf.cmds.length?', or /'+esc(inf.cmds[0]):''}" autocomplete="off"><button class="btn primary">${ic('send',2)}</button></form></section>
 <aside class="bside r"><div class="flabel">Values</div>${vars.cols.length?`<table class="vt"><thead><tr><th></th>${vars.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.members.map(m=>`<tr><td>${esc(m.name.split(' ')[0])}</td>${vars.cols.map(c=>`<td class="mono">${esc(String(s.store.m?.[m.id]?.[c]??'·'))}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="sub sm">Values the plugin keeps, like coins, show here.</p>'}
  ${vars.g.length?`<div class="flabel">Group values</div>${vars.g.map(([k,v])=>`<div class="gv"><span>${esc(k)}</span><b class="mono">${esc(String(v))}</b></div>`).join('')}`:''}
  <div class="flabel">What ran</div><div class="blog">${s.log.length?s.log.map(l=>`<div class="bl ${l.err?'err':''}"><b>${esc(l.label)}</b><span class="mono">${l.nodes.length?plural(l.nodes.length,'step'):'nothing matched'} · ${plural(l.acts,'action')}</span>${l.err?`<em>${esc(l.err)}</em>`:''}${l.nodes.length&&curPl().mode!=='code'?`<div class="blc">${l.nodes.slice(0,8).map(n=>`<button class="mono" onclick="V.lit=new Set(${esc(JSON.stringify(l.nodes))});V.sel='${n}';go('studio')">${n.toUpperCase()}</button>`).join('')}</div>`:''}</div>`).join(''):'<p class="sub sm">Every event and the steps it took show here.</p>'}</div></aside></div></div>`}
function simVars(){const s=sim(),cols=new Set();Object.values(s.store.m||{}).forEach(o=>Object.keys(o).forEach(k=>!k.startsWith('_')&&cols.add(k)));return{cols:[...cols].slice(0,5),g:Object.entries(s.store.g||{}).filter(([k])=>!k.startsWith('_'))}}
function bMsg(m,ch){const s=sim(),pl=curPl(),me=m.from==='me',p=m.from==='pl'?null:simMem(m.from);
 return`<div class="bmsg ${me?'me':''} ${m.from==='pl'?'pl':''} ${V.rx&&V.rx!==true?'pickable':''}" data-m="${m.id}">${m.from==='pl'?PK.picHtml(pl,'sm'):`<span class="bav" style="--c:${p?.col||'var(--muted)'}">${esc((p?.name||'?')[0])}</span>`}<div class="bb"><div class="bw">${m.from==='pl'?`${esc(pl.name)} <span class="pltag">Plugin</span>`:esc(p?.name.split(' ')[0]||'')}${m.pin?` <span class="mono pinm">PINNED</span>`:''}</div>${m.file?`<div class="bfile">${ic('file',1.8)}<div><b>${esc(m.file.name)}</b><span>${esc(m.file.kind)} · ${esc(m.file.sizeText)}</span></div></div>`:''}${m.text?`<div class="bt2">${esc(m.text)}</div>`:''}
 ${m.rx&&Object.keys(m.rx).length?`<div class="rxs">${Object.entries(m.rx).map(([k,v])=>`<span class="rx">${PK.rxHtml(k)}<b>${v.length}</b></span>`).join('')}</div>`:''}</div></div>`}
function benchRefresh(){if(V.view!=='test')return;const y=$('#bM')?.scrollTop;render();const b=$('#bM');if(b)b.scrollTop=b.scrollHeight}
function benchSend(text,as){const s=sim(),ch=s.channels.find(c=>c.id===s.ch),m={id:uid(),from:as,text,at:simNow()},u=simMem(as);(s.msgs[ch.id]=s.msgs[ch.id]||[]).push(m);
 const base={user:{id:u.id,name:u.name},ch:{id:ch.id,name:ch.name},msg:{id:m.id},text},t=text.trim();
 if(t.startsWith('/')){const [cmd,...args]=t.slice(1).split(/\s+/);simFire({...base,k:'command',cmd:cmd.toLowerCase(),args},`/${cmd} by ${u.name.split(' ')[0]}`);return}
 const day=new Date(simNow()).toDateString();if(s.day[u.id]!==day){s.day[u.id]=day;simFire({...base,k:'daily'},`First message today, ${u.name.split(' ')[0]}`)}
 simFire({...base,k:'message'},`Message by ${u.name.split(' ')[0]}`);simFire({...base,k:'keyword'},'Words checked');benchRefresh()}
function bindBench(){const s=sim(),b=$('#bM');if(b)b.scrollTop=b.scrollHeight;
 $('#bC').onsubmit=e=>{e.preventDefault();const v=$('#bI').value;if(!v.trim())return;s.as=$('#bAs').value;benchSend(v,s.as);setTimeout(()=>{const i=$('#bI');if(i)i.focus()},30)};$('#bI').focus();
 $('#bF').onchange=async e=>{const f=e.target.files[0];if(!f)return;const ch=s.channels.find(c=>c.id===s.ch),u=simMem($('#bAs').value),file=await PK.fileInfo(f.name,f.type,f.size,f),m={id:uid(),from:u.id,text:'',file,at:simNow()};(s.msgs[ch.id]=s.msgs[ch.id]||[]).push(m);
  simFire({k:'file',user:{id:u.id,name:u.name},ch:{id:ch.id,name:ch.name},msg:{id:m.id},text:'',file},`${f.name} shared by ${u.name.split(' ')[0]}`)};
 $$('.bpick [data-rk]').forEach(x=>x.onclick=()=>{V.rx=x.dataset.rk;render()});
 if(V.rx&&V.rx!==true)$$('.bmsg').forEach(el=>el.onclick=()=>{const ch=s.channels.find(c=>c.id===s.ch),m=(s.msgs[ch.id]||[]).find(x=>x.id===el.dataset.m),u=simMem($('#bAs').value),key=V.rx;V.rx=null;if(!m)return;m.rx=m.rx||{};(m.rx[key]=m.rx[key]||[]).push(u.id);
  const au=m.from==='pl'?null:simMem(m.from);simFire({k:'reaction',user:{id:u.id,name:u.name},author:au?{id:au.id,name:au.name}:null,ch:{id:ch.id,name:ch.name},msg:{id:m.id},text:m.text||'',reaction:{key,label:PK.RX[key][1]}},`${PK.RX[key][1]} from ${u.name.split(' ')[0]}`)})}
function benchJoin(){const s=sim(),n=++s.guests,m={id:'g'+n,name:['Nina','Gal','Eva','Jan','Lara','Tim'][(n-1)%6]+' Guest',roles:[],col:'var(--red)',bot:true};s.members.push(m);simFire({k:'join',user:{id:m.id,name:m.name}},`${m.name.split(' ')[0]} joined`)}
function benchReact(){V.rx=true;render()}
function benchRole(){const s=sim();modal(`<div class="mh"><h2>Give a role</h2><button class="icon-btn" data-close aria-label="Close">${ic('close')}</button></div><label for="brM">Member</label><select id="brM">${s.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><label for="brR">Role</label><input id="brR" value="Helper" maxlength="24"><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="brGo">Give</button></div>`,'sm');
 $('#brGo').onclick=()=>{const m=simMem($('#brM').value),r=$('#brR').value.trim();if(!r)return;if(!m.roles.includes(r))m.roles.push(r);closeModal();simFire({k:'role',user:{id:m.id,name:m.name},role:{name:r}},`${r} given to ${m.name.split(' ')[0]}`)}}
function benchDay(){const s=sim();s.clock+=864e5;toast('A day later. Daily rewards and cooldowns are ready again.');saveSoon();render()}
function benchTick(){const s=sim();s.clock+=36e5;simFire({k:'timer',user:{id:'me',name:s.members[0].name}},'An hour went by')}
/* ============ SENDING AND IMPORTING ============ */
async function shareModal(id,pubId){const pl=id?plOf(id):PK.STARTERS.find(x=>x.id===pubId)||plOf(pubId);if(!pl)return;const bad=validate(pl).filter(b=>b.lvl==='err');
 const code=await PK.encode(pl),parts=PK.parts(code,380);let k=0,tm=0;const kb=(code.length/1024).toFixed(1);
 modal(`<div class="mh"><h2>Send ${esc(pl.name)} to Atelier</h2><button class="icon-btn" data-close aria-label="Close">${ic('close')}</button></div>${bad.length?`<div class="warnbox">${ic('info',2)} ${esc(bad[0].t)} You can still send it.</div>`:''}
 <div class="share"><div class="qrbox"><div id="sQ">${PK.qrSvg(parts[0])}</div><div class="qrmeta mono">${parts.length>1?`<span id="sQN">1</span> / ${parts.length} · `:''}${kb} KB PACKED</div></div>
 <ol class="steps"><li><b>On your phone</b>, open Atelier, go to <em>Chat</em>, then <em>Groups</em>, then <em>Plugins</em>, and tap <em>Scan</em>.</li><li><b>Point it at the code.</b> ${parts.length>1?`This plugin needs ${parts.length} codes. They change by themselves, and Atelier collects them in any order.`:'One code is all it takes.'}</li><li><b>Tap Add</b>, then add it to a group.</li></ol></div>
 <div class="row wrap"><button class="btn" id="sIn">${ic('send',2)} Send to Atelier on this computer</button><button class="btn" id="sCp">${ic('copy',2)} Copy the code</button><button class="btn" id="sDl">${ic('download',2)} Download file</button>${code.length<1800?`<button class="btn" id="sLk">${ic('link',2)} Copy a link</button>`:''}</div>`,'wide');
 if(parts.length>1){tm=setInterval(()=>{k=(k+1)%parts.length;const q=$('#sQ');if(!q)return clearInterval(tm);q.innerHTML=PK.qrSvg(parts[k]);$('#sQN').textContent=k+1},900);onClose(()=>clearInterval(tm))}
 const mark=()=>{if(id){logAct('send',id);save()}};mark();
 $('#sIn').onclick=()=>{let L=[];try{L=JSON.parse(localStorage.getItem(INBOX)||'[]')}catch(e){}L.push(code);try{localStorage.setItem(INBOX,JSON.stringify(L.slice(-20)));toast('Sent. Open Atelier in this browser and it arrives.');mark()}catch(e){toast('Could not reach Atelier here')}};
 $('#sCp').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}toast('Code copied. Paste it in Atelier: Plugins, Scan, Paste a code.');mark()};
 $('#sDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(PK.clean(pl),null,1)],{type:'application/json'}));a.download=pl.name.replace(/[^\w-]+/g,'-').toLowerCase()+'.atelier-plugin.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);mark()};
 const lk=$('#sLk');if(lk)lk.onclick=()=>{try{navigator.clipboard.writeText(APP_URL+'#plugin='+code)}catch(e){}toast('Link copied');mark()}}
function importPlugin(){let stop=null;const col=PK.collector();
 modal(`<div class="mh"><h2>Import from a phone</h2><button class="icon-btn" data-close aria-label="Close">${ic('close')}</button></div><p class="sub">In Atelier, open a plugin and tap <em>Show code</em>. Hold the phone up to this computer's camera, or paste the code.</p>
 <div class="imp"><div class="impcam"><video id="iV" playsinline muted></video><canvas id="iC" hidden></canvas><span id="iH">Starting the camera…</span></div><div><label for="iT">Code</label><textarea id="iT" rows="6" placeholder="ATP1…" spellcheck="false"></textarea><div class="row"><button class="btn primary" id="iGo">Import</button><label class="btn">${ic('file',2)} Open file<input type="file" id="iF" accept=".json,application/json" hidden></label></div><div id="iP" class="sub sm"></div></div></div>`,'wide');
 const take=async t=>{try{const pl=await PK.decode(t);if(stop){stop();stop=null}addImported(pl);closeModal()}catch(e){toast(e.message)}};
 if(navigator.mediaDevices?.getUserMedia)stop=PK.scan($('#iV'),$('#iC'),t=>{const r=col.add(t);if(r.done)take(r.done);else if(r.got)$('#iP').textContent=`Code ${r.got} of ${r.n}`},()=>{$('#iH').textContent='No camera here. Paste the code instead.'});else $('#iH').textContent='No camera here. Paste the code instead.';
 onClose(()=>{if(stop)stop()});setTimeout(()=>{const h=$('#iH');if(h&&$('#iV')?.srcObject)h.textContent='Show the code to the camera'},1500);
 $('#iGo').onclick=()=>{const v=$('#iT').value.trim();if(v)take(v)};$('#iF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const pl=JSON.parse(await f.text()),bad=PK.valid(pl);if(bad)return toast(bad);addImported(PK.clean(pl));closeModal()}catch(x){toast('That file is not a plugin')}}}
function addImported(pl){const ex=plOf(pl.id);if(ex&&!confirm(`${pl.name} is already in your library. Replace it?`))return;pl.graph=pl.graph||{nodes:[],links:[]};if(pl.mode==='code'&&!pl.code)pl.code='';delete pl.starter;H.plugins=H.plugins.filter(p=>p.id!==pl.id);H.plugins.push(pl);save();go('studio',pl.id);toast(pl.name+' imported')}

/* start */
render();
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
