<html lang="en">

<style>
/* Layout: a tropical arcade cabinet. Hub of game cards that scrolls; each game takes the whole screen with a slim top bar. One dark sea look. */
:root{
  --bg:#071a2e; --deep:#04101e; --panel:#0e2d4a; --panel2:#15405f; --line:rgba(140,220,230,.18);
  --sea:#3fd6cf; --coral:#ff7a59; --gold:#ffc94a; --txt:#eaf6f7; --mut:#8fb2bd; --good:#5fdc8c; --bad:#ff6363;
  --fd:'Luckiest Guy','Trebuchet MS',system-ui,sans-serif; --fb:'Nunito Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fb);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hub{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(120% 60% at 50% 0%,#11486e,var(--bg) 60%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hh{display:flex;align-items:center;gap:12px}
.hh>div:first-child{flex:1;min-width:0}
.hh h1{margin:0;font-family:var(--fd);font-weight:400;font-size:38px;letter-spacing:1px;line-height:1;color:var(--gold);text-shadow:0 3px 0 #a0601a}
.hh p{margin:4px 0 0;color:var(--mut);font-size:13px;font-weight:700}
.pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 13px 7px 9px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffc94a 45%,#c88a10);box-shadow:inset 0 0 0 2px rgba(160,96,26,.5)}
.daily{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,#ff7a59,#ffb05a);color:#2a0d05;border-radius:18px;padding:12px 14px}
.daily .m{flex:1;min-width:0}.daily b{display:block;font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.5px}.daily span{font-size:12.5px;font-weight:700}
.daily button{background:#2a0d05;color:#ffe0c8;border-radius:12px;padding:10px 14px;font-weight:900;font-size:13px}
.daily.done{background:var(--panel);color:var(--mut)}.daily.done button{display:none}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{margin:0;font-family:var(--fd);font-weight:400;font-size:22px;letter-spacing:.5px}
.sect span{color:var(--mut);font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.gc:active{transform:scale(.97)}
.gc img{width:100%;aspect-ratio:5/3;display:block;background:#0a2a44}
.gc .gi{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.gc b{font-family:var(--fd);font-weight:400;font-size:17px;letter-spacing:.4px;line-height:1.1}
.gc .tg{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.gc .bs{font-size:11.5px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.album{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.album p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.45}
.stk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stk img{width:100%;aspect-ratio:1;border-radius:12px;display:block}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:900;font-size:14px;min-height:44px}
.btn.gold{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.btn.sea{background:var(--sea);color:#04262a;border-color:var(--sea)}
.btn.danger{background:#5a1d1d;color:#ffd6cf;border-color:#ff8a7a55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setr{display:flex;gap:8px;flex-wrap:wrap}
.foot{color:#4a7080;font-size:11px;text-align:center;font-weight:700;letter-spacing:.06em}
.game{position:fixed;inset:0;background:var(--deep);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(4,16,30,.92),rgba(4,16,30,.55));pointer-events:none}
.gbar>*{pointer-events:auto}
.ib{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.gbar b{font-family:var(--fd);font-weight:400;font-size:19px;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar span{font-weight:900;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,10,18,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{width:min(380px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:#0b2a44;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ot{font-family:var(--fd);font-size:28px;letter-spacing:.5px;line-height:1.05;text-wrap:balance}
.osc{font-family:var(--fd);font-size:46px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.omut{color:var(--mut);font-size:13px;font-weight:700}
.onew{color:var(--good);font-weight:900;font-size:14px}
.ostars{display:flex;gap:6px;font-size:34px;line-height:1}.ostars i{font-style:normal;color:#2b4f61}.ostars i.on{color:var(--gold);text-shadow:0 2px 10px rgba(255,201,74,.5)}
.ocoin{display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:14px;padding:8px 14px;font-weight:900}
.obtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}.obtns .btn{flex:1;min-width:100px}
.stkbig{width:150px;height:150px;border-radius:24px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;pointer-events:none;animation:pop .25s ease-out;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* Offline helper: register the offline worker straight away and show whether the game is saved for offline play. */
(function(){if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
var pg=new URL('index.html',location.href).href,el=null,was=false,n=0;
function pill(t,ok){if(!document.body){return setTimeout(function(){pill(t,ok)},200)}if(!el){el=document.createElement('div');el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:99999;pointer-events:none;font:700 12px system-ui,sans-serif;padding:6px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .4s';document.body.appendChild(el)}el.textContent=t;el.style.background=ok?'#5fdc8c':'#ffc94a';el.style.color=ok?'#06301a':'#3a2600';el.style.opacity='1'}
function chk(){caches.match(pg).then(function(r){if(r){var seen=false;try{seen=!!sessionStorage.getItem('offline-ok'+location.pathname)}catch(e){}if(was||!seen){try{sessionStorage.setItem('offline-ok'+location.pathname,'1')}catch(e){}pill('\u2713 Saved for offline play',true);setTimeout(function(){if(el)el.style.opacity='0'},3500)}}else{was=true;if(navigator.onLine===false){pill('Not saved for offline yet: connect to wifi once',false)}else{pill('Saving for offline\u2026 keep this open',false)}if(n++<200)setTimeout(chk,1500)}}).catch(function(){})}
setTimeout(chk,800)})();
</script>
</head>
<body>
<div class="hub" id="hub"><div class="wrap">
  <header class="hh"><div><h1>Atoll Arcade</h1><p>8 games · plays offline · progress saves</p></div><div class="pill" aria-label="Coins"><i class="coin"></i><b id="coinN">0</b></div></header>
  <section class="daily" id="daily"></section>
  <div class="sect"><h2>Games</h2><span id="statN"></span></div>
  <section class="grid" id="grid"></section>
  <section class="album"><div class="sect"><h2>Sticker album</h2><span id="albN">0 / 24</span></div><p>Every game pays coins. Open a pack for a random sticker. Golden stickers are rare, and duplicates give 15 coins back.</p><button class="btn gold" id="packBtn">Open a pack · 60 coins</button><div class="stk" id="stk"></div></section>
  <section class="setr"><button class="btn" id="sndBtn">Sound: on</button><button class="btn danger" id="rstBtn">Reset progress</button></section>
  <p class="foot">ATOLL ARCADE · VERSION 1.0</p>
</div></div>

<div class="game" id="game" hidden><canvas id="cv"></canvas>
  <div class="gbar" id="gbar"><button class="ib" id="gBack" aria-label="Back to arcade">‹</button><b id="gTitle">Game</b><span id="gScore"></span><button class="ib" id="gPause" aria-label="Pause">II</button></div>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.random()*n|0,pick=a=>a[ri(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>{const A=hexRgb(a),B=hexRgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const shade=(h,t)=>t>0?mix(h,'#ffffff',t):mix(h,'#000000',-t);
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const dstr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- save ---------- */
const KEY='atoll-arcade-v1';
const DEF=()=>({coins:0,best:{},stars:{},lvl:{match:1,path:1,memory:1},stickers:{},daily:{d:'',done:false},sound:true,plays:0,sudoku:{solved:0,easy:0,medium:0,hard:0}});
let S=DEF();
function load(){try{const r=localStorage.getItem(KEY);if(!r)return;const o=JSON.parse(r);if(!o||typeof o!=='object')return;const d=DEF();S=Object.assign(d,o);
  for(const k of['best','stars','lvl','stickers','daily','sudoku'])if(!S[k]||typeof S[k]!=='object')S[k]=DEF()[k];S.lvl=Object.assign(DEF().lvl,S.lvl);S.sudoku=Object.assign(DEF().sudoku,S.sudoku);
  for(const k in S.lvl)S.lvl[k]=Math.max(1,Math.floor(+S.lvl[k])||1);if(typeof S.coins!=='number'||!isFinite(S.coins)||S.coins<0)S.coins=0}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type,v,slide,delay){if(!AC||!S.sound)return;const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);gn.gain.setValueAtTime(v||.1,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}
const SFX={tap:()=>tone(700,.04,'triangle',.05),coin:()=>{tone(1100,.06,'square',.035);tone(1650,.1,'square',.035,null,.05)},hit:()=>tone(200,.32,'sawtooth',.08,60),flap:()=>tone(420,.08,'triangle',.05,700),
  pop:()=>tone(520+ri(300),.08,'triangle',.06,900),swap:()=>tone(380,.06,'sine',.06,520),place:()=>tone(260,.1,'triangle',.08,180),perfect:()=>[660,880,1100].forEach((f,i)=>tone(f,.12,'triangle',.06,null,i*.05)),
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.2,'triangle',.08,null,i*.09)),lose:()=>[400,300,220].forEach((f,i)=>tone(f,.22,'sine',.08,null,i*.12)),flip:()=>tone(900,.03,'triangle',.04),bad:()=>tone(180,.15,'square',.05)};
const sfx=k=>{try{SFX[k]&&SFX[k]()}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- shared art ---------- */
const ICONS=[{id:'fish',n:'Clownfish',c:'#ff8a3a'},{id:'turtle',n:'Sea Turtle',c:'#5fbf6a'},{id:'crab',n:'Red Crab',c:'#ff5a4a'},{id:'star',n:'Starfish',c:'#ffc94a'},{id:'shell',n:'Scallop',c:'#ffa8c4'},{id:'jelly',n:'Jellyfish',c:'#b08aff'},
  {id:'octo',n:'Octopus',c:'#ff6fa8'},{id:'palm',n:'Palm Tree',c:'#3fae6a'},{id:'boat',n:'Dhoni',c:'#f3efe4'},{id:'sun',n:'Sunshine',c:'#ffd23f'},{id:'whale',n:'Whale Shark',c:'#4a7aa8'},{id:'horse',n:'Seahorse',c:'#ffa04a'}];
function icon(g,id,x,y,s,col,gold,t){t=t||0;g.save();g.translate(x,y);g.scale(s/40,s/40);g.lineCap='round';g.lineJoin='round';const c=gold?'#ffcc33':col,dk=shade(c,-.35),lt=shade(c,.4);
  switch(id){
  case 'fish':g.fillStyle=dk;g.beginPath();g.moveTo(-9,0);g.lineTo(-20,-10+Math.sin(t*8)*2);g.lineTo(-20,10+Math.sin(t*8)*2);g.closePath();g.fill();g.beginPath();g.ellipse(2,0,15,10.5,0,0,7);g.fillStyle=c;g.fill();g.save();g.clip();g.fillStyle='#fff';g.fillRect(-3,-12,5,24);g.fillRect(8,-12,3.5,24);g.restore();g.fillStyle='#111';g.beginPath();g.arc(11,-2.5,2.2,0,7);g.fill();break;
  case 'turtle':g.fillStyle='#9ad08a';const fl=Math.sin(t*5)*.25;for(const[sx,sy,a]of[[-1,-1,-.6],[1,-1,.6],[-1,1,.5],[1,1,-.5]]){g.save();g.translate(sx*11,sy*8);g.rotate(a*sy+fl*sx);g.beginPath();g.ellipse(sx*5,0,8,3.6,0,0,7);g.fill();g.restore()}
    g.beginPath();g.arc(0,-17,5.5,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-2,-18,1,0,7);g.arc(2,-18,1,0,7);g.fill();g.fillStyle=c;g.beginPath();g.ellipse(0,0,13,15,0,0,7);g.fill();g.strokeStyle=dk;g.lineWidth=1.6;g.beginPath();for(let i=0;i<6;i++){const a=i/6*6.28;g.lineTo(Math.cos(a)*5.5,Math.sin(a)*6.5)}g.closePath();g.stroke();for(let i=0;i<6;i++){const a=i/6*6.28;g.beginPath();g.moveTo(Math.cos(a)*5.5,Math.sin(a)*6.5);g.lineTo(Math.cos(a)*12,Math.sin(a)*14);g.stroke()}break;
  case 'crab':g.strokeStyle=dk;g.lineWidth=2.4;for(const s2 of[-1,1])for(let k=0;k<3;k++){g.beginPath();g.moveTo(s2*8,3);g.lineTo(s2*(15+k*2),1+k*4);g.lineTo(s2*(17+k*2),8+k*4);g.stroke()}
    g.fillStyle=c;g.beginPath();g.ellipse(0,3,13,9,0,0,7);g.fill();for(const s2 of[-1,1]){g.beginPath();g.arc(s2*16,-8,5.5,0,7);g.fill();g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(s2*9,-1);g.lineTo(s2*14,-5);g.stroke()}g.fillStyle='#fff';g.beginPath();g.arc(-4,-7,3,0,7);g.arc(4,-7,3,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-4,-7,1.5,0,7);g.arc(4,-7,1.5,0,7);g.fill();break;
  case 'star':g.fillStyle=c;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?8:19;g.lineTo(Math.cos(a)*r,Math.sin(a)*r+1)}g.closePath();g.fill();g.fillStyle=lt;for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;g.beginPath();g.arc(Math.cos(a)*9,Math.sin(a)*9+1,1.8,0,7);g.fill()}break;
  case 'shell':g.fillStyle=c;g.beginPath();g.moveTo(0,16);for(let i=0;i<=10;i++){const a=Math.PI+.15+i/10*(Math.PI-.3);g.lineTo(Math.cos(a)*18,Math.sin(a)*18+6)}g.closePath();g.fill();g.fillRect(-5,12,10,6);g.strokeStyle=dk;g.lineWidth=1.6;for(let i=1;i<10;i++){const a=Math.PI+.15+i/10*(Math.PI-.3);g.beginPath();g.moveTo(0,16);g.lineTo(Math.cos(a)*16,Math.sin(a)*16+6);g.stroke()}break;
  case 'jelly':g.strokeStyle=lt;g.lineWidth=2.2;for(let i=0;i<5;i++){const x0=-10+i*5;g.beginPath();g.moveTo(x0,2);for(let k=1;k<=5;k++)g.lineTo(x0+Math.sin(t*4+i+k)*2.5,2+k*3.6);g.stroke()}g.fillStyle=c;g.beginPath();g.arc(0,2,14,Math.PI,0);g.quadraticCurveTo(0,7,-14,2);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(-5,-6,4,2.5,-.5,0,7);g.fill();break;
  case 'octo':g.strokeStyle=c;g.lineWidth=4;for(let i=0;i<6;i++){const x0=-10+i*4;g.beginPath();g.moveTo(x0,2);g.quadraticCurveTo(x0+(i-2.5)*3+Math.sin(t*4+i)*3,12,x0+(i-2.5)*5,18);g.stroke()}g.fillStyle=c;g.beginPath();g.ellipse(0,-5,13,13,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-5,-5,3.4,0,7);g.arc(5,-5,3.4,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-4.5,-4.5,1.7,0,7);g.arc(5.5,-4.5,1.7,0,7);g.fill();break;

/* ================= REEF RUSH: turtle swimmer ================= */
function makeRush(){
  let t=0,dist=0,v=230,shells=0,objs=[],sh=[],pw=[],tx,x,y,shield=0,magnet=0,rowY,dead=false,deadT=0,parts=[],hint=2.8,bub=[],flash=0;
  const R=()=>17*K;

  function spawnRow(yy){const L=5,lw=W/L;const nb=Math.min(3,1+(t>18?ri(2):0)+(t>45&&Math.random()<.4?1:0));const lanes=shuffle([0,1,2,3,4]);const blocked=lanes.slice(0,nb),free=lanes.slice(nb);
    for(const l of blocked){const cx=l*lw+lw/2,r=Math.random();let o;

      else if(r<.65)o={k:'net',x:l*lw+4*K,y:yy-13*K,w:lw-8*K,h:26*K};
      else if(r<.85||t<25)o={k:'bag',x:cx-13*K,y:yy-14*K,w:26*K,h:28*K,ph:Math.random()*6};
      else o={k:'eel',x:cx-30*K,y:yy-9*K,w:60*K,h:18*K,vx:(Math.random()<.5?-1:1)*(50+t)*K,ph:0};
      objs.push(o)}
    if(Math.random()<.75){const l=pick(free),cx=l*lw+lw/2;for(let i=0;i<3;i++)sh.push({x:cx,y:yy-i*42*K})}
    if(Math.random()<.07){const l=pick(free);pw.push({k:Math.random()<.55?'shield':'magnet',x:l*lw+lw/2,y:yy-60*K})}}
  const hitRect=(cx,cy,r,o)=>{const nx=clamp(cx,o.x,o.x+o.w),ny=clamp(cy,o.y,o.y+o.h);return(cx-nx)**2+(cy-ny)**2<r*r};

  return{action:true,_t:()=>({x,y,objs,dead,dist}),
    start(){x=tx=W/2;y=H*.8;rowY=TOP-80*K},
    resize(){y=H*.8},
    down(px){tx=px},move(px){tx=px},
    update(dt){t+=dt;flash=Math.max(0,flash-dt);
      for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt*1.6}parts=parts.filter(p=>p.l>0);
      if(Math.random()<dt*4)bub.push({x:Math.random()*W,y:H+10,r:1+Math.random()*3,v:40+Math.random()*60});for(const b of bub)b.y-=(b.v+(dead?0:v*.25))*dt;bub=bub.filter(b=>b.y>-10);
      if(dead){deadT+=dt;if(deadT>1.2&&!this.done){const m=Math.floor(dist/10/K);finish({title:'Caught in the reef!',score:m+shells*5,unit:'points',sub:`${m} m swum · ${shells} shells`,coins:shells+Math.floor(m/40)})}return}
      hint-=dt;v=Math.min(560,230+t*7)*K;const dy=v*dt;dist+=dy;
      x+=(clamp(tx,R(),W-R())-x)*Math.min(1,dt*14);
      for(const o of objs){o.y+=dy;if(o.vx){o.x+=o.vx*dt;if(o.x<0&&o.vx<0||o.x+o.w>W&&o.vx>0)o.vx*=-1}}
      for(const s of sh){s.y+=dy;if(magnet>0){const ddx=x-s.x,ddy=y-s.y,d=Math.hypot(ddx,ddy)||1;if(d<240*K){s.x+=ddx/d*600*K*dt;s.y+=ddy/d*600*K*dt}}}

      for(let i=sh.length-1;i>=0;i--){const s=sh[i];if(Math.hypot(s.x-x,s.y-y)<R()+12*K){sh.splice(i,1);shells++;sfx('coin');burst(s.x,s.y,'255,220,120',6)}else if(s.y>H+30)sh.splice(i,1)}

      for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.y>H+40){objs.splice(i,1);continue}
        if(hitRect(x,y,R()*.82,o)){if(shield){shield=0;objs.splice(i,1);sfx('pop');buzz(60);burst(x,y-10,'160,230,255',18);flash=.3}else{dead=true;sfx('hit');buzz(220);burst(x,y,'255,255,255',24);flash=.5;return}}}
      setScore(`${Math.floor(dist/10/K)} m · ${shells}`)},
    draw(g,T){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1aa6c8');gr.addColorStop(.6,'#0d6a9a');gr.addColorStop(1,'#0a3f6a');g.fillStyle=gr;g.fillRect(0,0,W,H);

      for(const s of sh){icon(g,'shell',s.x,s.y,24*K,'#ffc94a',false,T)}
      for(const p of pw){g.fillStyle='rgba(200,240,255,.25)';g.strokeStyle='#bff8ff';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,16*K+Math.sin(T*5)*2,0,7);g.fill();g.stroke();g.fillStyle='#fff';g.font=`900 ${14*K}px Nunito Sans, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(p.k==='shield'?'S':'M',p.x,p.y+1);g.textBaseline='alphabetic'}
      for(const o of objs){if(o.k==='jelly')icon(g,'jelly',o.x+o.w/2,o.y+o.h/2+Math.sin(T*3+o.ph)*3,o.w*1.15,'#c08aff',false,T+o.ph);
        else if(o.k==='net'){g.strokeStyle='rgba(230,230,220,.9)';g.lineWidth=1.5;g.strokeRect(o.x,o.y,o.w,o.h);g.beginPath();for(let xx=o.x;xx<=o.x+o.w;xx+=8*K){g.moveTo(xx,o.y);g.lineTo(xx,o.y+o.h)}for(let yy=o.y;yy<=o.y+o.h;yy+=8*K){g.moveTo(o.x,yy);g.lineTo(o.x+o.w,yy)}g.stroke();g.fillStyle='#ff9a3d';for(let xx=o.x;xx<=o.x+o.w;xx+=o.w/3){g.beginPath();g.arc(xx,o.y,4*K,0,7);g.fill()}}
        else if(o.k==='bag'){g.fillStyle='rgba(240,245,250,.75)';g.beginPath();const w2=Math.sin(T*4+o.ph)*3;g.moveTo(o.x+4,o.y);g.lineTo(o.x+o.w-4,o.y);g.quadraticCurveTo(o.x+o.w+w2,o.y+o.h*.6,o.x+o.w-6,o.y+o.h);g.lineTo(o.x+6,o.y+o.h);g.quadraticCurveTo(o.x-w2,o.y+o.h*.6,o.x+4,o.y);g.fill();g.strokeStyle='rgba(150,170,190,.8)';g.lineWidth=1;g.stroke()}
        else{g.strokeStyle='#5a8a3a';g.lineWidth=o.h*.7;g.lineCap='round';g.beginPath();for(let i=0;i<=10;i++){const u=i/10;g.lineTo(o.x+u*o.w,o.y+o.h/2+Math.sin(T*6+u*7)*5*K)}g.stroke();g.lineCap='butt';g.fillStyle='#111';const hx=o.vx>0?o.x+o.w:o.x;g.beginPath();g.arc(hx,o.y+o.h/2,2.2*K,0,7);g.fill()}}
      if(!dead||Math.floor(deadT*10)%2===0){g.save();g.translate(x,y);g.rotate(clamp((tx-x)/200,-.4,.4));icon(g,'turtle',0,0,46*K,'#5fbf6a',false,T*2);g.restore();
        if(shield){g.strokeStyle='rgba(190,250,255,.85)';g.lineWidth=3;g.beginPath();g.arc(x,y,30*K+Math.sin(T*6)*2,0,7);g.stroke()}
        if(magnet>0){g.strokeStyle=`rgba(255,201,74,${.3+.3*Math.sin(T*10)})`;g.lineWidth=2;g.beginPath();g.arc(x,y,40*K,0,7);g.stroke()}}

/* ================= COCONUT STACK ================= */
function makeStack(){

  function place(){if(over||ready>0)return;const p=blocks[blocks.length-1];const l=Math.max(cb.x,p.x),r=Math.min(cb.x+cb.w,p.x+p.w),ov=r-l;
    if(ov<=0){over=true;deb.push({x:cb.x,w:cb.w,i:cb.i,y:0,vy:0,vx:dir*60,rot:0});sfx('hit');buzz(160);return}

    else{combo=0;nb={x:l,w:ov,i:cb.i};const cut=cb.x<p.x?{x:cb.x,w:p.x-cb.x}:{x:r,w:cb.x+cb.w-r};deb.push({x:cut.x,w:cut.w,i:cb.i,y:0,vy:0,vx:(cb.x<p.x?-1:1)*40,rot:0});sfx('place')}
    blocks.push(nb);dir*=-1;newBlock();setScore(`Height ${blocks.length-1}`)}
  const scrY=i=>base-i*bh()+camY;
  return{action:true,_t:()=>({cb,p:blocks[blocks.length-1],n:blocks.length}),
    start(){base=H-120*K;maxW=W*.62;blocks=[{x:(W-maxW)/2,w:maxW,i:0}];newBlock();setScore('Height 0')},
    resize(){base=H-120*K},
    down(){place()},
    update(dt){t+=dt;ready-=dt;for(const f of floats){f.y-=40*dt;f.l-=dt*.9}floats=floats.filter(f=>f.l>0);
      for(const d of deb){d.vy+=900*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.rot+=d.vx*.004*dt}deb=deb.filter(d=>d.y<H+400);
      const target=Math.max(0,(blocks.length-1)*bh()-H*.4);camY+=(target-camY)*Math.min(1,dt*5);
      if(over){overT+=dt;if(overT>1.1&&!this.done){const h=blocks.length-1;finish({title:'The tower toppled!',score:h,unit:'blocks high',sub:`${perf} perfect drops`,coins:Math.floor(h/2)+perf})}return}
      cb.x+=dir*spd*dt;if(cb.x+cb.w>W+cb.w*.35&&dir>0||cb.x<-cb.w*.35&&dir<0)dir*=-1},
    draw(g,T){const h=blocks.length;const sky=g.createLinearGradient(0,0,0,H);const k2=clamp(h/40,0,1);sky.addColorStop(0,mix('#3ba8e8','#0a0f2e',k2));sky.addColorStop(1,mix('#bfe9ff','#4a2a6a',k2));g.fillStyle=sky;g.fillRect(0,0,W,H);

  function slide(dir){if(moving||over)return;const dr=[-1,0,1,0][dir],dc=[0,1,0,-1][dir];const rows=[0,1,2,3],cols=[0,1,2,3];if(dr===1)rows.reverse();if(dc===1)cols.reverse();

    draw(g,T){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#123e5e');gr.addColorStop(1,'#071a2e');g.fillStyle=gr;g.fillRect(0,0,W,H);
      const bs=cs*N+gap*(N+1);g.fillStyle='#eaf6f7';g.font=`900 ${12*K}px Nunito Sans, sans-serif`;g.textAlign='left';g.fillText('SCORE',ox,TOP+22*K);g.textAlign='right';g.fillText('BEST',ox+bs,TOP+22*K);
      g.font=`400 ${28*K}px Luckiest Guy, sans-serif`;g.textAlign='left';g.fillStyle='#ffc94a';g.fillText(fmt(shown),ox,TOP+54*K);g.textAlign='right';g.fillStyle='#eaf6f7';g.fillText(fmt(Math.max(best0,score)),ox+bs,TOP+54*K);
      g.fillStyle='#8fb2bd';g.font=`700 ${11.5*K}px Nunito Sans, sans-serif`;g.textAlign='center';g.fillText('Swipe to slide. Match two of a kind to grow them into a Pearl.',W/2,oy-12*K);

        g.fillStyle=t.v<=4?'#6a4a2a':'#fff';const fs=t.v<100?cs*.42:t.v<1000?cs*.34:cs*.27;g.font=`400 ${fs}px Luckiest Guy, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(t.v,0,-cs*.06);g.font=`900 ${cs*.13}px Nunito Sans, sans-serif`;g.globalAlpha=.85;g.fillText((NAMES[t.v]||'Legend').toUpperCase(),0,cs*.3);g.globalAlpha=1;g.textBaseline='alphabetic';g.restore()}

  function finishRun(quit){finish({title:quit?'Final score':'No more moves',score,unit:'points',sub:`Biggest tile: ${Math.max(...tiles.map(t=>t.v))}`,coins:Math.round(score/120)})}}

/* ================= RIVER PATH: rotate channels to water every hut ================= */
function makePath(opt){
  const lv=opt.level||S.lvl.path||1,n=Math.min(8,4+Math.floor((lv-1)/3));

  const N1=1,E=2,S2=4,Wb=8,rot1=m=>((m<<1)|(m>>3))&15,opp={1:4,2:8,4:1,8:2},DIR=[[1,-1,0],[2,0,1],[4,1,0],[8,0,-1]];

    while(front.length){const i=Math.random()<.7?front[front.length-1]:front[ri(front.length)];const r=i/n|0,c=i%n;const nb=DIR.filter(([b,dr,dc])=>{const r2=r+dr,c2=c+dc;return r2>=0&&r2<n&&c2>=0&&c2<n&&!vis.has(r2*n+c2)});

    minTaps=0;for(const cl of cells){const k=ri(4);let m=cl.sol;for(let i=0;i<k;i++)m=rot1(m);cl.cur=m;let need=0,x=m;while(x!==cl.sol&&need<4){x=rot1(x);need++}minTaps+=need;cl.ang=cl.tgt=0}
    if(minTaps===0){const cl=cells.find(c=>c.sol!==rot1(rot1(c.sol))&&c.sol!==rot1(c.sol))||cells[0];cl.cur=rot1(cl.cur);minTaps=3}flood()}
  function flood(){flow=new Set([src]);const q=[src];while(q.length){const i=q.pop(),r=i/n|0,c=i%n,m=cells[i].cur;for(const[bit,dr,dc]of DIR){if(!(m&bit))continue;const r2=r+dr,c2=c+dc;if(r2<0||r2>=n||c2<0||c2>=n)continue;const j=r2*n+c2;if(flow.has(j))continue;if(cells[j].cur&opp[bit]){flow.add(j);q.push(j)}}}}

    start(){layout();gen()},resize(){layout()},
    down(x,y){if(won)return;const c=Math.floor((x-ox)/cs),r=Math.floor((y-oy)/cs);if(r<0||r>=n||c<0||c>=n)return;const cl=cells[r*n+c];cl.cur=rot1(cl.cur);cl.tgt+=Math.PI/2;taps++;sfx('tap');const before=flow.size;flood();if(flow.size>before){sfx('pop');ripple.push({x:ox+c*cs+cs/2,y:oy+r*cs+cs/2,l:1})}
      if(solved()){won=true;sfx('win');buzz([40,40,120]);const st=taps<=minTaps+1?3:taps<=Math.ceil(minTaps*1.5)+2?2:1;S.lvl.path=Math.max(S.lvl.path,lv+1);S.stars['path'+lv]=Math.max(S.stars['path'+lv]||0,st);
        setTimeout(()=>finish({title:`Island ${lv} watered!`,score:taps,unit:`taps · best possible ${minTaps}`,stars:st,win:true,noBest:1,coins:st*6+n,next:{level:lv+1},again:{level:lv}}),1300)}},
    update(dt){for(const cl of cells){cl.ang+=(cl.tgt-cl.ang)*Math.min(1,dt*16)}for(const p of ripple)p.l-=dt*2;ripple=ripple.filter(p=>p.l>0);if(won)wonT+=dt;setScore(`${taps} taps`)},
    draw(g,T){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2bb5c4');gr.addColorStop(1,'#0a4a6e');g.fillStyle=gr;g.fillRect(0,0,W,H);
      g.fillStyle='#eaf6f7';g.font=`900 ${13*K}px Nunito Sans, sans-serif`;g.textAlign='center';g.fillText(`ISLAND ${lv} · ${n}×${n}`,W/2,TOP+22*K);g.fillStyle='#d8f4f2';g.font=`700 ${12*K}px Nunito Sans, sans-serif`;g.fillText('Tap tiles to turn the river. Water every hut from the spring.',W/2,TOP+44*K);

      const bs=cs*n;rr(g,ox-10,oy-10,bs+20,bs+20,22*K);g.fillStyle='#f0deb0';g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=3;g.stroke();
      for(let i=0;i<n*n;i++){const r=i/n|0,c=i%n,cl=cells[i],x=ox+c*cs+cs/2,y=oy+r*cs+cs/2,wet=flow.has(i);
        rr(g,ox+c*cs+2,oy+r*cs+2,cs-4,cs-4,8*K);g.fillStyle=wet?'#e2f0c8':'#ead2a0';g.fill();

        if(wet&&!won){g.fillStyle='rgba(255,255,255,.6)';const ph=(T*1.5+(r+c)*.3)%1;for(const[bit]of DIR){if(!(m&bit))continue;const a={1:-Math.PI/2,2:0,4:Math.PI/2,8:Math.PI}[bit];g.beginPath();g.arc(Math.cos(a)*cs*.5*ph,Math.sin(a)*cs*.5*ph,1.6*K,0,7);g.fill()}}
        g.restore();
        if(i===src){g.fillStyle='#1f86c4';g.beginPath();g.arc(x,y,cs*.26,0,7);g.fill();g.fillStyle='#bff8ff';for(let k=0;k<3;k++){const a=T*2+k*2.1;g.beginPath();g.arc(x+Math.cos(a)*cs*.1,y+Math.sin(a)*cs*.1,cs*.06,0,7);g.fill()}}

      for(const p of ripple){g.strokeStyle=`rgba(255,255,255,${p.l})`;g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,cs*(.6-p.l*.3),0,7);g.stroke()}
      if(won)bigText(g,'Watered!',W/2,oy+cs*n/2,46*K,'#ffc94a',Math.min(1,wonT*3))}};}

/* ================= ISLAND SUDOKU ================= */
const popc=m=>{let c=0;while(m){m&=m-1;c++}return c};
function sudSolve(grid,limit){const a=grid.slice();let sols=0,sol=null;
  const cand=i=>{const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3;let u=0;for(let k=0;k<9;k++){u|=1<<a[r*9+k];u|=1<<a[k*9+c];u|=1<<a[(br+(k/3|0))*9+bc+k%3]}return~u&0x3FE};

    if(best<0){sols++;if(!sol)sol=a.slice();return}if(!bc)return;for(let d=1;d<=9;d++)if(bm>>d&1){a[best]=d;rec();if(sols>=limit)break}a[best]=0};
  rec();return{sols,sol}}
function sudGen(diff){const a=Array(81).fill(0);const fillR=i=>{if(i===81)return true;const r=i/9|0,c=i%9;for(const d of shuffle([1,2,3,4,5,6,7,8,9])){let ok=true;for(let k=0;k<9&&ok;k++){if(a[r*9+k]===d||a[k*9+c]===d||a[(r-r%3+(k/3|0))*9+c-c%3+k%3]===d)ok=false}if(ok){a[i]=d;if(fillR(i+1))return true;a[i]=0}}return false};fillR(0);
  const full=a.slice(),p=a.slice(),target={easy:38,medium:47,hard:54}[diff];let removed=0;for(const i of shuffle([...Array(81).keys()])){if(removed>=target)break;const v=p[i];p[i]=0;if(sudSolve(p,2).sols!==1)p[i]=v;else removed++}return{p,full}}
function makeSudoku(opt){
  let diff=opt.diff||null,puz=null,vals,given,notes,sel=-1,notesOn=false,mist=0,hints=3,time=0,won=false,lost=false,btns=[],pad=[],tools=[],bs,cs,ox,oy,flashCell=-1,flashT=0,done9=new Set();
  function layout(){const top=TOP+44*K;bs=Math.min(W-20,H-top-170*K);cs=bs/9;ox=(W-bs)/2;oy=top;const py=oy+bs+14*K,pw=(bs-8*4)/9;pad=[];for(let d=1;d<=9;d++)pad.push({x:ox+(d-1)*(pw+4),y:py,w:pw,h:54*K,d,label:String(d),fs:24*K});
    const ty=py+64*K,tw=(bs-16)/3;tools=[{x:ox,y:ty,w:tw,h:44*K,k:'notes',label:'Notes'},{x:ox+tw+8,y:ty,w:tw,h:44*K,k:'erase',label:'Erase'},{x:ox+2*(tw+8),y:ty,w:tw,h:44*K,k:'hint',label:'Hint'}];
    const bw=Math.min(280*K,W-60);btns=['easy','medium','hard'].map((d,i)=>({x:(W-bw)/2,y:H*.36+i*72*K,w:bw,h:58*K,d,label:{easy:'Easy',medium:'Medium',hard:'Hard'}[d],fs:20*K}))}
  function begin(d){diff=d;puz=sudGen(d);vals=puz.p.slice();given=puz.p.map(v=>v>0);notes=Array(81).fill(0);sel=vals.indexOf(0);time=0;mist=0;hints=3;refresh();sfx('tap')}
  function refresh(){done9=new Set();for(let d=1;d<=9;d++){let n=0;for(let i=0;i<81;i++)if(vals[i]===d&&vals[i]===puz.full[i])n++;if(n===9)done9.add(d)}}

function showModal(h){$('#mbox').innerHTML=h;$('#modal').hidden=false}
function hideModal(){$('#modal').hidden=true}
function openGame(id,opt){const d=GAMES.find(x=>x.id===id);if(!d)return;hideModal();curDef=d;$('#hub').hidden=true;$('#game').hidden=false;$('#gTitle').textContent=d.n;paused=false;setScore('');resize();cur=d.make(opt||{});cur.done=false;cur.start&&cur.start();S.plays++;save()}
function toHub(){cur=null;curDef=null;paused=false;hideModal();$('#game').hidden=true;$('#hub').hidden=false;renderHub()}
function pauseGame(){if(!cur||cur.done)return;paused=true;showModal(`<div class="ot">Paused</div><div class="omut">${esc(curDef.n)}</div><div class="obtns"><button class="btn sea" id="pRes">Resume</button><button class="btn" id="pRe">Restart</button><button class="btn" id="pHome">Arcade</button></div>`);
  $('#pRes').onclick=()=>{hideModal();paused=false;last=performance.now()};$('#pRe').onclick=()=>openGame(curDef.id,cur&&cur._opt||{});$('#pHome').onclick=toHub}
$('#gPause').onclick=()=>{ac();pauseGame()};$('#gBack').onclick=toHub;
function finish(r){if(!cur||cur.done)return;cur.done=true;const d=curDef;let nb=false;
  if(!r.noBest&&r.score!=null&&r.score>(S.best[d.id]||0)){nb=(S.best[d.id]||0)>0;S.best[d.id]=r.score}
  let c=Math.max(0,Math.round(r.coins||0)),dbl=false;const today=dstr();if(S.daily.d!==today)S.daily={d:today,done:false};if(!S.daily.done&&dailyGame().id===d.id&&c>0){c*=2;dbl=true;S.daily.done=true}
  S.coins+=c;save();sfx(r.win===false||r.stars===0?'lose':'win');
  const st=r.stars!=null?`<div class="ostars">${[1,2,3].map(i=>`<i class="${i<=r.stars?'on':''}">★</i>`).join('')}</div>`:'';
  showModal(`<div class="ot">${esc(r.title)}</div>${st}${r.score!=null?`<div class="osc">${esc(r.scoreText||fmt(r.score))}</div><div class="omut">${esc(r.unit||'')}</div>`:''}${nb?'<div class="onew">New best!</div>':r.sub?`<div class="omut">${esc(r.sub)}</div>`:''}
    <div class="ocoin"><i class="coin"></i>+${c} coins${dbl?' · daily 2×':''}</div><div class="obtns">${r.next?'<button class="btn gold" id="oNext">Next level</button>':''}<button class="btn ${r.next?'':'sea'}" id="oAgain">${r.next?'Replay':'Play again'}</button><button class="btn" id="oHome">Arcade</button></div>`);
  if(r.next)$('#oNext').onclick=()=>openGame(d.id,r.next);$('#oAgain').onclick=()=>openGame(d.id,r.again||{});$('#oHome').onclick=toHub}
/* ---------- boot ---------- */
load();resize();renderHub();requestAnimationFrame(frame);
window.__arc={get S(){return S},get cur(){return cur},openGame,toHub,finish,GAMES,sudGen,sudSolve};

</script>
<script>
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&had){const b=document.createElement('button');b.className='btn gold';b.textContent='New version ready · Tap to update';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4)';b.onclick=()=>{try{localStorage.setItem('atoll-arcade-v1',JSON.stringify(window.__arc.S))}catch(e){}location.reload()};document.body.appendChild(b)}})});
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})})}
</script>
