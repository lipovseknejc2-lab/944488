:root{
  --paper:#efe8d8;--paper2:#e6dcc6;--card:#f7f2e6;--ink:#1d2a21;--ink2:#46534a;--ink3:#7d8578;--rule:#cdc2a8;
  --leaf:#2f6b3a;--leaf2:#4f8a46;--moss:#8aa04e;--khaki:#c3ae7c;--sand:#ddc99b;--terra:#b4532d;--ochre:#d0962a;--water:#2f7488;--sky:#8fb7c0;--night:#14201a;
  --cr:#b4302a;--en:#d06a2a;--vu:#d0a42a;--nt:#8aa04e;--lc:#2f6b3a;--ew:#5a3a6a;--dd:#7d8578;
  --f-disp:'Fraunces',Georgia,serif;--f-ui:'Figtree',system-ui,sans-serif;--f-mono:'Martian Mono',ui-monospace,monospace;--f-sign:'Big Shoulders Display','Figtree',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -12px rgba(20,32,26,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a241d;--paper2:#223027;--card:#202c24;--ink:#ece4cf;--ink2:#c2bba6;--ink3:#8e927f;--rule:#3a4a3e;--shadow:0 10px 30px -12px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--paper:#1a241d;--paper2:#223027;--card:#202c24;--ink:#ece4cf;--ink2:#c2bba6;--ink3:#8e927f;--rule:#3a4a3e;--shadow:0 10px 30px -12px rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- top instrument strip ---------- */
#strip{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 6px) 10px 6px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:20}
#strip>*{pointer-events:auto}
.mark{display:flex;align-items:center;gap:7px;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 11px 4px 5px;box-shadow:var(--shadow)}
.mark svg{width:26px;height:26px}
.mark b{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-sign);font-weight:800;letter-spacing:.14em;font-size:15px}
.gauges{display:flex;flex:1;min-width:0;gap:0;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-left:auto;overflow:hidden}
.gauge{padding:2px 6px;min-width:0;flex:1;line-height:1.05;overflow:hidden}
.gauge i{display:block;font-style:normal;font-family:var(--f-mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.gauge b{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;white-space:nowrap}
.gauge+.gauge{border-left:1px dashed var(--rule)}
.stars{color:var(--ochre);letter-spacing:-1px}
#speed{display:flex;background:var(--ink);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
#speed button{width:27px;height:30px;border-radius:9px;color:var(--paper);font-family:var(--f-mono);font-size:11px;font-weight:600}
#speed button.on{background:var(--ochre);color:var(--ink)}

@media (max-width:520px){.mark b{display:none}.mark{padding:4px}#strip{gap:5px;padding-left:6px;padding-right:6px}}
/* ---------- ticker / notes ---------- */
#notes{position:absolute;left:10px;right:10px;top:calc(var(--safe-t) + 52px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;z-index:25}
.note{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--leaf);padding:7px 12px 7px 10px;border-radius:4px 12px 12px 4px;font-size:13px;box-shadow:var(--shadow);max-width:92%;animation:noteIn .35s cubic-bezier(.2,1.4,.4,1)}
.note.bad{border-left-color:var(--terra)}.note.gold{border-left-color:var(--ochre)}
.note small{display:block;font-family:var(--f-mono);font-size:9px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
@keyframes noteIn{from{transform:translateY(-8px) scale(.96);opacity:0}}

/* ---------- objectives card (field notes) ---------- */
#goal{position:absolute;left:10px;top:calc(var(--safe-t) + 52px);max-width:230px;background:repeating-linear-gradient(var(--card) 0 19px,var(--rule) 19px 20px);border:1px solid var(--rule);border-radius:3px;padding:6px 10px 6px 26px;font-size:12.5px;line-height:20px;box-shadow:var(--shadow);z-index:15;transform:rotate(-.6deg)}
#goal:before{content:'';position:absolute;left:16px;top:0;bottom:0;border-left:1px solid var(--terra);opacity:.5}
#goal h6{margin:0;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--terra);font-weight:600;text-transform:uppercase}
#goal .done{text-decoration:line-through;color:var(--ink3)}
#goal button{position:absolute;right:4px;top:2px;font-size:14px;color:var(--ink3);width:22px;height:22px}

/* ---------- dock (index-card tabs) ---------- */
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 8px calc(var(--safe-b) + 8px);display:flex;justify-content:center;gap:4px;z-index:45;pointer-events:none}
#dock button{pointer-events:auto;flex:1;max-width:76px;background:var(--card);border:1px solid var(--rule);border-radius:12px 12px 6px 6px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);position:relative;transition:transform .18s}
#dock button svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#dock button span{font-family:var(--f-sign);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
#dock button.on{background:var(--ink);color:var(--paper);transform:translateY(-4px)}
#dock button.on svg{stroke:var(--paper)}
#dock .badge{position:absolute;top:-5px;right:6px;background:var(--terra);color:#fff;font-family:var(--f-mono);font-size:9px;border-radius:9px;padding:1px 5px;font-weight:700}

/* ---------- sheet (field journal) ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:78%;height:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.55);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;touch-action:pan-y}
#sheet.open{transform:none}
#sheet.tall{height:92%;max-height:92%}
#sheet .grip{height:22px;flex:none;display:flex;justify-content:center;align-items:center;cursor:grab}
#sheet .grip:before{content:'';width:44px;height:5px;border-radius:5px;background:var(--rule)}
#sheet header{flex:none;padding:0 16px 8px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--rule)}
#sheet header h2{margin:0;font-family:var(--f-disp);font-weight:600;font-size:25px;letter-spacing:-.01em;font-variation-settings:'SOFT' 50,'WONK' 1}
#sheet header .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
#sheet header .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--paper2);font-size:18px;flex:none}
#sheet .tabs{flex:none;display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
#sheet .tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);font-size:12.5px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--leaf);border-color:var(--leaf);color:#f4efe2}
#sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--safe-b) + 90px);touch-action:pan-y;overscroll-behavior:contain}

/* ---------- shared bits ---------- */
.lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--f-mono)}
.h3{font-family:var(--f-disp);font-size:18px;font-weight:600;margin:14px 0 6px}
.muted{color:var(--ink3)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:6px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.alt{background:var(--paper2);color:var(--ink);border:1px solid var(--rule)}
.btn.leaf{background:var(--leaf);color:#f4efe2}.btn.terra{background:var(--terra);color:#fff}.btn.gold{background:var(--ochre);color:var(--ink)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{border-color:var(--leaf2);color:var(--leaf)}.chip.bad{border-color:var(--terra);color:var(--terra)}.chip.warn{border-color:var(--ochre);color:#9a6a10}
.iucn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--f-mono);font-size:9px;font-weight:700;color:#fff;flex:none}
.iucn.CR{background:var(--cr)}.iucn.EN{background:var(--en)}.iucn.VU{background:var(--vu);color:#1d2a21}.iucn.NT{background:var(--nt)}.iucn.LC{background:var(--lc)}.iucn.EW{background:var(--ew)}.iucn.DD{background:var(--dd)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px;position:relative}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.985)}
.card.sel{outline:2.5px solid var(--leaf);outline-offset:-1px}
.list{display:flex;flex-direction:column;gap:8px}
.meter{height:6px;border-radius:6px;background:var(--paper2);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--leaf2)}
.meter.warn i{background:var(--ochre)}.meter.bad i{background:var(--terra)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.kv dt{color:var(--ink3);font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}.kv dd{margin:0}
.thumb{width:64px;height:48px;flex:none;border-radius:10px;background:var(--paper2);display:block}
.thumb.lg{width:96px;height:72px}
.empty{padding:26px 10px;text-align:center;color:var(--ink3);font-size:13px;border:1.5px dashed var(--rule);border-radius:14px}
.empty b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink2);margin-bottom:4px}
.seg{display:flex;background:var(--paper2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:12px;font-weight:700}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--rule)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
input[type=range]{width:100%;accent-color:var(--leaf)}
.field{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--rule);background:var(--card)}
.price{font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.tag{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--paper2);color:var(--ink2)}
.tag.rare{background:#5a3a6a;color:#f2e6f8}.tag.line{background:var(--ochre);color:var(--ink)}.tag.baby{background:var(--sky);color:var(--ink)}
.stamp{display:inline-block;border:2px solid var(--terra);color:var(--terra);font-family:var(--f-sign);font-weight:800;letter-spacing:.14em;padding:2px 8px;border-radius:5px;transform:rotate(-6deg);text-transform:uppercase;font-size:12px;opacity:.85}
hr.dash{border:0;border-top:1px dashed var(--rule);margin:12px 0}

/* ---------- build bar ---------- */
#buildbar{position:absolute;left:8px;right:8px;bottom:calc(var(--safe-b) + 8px);z-index:35;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px;box-shadow:var(--shadow);display:none}
#buildbar.on{display:block}
#buildbar .hint{font-size:12.5px;opacity:.85;margin-bottom:8px;line-height:1.35}
#buildbar .hint b{font-family:var(--f-sign);letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:var(--ochre);margin-right:6px}
#buildbar .btn.alt{background:#2c3a30;color:var(--paper);border-color:#3e4e42}
#buildbar .opts{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#buildbar .opts::-webkit-scrollbar{display:none}
#buildbar .opt{flex:none;padding:6px 10px;border-radius:10px;background:#2c3a30;font-size:12px;font-weight:700;border:1px solid transparent}
#buildbar .opt.on{border-color:var(--ochre);color:var(--ochre)}
#buildbar .cost{font-family:var(--f-mono);font-size:12px;color:var(--ochre)}

/* ---------- inspector pop ---------- */
#pop{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-b) + 84px);z-index:32;display:none}
#pop.on{display:block;animation:noteIn .25s}
#pop .card{box-shadow:var(--shadow);padding:12px}

/* ---------- full overlays ---------- */
.over{position:absolute;inset:0;z-index:60;display:none;background:rgba(10,16,12,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.over.on{display:flex;align-items:center;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border-radius:20px;width:min(94vw,440px);max-height:88vh;overflow-y:auto;padding:18px;box-shadow:var(--shadow);touch-action:pan-y}
.modal h3{margin:0 0 6px;font-family:var(--f-disp);font-size:22px}

/* ---------- side / cross-section view ---------- */
#side{position:absolute;inset:0;z-index:50;display:none;background:var(--night);flex-direction:column}
#side.on{display:flex}
#side header{padding:calc(var(--safe-t) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;color:#ece4cf}
#side header h2{margin:0;font-family:var(--f-disp);font-size:21px;font-weight:600}
#side header .lbl{color:#9aa294}
#side canvas{flex:1;width:100%;min-height:0;display:block}
#side .ctl{background:var(--paper);border-radius:20px 20px 0 0;padding:12px 14px calc(var(--safe-b) + 12px);max-height:44%;overflow-y:auto;touch-action:pan-y}

/* ---------- certificate ---------- */
.cert{background:#f6efdc;color:#1d2a21;border-radius:6px;padding:18px 16px;position:relative;width:min(94vw,430px);max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 40%),repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,60,.035) 3px 4px);touch-action:pan-y}
.cert:before{content:'';position:absolute;inset:7px;border:1.5px solid #1d2a21;border-radius:3px;pointer-events:none}
.cert:after{content:'';position:absolute;inset:11px;border:.5px solid #1d2a21;border-radius:2px;pointer-events:none}
.cert .ch{text-align:center;font-family:var(--f-sign);letter-spacing:.3em;font-size:11px;font-weight:700}
.cert h3{font-family:var(--f-disp);font-style:italic;font-weight:500;text-align:center;font-size:27px;margin:4px 0 0}
.cert .sci{text-align:center;font-family:var(--f-disp);font-style:italic;color:#46534a}
.cert .seal{position:absolute;right:20px;top:66px;width:74px;height:74px}
.cert .kv dt{color:#7d8578}
.cert canvas{width:100%;height:150px;display:block;border-top:1px solid #cdc2a8;border-bottom:1px solid #cdc2a8;margin:10px 0}
.tree{font-family:var(--f-mono);font-size:10.5px;line-height:1.5}

/* ---------- magazines ---------- */
.mag{border-radius:6px;overflow:hidden;position:relative;color:#fff;min-height:250px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.mag.ff{background:linear-gradient(170deg,#28472f,#0f1d13);font-family:var(--f-disp)}
.mag.ff .mt{font-family:var(--f-disp);font-weight:900;font-size:44px;letter-spacing:-.04em;line-height:.85;font-variation-settings:'SOFT' 100,'WONK' 1;color:#e9d9a8}
.mag.wl{background:#0b0b0b;font-family:var(--f-sign)}
.mag.wl .mt{font-family:var(--f-sign);font-weight:900;font-size:62px;line-height:.8;letter-spacing:-.01em;text-transform:uppercase;color:#f2d21a}
.mag.nr{background:#f3efe4;color:#1a1a1a;border:1px solid #cdc2a8}
.mag.nr .mt{font-family:var(--f-disp);font-weight:400;font-style:italic;font-size:30px;border-bottom:3px double #1a1a1a;padding-bottom:4px;text-align:center}
.mag canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.mag>*{position:relative}
.review{border-left:3px solid var(--ochre);padding:4px 0 4px 10px;margin:8px 0;font-family:var(--f-disp);font-style:italic;font-size:14.5px;line-height:1.4}

/* ---------- onboarding ---------- */
#intro{position:absolute;inset:0;z-index:80;background:var(--night);color:#ece4cf;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#intro.on{display:flex}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .in{position:relative;max-width:380px}
#intro h1{font-family:var(--f-sign);font-weight:900;letter-spacing:.24em;font-size:46px;margin:12px 0 0;padding-left:.24em}
#intro p{font-family:var(--f-disp);font-style:italic;font-size:17px;opacity:.85;line-height:1.45}
#intro .field{background:rgba(255,255,255,.06);border-color:#3a4a3e;color:#ece4cf;text-align:center;font-family:var(--f-disp);font-size:18px}
#intro .lbl{color:#9aa294}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.pick button{border:1px solid #3a4a3e;border-radius:14px;padding:10px 6px;text-align:center;font-size:12px}
.pick button b{display:block;font-family:var(--f-sign);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.pick button.on{border-color:var(--ochre);background:rgba(208,150,42,.14)}
</style>
</head>

function hueShift(hex,deg,sat=0,lit=0){let[r,g,b]=hexToRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  h=(h+deg+360)%360;s=clamp(s+sat,0,1);l=clamp(l+lit,0,1);const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(h/60%2-1)),m=l-c/2;let[R,G,B]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return rgbToHex((R+m)*255,(G+m)*255,(B+m)*255)}

/* ---------- geometry ---------- */
function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>y)!==(b.y>y))&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function polyArea(p){let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=(p[j].x+p[i].x)*(p[j].y-p[i].y);return Math.abs(s/2)}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y});return{x:x/p.length,y:y/p.length}}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;p.forEach(q=>{a=Math.min(a,q.x);b=Math.min(b,q.y);c=Math.max(c,q.x);d=Math.max(d,q.y)});return{x0:a,y0:b,x1:c,y1:d}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
/* smooth a polygon: points flagged r (round) become Chaikin-like curves, sharp points stay */
function smoothPoly(pts,closed=true,steps=6){if(pts.length<3)return pts.map(p=>({x:p.x,y:p.y}));const out=[];const n=pts.length;
  for(let i=0;i<n;i++){if(!closed&&(i===0||i===n-1)){out.push({x:pts[i].x,y:pts[i].y});continue}
    const p=pts[i],a=pts[(i-1+n)%n],b=pts[(i+1)%n];
    if(!p.r){out.push({x:p.x,y:p.y});continue}
    const t=.45,s={x:lerp(p.x,a.x,t),y:lerp(p.y,a.y,t)},e={x:lerp(p.x,b.x,t),y:lerp(p.y,b.y,t)};
    for(let k=0;k<=steps;k++){const u=k/steps,iu=1-u;out.push({x:iu*iu*s.x+2*iu*u*p.x+u*u*e.x,y:iu*iu*s.y+2*iu*u*p.y+u*u*e.y})}}
  return out}
/* Catmull-Rom spline through path points */
function spline(pts,seg=8){if(pts.length<3)return pts.map(p=>({x:p.x,y:p.y}));const out=[];
  for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;out.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)})}}
  out.push({x:pts[pts.length-1].x,y:pts[pts.length-1].y});return out}
function polyLen(p){let l=0;for(let i=1;i<p.length;i++)l+=dist(p[i-1],p[i]);return l}
function pointAt(p,d){for(let i=1;i<p.length;i++){const l=dist(p[i-1],p[i]);if(d<=l||i===p.length-1){const t=l?clamp(d/l,0,1):0;return{x:lerp(p[i-1].x,p[i].x,t),y:lerp(p[i-1].y,p[i].y,t),a:Math.atan2(p[i].y-p[i-1].y,p[i].x-p[i-1].x)}}d-=l}return{x:p[0].x,y:p[0].y,a:0}}
function randInPoly(poly,tries=40){const b=bbox(poly);for(let i=0;i<tries;i++){const x=rnd(b.x0,b.x1),y=rnd(b.y0,b.y1);if(pip(x,y,poly))return{x,y}}return centroid(poly)}
function polysOverlap(A,B){for(const p of A)if(pip(p.x,p.y,B))return true;for(const p of B)if(pip(p.x,p.y,A))return true;
  for(let i=0;i<A.length;i++){const a1=A[i],a2=A[(i+1)%A.length];for(let j=0;j<B.length;j++){const b1=B[j],b2=B[(j+1)%B.length];const d=(a2.x-a1.x)*(b2.y-b1.y)-(a2.y-a1.y)*(b2.x-b1.x);if(!d)continue;const t=((b1.x-a1.x)*(b2.y-b1.y)-(b1.y-a1.y)*(b2.x-b1.x))/d,u=((b1.x-a1.x)*(a2.y-a1.y)-(b1.y-a1.y)*(a2.x-a1.x))/d;if(t>0&&t<1&&u>0&&u<1)return true}}return false}

function checksum(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function saveGame(){if(!S||!S.blds||!S.blds.length)return;try{const g=S.guests;S.guests=[];const j=JSON.stringify(S);S.guests=g;localStorage.setItem(SAVE_KEY,j);localStorage.setItem(SAVE_KEY+'.c',checksum(j))}catch(e){console.warn('save failed',e)}}

  o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[2]+.05);o.start(t);o.stop(t+P[2]+.06)}catch(e){}}

  bred:0,lastBirth:-9999,preg:null,notes:[]};
  if(!S.book)S.book={};S.book[a.id]={sp:spId,n:a.name,s:a.sex,b:Math.floor(a.born),m:a.mother,f:a.father,o:a.origin,l:a.line,mo:a.gen.morph};

let CV,CX,VW=0,VH=0,DPR=1;
function resize(){CV=$('map');DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;CV.width=VW*DPR;CV.height=VH*DPR;CX=CV.getContext('2d')}
const wx2s=x=>(x-CAM.x)*CAM.z+VW/2, wy2s=(y,h=0)=>(y-CAM.y)*CAM.z*TILT+VH/2-h*CAM.z*HZ;
const s2w=(sx,sy)=>({x:(sx-VW/2)/CAM.z+CAM.x,y:(sy-VH/2)/(CAM.z*TILT)+CAM.y});
function onScreen(x,y,pad=60){const sx=wx2s(x),sy=wy2s(y);return sx>-pad&&sx<VW+pad&&sy>-pad*2&&sy<VH+pad}
function polyPath(ctx,pts,h=0){ctx.beginPath();pts.forEach((p,i)=>{const sx=wx2s(p.x),sy=wy2s(p.y,h);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy)});ctx.closePath()}
function plotOwned(x,y){return S.plots.includes(Math.floor(x/WORLD.plot)+','+Math.floor(y/WORLD.plot))}
function polyOwned(pts){return pts.every(p=>plotOwned(p.x,p.y))&&plotOwned(centroid(pts).x,centroid(pts).y)}
function landArea(){return S.plots.length*WORLD.plot*WORLD.plot}

/* ---------- ground (pre-rendered) ---------- */
let GROUND=null,_groundKey='';
function buildGround(){const key=S.plots.join(';');if(GROUND&&key===_groundKey)return;_groundKey=key;const sc=2,W=WORLD.w*sc;const g=document.createElement('canvas');g.width=g.height=W;const c=g.getContext('2d');
  c.fillStyle='#a9b77a';c.fillRect(0,0,W,W);const R=srng(7);
  for(let i=0;i<1600;i++){c.fillStyle=pick(['#9fae6e','#b3c084','#a4b474','#98a968','#bcc68e']);c.globalAlpha=.35;c.beginPath();c.ellipse(R()*W,R()*W,rnd(8,40),rnd(6,28),R()*3,0,7);c.fill()}c.globalAlpha=1;
  /* topographic contours — the house signature */
  c.strokeStyle='rgba(60,80,40,.16)';c.lineWidth=1.2;const hgt=(x,y)=>Math.sin(x*.006)*Math.cos(y*.005)*1.2+Math.sin((x+y)*.004)*.8+Math.cos(x*.011-y*.007)*.4;
  for(let lv=-2;lv<=2;lv+=.35){c.beginPath();for(let y=0;y<W;y+=6)for(let x=0;x<W;x+=6){const v=hgt(x,y)-lv,v2=hgt(x+6,y)-lv,v3=hgt(x,y+6)-lv;if(v*v2<0){c.moveTo(x+6*v/(v-v2),y);c.lineTo(x+6*v/(v-v2)+.8,y+.8)}if(v*v3<0){c.moveTo(x,y+6*v/(v-v3));c.lineTo(x+.8,y+6*v/(v-v3)+.8)}}c.stroke()}
  /* unowned land */
  for(let i=0;i<6;i++)for(let j=0;j<6;j++){if(S.plots.includes(i+','+j))continue;const x=i*WORLD.plot*sc,y=j*WORLD.plot*sc,s=WORLD.plot*sc;c.fillStyle='rgba(40,52,38,.42)';c.fillRect(x,y,s,s);c.strokeStyle='rgba(239,232,216,.08)';c.lineWidth=2;c.beginPath();for(let k=-s;k<s;k+=18){c.moveTo(x+k,y);c.lineTo(x+k+s,y+s)}c.save();c.beginPath();c.rect(x,y,s,s);c.clip();c.stroke();c.restore()}
  /* boundary line */
  c.strokeStyle='rgba(180,83,45,.75)';c.setLineDash([10,7]);c.lineWidth=3;for(let i=0;i<6;i++)for(let j=0;j<6;j++){if(!S.plots.includes(i+','+j))continue;const x=i*WORLD.plot*sc,y=j*WORLD.plot*sc,s=WORLD.plot*sc;[[0,-1,x,y,x+s,y],[0,1,x,y+s,x+s,y+s],[-1,0,x,y,x,y+s],[1,0,x+s,y,x+s,y+s]].forEach(([dx,dy,a,b,cc,d])=>{if(!S.plots.includes((i+dx)+','+(j+dy))){c.beginPath();c.moveTo(a,b);c.lineTo(cc,d);c.stroke()}})}c.setLineDash([]);
  GROUND=g}
/* ---------- caches of smoothed geometry ---------- */
function geoOf(o){const k=JSON.stringify(o.pts);if(o._gk!==k){o._gk=k;o._g=o.kind&&PATHS[o.kind]&&o.isPath?spline(o.pts,8):smoothPoly(o.pts);o._area=o.isPath?0:polyArea(o._g)}return o._g}
function pathGeo(p){const k=JSON.stringify(p.pts);if(p._gk!==k){p._gk=k;p._g=spline(p.pts,10);p._len=polyLen(p._g)}return p._g}

/* ---------- block building geometry ---------- */
function bldBlocks(b){if(b.blocks&&b.blocks.length)return b.blocks;return b.blocks=defaultBlocks(b.kind,b)}
function defaultBlocks(kind,b){const W=BLD[kind].w,D=BLD[kind].dpt,c=BLD[kind].col;const B=(s,x,y,z,w,d,h,col,o=0)=>({s,x,y,z,w,d,h,c:col,o});
  switch(kind){
    case'desk':return[B('cube',0,1,0,W,D-1,3,'#efe8d8'),B('roof',-.5,.5,3,W+1,D,2.2,'#b4532d'),B('arch',W/2-1.5,D-.2,0,3,.4,2.6,'#6a5434'),B('cube',1,D,0,2,.6,1.1,'#8a5e3a'),B('cyl',W-1.5,D,0,1,1,4.5,'#1d2a21')];

    case'kitchen':return[B('cube',0,0,0,W,D,3.6,'#ddc99b'),B('roof',0,0,3.6,W,D,2,'#6a5434',1),B('cyl',W-2,1,3.6,1.2,1.2,3,'#7a7e82'),B('arch',1,D-.1,0,3,.2,2.8,'#3a2a1c')];
    case'lab':return[B('cube',0,0,0,W,D,5,'#c8d8e0'),B('glass',1,D-.05,1,W-2,.1,3,'#8fb7c0'),B('dome',W/2-3,D/2-3,5,6,6,3,'#efe8d8'),B('cube',0,0,5,2,2,1.5,'#1d2a21')];
    case'nursery':return[B('cube',0,0,0,W,D,3,'#f0d8b0'),B('roof',0,0,3,W,D,2.6,'#d0962a'),B('arch',W/2-1.2,D-.1,0,2.4,.2,2.4,'#8a5e3a')];
    case'incubator':return[B('cube',0,0,0,W,D,2.8,'#f0e0a0'),B('dome',1,1,2.8,W-2,D-2,2.2,'#efe8d8')];
    case'breeding':return[B('cube',0,0,0,W,D,4,'#8a5e3a'),B('roof',0,0,4,W,D,3,'#3a2a1c'),B('arch',2,D-.1,0,3,.2,3,'#1d2a21'),B('arch',W-5,D-.1,0,3,.2,3,'#1d2a21')];
    case'rehab':return[B('cube',0,0,0,W,D,3.4,'#5a7a5a'),B('roof',0,0,3.4,W,D,2.4,'#2f6b3a',1),B('cube',W/2-.8,D-.05,.8,1.6,.2,1.6,'#efe8d8'),B('glass',1,D-.1,1,3,.2,1.6,'#8fb7c0')];
    case'greenhouse':return[B('glass',0,0,0,W,D,3,'#bfe0d0'),B('roof',0,0,3,W,D,2.4,'#dff0e8',1)];
    case'school':return[B('cube',0,0,0,W,D,4,'#7a8ab0'),B('cube',0,0,4,W*.6,D,3,'#9aa8c8'),B('roof',0,0,7,W*.6,D,2,'#3a4a6a'),B('arch',W-4,D-.1,0,3,.2,3,'#1d2a21')];
    case'cafe':return[B('cube',0,0,0,W,D,3.2,'#efe8d8'),B('wedge',-.5,D-1,3.2,W+1,2,1,'#d04a4a',2),B('cyl',2,D+1,0,1.6,1.6,1,'#8a5e3a'),B('cyl',W-3,D+1,0,1.6,1.6,1,'#8a5e3a')];
    case'toilets':return[B('cube',0,0,0,W,D,2.8,'#7a9ab0'),B('roof',0,0,2.8,W,D,1.4,'#3a4a5a')];
    case'shop':return[B('cube',0,0,0,W,D,3.4,'#a87ac8'),B('wedge',0,D-1.5,3.4,W,1.5,1.2,'#efe8d8',2),B('glass',1,D-.05,.4,W-2,.1,2,'#8fb7c0')];
    case'hide':return[B('cube',0,0,0,W,D,2.2,'#6a5434'),B('roof',-.3,-.3,2.2,W+.6,D+.6,1.2,'#3a2a1c'),B('cube',.6,D-.05,1.2,W-1.2,.1,.4,'#141414')];
    case'tower':return[B('cube',.5,.5,0,.5,.5,9,'#6a5434'),B('cube',W-1,.5,0,.5,.5,9,'#6a5434'),B('cube',.5,D-1,0,.5,.5,9,'#6a5434'),B('cube',W-1,D-1,0,.5,.5,9,'#6a5434'),B('cube',0,0,9,W,D,.4,'#8a5e3a'),B('roof',0,0,10.6,W,D,2,'#2f6b3a')];
    case'lodge':return[B('cube',0,0,0,W,D,3,'#9a8a6a'),B('roof',0,0,3,W,D,2.4,'#3a2a1c')];
    case'bench':return[B('cube',0,0,0,W,D,.45,'#8a5e3a')];
    default:return[B('cube',0,0,0,W,D,3,c),B('roof',0,0,3,W,D,2,'#6a5434')]}}
function bldFoot(b){const k=BLD[b.kind];const r=b.rot||0;const w=r%2?(b.d||k.dpt):(b.w||k.w),d=r%2?(b.w||k.w):(b.d||k.dpt);return{x0:b.x-w/2,y0:b.y-d/2,x1:b.x+w/2,y1:b.y+d/2,w,d}}
/* draw one block in world space; ox,oy = building origin (top-left), rot handled by caller */
function drawBlock(ctx,bk,ox,oy,P){const{s,x,y,z,w,d,h,c,o}=bk;const X=ox+x,Y=oy+y;const top=shade(c,.16),front=c,side=shade(c,-.18),edge=shade(c,-.45);
  const pt=(px,py,pz)=>[P.x(px),P.y(py,pz)];
  const quad=(pts,fill)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=.6;ctx.stroke()};
  const alpha=s==='glass'?.55:1;ctx.globalAlpha=alpha;
  if(s==='cube'||s==='arch'||s==='glass'){quad([pt(X,Y,z+h),pt(X+w,Y,z+h),pt(X+w,Y+d,z+h),pt(X,Y+d,z+h)],top);quad([pt(X,Y+d,z),pt(X+w,Y+d,z),pt(X+w,Y+d,z+h),pt(X,Y+d,z+h)],front);
    if(s==='arch'){ctx.globalAlpha=1;ctx.fillStyle='#1a1410';const cx=P.x(X+w/2),by=P.y(Y+d,z),r=(P.x(X+w)-P.x(X))*.32,ah=(P.y(Y+d,z)-P.y(Y+d,z+h))*.7;ctx.beginPath();ctx.moveTo(cx-r,by);ctx.lineTo(cx-r,by-ah+r);ctx.arc(cx,by-ah+r,r,Math.PI,0);ctx.lineTo(cx+r,by);ctx.closePath();ctx.fill()}
    if(s==='glass'){ctx.globalAlpha=.7;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;const x0=P.x(X),x1=P.x(X+w),y0=P.y(Y+d,z+h),y1=P.y(Y+d,z);ctx.beginPath();for(let i=1;i<4;i++){const xx=lerp(x0,x1,i/4);ctx.moveTo(xx,y0);ctx.lineTo(xx,y1)}ctx.moveTo(x0+(x1-x0)*.1,y1-(y1-y0)*.2);ctx.lineTo(x0+(x1-x0)*.3,y0+(y1-y0)*.1);ctx.stroke()}}
  else if(s==='wedge'){/* o: 0 rises to north, 1 east, 2 south, 3 west */const H=(px,py)=>{const u=(px-X)/w,v=(py-Y)/d;return z+h*[1-v,u,v,1-u][o||0]};
    const pts=[[X,Y],[X+w,Y],[X+w,Y+d],[X,Y+d]].map(([a,b])=>pt(a,b,H(a,b)));quad(pts,top);
    if(o===1||o===3)quad([pt(X,Y+d,z),pt(X+w,Y+d,z),pt(X+w,Y+d,H(X+w,Y+d)),pt(X,Y+d,H(X,Y+d))],front);else if(o===2)quad([pt(X,Y+d,z),pt(X+w,Y+d,z),pt(X+w,Y+d,z+h),pt(X,Y+d,z+h)],front)}
  else if(s==='roof'){if(o%2===0){/* ridge along x */const m=Y+d/2;quad([pt(X,Y,z),pt(X+w,Y,z),pt(X+w,m,z+h),pt(X,m,z+h)],side);quad([pt(X,m,z+h),pt(X+w,m,z+h),pt(X+w,Y+d,z),pt(X,Y+d,z)],front)}
    else{const m=X+w/2;quad([pt(X,Y,z),pt(m,Y,z+h),pt(m,Y+d,z+h),pt(X,Y+d,z)],top);quad([pt(m,Y,z+h),pt(X+w,Y,z),pt(X+w,Y+d,z),pt(m,Y+d,z+h)],side);quad([pt(X,Y+d,z),pt(X+w,Y+d,z),pt(m,Y+d,z+h)],front)}}
  else if(s==='cyl'||s==='dome'){const cx=P.x(X+w/2),rx=(P.x(X+w)-P.x(X))/2,cyB=P.y(Y+d/2,z),cyT=P.y(Y+d/2,z+h),ry=Math.abs(P.y(Y+d,0)-P.y(Y,0))/2;
    if(s==='cyl'){ctx.fillStyle=front;ctx.beginPath();ctx.ellipse(cx,cyB,rx,ry,0,0,Math.PI);ctx.lineTo(cx-rx,cyT);ctx.ellipse(cx,cyT,rx,ry,0,Math.PI,0,true);ctx.closePath();ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=.6;ctx.stroke();const g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(0,0,0,.22)');ctx.fillStyle=g;ctx.fill();ctx.fillStyle=top;ctx.beginPath();ctx.ellipse(cx,cyT,rx,ry,0,0,7);ctx.fill();ctx.stroke()}
    else{const g=ctx.createRadialGradient(cx-rx*.3,cyB-(cyB-cyT)*.7,1,cx,cyB,rx*1.2);g.addColorStop(0,top);g.addColorStop(1,side);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cyB,rx,cyB-cyT+ry,0,Math.PI,0);ctx.ellipse(cx,cyB,rx,ry,0,0,Math.PI);ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=.6;ctx.stroke()}}
  ctx.globalAlpha=1}
/* rotate block coords for building rotation */
function rotBlocks(blocks,W,D,rot){if(!rot)return blocks;return blocks.map(b=>{let{x,y,w,d,o}=b;for(let i=0;i<rot;i++){const nx=D-(y+d),ny=x;[x,y]=[nx,ny];[w,d]=[d,w];[W,D]=[D,W];o=o!=null?(o+1)%4:o}return{...b,x,y,w,d,o}})}
const MAPP={x:x=>wx2s(x),y:(y,z)=>wy2s(y,z)};
function drawBuilding(ctx,b,P=MAPP,ghost){const k=BLD[b.kind];const f=bldFoot(b);let blocks=rotBlocks(bldBlocks(b),b.w||k.w,b.d||k.dpt,b.rot||0);
  blocks=blocks.slice().sort((p,q)=>(p.y+p.d)-(q.y+q.d)||p.z-q.z);
  /* shadow */ctx.fillStyle='rgba(20,30,20,.18)';ctx.beginPath();ctx.moveTo(P.x(f.x0)+3,P.y(f.y0,0)+2);ctx.lineTo(P.x(f.x1)+6,P.y(f.y0,0)+2);ctx.lineTo(P.x(f.x1)+6,P.y(f.y1,0)+4);ctx.lineTo(P.x(f.x0)+3,P.y(f.y1,0)+4);ctx.fill();
  if(ghost)ctx.globalAlpha=.6;blocks.forEach(bk=>drawBlock(ctx,bk,f.x0,f.y0,P));ctx.globalAlpha=1}

/* ---------- plants ---------- */
function drawPlant(ctx,p){const d=PLANTS[p.sp];const g=clamp(p.g,.15,1);const x=wx2s(p.x),y=wy2s(p.y),z=CAM.z;const h=d.h*g*z*HZ,r=d.r*g*z*(p.sc||1);const col=hueShift(d.c,p.hue||0);
  if(r<1.2){ctx.fillStyle=col;ctx.fillRect(x-1,y-2,2,2);return}
  ctx.fillStyle='rgba(20,30,20,.2)';ctx.beginPath();ctx.ellipse(x+r*.3,y,r*.9,r*.4,0,0,7);ctx.fill();
  const trunk=k=>{ctx.strokeStyle='#5a4030';ctx.lineWidth=Math.max(1,r*.18);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h*k);ctx.stroke()};
  switch(d.k){
    case'tree':trunk(.55);if(p.sp==='acacia'){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-h,r*1.2,r*.38,0,0,7);ctx.fill();ctx.fillStyle=shade(col,.15);ctx.beginPath();ctx.ellipse(x-r*.2,y-h-r*.12,r*.9,r*.22,0,0,7);ctx.fill()}
      else if(p.sp==='baobab'){ctx.fillStyle='#9a8a7a';ctx.fillRect(x-r*.35,y-h*.7,r*.7,h*.7);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-h*.8,r,r*.4,0,0,7);ctx.fill()}
      else{for(let i=0;i<4;i++){ctx.fillStyle=shade(col,[-.1,0,.1,.18][i]);ctx.beginPath();ctx.arc(x+[-.4,.4,0,-.1][i]*r,y-h*.7-[0,.1,.35,.5][i]*r,r*[.7,.65,.7,.45][i],0,7);ctx.fill()}}break;
    case'conifer':trunk(.3);ctx.fillStyle=col;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x-r*(1-i*.25),y-h*(.25+i*.22));ctx.lineTo(x,y-h*(.6+i*.2));ctx.lineTo(x+r*(1-i*.25),y-h*(.25+i*.22));ctx.fill()}break;
    case'palm':ctx.strokeStyle='#7a6040';ctx.lineWidth=Math.max(1,r*.15);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+r*.3,y-h*.5,x+r*.1,y-h);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,r*.18);for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ctx.beginPath();ctx.moveTo(x+r*.1,y-h);ctx.quadraticCurveTo(x+r*.1+Math.cos(a)*r*.6,y-h-r*.3,x+r*.1+Math.cos(a)*r,y-h+Math.abs(Math.sin(a))*r*.3+r*.2);ctx.stroke()}break;
    case'willow':trunk(.6);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-h*.7,r,r*.6,0,0,7);ctx.fill();ctx.strokeStyle=shade(col,-.1);ctx.lineWidth=1;for(let i=0;i<12;i++){const xx=x-r+i*r/6;ctx.beginPath();ctx.moveTo(xx,y-h*.7);ctx.lineTo(xx,y-h*.15);ctx.stroke()}break;
    case'clump':ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,r*.12);for(let i=0;i<7;i++){const xx=x+(i-3)*r*.18;ctx.beginPath();ctx.moveTo(xx,y);ctx.quadraticCurveTo(xx+(i-3)*r*.1,y-h*.6,xx+(i-3)*r*.25,y-h);ctx.stroke()}break;
    case'cactus':ctx.fillStyle=col;ctx.fillRect(x-r*.25,y-h,r*.5,h);ctx.fillRect(x-r*.8,y-h*.6,r*.3,h*.3);ctx.fillRect(x-r*.8,y-h*.35,r*.6,r*.25);break;
    case'flowers':for(let i=0;i<10;i++){ctx.fillStyle=pick?['#d07aa0','#f0c81a','#efe8d8','#a87ac8'][i%4]:col;ctx.beginPath();ctx.arc(x+Math.cos(i*2.4)*r*.7,y-r*.2+Math.sin(i*2.4)*r*.3,Math.max(1,r*.18),0,7);ctx.fill()}break;
    case'lily':ctx.fillStyle='#4f8a46';ctx.beginPath();ctx.ellipse(x,y,r,r*.4,0,0,7);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-r*.1,r*.3,0,7);ctx.fill();break;
    case'fern':for(let i=0;i<8;i++){ctx.strokeStyle=shade(col,i%2?.1:-.1);ctx.lineWidth=Math.max(1,r*.15);const a=i/8*Math.PI-Math.PI;ctx.beginPath();ctx.moveTo(x,y-h*.8);ctx.quadraticCurveTo(x+Math.cos(a)*r*.6,y-h,x+Math.cos(a)*r,y-h*.6);ctx.stroke()}trunk(.8);break;
    default:/* shrub / grass / small */ctx.fillStyle=col;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(x+(i-1)*r*.4,y-h*.4,r*.55,Math.max(h*.6,r*.4),0,0,7);ctx.fill()}}}

/* ---------- habitat furnishing (flat or raised) ---------- */
function drawItem(ctx,it,e){const d=ITEMS[it.t];const x=wx2s(it.x),y=wy2s(it.y),z=CAM.z,r=d.r*z*(it.s||1);const t=performance.now()/1000;
  switch(d.shape){

    case'house':case'barn':{const w=d.r*1.4,dd=d.r*1;drawBlock(ctx,{s:'cube',x:0,y:0,z:0,w,d:dd,h:it.t==='barn'?4:2.6,c:it.t==='barn'?'#8a3a2a':'#8a6a4a'},it.x-w/2,it.y-dd/2,MAPP);drawBlock(ctx,{s:'roof',x:0,y:0,z:it.t==='barn'?4:2.6,w,d:dd,h:1.6,c:'#3a2a1c',o:0},it.x-w/2,it.y-dd/2,MAPP);break}
    case'lamp':ctx.fillStyle='#3a3632';ctx.fillRect(x-1,y-2.4*z,2,2.4*z);ctx.fillStyle=it.t==='uv'?'#a87ae8':'#f0a020';ctx.beginPath();ctx.arc(x,y-2.4*z,Math.max(2,z*.5),0,7);ctx.fill();ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(x,y-1.2*z,z*2,0,7);ctx.fill();ctx.globalAlpha=1;break;
    case'feeder':ctx.fillStyle='#5a4030';ctx.fillRect(x-1,y-4.5*z,2,4.5*z);ctx.fillStyle='#8a6a3a';ctx.fillRect(x-z*.9,y-5*z,z*1.8,z*.9);ctx.fillStyle='#6a8a3a';ctx.fillRect(x-z*.8,y-5.4*z,z*1.6,z*.5);break;
    case'rock':case'coral':ctx.fillStyle=d.shape==='coral'?'#c87a6a':'#9a948a';ctx.beginPath();ctx.ellipse(x,y-r*.25,r,r*.5,0,Math.PI,0);ctx.fill();ctx.fillStyle=d.shape==='coral'?'#e0a090':'#b0aa9e';ctx.beginPath();ctx.ellipse(x-r*.3,y-r*.4,r*.45,r*.3,0,Math.PI,0);ctx.fill();break;

/* ---------- habitats ---------- */
function drawHabitatBase(ctx,e){const g=geoOf(e);const col=GROUNDS[e.ground]?.c||HABITATS[e.kind].col;
  polyPath(ctx,g);if(e.kind==='tank'){const gr=ctx.createLinearGradient(0,wy2s(bbox(g).y0),0,wy2s(bbox(g).y1));gr.addColorStop(0,'#1f5a6e');gr.addColorStop(1,'#3f8fa0');ctx.fillStyle=gr;ctx.fill()}
  else if(e.kind==='viv'){ctx.fillStyle=mix(col,'#2f4a3a',.3);ctx.fill()}else{ctx.fillStyle=col;ctx.fill();ctx.save();ctx.clip();ctx.globalAlpha=.12;ctx.fillStyle='#1d2a21';const R=srng(e.id.length*31);const b=bbox(g);for(let i=0;i<Math.min(200,e._area/30);i++){ctx.beginPath();ctx.arc(wx2s(rnd(b.x0,b.x1)),wy2s(rnd(b.y0,b.y1)),1,0,7);ctx.fill()}ctx.restore();ctx.globalAlpha=1}
  if(e.kind==='tank'){const t=performance.now()/1000;ctx.save();polyPath(ctx,g);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;const b=bbox(g);for(let i=0;i<8;i++){const yy=lerp(b.y0,b.y1,i/8);ctx.beginPath();for(let x=b.x0;x<b.x1;x+=3){ctx.lineTo(wx2s(x),wy2s(yy)+Math.sin(x*.3+t*2+i)*2)}ctx.stroke()}ctx.restore()}
  (e.items||[]).forEach(it=>{const d=ITEMS[it.t];if(['water','mud','sand','pen'].includes(d.shape))drawItem(ctx,it,e)})}
function drawFence(ctx,e,front){/* fence posts — draw back half or front half for depth */const g=geoOf(e);const H=e.kind==='aviary'?(e.height||8):e.kind==='tank'?(e.depth||3)*.6+.6:e.kind==='viv'?2.6:e.kind==='polar'?2.4:1.8;const c=CAM.z;const cy=centroid(g).y;
  const col=e.fence||HABITATS[e.kind].fence;ctx.lineWidth=Math.max(1,c*.18);
  for(let i=0;i<g.length;i++){const a=g[i],b=g[(i+1)%g.length];const isFront=(a.y+b.y)/2>cy;if(isFront!==front)continue;
    const ax=wx2s(a.x),ay=wy2s(a.y),bx=wx2s(b.x),by=wy2s(b.y);
    if(e.kind==='tank'||e.kind==='viv'){ctx.fillStyle=e.kind==='tank'?'rgba(170,215,225,.28)':'rgba(200,230,220,.25)';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(bx,by-H*c*HZ);ctx.lineTo(ax,ay-H*c*HZ);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(ax,ay-H*c*HZ);ctx.lineTo(bx,by-H*c*HZ);ctx.stroke();continue}
    if(e.kind==='aviary'){ctx.strokeStyle='rgba(40,50,46,.35)';ctx.lineWidth=.6;const n=Math.max(2,Math.round(dist(a,b)/1.5));for(let k=0;k<=n;k++){const t=k/n;const x=lerp(ax,bx,t),y=lerp(ay,by,t);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-H*c*HZ);ctx.stroke()}ctx.beginPath();ctx.moveTo(ax,ay-H*c*HZ);ctx.lineTo(bx,by-H*c*HZ);ctx.stroke();continue}
    ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(ax,ay-H*c*HZ);ctx.lineTo(bx,by-H*c*HZ);ctx.moveTo(ax,ay-H*c*HZ*.5);ctx.lineTo(bx,by-H*c*HZ*.5);ctx.stroke();
    ctx.strokeStyle=shade(col,-.3);const n=Math.max(1,Math.round(dist(a,b)/3));for(let k=0;k<=n;k++){const t=k/n;const x=lerp(ax,bx,t),y=lerp(ay,by,t);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-H*c*HZ*1.05);ctx.stroke()}}}
function drawPaths(ctx){const z=CAM.z;S.paths.forEach(p=>{const g=pathGeo(p);const k=PATHS[p.kind]||PATHS.gravel;const w=(p.w||k.w)*z;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();g.forEach((q,i)=>{const x=wx2s(q.x),y=wy2s(q.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=k.e;ctx.lineWidth=w+Math.max(2,z*.6);ctx.stroke();ctx.strokeStyle=k.c;ctx.lineWidth=w;ctx.stroke();
  if(p.kind==='boardwalk'&&z>2.5){ctx.strokeStyle='rgba(60,40,20,.35)';ctx.lineWidth=1;for(let d=0;d<p._len;d+=1.2){const q=pointAt(g,d);const nx=-Math.sin(q.a)*w/2/z,ny=Math.cos(q.a)*w/2/z;ctx.beginPath();ctx.moveTo(wx2s(q.x-nx),wy2s(q.y-ny));ctx.lineTo(wx2s(q.x+nx),wy2s(q.y+ny));ctx.stroke()}}
  if(p.kind==='paved'&&z>3){ctx.strokeStyle='rgba(120,110,100,.3)';ctx.lineWidth=1;ctx.setLineDash([z*.8,z*.8]);ctx.beginPath();g.forEach((q,i)=>{const x=wx2s(q.x),y=wy2s(q.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.setLineDash([])}})}
function drawShapes(ctx){S.shapes.forEach(s=>{const g=geoOf(s);const d=SHAPES[s.kind];polyPath(ctx,g);
  if(s.kind==='pond'){ctx.fillStyle='#c8b88a';ctx.lineWidth=Math.max(2,CAM.z*.8);ctx.strokeStyle='#c8b88a';ctx.stroke();const b=bbox(g);const gr=ctx.createLinearGradient(0,wy2s(b.y0),0,wy2s(b.y1));gr.addColorStop(0,shade(s.c||d.c,-.15));gr.addColorStop(1,shade(s.c||d.c,.1));ctx.fillStyle=gr;ctx.fill();ctx.save();ctx.clip();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;const t=performance.now()/1500;for(let i=0;i<6;i++){const yy=lerp(b.y0,b.y1,(i+.5)/6);ctx.beginPath();ctx.moveTo(wx2s(b.x0+((t*7+i*13)%((b.x1-b.x0)||1))),wy2s(yy));ctx.lineTo(wx2s(b.x0+((t*7+i*13)%((b.x1-b.x0)||1)))+CAM.z*3,wy2s(yy));ctx.stroke()}ctx.restore()}
  else if(s.kind==='hill'){const c=centroid(g);ctx.fillStyle=s.c||d.c;ctx.fill();ctx.save();ctx.clip();for(let i=1;i<5;i++){ctx.strokeStyle=`rgba(40,60,30,${.18})`;ctx.lineWidth=1;ctx.beginPath();g.forEach((p,j)=>{const x=wx2s(lerp(p.x,c.x,i/5)),y=wy2s(lerp(p.y,c.y,i/5),i*.6);j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke()}ctx.restore()}
  else{ctx.fillStyle=s.c||d.c;ctx.fill();if(s.kind==='bed'){ctx.strokeStyle='#6a5434';ctx.lineWidth=Math.max(1,CAM.z*.3);ctx.stroke()}if(s.kind==='rockery'){ctx.save();ctx.clip();const R=srng(s.id.length*13);const b=bbox(g);ctx.fillStyle='#8a847a';for(let i=0;i<30;i++){ctx.beginPath();ctx.ellipse(wx2s(lerp(b.x0,b.x1,R())),wy2s(lerp(b.y0,b.y1,R())),CAM.z*1.2,CAM.z*.7,0,0,7);ctx.fill()}ctx.restore()}}})}

/* ---------- people ---------- */
const SHIRTS=['#d04a4a','#2f7488','#d0962a','#efe8d8','#4f8a46','#a87ac8','#1d2a21','#b4532d','#5a7a8a'];
function drawPerson(ctx,x,y,col,kind,t){const z=CAM.z;const h=1.7*z*HZ;if(h<3){ctx.fillStyle=col;ctx.fillRect(x-1,y-2,2,2);return}const w=Math.max(1.5,z*.45);const step=Math.sin(t)*w*.4;
  ctx.fillStyle='rgba(20,30,20,.2)';ctx.beginPath();ctx.ellipse(x,y,w,w*.4,0,0,7);ctx.fill();
  ctx.strokeStyle='#3a3024';ctx.lineWidth=Math.max(1,w*.35);ctx.beginPath();ctx.moveTo(x-w*.2,y-h*.45);ctx.lineTo(x-w*.2+step,y);ctx.moveTo(x+w*.2,y-h*.45);ctx.lineTo(x+w*.2-step,y);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w*.55,y-h*.85,w*1.1,h*.45,w*.3):ctx.rect(x-w*.55,y-h*.85,w*1.1,h*.45);ctx.fill();
  ctx.fillStyle='#d8b494';ctx.beginPath();ctx.arc(x,y-h*.95,w*.38,0,7);ctx.fill();
  if(kind==='photo'){ctx.fillStyle='#141414';ctx.fillRect(x+w*.3,y-h*.8,w*.7,w*.5)}
  if(kind==='keeper'){ctx.fillStyle='#2f6b3a';ctx.fillRect(x-w*.55,y-h*.85,w*1.1,h*.45);ctx.fillStyle='#c3ae7c';ctx.beginPath();ctx.ellipse(x,y-h*1.05,w*.6,w*.2,0,0,7);ctx.fill()}}

/* ---------- animals on the map ---------- */
function animalPx(a){const sp=SPECIES[a.sp];/* map plates are drawn ~2.2x life size so they read at park scale */return Math.max(6,sp.len*growth(a)*a.gen.size*CAM.z*2.2)}
function drawAnimal(ctx,a,hx,hy){const sp=SPECIES[a.sp];const px=animalPx(a);const x=wx2s(hx),y=wy2s(hy,a._alt||0);
  const fr=a.state==='walk'||a.state==='fly'||a.state==='swim'?Math.floor((performance.now()/1000*(4+3/Math.sqrt(sp.len+.2)))+a.gen.patSeed)%4:1;
  const pose=a.state==='graze'?'graze':a.state==='fly'?'fly':a.state==='sleep'?'stand':a.state==='walk'?'walk':'stand';
  if(px<7){ctx.fillStyle=animalCols(a).base;ctx.beginPath();ctx.arc(x,y-2,2.2,0,7);ctx.fill();return}
  const s=spriteFor(a,fr,px*DPR,pose);ctx.fillStyle='rgba(20,30,20,.18)';ctx.beginPath();ctx.ellipse(x,wy2s(hy),px*.32,px*.08,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);if(a.face<0)ctx.scale(-1,1);if(a.state==='sleep'){ctx.globalAlpha=.92}ctx.drawImage(s.cv,-s.ox/DPR,-s.oy/DPR,s.cv.width/DPR,s.cv.height/DPR);ctx.restore();
  if(a.state==='sleep'&&px>14){ctx.fillStyle='rgba(29,42,33,.7)';ctx.font=`600 ${Math.max(9,px*.15)}px ${'Martian Mono'}`;ctx.fillText('z',x+px*.25,y-px*.5)}
  if(SEL.obj&&SEL.obj.a===a){ctx.strokeStyle='#d0962a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,wy2s(hy),px*.45,px*.13,0,0,7);ctx.stroke()}}

/* ---------- the frame ---------- */
const SEL={obj:null};
let _lastT=0,_frame=0;
function render(){if(!CX||!S)return;const ctx=CX;ctx.setTransform(DPR,0,0,DPR,0,0);const z=CAM.z;_frame++;
  ctx.fillStyle='#2b3a2c';ctx.fillRect(0,0,VW,VH);buildGround();
  ctx.save();ctx.translate(wx2s(0),wy2s(0));ctx.scale(z/2,z*TILT/2);ctx.imageSmoothingEnabled=z<4;ctx.drawImage(GROUND,0,0);ctx.restore();
  /* plot prices on unowned land when buying */
  if(BUILD.mode==='land'){ctx.font=`700 13px 'Big Shoulders Display'`;ctx.textAlign='center';for(let i=0;i<6;i++)for(let j=0;j<6;j++){if(S.plots.includes(i+','+j))continue;const adj=S.plots.some(p=>{const[a,b]=p.split(',').map(Number);return Math.abs(a-i)+Math.abs(b-j)===1});const cx=wx2s((i+.5)*WORLD.plot),cy=wy2s((j+.5)*WORLD.plot);ctx.fillStyle=adj?'#efe8d8':'rgba(239,232,216,.35)';ctx.fillText(adj?money(plotPrice())+' · TAP TO BUY':'NOT ADJACENT',cx,cy)}}
  drawShapes(ctx);drawPaths(ctx);
  /* habitats ground */
  S.encl.forEach(e=>{if(onScreen(centroid(geoOf(e)).x,centroid(geoOf(e)).y,(Math.sqrt(e._area||100)+20)*z))drawHabitatBase(ctx,e)});
  S.encl.forEach(e=>drawFence(ctx,e,false));
  /* depth sorted things */
  const L=[];const t=performance.now()/1000;
  S.plants.forEach(p=>{if(onScreen(p.x,p.y))L.push([p.y,0,p])});
  S.blds.forEach(b=>{const f=bldFoot(b);if(onScreen(b.x,b.y,f.w*z+80))L.push([f.y1,1,b])});
  S.encl.forEach(e=>(e.items||[]).forEach(it=>{if(!['water','mud','sand','pen'].includes(ITEMS[it.t].shape)&&onScreen(it.x,it.y))L.push([it.y,2,it,e])}));
  S.animals.forEach(a=>{if((a.loc.t==='encl'||a.loc.t==='clinic'||a.loc.t==='rehab')&&onScreen(a.x,a.y))L.push([a.y,3,a])});
  if(z>1.6){S.guests.forEach(g=>{if(onScreen(g.x,g.y))L.push([g.y,4,g])});S.staff.forEach(s=>{if(s._x!=null&&onScreen(s._x,s._y))L.push([s._y,5,s])})}
  L.sort((p,q)=>p[0]-q[0]);
  for(const o of L){switch(o[1]){case 0:drawPlant(ctx,o[2]);break;case 1:drawBuilding(ctx,o[2]);if(SEL.obj&&SEL.obj.b===o[2]){const f=bldFoot(o[2]);ctx.strokeStyle='#d0962a';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeRect(wx2s(f.x0),wy2s(f.y0),f.w*z,f.d*z*TILT);ctx.setLineDash([])}break;case 2:drawItem(ctx,o[2],o[3]);break;case 3:drawAnimal(ctx,o[2],o[2].x,o[2].y);break;case 4:drawPerson(ctx,wx2s(o[2].x),wy2s(o[2].y),o[2].c,o[2].k,t*6+o[2].ph);break;case 5:drawPerson(ctx,wx2s(o[2]._x),wy2s(o[2]._y),'#2f6b3a','keeper',t*6);break}}
  S.encl.forEach(e=>drawFence(ctx,e,true));
  /* habitat signs */
  if(z>1.2&&S.settings.labels){ctx.textAlign='center';S.encl.forEach(e=>{const g=geoOf(e);const b=bbox(g);const x=wx2s((b.x0+b.x1)/2),y=wy2s(b.y1)+14;const txt=(e.name||HABITATS[e.kind].n).toUpperCase();ctx.font=`800 ${z>3?12:10}px 'Big Shoulders Display'`;const w=ctx.measureText(txt).width+14;
    const warn=e._warn;ctx.fillStyle=warn?'#b4532d':'#1d2a21';ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2,y-9,w,16,4):ctx.rect(x-w/2,y-9,w,16);ctx.fill();ctx.fillStyle='#efe8d8';ctx.fillText(txt,x,y+3);
    if(e._n){ctx.font=`500 9px 'Martian Mono'`;ctx.fillStyle='rgba(29,42,33,.85)';ctx.fillText(e._n+' · '+Math.round((e._wel||0)*100)+'%',x,y+18)}});
    if(z>2){S.blds.forEach(b=>{if(b.kind==='bench')return;const f=bldFoot(b);const x=wx2s(b.x),y=wy2s(f.y1)+12;ctx.font=`700 9.5px 'Big Shoulders Display'`;ctx.fillStyle='rgba(29,42,33,.75)';ctx.fillText((b.name||BLD[b.kind].n).toUpperCase(),x,y)})}}
  if(SEL.obj&&SEL.obj.e){const g=geoOf(SEL.obj.e);polyPath(ctx,g);ctx.strokeStyle='#d0962a';ctx.lineWidth=2.5;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([])}
  drawBuildOverlay(ctx);
  /* day / night */
  const tod=(S.day%1);const night=tod<.18?1-tod/.18:tod>.82?(tod-.82)/.18:0;if(night>0){ctx.fillStyle=`rgba(12,22,40,${night*.42})`;ctx.fillRect(0,0,VW,VH);ctx.globalCompositeOperation='lighter';S.blds.forEach(b=>{if(b.kind==='bench')return;const x=wx2s(b.x),y=wy2s(b.y,2);const g=ctx.createRadialGradient(x,y,1,x,y,z*8);g.addColorStop(0,`rgba(240,180,90,${night*.35})`);g.addColorStop(1,'rgba(240,180,90,0)');ctx.fillStyle=g;ctx.fillRect(x-z*8,y-z*8,z*16,z*16)});ctx.globalCompositeOperation='source-over'}
}
function plotPrice(){return Math.round(90000*Math.pow(1+.45*Math.max(0,S.plots.length-2),1.6)/1000)*1000}

/* ---------- picking ---------- */
function pickAt(sx,sy){const w=s2w(sx,sy);let best=null,bd=1e9;
  S.animals.forEach(a=>{if(!['encl','clinic','rehab'].includes(a.loc.t))return;const px=animalPx(a);const ax=wx2s(a.x),ay=wy2s(a.y)-px*.3;const d=Math.hypot(ax-sx,ay-sy);if(d<Math.max(16,px*.5)&&d<bd){bd=d;best={a}}});if(best)return best;
  for(let i=S.blds.length-1;i>=0;i--){const b=S.blds[i];const f=bldFoot(b);if(w.x>=f.x0-1&&w.x<=f.x1+1&&w.y>=f.y0-1&&w.y<=f.y1+3)return{b}}
  for(let i=S.encl.length-1;i>=0;i--){const e=S.encl[i];if(pip(w.x,w.y,geoOf(e)))return{e}}
  for(const p of S.plants)if(dist(p,w)<Math.max(1.5,PLANTS[p.sp].r*p.g))return{p};
  for(const s of S.shapes)if(pip(w.x,w.y,geoOf(s)))return{s};
  for(const p of S.paths){const g=pathGeo(p);for(let i=1;i<g.length;i++)if(segDist(w,g[i-1],g[i])<(p.w||PATHS[p.kind].w)/2+1)return{path:p}}
  return null}

/* ---------- input: pan, pinch, tap ---------- */
const PTR=new Map();let _gest=null;
function initInput(){const c=$('map');
  c.addEventListener('pointerdown',e=>{if(e.isPrimary)PTR.clear();try{c.setPointerCapture(e.pointerId)}catch(_){}PTR.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()});
    if(PTR.size===1){_gest={mode:'tap',cx:CAM.x,cy:CAM.y};const h=BUILD.mode&&buildHandleAt(e.clientX,e.clientY);if(h){_gest.mode='handle';_gest.h=h}}
    else if(PTR.size===2){const[a,b]=[...PTR.values()];_gest={mode:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),z0:CAM.z,cx:CAM.x,cy:CAM.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}});
  c.addEventListener('pointermove',e=>{const p=PTR.get(e.pointerId);if(!p||!_gest)return;p.x=e.clientX;p.y=e.clientY;
    if(_gest.mode==='handle'){if(Math.hypot(p.x-p.x0,p.y-p.y0)>4){_gest.moved=1;buildDrag(_gest.h,s2w(p.x,p.y))}return}
    if(_gest.mode==='tap'&&Math.hypot(p.x-p.x0,p.y-p.y0)>7)_gest.mode='pan';
    if(_gest.mode==='pan'){CAM.x=_gest.cx-(p.x-p.x0)/CAM.z;CAM.y=_gest.cy-(p.y-p.y0)/(CAM.z*TILT);clampCam()}
    if(_gest.mode==='pinch'&&PTR.size===2){const[a,b]=[...PTR.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);CAM.z=clamp(_gest.z0*d/_gest.d0,.6,14);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      const w0={x:(_gest.mx-VW/2)/_gest.z0+_gest.cx,y:(_gest.my-VH/2)/(_gest.z0*TILT)+_gest.cy};CAM.x=w0.x-(mx-VW/2)/CAM.z;CAM.y=w0.y-(my-VH/2)/(CAM.z*TILT);clampCam()}});
  const up=e=>{const p=PTR.get(e.pointerId);PTR.delete(e.pointerId);if(!p||!_gest)return;
    if(_gest.mode==='tap'&&performance.now()-p.t<600)onTap(p.x,p.y);
    if(_gest.mode==='handle'){if(!_gest.moved)onTap(p.x,p.y,_gest.h);else buildDragEnd(_gest.h)}
    if(PTR.size===0)_gest=null;else if(_gest.mode==='pinch')_gest={mode:'none'}};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  c.addEventListener('wheel',e=>{e.preventDefault();const w0=s2w(e.clientX,e.clientY);CAM.z=clamp(CAM.z*Math.exp(-e.deltaY*.0015),.6,14);CAM.x=w0.x-(e.clientX-VW/2)/CAM.z;CAM.y=w0.y-(e.clientY-VH/2)/(CAM.z*TILT);clampCam()},{passive:false})}
function clampCam(){CAM.x=clamp(CAM.x,0,WORLD.w);CAM.y=clamp(CAM.y,0,WORLD.h)}
function onTap(sx,sy,handle){if(BUILD.mode){buildTap(s2w(sx,sy),handle,sx,sy);return}const o=pickAt(sx,sy);SEL.obj=o;if(!o){closePop();return}inspect(o)}
function focusOn(x,y,z){CAM.x=x;CAM.y=y;if(z)CAM.z=z;clampCam()}

/* =====================================================================
   WILDKEEP · construction — curved paths, pulled-point shapes,
   habitats, buildings, plants, furnishings, land, bulldozer
   ===================================================================== */
const BUILD={mode:null,sub:null,pts:[],sel:-1,ghost:null,rot:0,target:null,grown:true,color:null,edit:null};
function spend(v,cat='build'){if(S.cash<v){note('Not enough funds — '+money(v)+' needed.','bad');sfx('bad');return false}S.cash-=v;S.month[cat]=(S.month[cat]||0)+v;return true}
function startBuild(mode,sub,o={}){closeSheet();closePop();Object.assign(BUILD,{mode,sub,pts:[],sel:-1,ghost:null,rot:0,target:o.target||null,edit:o.edit||null,color:o.color||null,grown:!hasB('greenhouse')});
  if(mode==='reshape'){BUILD.pts=o.edit.pts.map(p=>({...p}))}renderBuildBar();dockSync()}
function endBuild(){BUILD.mode=null;BUILD.pts=[];BUILD.edit=null;$('buildbar').classList.remove('on');$('buildbar').innerHTML='';dockSync()}
ACT.buildCancel=()=>{endBuild()};
ACT.buildSub=el=>{BUILD.sub=el.dataset.v;renderBuildBar()};
ACT.buildUndo=()=>{if(BUILD.sel>=0){BUILD.pts.splice(BUILD.sel,1);BUILD.sel=-1}else BUILD.pts.pop();renderBuildBar()};
ACT.buildRound=()=>{const i=BUILD.sel>=0?BUILD.sel:BUILD.pts.length-1;if(BUILD.pts[i]){BUILD.pts[i].r=!BUILD.pts[i].r;renderBuildBar()}};
ACT.buildAllRound=()=>{const r=!BUILD.pts.every(p=>p.r);BUILD.pts.forEach(p=>p.r=r);renderBuildBar()};
ACT.buildRot=()=>{BUILD.rot=(BUILD.rot+1)%4;renderBuildBar()};
ACT.buildGrown=()=>{BUILD.grown=!BUILD.grown;renderBuildBar()};
ACT.buildColor=el=>{BUILD.color=el.dataset.v;renderBuildBar()};
ACT.buildOk=()=>buildConfirm();

/* ---------- costs ---------- */
function perim(pts){let l=0;for(let i=0;i<pts.length;i++)l+=dist(pts[i],pts[(i+1)%pts.length]);return l}
function enclCost(kind,pts,depth){const g=smoothPoly(pts);const A=polyArea(g),P=perim(g);const h=HABITATS[kind];if(kind==='tank'){const vol=A*(depth||2);return Math.round(h.base+P*h.perM+vol*700+(depth>=6?2500000:depth>=4?400000:0))}return Math.round(h.base+P*h.perM+A*h.perM2)}
function pathCost(pts,kind){return Math.round(polyLen(spline(pts,8))*(PATHS[kind]||PATHS.gravel).cost)}
function shapeCost(pts,kind){return Math.round(polyArea(smoothPoly(pts))*SHAPES[kind].cost+200)}
function bldCost(kind){const k=BLD[kind];let c=k.cost;if(k.unique&&kind!=='desk')c=c;return c}
function plantCost(sp,grown){return Math.round(PLANTS[sp].cost*(grown?1:.25))}

/* ---------- validation ---------- */
function polyBlocked(pts,ignore){const g=smoothPoly(pts);if(!polyOwned(g))return'Part of it is outside your land.';
  for(const e of S.encl){if(e===ignore)continue;if(polysOverlap(g,geoOf(e)))return'It overlaps '+(e.name||'another habitat')+'.'}
  for(const b of S.blds){const f=bldFoot(b);const r=[{x:f.x0,y:f.y0},{x:f.x1,y:f.y0},{x:f.x1,y:f.y1},{x:f.x0,y:f.y1}];if(polysOverlap(g,r))return'It overlaps the '+BLD[b.kind].n.toLowerCase()+'.'}
  for(const p of S.paths){const q=pathGeo(p);for(const v of q)if(pip(v.x,v.y,g))return'A path runs through it — guests would walk among the animals.'}
  if(polySelfCross(pts))return'The outline crosses itself.';return null}
function polySelfCross(p){const n=p.length;for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;const a=p[i],b=p[(i+1)%n],c=p[j],d=p[(j+1)%n];const den=(b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x);if(!den)continue;const t=((c.x-a.x)*(d.y-c.y)-(c.y-a.y)*(d.x-c.x))/den,u=((c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x))/den;if(t>0&&t<1&&u>0&&u<1)return true}return false}
function bldBlocked(b,ignore){const f=bldFoot(b);if(![[f.x0,f.y0],[f.x1,f.y0],[f.x0,f.y1],[f.x1,f.y1]].every(([x,y])=>plotOwned(x,y)))return'Outside your land.';const r=[{x:f.x0,y:f.y0},{x:f.x1,y:f.y0},{x:f.x1,y:f.y1},{x:f.x0,y:f.y1}];
  for(const e of S.encl)if(polysOverlap(r,geoOf(e)))return'Overlaps a habitat.';for(const o of S.blds){if(o===ignore)continue;const g=bldFoot(o);if(f.x0<g.x1&&f.x1>g.x0&&f.y0<g.y1&&f.y1>g.y0)return'Overlaps the '+BLD[o.kind].n.toLowerCase()+'.'}return null}
function pathBlocked(pts){const g=spline(pts,8);if(!g.every(p=>plotOwned(p.x,p.y)))return'Leaves your land.';for(const e of S.encl){const eg=geoOf(e);if(g.some(p=>pip(p.x,p.y,eg)))return'Runs through '+(e.name||'a habitat')+'.'}for(const b of S.blds){if(b.kind==='bench')continue;const f=bldFoot(b);if(g.some(p=>p.x>f.x0+.6&&p.x<f.x1-.6&&p.y>f.y0+.6&&p.y<f.y1-.6))return'Runs through the '+BLD[b.kind].n.toLowerCase()+'.'}return null}

/* ---------- taps ---------- */
function snapPathPt(w){let best=null,bd=6;S.paths.forEach(p=>{const g=pathGeo(p);[g[0],g[g.length-1]].forEach(q=>{const d=dist(q,w);if(d<bd){bd=d;best={x:q.x,y:q.y,r:1}}});if(!best){g.forEach(q=>{const d=dist(q,w);if(d<3&&d<bd){bd=d;best={x:q.x,y:q.y,r:1}}})}});
  const desk=S.blds.find(b=>b.kind==='desk');if(desk){const f=bldFoot(desk);const q={x:desk.x,y:f.y1+1.5};if(dist(q,w)<6&&dist(q,w)<bd)best={x:q.x,y:q.y,r:1}}return best||{x:w.x,y:w.y,r:1}}
function buildTap(w,handle){const m=BUILD.mode;
  if(handle!=null&&handle.i!=null&&(m==='path'||m==='encl'||m==='shape'||m==='reshape')){if(BUILD.sel===handle.i){BUILD.pts[handle.i].r=!BUILD.pts[handle.i].r}else BUILD.sel=handle.i;renderBuildBar();return}
  if(m==='path'){BUILD.pts.push(snapPathPt(w));BUILD.sel=-1;renderBuildBar();return}
  if(m==='encl'||m==='shape'){BUILD.pts.push({x:Math.round(w.x*2)/2,y:Math.round(w.y*2)/2,r:BUILD.pts.length?BUILD.pts[BUILD.pts.length-1].r:m==='shape'});BUILD.sel=-1;renderBuildBar();return}
  if(m==='reshape'){/* insert point on nearest edge */const p=BUILD.pts;let bi=-1,bd=1e9;for(let i=0;i<p.length;i++){const d=segDist(w,p[i],p[(i+1)%p.length]);if(d<bd){bd=d;bi=i}}if(bd<8){p.splice(bi+1,0,{x:w.x,y:w.y,r:p[bi].r});BUILD.sel=bi+1;renderBuildBar()}return}
  if(m==='bld'){BUILD.ghost={x:Math.round(w.x*2)/2,y:Math.round(w.y*2)/2};renderBuildBar();return}
  if(m==='move'){BUILD.ghost={x:Math.round(w.x*2)/2,y:Math.round(w.y*2)/2};renderBuildBar();return}
  if(m==='plant'){placePlant(w);return}
  if(m==='item'){placeItem(w);return}
  if(m==='land'){const i=Math.floor(w.x/WORLD.plot),j=Math.floor(w.y/WORLD.plot);buyPlot(i,j);return}
  if(m==='bulldoze'){const o=pickAt(wx2s(w.x),wy2s(w.y));if(o)bulldoze(o);return}}
function buildHandleAt(sx,sy){const m=BUILD.mode;if(!['path','encl','shape','reshape'].includes(m))return null;for(let i=BUILD.pts.length-1;i>=0;i--){const p=BUILD.pts[i];if(Math.hypot(wx2s(p.x)-sx,wy2s(p.y)-sy)<18)return{i}}return null}
function buildDrag(h,w){if(h.i!=null&&BUILD.pts[h.i]){BUILD.pts[h.i].x=w.x;BUILD.pts[h.i].y=w.y;BUILD.sel=h.i;_bbT=0;renderBuildBarThrottled()}}
function buildDragEnd(){renderBuildBar()}
let _bbT=0;function renderBuildBarThrottled(){const n=performance.now();if(n-_bbT>150){_bbT=n;renderBuildBar()}}

/* ---------- confirm ---------- */
function buildConfirm(){const m=BUILD.mode,p=BUILD.pts;
  if(m==='path'){if(p.length<2)return note('Tap at least two points.','bad');const err=pathBlocked(p);if(err)return note(err,'bad');const c=pathCost(p,BUILD.sub);if(!spend(c))return;S.paths.push({id:nid('p'),kind:BUILD.sub,pts:p.map(q=>({x:q.x,y:q.y})),isPath:1});S.stats.builds++;sfx('build');note('Path laid · '+money(c));BUILD.pts=[];renderBuildBar();onWorldChanged();return}
  if(m==='encl'){if(p.length<3)return note('Tap at least three corners.','bad');const h=HABITATS[BUILD.sub];if(S.accred<h.accred)return note(h.n+' needs '+ACCRED[h.accred].n+' status.','bad');const A=polyArea(smoothPoly(p));if(A<h.minArea)return note('Too small — at least '+h.minArea+' m².','bad');if(BUILD.sub==='viv'&&A>400)return note('Vivaria top out at 400 m².','bad');const err=polyBlocked(p);if(err)return note(err,'bad');const depth=BUILD.sub==='tank'?BUILD.depth||3:0;if(BUILD.sub==='tank'&&depth>=6&&S.accred<3)return note('Deep ocean tanks need Conservation zoo status.','bad');const c=enclCost(BUILD.sub,p,depth);if(!spend(c))return;
    const e={id:nid('e'),kind:BUILD.sub,pts:p.map(q=>({x:q.x,y:q.y,r:!!q.r})),ground:{land:'grass',semi:'grass',aviary:'grass',viv:'forest',polar:'snow',tank:'reef'}[BUILD.sub],items:[],name:habitatName(BUILD.sub),built:S.day,depth:depth||undefined,height:BUILD.sub==='aviary'?8:undefined,settings:{water:'salt',temp:25,light:'day',current:1,ls:1,climate:24,humid:60}};S.encl.push(e);S.stats.builds++;sfx('build');note(`${esc(e.name)} built · ${money(c)}`,'','New habitat');endBuild();onWorldChanged();SEL.obj={e};inspect({e});return}
  if(m==='reshape'){const e=BUILD.edit;if(p.length<3)return note('Needs three points.','bad');const err=polyBlocked(p,e);if(err)return note(err,'bad');const old=enclCost(e.kind,e.pts,e.depth),nw=enclCost(e.kind,p,e.depth);const diff=Math.max(Math.round((nw-old)),Math.round(perim(smoothPoly(p))*20));if(!spend(diff))return;e.pts=p.map(q=>({x:q.x,y:q.y,r:!!q.r}));const g=geoOf(e);e.items=e.items.filter(it=>pip(it.x,it.y,g));S.animals.forEach(a=>{if(a.loc.t==='encl'&&a.loc.id===e.id&&!pip(a.x,a.y,g)){const q=randInPoly(g);a.x=q.x;a.y=q.y}});sfx('build');note('Reshaped · '+money(diff));endBuild();onWorldChanged();return}
  if(m==='shape'){if(p.length<3)return note('Tap at least three points.','bad');const g=smoothPoly(p);if(!polyOwned(g))return note('Outside your land.','bad');for(const e of S.encl)if(polysOverlap(g,geoOf(e)))return note('Overlaps a habitat.','bad');const c=shapeCost(p,BUILD.sub);if(!spend(c))return;S.shapes.push({id:nid('s'),kind:BUILD.sub,pts:p.map(q=>({x:q.x,y:q.y,r:!!q.r})),c:BUILD.color||SHAPES[BUILD.sub].c});sfx('build');note(SHAPES[BUILD.sub].n+' shaped · '+money(c));BUILD.pts=[];renderBuildBar();onWorldChanged();return}
  if(m==='bld'||m==='move'){if(!BUILD.ghost)return note('Tap the map to place it.','bad');const kind=m==='move'?BUILD.edit.kind:BUILD.sub;const b={id:nid('b'),kind,x:BUILD.ghost.x,y:BUILD.ghost.y,rot:BUILD.rot,blocks:null};if(m==='move'){Object.assign(b,{id:BUILD.edit.id,blocks:BUILD.edit.blocks,w:BUILD.edit.w,d:BUILD.edit.d,name:BUILD.edit.name,custom:BUILD.edit.custom})}
    const err=bldBlocked(b,m==='move'?BUILD.edit:null);if(err)return note(err,'bad');
    if(m==='move'){if(!spend(1500))return;Object.assign(BUILD.edit,{x:b.x,y:b.y,rot:b.rot});sfx('build');endBuild();onWorldChanged();return}
    const k=BLD[kind];if(k.unique&&hasB(kind))return note('You already have a '+k.n.toLowerCase()+'.','bad');if(k.accred&&S.accred<k.accred)return note(k.n+' needs '+ACCRED[k.accred].n+' status.','bad');if(!spend(bldCost(kind)))return;if(kind==='custom'){b.custom=1;b.w=8;b.d=8;b.blocks=[{s:'cube',x:0,y:0,z:0,w:8,d:8,h:3,c:'#c3ae7c'}];b.name='Pavilion'}
    S.blds.push(b);S.stats.builds++;sfx('build');note(`${k.n} built`+(k.cost?' · '+money(k.cost):''),'','Construction');if(kind==='custom'){endBuild();onWorldChanged();openDesigner(b);return}if(!k.unique&&kind!=='custom'){BUILD.ghost=null;renderBuildBar()}else endBuild();onWorldChanged();return}}
function habitatName(kind){const pre={land:['Savanna','Paddock','Meadow','Kopje','Grassland','Range','Plains','Thicket','Valley','Steppe'],semi:['Wetland','River bend','Lagoon','Marsh','Delta','Billabong'],aviary:['Aviary','Flight','Canopy','Sky dome'],viv:['Vivarium','Terrarium','Glasshouse','Cloud room'],polar:['Ice coast','Tundra','Fjord','Floe'],tank:['Reef tank','Deep blue','Ocean hall','Kelp tank','Lagoon tank']}[kind];const n=S.encl.filter(e=>e.kind===kind).length;return pick(pre)+(n?' '+['II','III','IV','V','VI','VII','VIII','IX','X'][Math.min(8,n-1)]:'')}

/* ---------- plants & items ---------- */
function placePlant(w){const sp=BUILD.sub;const d=PLANTS[sp];if(!plotOwned(w.x,w.y))return note('Outside your land.','bad');const inE=S.encl.find(e=>pip(w.x,w.y,geoOf(e)));if(inE&&inE.kind==='tank'&&!d.aquatic)return note('That plant cannot grow underwater.','bad');
  for(const b of S.blds){const f=bldFoot(b);if(w.x>f.x0&&w.x<f.x1&&w.y>f.y0&&w.y<f.y1)return note('On top of a building.','bad')}
  if(!BUILD.grown&&!hasB('greenhouse'))return note('Seedlings need a greenhouse.','bad');const c=plantCost(sp,BUILD.grown);if(!spend(c))return;
  S.plants.push({id:nid('t'),sp,x:w.x,y:w.y,g:BUILD.grown?1:.15,hue:rnd(-8,8),sc:rnd(.85,1.15),hp:1,encl:inE?inE.id:null});sfx('build');S._dirty=1;S.stats.builds++}
function placeItem(w){const e=BUILD.target;const d=ITEMS[BUILD.sub];if(!e)return;if(!pip(w.x,w.y,geoOf(e)))return note('Place it inside '+esc(e.name)+'.','bad');if(!spend(d.cost))return;e.items.push({t:BUILD.sub,x:w.x,y:w.y,s:1});sfx('build');S._dirty=1;renderBuildBar()}
function buyPlot(i,j){if(i<0||j<0||i>5||j>5)return;const k=i+','+j;if(S.plots.includes(k))return note('You already own this land.');const adj=S.plots.some(p=>{const[a,b]=p.split(',').map(Number);return Math.abs(a-i)+Math.abs(b-j)===1});if(!adj)return note('Buy land next to the park.','bad');const c=plotPrice();
  confirmBox('Buy this land?',`A 120 × 120 m plot (1.44 ha) for <b>${money(c)}</b>. More land lets you build bigger habitats — but the score checkers compare species against land size.`,'Buy plot',()=>{if(!spend(c,'build'))return;S.plots.push(k);GROUND=null;sfx('buy');note('Land bought · '+money(c),'gold');logEv('Bought a new plot of land')})}
function bulldoze(o){let name,refund=0,fn;
  if(o.b){if(o.b.kind==='desk')return note('The check-in desk cannot be removed.','bad');name=BLD[o.b.kind].n;refund=bldCost(o.b.kind)*.4;fn=()=>{S.blds=S.blds.filter(x=>x!==o.b)}}
  else if(o.e){const n=S.animals.filter(a=>a.loc.t==='encl'&&a.loc.id===o.e.id).length;if(n)return note('Move the '+n+' animals out first.','bad');name=o.e.name;refund=enclCost(o.e.kind,o.e.pts,o.e.depth)*.3;fn=()=>{S.encl=S.encl.filter(x=>x!==o.e);S.staff.forEach(s=>{if(s.assign===o.e.id)s.assign=null})}}
  else if(o.p){name=PLANTS[o.p.sp].n;fn=()=>{S.plants=S.plants.filter(x=>x!==o.p)}}
  else if(o.s){name=SHAPES[o.s.kind].n;fn=()=>{S.shapes=S.shapes.filter(x=>x!==o.s)}}
  else if(o.path){name='Path';refund=pathCost(o.path.pts,o.path.kind)*.3;fn=()=>{S.paths=S.paths.filter(x=>x!==o.path)}}else return;
