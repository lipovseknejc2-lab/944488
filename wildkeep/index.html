function animalRow(a,extra=''){const sp=SPECIES[a.sp];return`<div class="card tap row" data-act="cert" data-id="${a.id}">${at(a)}<div class="grow"><div class="row" style="gap:5px"><b>${esc(a.name)}</b><span class="muted small">${sexIc(a.sex)} ${ageStr(ageOf(a))}</span>${a.gen.morph!=='normal'?`<span class="tag rare">${MORPHS[a.gen.morph].n}</span>`:''}${a.hybrid?'<span class="tag line">Hybrid</span>':''}${a.preg?'<span class="tag baby">Expecting</span>':''}${a.sick?'<span class="tag" style="background:var(--terra);color:#fff">Sick</span>':''}</div><div class="lbl">${esc(sp.n)} · ${esc(locTxt(a))}</div>${meter(a.welfare)}</div>${extra}</div>`}
SHEETS.animals={title:'Animals',sub:()=>{const n=S.animals.filter(a=>a.loc.t==='encl').length;return n+' on show · '+speciesCount()+' species'},tall:true,tabs:[['habitats','Habitats'],['all','All animals'],['studbook','Studbook'],['departed','Departed']],
  render(tab){if(tab==='habitats'){if(!S.encl.length)return'<div class="empty"><b>No habitats yet</b>Open Build → Habitats to fence your first.</div>';return`<div class="list">${S.encl.map(e=>{const an=inEncl(e);const sp=[...new Set(an.map(a=>a.sp))];return`<div class="card tap" data-act="openEncl" data-id="${e.id}"><div class="row"><div class="grow"><div class="lbl">${HABITATS[e.kind].n} · ${Math.round(e._area).toLocaleString()} m²</div><b style="font-family:var(--f-disp);font-size:17px">${esc(e.name)}</b></div>${e._warn?'<span class="chip bad">Attention</span>':an.length?'<span class="chip ok">'+pct(e._wel)+'</span>':'<span class="chip">Empty</span>'}</div><div class="row" style="gap:4px;margin-top:6px;overflow:hidden">${sp.slice(0,5).map(s=>pt(s,52,38)).join('')}${sp.length?'':'<span class="small muted">No animals yet</span>'}</div></div>`}).join('')}</div>`}
    if(tab==='all'){const L=S.animals.filter(a=>a.loc.t!=='transit').sort((x,y)=>SPECIES[x.sp].n.localeCompare(SPECIES[y.sp].n));const tr=S.deliveries;return`${tr.length?`<div class="h3" style="margin-top:0">In transit</div><div class="list">${tr.map(d=>`<div class="card row">${pt(d.a.sp)}<div class="grow"><b>${esc(SPECIES[d.a.sp].n)}</b><div class="lbl">Arrives in ${Math.ceil(d.due-S.day)} d</div></div></div>`).join('')}</div><div class="h3">At the park</div>`:''}<div class="list">${L.map(a=>animalRow(a)).join('')||'<div class="empty"><b>No animals</b>Buy some from the Register.</div>'}</div>`}
    if(tab==='studbook'){const by={};Object.entries(S.book||{}).forEach(([id,b])=>(by[b.sp]=by[b.sp]||[]).push([id,b]));const ks=Object.keys(by).sort((a,b)=>SPECIES[a].n.localeCompare(SPECIES[b].n));
      return`<p class="small muted">Every animal that has lived here, with parents. Avoid pairing relatives — offspring with inbreeding of 12.5% or more are weaker, and The Naturalist Review notices.</p>${ks.map(k=>`<div class="card" style="margin-bottom:8px"><div class="row">${pt(k,44,32)}<b class="grow">${esc(SPECIES[k].n)}</b><span class="lbl">${by[k].length} recorded</span></div><div class="tree" style="margin-top:6px">${by[k].slice(-14).map(([id,b])=>{const m=S.book[b.m],f=S.book[b.f];const live=S.animals.some(a=>a.id===id);return`<div data-act="${live?'cert':''}" data-id="${id}" style="${live?'':'opacity:.5'}">${b.s==='F'?'♀':'♂'} ${esc(b.n)} <span class="muted">· ${b.o}${m?' · of '+esc(m.n)+(f?' × '+esc(f.n):''):''}${b.x?' · †':''}${b.r?' · released':''}</span></div>`}).join('')}</div></div>`).join('')||'<div class="empty"><b>Empty studbook</b></div>'}`}
    const D=(S.dead||[]).slice().reverse();const R=S.released.slice().reverse();return`<div class="h3" style="margin-top:0">Returned to the wild · ${R.length}</div><div class="list">${R.slice(0,30).map(r=>`<div class="card row">${pt(r.sp,44,32)}<div class="grow"><b>${esc(r.name)}</b><div class="lbl">${esc(SPECIES[r.sp].n)} · ${dateStr(r.d)} · ${r.soft?'soft':'hard'} release</div></div><span class="stamp" style="font-size:10px">Free</span></div>`).join('')||'<div class="small muted">None yet.</div>'}</div><div class="h3">In memoriam · ${D.length}</div><div class="list">${D.slice(0,40).map(d=>`<div class="card row" style="opacity:.75">${pt(d.sp,44,32)}<div class="grow"><b>${esc(d.name)}</b><div class="lbl">${esc(SPECIES[d.sp].n)} · died ${dateStr(d.d)} aged ${ageStr(d.age)}</div></div></div>`).join('')||'<div class="small muted">None.</div>'}</div>`},after:afterPaint};

/* ---------- habitat sheet ---------- */
SHEETS.encl={title:()=>esc(encById(SH.arg)?.name||'Habitat'),sub:()=>{const e=encById(SH.arg);return e?HABITATS[e.kind].n+' · '+Math.round(e._area).toLocaleString()+' m²'+(e.kind==='tank'?' · '+tankVol(e).toLocaleString()+' m³':''):''},tall:true,tabs:[['over','Checklist'],['animals','Animals'],['furnish','Furnish'],['settings','Settings']],
  render(tab,id){const e=encById(id);if(!e)return'<div class="empty"><b>Gone</b></div>';const R=evalEncl(e);const an=inEncl(e);
    const actions=`<div class="row wrap" style="margin-bottom:10px"><button class="btn sm leaf" data-act="sideView" data-id="${e.id}">Side view</button><button class="btn sm alt" data-act="focusEncl" data-id="${e.id}">Show on map</button><button class="btn sm alt" data-act="reshape" data-id="${e.id}">Reshape</button></div>`;
    if(tab==='over'){const chk=(ok,t,v)=>`<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--rule)"><span style="width:20px;color:${ok===1?'var(--leaf)':ok===0?'var(--terra)':'var(--ochre)'};font-weight:800">${ok===1?'✓':ok===0?'✕':'!'}</span><span class="grow small">${t}</span><span class="lbl">${v||''}</span></div>`;
      if(!an.length)return actions+`<div class="empty"><b>Empty habitat</b>Move animals in from the Clinic once they clear quarantine, or buy them with this habitat as the destination.</div><div class="h3">Provides</div><div class="row wrap">${[...enclGives(e)].map(g=>`<span class="chip ok">${NEED_TXT[g]||g}</span>`).join(' ')||'<span class="small muted">Nothing yet — furnish it.</span>'}</div>`;
      return actions+`<div class="grid2" style="margin-bottom:8px"><div class="card"><div class="lbl">Welfare</div><b style="font-size:20px">${pct(e._wel)}</b>${meter(e._wel)}</div><div class="card"><div class="lbl">Space</div><b style="font-size:20px">${pct(Math.min(R.space,1))}</b><div class="lbl">${Math.round(R.spaceHave).toLocaleString()} of ${Math.round(R.spaceNeed).toLocaleString()} ${e.kind==='tank'?'m³':'m²'}</div></div></div>
      ${chk(R.space>=.95?1:R.space>=.8?.5:0,'Enough space for every animal',pct(Math.min(R.space,1.4)))}
      ${Object.values(R.species).map(r=>chk(r.miss.length?0:1,`${esc(r.sp.n)} — needs ${r.sp.needs.map(n=>NEED_TXT[n]).join(', ')||'nothing special'}`,r.miss.length?'missing '+r.miss.map(n=>NEED_TXT[n]).join(', '):'all met')+chk(r.soc>=.95?1:r.soc>=.6?.5:0,`${esc(r.sp.n)} group size (${r.n} of ${r.sp.gmin}–${r.sp.gmax})`,SOCIAL_TXT[r.sp.social])+chk(r.tmp>=.95?1:r.tmp>=.7?.5:0,`${esc(r.sp.n)} climate ${r.sp.tmin}–${r.sp.tmax}°C`,Math.round(enclTemp(e))+'°C now')).join('')}
      ${chk(R.care>=.95?1:R.care>=.6?.5:0,'Keeper care',R.keepers.length?R.keepers.map(k=>esc(k.name.split(' ')[0])).join(', '):'no keeper assigned')}
      ${R.compat.map(c=>chk(0,esc(c),'mix')).join('')}${R.issues.map(c=>chk(0,esc(c),'')).join('')}
      ${chk(viewable(e)?1:0,'Visible from a path','')}
      <div class="h3">Feeding today</div><div class="small muted">${[...new Set(an.map(a=>a.sp))].map(s=>`${SPECIES[s].n}: ${SPECIES[s].diet.map(f=>FOOD[f].n.toLowerCase()).join(', ')}`).join('<br>')}</div>`}
    if(tab==='animals'){const ready=S.animals.filter(a=>((a.loc.t==='clinic'&&a.cleared)||(a.loc.t==='nursery'&&a._grad)||(a.loc.t==='encl'&&a.loc.id!==e.id))&&HOME_FITS[e.kind].includes(SPECIES[a.sp].home));
      return actions+`<div class="list">${an.map(a=>animalRow(a,`<button class="btn sm alt" data-act="moveOut" data-id="${a.id}">Move</button>`)).join('')||'<div class="small muted">No animals.</div>'}</div><div class="h3">Can move in</div><div class="list">${ready.map(a=>animalRow(a,`<button class="btn sm leaf" data-act="moveIn" data-id="${a.id}" data-e="${e.id}">Move in</button>`)).join('')||'<div class="small muted">Nothing ready. Animals must clear quarantine first.</div>'}</div>`}
    if(tab==='furnish'){const items=Object.entries(ITEMS).filter(([k,v])=>v.hab.split(' ').includes(e.kind));const gives=enclGives(e);const missing=R.missing;
      return actions+`${missing.length?`<div class="card" style="border-color:var(--terra);margin-bottom:10px"><b>Missing:</b> ${missing.map(m=>NEED_TXT[m]).join(', ')}</div>`:''}<div class="lbl" style="margin-bottom:6px">Ground</div><div class="row wrap" style="gap:6px;margin-bottom:12px">${Object.entries(GROUNDS).map(([k,g])=>`<button class="chip ${e.ground===k?'ok':''}" data-act="setGround" data-v="${k}" style="background:${g.c}55">${g.n}</button>`).join('')}</div>
      <div class="list">${items.map(([k,v])=>{const n=e.items.filter(i=>i.t===k).length;const useful=v.gives.some(g=>missing.includes(g));return`<div class="card row" style="${useful?'border-color:var(--ochre)':''}"><div class="grow"><b>${v.n}</b>${n?` <span class="tag">×${n}</span>`:''}<div class="lbl">Gives ${v.gives.map(g=>NEED_TXT[g]).join(', ')}</div></div><span class="price">${money(v.cost)}</span><button class="btn sm ${useful?'gold':'alt'}" data-act="placeItem" data-v="${k}" data-e="${e.id}">Place</button>${n?`<button class="btn sm alt" data-act="removeItem" data-v="${k}" data-e="${e.id}">−</button>`:''}</div>`}).join('')}</div>
      <div class="h3">Plant inside</div><div class="row wrap" style="gap:6px">${Object.entries(PLANTS).filter(([k,p])=>e.kind==='tank'?p.aquatic:true).slice(0,12).map(([k,p])=>`<button class="chip" data-act="plantIn" data-v="${k}" data-e="${e.id}">${p.n}</button>`).join('')}</div>`}
    const st=e.settings;const policy=e.policy||(e.policy={breed:true,pull:true,sex:null});
    return actions+`<div class="lbl">Name</div><input class="field" value="${esc(e.name)}" data-ch="enclName" data-e="${e.id}" maxlength="28">
      ${e.kind==='tank'?`<div class="h3">Life support</div><div class="lbl">Water</div><div class="seg"><button class="${st.water==='salt'?'on':''}" data-act="tankSet" data-k="water" data-v="salt" data-e="${e.id}">Salt</button><button class="${st.water==='fresh'?'on':''}" data-act="tankSet" data-k="water" data-v="fresh" data-e="${e.id}">Fresh</button></div>
        <div class="lbl" style="margin-top:10px">Temperature · ${st.temp}°C</div><input type="range" min="2" max="32" value="${st.temp}" data-ch="tankTemp" data-e="${e.id}"><div class="lbl" style="margin-top:6px">Lighting</div><div class="seg">${['day','seasonal','blue'].map(v=>`<button class="${st.light===v?'on':''}" data-act="tankSet" data-k="light" data-v="${v}" data-e="${e.id}">${{day:'Daylight',seasonal:'Seasonal cycle',blue:'Moonlight blue'}[v]}</button>`).join('')}</div>
        <div class="small muted" style="margin-top:8px">Depth ${e.depth} m · volume ${tankVol(e).toLocaleString()} m³ · upkeep ${money(tankVol(e)*2.8+800)}/mo. Seasonal light triggers spawning.</div>`:''}
      ${e.kind==='viv'?`<div class="h3">Climate</div><div class="lbl">Air temperature · ${st.climate}°C</div><input type="range" min="8" max="36" value="${st.climate}" data-ch="vivClim" data-e="${e.id}"><div class="lbl">Humidity · ${st.humid}%</div><input type="range" min="20" max="100" value="${st.humid}" data-ch="vivHum" data-e="${e.id}">`:''}
      ${e.kind==='aviary'?`<div class="lbl" style="margin-top:10px">Mesh height · ${e.height} m</div><input type="range" min="4" max="20" value="${e.height}" data-ch="avHeight" data-e="${e.id}">`:''}
      <div class="h3">Breeding</div><div class="row" style="justify-content:space-between"><span class="small">Allow breeding</span><button class="btn sm ${policy.breed?'leaf':'alt'}" data-act="pol" data-k="breed" data-e="${e.id}">${policy.breed?'On':'Off — contraception'}</button></div>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="small">Pull eggs to the incubator</span><button class="btn sm ${policy.pull?'leaf':'alt'}" data-act="pol" data-k="pull" data-e="${e.id}">${policy.pull?'On':'Off'}</button></div>
      ${S.lab.tech.tsd?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="small">Incubation temperature (reptiles)</span><div class="seg">${[['','Mixed'],['F','Warm ♀'],['M','Cool ♂']].map(([v,l])=>`<button class="${(policy.sex||'')===v?'on':''}" data-act="polSex" data-v="${v}" data-e="${e.id}">${l}</button>`).join('')}</div></div>`:''}
      <div class="h3">Fence colour</div><div class="swatches">${['#6a5434','#3a2a1c','#1d2a21','#4a5a5a','#7a7e82','#b4532d','#efe8d8','#2f6b3a'].map(c=>`<button class="sw ${e.fence===c?'on':''}" style="background:${c}" data-act="fenceCol" data-v="${c}" data-e="${e.id}"></button>`).join('')}</div>
      <div class="h3">Caretakers</div>${staffPicker(e)}`},after:afterPaint};
function staffPicker(e){const assigned=S.staff.filter(s=>s.assign===e.id);const free=S.staff.filter(s=>(s.role==='keeper'||s.role==='volunteer')&&s.assign!==e.id);return`<div class="list">${assigned.map(s=>`<div class="card row"><b class="grow">${esc(s.name)}</b><span class="lbl">${s.role==='keeper'?KEEPER[s.spec]:'Volunteer'}</span><button class="btn sm alt" data-act="unassign" data-id="${s.id}">Remove</button></div>`).join('')}${free.length?`<select class="field" data-ch="assignSel" data-e="${e.id}"><option value="">Assign a keeper…</option>${free.map(s=>`<option value="${s.id}">${esc(s.name)} — ${s.role==='keeper'?KEEPER[s.spec]+', '+EDU[s.edu]:'Volunteer'}${s.assign?' (moves from '+esc(encById(s.assign)?.name||'')+')':''}</option>`).join('')}</select>`:'<div class="small muted">Hire keepers in Care → Hire.</div>'}</div>`}
ACT.moveIn=el=>{const a=S.animals.find(x=>x.id===el.dataset.id);if(moveTo(a,encById(el.dataset.e))){sfx('buy');renderSheet()}};
ACT.moveOut=el=>{const a=S.animals.find(x=>x.id===el.dataset.id);const sp=SPECIES[a.sp];const fits=S.encl.filter(e=>e.id!==a.loc.id&&HOME_FITS[e.kind].includes(sp.home));
  modal(`<h3>Move ${esc(a.name)}</h3><div class="list">${fits.map(e=>`<button class="card tap row" data-act="moveGo" data-id="${a.id}" data-e="${e.id}"><b class="grow" style="text-align:left">${esc(e.name)}</b><span class="lbl">${inEncl(e).length} animals</span></button>`).join('')}<button class="card tap row" data-act="moveClinic" data-id="${a.id}"><b class="grow" style="text-align:left">Back to the clinic</b></button>${canReintroduce(a)?`<button class="card tap row" data-act="reintro" data-id="${a.id}"><b class="grow" style="text-align:left">Reintroduce to the wild</b><span class="stamp" style="font-size:9px">Release</span></button>`:''}<button class="card tap row" data-act="transferOut" data-id="${a.id}"><b class="grow" style="text-align:left">Transfer to another zoo</b><span class="price">+${money(SPECIES[a.sp].price*(isAdult(a)?.55:.2))}</span></button></div><button class="btn alt wide" style="margin-top:10px" data-act="closeModal">Cancel</button>`)};
ACT.moveGo=el=>{closeModal();const a=S.animals.find(x=>x.id===el.dataset.id);moveTo(a,encById(el.dataset.e));renderSheet()};
ACT.moveClinic=el=>{closeModal();const a=S.animals.find(x=>x.id===el.dataset.id);a.loc={t:'clinic'};a.cleared=1;placeNearBuilding(a,'clinic');renderSheet()};
ACT.reintro=el=>{closeModal();const a=S.animals.find(x=>x.id===el.dataset.id);confirmBox('Reintroduce '+a.name+'?','A captive-bred '+esc(SPECIES[a.sp].n)+' joins a protected wild population. Soft release with monitoring is safer.','Soft release',()=>releaseAnimal(a,true))};
ACT.transferOut=el=>{closeModal();const a=S.animals.find(x=>x.id===el.dataset.id);const v=Math.round(SPECIES[a.sp].price*(isAdult(a)?.55:.2));confirmBox('Transfer '+a.name+'?','Another institution takes '+esc(a.name)+' and pays '+money(v)+'. Quick trades of recently bought animals hurt your integrity score.','Transfer',()=>{S.cash+=v;S.month.sales+=v;if(a.boughtAt!=null&&S.day-a.boughtAt<120)(S.trades=S.trades||[]).push(S.day);a._gone=1;S.animals=S.animals.filter(x=>x!==a);if(S.book[a.id])S.book[a.id].t=Math.floor(S.day);logEv(`Transferred ${a.name} (${SPECIES[a.sp].n})`);renderSheet()})};
ACT.setGround=el=>{const e=encById(SH.arg);const c=Math.round(e._area*1.5);if(!spend(c))return;e.ground=el.dataset.v;evalEncl(e);note(GROUNDS[e.ground].n+' laid · '+money(c));renderSheet()};
ACT.placeItem=el=>{const e=encById(el.dataset.e);startBuild('item',el.dataset.v,{target:e});const c=centroid(geoOf(e));focusOn(c.x,c.y,Math.max(CAM.z,4))};
ACT.removeItem=el=>{const e=encById(el.dataset.e);const i=e.items.findIndex(x=>x.t===el.dataset.v);if(i>=0){e.items.splice(i,1);S.cash+=ITEMS[el.dataset.v].cost*.4;evalEncl(e);renderSheet()}};
ACT.plantIn=el=>{const e=encById(el.dataset.e);startBuild('plant',el.dataset.v);const c=centroid(geoOf(e));focusOn(c.x,c.y,Math.max(CAM.z,4))};
IN.enclName=el=>{encById(el.dataset.e).name=el.value.trim()||'Habitat'};
ACT.tankSet=el=>{const e=encById(el.dataset.e);e.settings[el.dataset.k]=el.dataset.v;evalEncl(e);renderSheet()};
IN.tankTemp=el=>{const e=encById(el.dataset.e);e.settings.temp=+el.value;evalEncl(e);renderSheet()};IN.vivClim=el=>{const e=encById(el.dataset.e);e.settings.climate=+el.value;evalEncl(e);renderSheet()};IN.vivHum=el=>{const e=encById(el.dataset.e);e.settings.humid=+el.value;evalEncl(e);renderSheet()};IN.avHeight=el=>{const e=encById(el.dataset.e);const nh=+el.value;const c=Math.max(0,(nh-e.height)*perim(geoOf(e))*30);if(c&&!spend(c))return renderSheet();e.height=nh;renderSheet()};
ACT.pol=el=>{const e=encById(el.dataset.e);e.policy[el.dataset.k]=!e.policy[el.dataset.k];renderSheet()};ACT.polSex=el=>{const e=encById(el.dataset.e);e.policy.sex=el.dataset.v||null;renderSheet()};
ACT.fenceCol=el=>{encById(el.dataset.e).fence=el.dataset.v;renderSheet()};
IN.assignSel=el=>{const s=S.staff.find(x=>x.id===el.value);if(s){s.assign=el.dataset.e;S._actions=(S._actions||0)+1;evalEncl(encById(el.dataset.e))}renderSheet()};ACT.unassign=el=>{const s=S.staff.find(x=>x.id===el.dataset.id);s.assign=null;renderSheet()};

SHEETS.care={title:'Care',sub:()=>`${staffCount('keeper')} keepers · ${staffCount('vet')} vets · ${S.staff.filter(s=>s.role==='volunteer').length} volunteers`,tall:true,tabs:[['clinic','Clinic'],['kitchen','Kitchen'],['staff','Staff'],['hire','Hire'],['rehab','Rehab']],
  render(tab){
    if(tab==='clinic'){if(!hasB('clinic'))return`<div class="empty"><b>No clinic</b>Every new animal must be examined and quarantined. Build one first.<br><br><button class="btn leaf" data-act="bBld" data-v="clinic">Build clinic · ${money(BLD.clinic.cost)}</button></div>`;
      const L=S.animals.filter(a=>a.loc.t==='clinic'),N=S.animals.filter(a=>a.loc.t==='nursery'),sick=S.animals.filter(a=>a.sick&&a.loc.t==='encl');
      return`<div class="grid3" style="margin-bottom:10px"><div class="card"><div class="lbl">Capacity</div><b>${L.length}/${clinicCap()}</b></div><div class="card"><div class="lbl">Vets</div><b>${staffCount('vet')}</b></div><div class="card"><div class="lbl">Sick</div><b>${sick.length}</b></div></div>${staffCount('vet')?'':'<div class="card" style="border-color:var(--terra);margin-bottom:10px"><b>No vet on staff.</b> Quarantine cannot progress — hire one in Hire.</div>'}
      <div class="list">${L.map(a=>{const sp=SPECIES[a.sp];const keys=Object.keys(a.tests||{});return`<div class="card"><div class="row">${at(a)}<div class="grow"><b>${esc(a.name)}</b> <span class="small muted">${esc(sp.n)} ${sexIc(a.sex)}</span><div class="lbl">${a.cleared?'Cleared — ready to move':`Quarantine day ${Math.floor(a.qDone||0)} of ${a.quarantine}`}${a._qNote?' · '+a._qNote:''}</div>${meter((a.qDone||0)/(a.quarantine||1))}</div></div>
        <div class="row wrap" style="gap:4px;margin-top:6px">${keys.map(k=>`<span class="chip ${a.tests[k]===1?'ok':a.tests[k]===.5?'warn':''}">${a.tests[k]===1?'✓':a.tests[k]===.5?'↻':'·'} ${k}</span>`).join('')}</div>
        ${a.cleared?`<div class="row" style="margin-top:8px"><select class="field grow" data-ch="clinicDest" data-id="${a.id}"><option value="">Move to habitat…</option>${S.encl.filter(e=>HOME_FITS[e.kind].includes(sp.home)).map(e=>`<option value="${e.id}">${esc(e.name)} (${inEncl(e).length})</option>`).join('')}</select><button class="btn sm alt" data-act="cert" data-id="${a.id}">Certificate</button></div>`:''}</div>`}).join('')||'<div class="empty"><b>Clinic is quiet</b>Arrivals appear here for quarantine.</div>'}</div>
      ${N.length?`<div class="h3">Nursery</div><div class="list">${N.map(a=>animalRow(a,a._grad?`<button class="btn sm leaf" data-act="nurseryOut" data-id="${a.id}">Move</button>`:'')).join('')}</div>`:''}
      ${sick.length?`<div class="h3">Sick in habitats</div><div class="list">${sick.map(a=>animalRow(a)).join('')}</div>`:''}
      <div class="h3">Upgrade</div><button class="btn alt" data-act="clinicUp">Add a ward (+4 beds) · ${money(60000*((S.flags.clinicUp||0)+1))}</button>`}

      const need={};S.animals.forEach(a=>{if(!['encl','clinic','rehab','nursery'].includes(a.loc.t))return;const sp=SPECIES[a.sp];const k=dailyKg(sp,a)/sp.diet.length;sp.diet.forEach(f=>need[f]=(need[f]||0)+k)});const keys=[...new Set([...Object.keys(need),...Object.keys(S.food).filter(k=>S.food[k]>.01)])];

      return`<div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b>Standing orders</b><div class="small muted">Top up automatically (+12% delivery)</div></div><button class="btn sm ${S.flags.autoFood!==false?'leaf':'alt'}" data-act="autoFood">${S.flags.autoFood!==false?'On':'Off'}</button></div>${staffCount('chef')?'':'<div class="small muted" style="margin-bottom:8px">A nutritionist cuts spoilage and improves diets.</div>'}

    if(tab==='staff'){const L=S.staff;return`<div class="list">${L.map(s=>`<div class="card"><div class="row"><div style="width:40px;height:40px;border-radius:50%;background:${s.role==='keeper'?'var(--leaf)':s.role==='vet'?'#d04a4a':s.role==='volunteer'?'var(--khaki)':'var(--water)'};color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-sign);font-weight:800">${s.name.split(' ').map(x=>x[0]).join('')}</div><div class="grow"><b>${esc(s.name)}</b><div class="lbl">${ROLES[s.role].n}${s.spec?' · '+KEEPER[s.spec]:''} · ${EDU[s.edu]||'—'} · exp ${pct(s.exp)}</div><div class="small muted">${s.assign?'Caring for '+esc(encById(s.assign)?.name||''):s.role==='keeper'||s.role==='volunteer'?'Unassigned':ROLES[s.role].d}${s.course?' · in training':''}</div></div><span class="price">${money(s.wage)}/mo</span></div>
        <div class="row" style="margin-top:6px;gap:4px">${s.role==='keeper'||s.role==='volunteer'?`<select class="field grow" data-ch="staffAssign" data-id="${s.id}"><option value="">${s.assign?'Reassign…':'Assign to habitat…'}</option>${S.encl.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>`:''}<button class="btn sm alt" data-act="fire" data-id="${s.id}">Let go</button></div></div>`).join('')||'<div class="empty"><b>No staff</b>Hire keepers, vets and more.</div>'}</div>`}
    if(tab==='hire'){if(!S.cands)refreshCandidates();const vmax=2+Math.floor(S.rating*2);const vol=S.staff.filter(s=>s.role==='volunteer').length;
      return`<div class="card row" style="margin-bottom:10px"><div class="grow"><b>Volunteers</b><div class="small muted">Nearly free, keen, limited skill — never with dangerous animals. ${vol}/${vmax} (more with a better rating).</div></div><button class="btn sm ${vol>=vmax?'off':'leaf'}" data-act="volunteer">Take one on</button></div>
      <p class="small muted">New candidates every week. Education and a matching specialism make a real difference to welfare — and to The Naturalist Review.</p><div class="list">${S.cands.map(c=>`<div class="card"><div class="row"><div class="grow"><b>${esc(c.name)}</b>, ${c.age}<div class="lbl">${ROLES[c.role].n}${c.spec?' · '+KEEPER[c.spec]:''} · ${EDU[c.edu]}</div><div class="small muted">${esc(c.bio)}</div></div><div class="col" style="align-items:flex-end"><span class="price">${money(c.wage)}/mo</span><button class="btn sm leaf" data-act="hire" data-id="${c.id}">Hire</button></div></div></div>`).join('')}</div>`}
    if(!hasB('rehab'))return`<div class="empty"><b>No rehabilitation centre</b>Injured and orphaned wildlife come to parks with a rehab centre. They're treated for months or years, conditioned to forage and fear people, acclimatised in a pre-release pen, then released.<br><br><button class="btn leaf" data-act="bBld" data-v="rehab">Build · ${money(BLD.rehab.cost)}</button></div>`;
    const L=S.animals.filter(a=>a.loc.t==='rehab');const stages=['treat','condition','acclim','ready'];const SN={treat:'Treatment',condition:'Conditioning',acclim:'Acclimation',ready:'Ready'};
    return`<div class="card" style="margin-bottom:10px"><div class="lbl">Release policy</div><div class="seg" style="margin-top:6px">${[['none','Keep all'],['rehab','Rehab & release'],['reintro','+ Reintroduce bred']].map(([k,l])=>`<button class="${(S.flags.policy||'rehab')===k?'on':''}" data-act="policy" data-v="${k}">${l}</button>`).join('')}</div><div class="row" style="margin-top:8px;justify-content:space-between"><span class="small">Hands-off care (keeps fear of people)</span><button class="btn sm ${S.flags.handsOff!==false?'leaf':'alt'}" data-act="flag" data-k="handsOff">${S.flags.handsOff!==false?'On':'Off'}</button></div><div class="row" style="margin-top:6px;justify-content:space-between"><span class="small">Live-prey foraging training</span><button class="btn sm ${S.flags.liveFood!==false?'leaf':'alt'}" data-act="flag" data-k="liveFood">${S.flags.liveFood!==false?'On':'Off'}</button></div></div>
    <div class="list">${L.map(a=>{const r=a.rehab;const sp=SPECIES[a.sp];return`<div class="card"><div class="row">${at(a)}<div class="grow"><b>${esc(a.name)}</b> <span class="small muted">${esc(sp.n)}</span><div class="lbl">${esc(r.inj)} · from ${esc(r.from)}</div></div></div><div class="row" style="gap:3px;margin:8px 0">${stages.map(s=>`<div class="grow" style="height:5px;border-radius:3px;background:${stages.indexOf(s)<=stages.indexOf(r.stage)?'var(--leaf2)':'var(--paper2)'}"></div>`).join('')}</div><div class="small"><b>${SN[r.stage]}</b> · ${r.stage==='treat'?`${Math.floor(r.prog)}/${r.need} days${staffCount('vet')?'':' — needs a vet'}`:r.stage==='condition'?`foraging ${pct(r.forage)} · wariness ${pct(r.fear)}`:r.stage==='acclim'?(r.waitPen?'Waiting for a pre-release pen in any habitat':`${r.ac}/14 days in the pen`):'Passed: recovered, forages, avoids people, acclimatised.'}</div>
      ${r.stage==='ready'?`<div class="row" style="margin-top:8px"><button class="btn sm leaf" data-act="release" data-id="${a.id}" data-soft="1">Soft release</button><button class="btn sm alt" data-act="release" data-id="${a.id}">Hard release</button></div>`:''}</div>`}).join('')||'<div class="empty"><b>No patients</b>Rescues arrive about every few months.</div>'}</div><div class="small muted" style="margin-top:10px">${S.stats.rescued} rescued · ${S.stats.released} released all time.</div>`},after:afterPaint};

      ${S.lab.eggs.map(eg=>`<div class="card row" style="margin-bottom:6px">${pt(eg.sp,52,38)}<div class="grow"><b>${esc(SPECIES[eg.sp].n)}</b>${eg.trait?` × <span class="tag line">${esc(TRAITS[eg.trait.replace('pat:','')]||'pattern')}</span>`:''}<div class="lbl">Due in ${Math.ceil(eg.due-S.day)} d · ${pct(eg.p)} success</div></div></div>`).join('')}
      <div class="h3">1 · Egg donor</div><select class="field" data-ch="labMother"><option value="">Choose an adult female…</option>${fem.map(a=>`<option value="${a.id}" ${a.id===LAB.mother?'selected':''}>${esc(a.name)} — ${esc(SPECIES[a.sp].n)}</option>`).join('')}</select>

      <div class="h3">3 · Cross a trait (optional)</div><p class="small muted">Takes one feature from another species — horns, a mane, stripes. Distant species rarely take. Wild Lens loves hybrids; Field & Fauna and The Naturalist Review do not, and hybrids never count toward conservation.</p><select class="field" data-ch="labDonor"><option value="">Purebred — no crossing</option>${donors.map(s=>`<option value="${s}" ${s===LAB.donor?'selected':''}>${esc(SPECIES[s].n)}</option>`).join('')}</select>
      ${opts.length?`<div class="row wrap" style="gap:6px;margin-top:8px">${opts.map(o=>`<button class="chip ${LAB.trait===o?'ok':''}" data-act="labTrait" data-v="${o}">${esc(TRAITS[o.replace('pat:','')]||o.replace('pat:','')+' pattern')}</button>`).join('')}</div>`:''}
      <div class="card" style="margin-top:12px"><div class="row"><div class="grow"><b>${LAB.trait?'Hybrid embryo':'IVF embryo'}</b><div class="lbl">${pct(p)} chance · ${Math.round(SPECIES[mo.sp].gest*.8)} days</div></div><button class="btn leaf" data-act="labGo">Start · ${money(cost)}</button></div></div>`:''}`}

        return`<div class="card"><div class="row">${pt(id,52,38)}<div class="grow"><b>${esc(sp.n)}</b><div class="lbl">${f.length}♀ ${m.length}♂ adult · ${sp.repro==='live'?'live birth':sp.repro==='eggs'?'eggs':'spawning'} · ${'●'.repeat(sp.diff)}</div></div>${preg.length?`<span class="tag baby">${preg.length} expecting</span>`:''}</div><div class="small muted" style="margin-top:4px">${!f.length||!m.length?'Needs an adult pair.':best>=.125?'All pairings are related — bring in new blood.':`Best pairing inbreeding ${pct(best)}.`}${preg.map(a=>` ${esc(a.name)} due in ${Math.ceil(a.preg.due-S.day)} d.`).join('')}</div></div>`}).join('')||'<div class="empty"><b>No animals on show</b></div>'}</div>`}

IN.labMother=el=>{LAB.mother=el.value||null;LAB.father=null;LAB.donor=null;LAB.trait=null;renderSheet()};IN.labFather=el=>{LAB.father=el.value||null;renderSheet()};IN.labDonor=el=>{LAB.donor=el.value||null;LAB.trait=null;renderSheet()};ACT.labTrait=el=>{LAB.trait=el.dataset.v;renderSheet()};

  render(tab){

      return`<div class="card" style="background:var(--ink);color:var(--paper)"><div class="lbl" style="color:var(--khaki)">Accreditation</div><div style="font-family:var(--f-disp);font-size:22px">${ACCRED[S.accred].n}</div>${next?`<div class="lbl" style="color:var(--khaki);margin-top:8px">Next: ${ACCRED[S.accred+1].n}</div>${next.map(r=>`<div class="row small" style="margin-top:3px"><span style="color:${r.ok?'#8aa04e':'#d0962a'}">${r.ok?'✓':'○'}</span><span class="grow">${r.t}</span><span class="mono" style="font-size:11px">${r.v}</span></div>`).join('')}`:'<div class="small">The highest standing there is.</div>'}</div>
      <div class="h3">Score checkers</div>${row('Species for your land',p.density,`${p.species} species on ${p.ha.toFixed(1)} ha — ${p.ratio<.7?'room for more':p.ratio>1.4?'crowded for the land':'balanced'}`)}${row('Space per animal',p.space,'Habitats meeting full space allowance')}${row('Needs met',p.needs,'Pools, shade, shelter, heat and the rest')}${row('Diet',p.diet,'Animals fed their proper diet')}${row('Welfare',p.welfare,'Average across every animal on show')}${row('Keeper expertise',p.expertise,`Average education ${p.kEdu.toFixed(1)} · specialists matched to species`)}${row('Release policy',p.releaseScore,`${S.stats.released} released · policy: ${{none:'keep all',rehab:'rehab & release',reintro:'reintroduce'}[S.flags.policy||'rehab']}`)}${row('Conservation',p.conservation,`${p.threat} threatened species`)}${row('Design',p.design,`${p.plantsM} mature plants · ${p.customN} original buildings · ${pct(p.themed)} habitats themed to one region`)}${row('Visitor amenities',p.amen,'Cafés, toilets, benches, shops')}${row('Integrity',p.integrity,p.integrity>.95?'No shortcuts detected':`Penalties: ${p.dupes?p.dupes+' duplicate cheap exhibits, ':''}${p.crowd?p.crowd+' crowded habitats, ':''}${p.trades?p.trades+' quick trades, ':''}${(S.flags.ticket??18)>fairPrice()*1.5?'gouging ticket price, ':''}${S.stats.grind>20?'idle fast-forwarding':''}`)}`}
    if(tab==='ledger'){const L=S.ledger.slice(-12).reverse();const m=S.month;const inc=m.tickets+m.sales+m.donations,out=m.food+m.build+m.animals;
      return`<div class="card"><div class="lbl">This month so far</div><div class="grid2" style="margin-top:6px"><div><div class="lbl">In</div><b class="price" style="color:var(--leaf)">${money(inc)}</b></div><div><div class="lbl">Out</div><b class="price" style="color:var(--terra)">${money(out)}</b></div></div><div class="small muted" style="margin-top:6px">${m.guests.toLocaleString()} guests · tickets ${money(m.tickets)} · café & shop ${money(m.sales)} · donations ${money(m.donations)}</div></div>
      <div class="h3">Monthly</div>${L.length?`<canvas id="ledgerCv" style="width:100%;height:140px;display:block"></canvas>`:''}<div class="list">${L.map(r=>`<div class="card"><div class="row"><b class="grow">${dateStr(r.d-1).replace(/^\d+ /,'')}</b><span class="price">${money(r.cash)}</span></div><div class="small muted">Tickets ${money(r.tickets)} · sales ${money(r.sales)} · donations ${money(r.donations)} · private funding ${money(r.grants)}<br>Wages ${money(r.wages)} · upkeep ${money(r.upkeep)} · food ${money(r.food)} · building ${money(r.build)} · animals ${money(r.animals)}</div></div>`).join('')||'<div class="small muted">The first month is still running.</div>'}</div>`}
    return`<div class="list">${S.log.slice(0,80).map(l=>`<div class="row small" style="padding:5px 0;border-bottom:1px dashed var(--rule)"><span class="mono" style="font-size:10px;width:74px;flex:none;color:var(--ink3)">${dateStr(l.d)}</span><span style="${l.k==='gold'?'color:#9a6a10;font-weight:600':l.k==='bad'?'color:var(--terra)':''}">${esc(l.t)}</span></div>`).join('')||'<div class="small muted">Nothing yet.</div>'}</div>`},
  after(tab){afterPaint();if(tab==='ledger'){const cv=$('ledgerCv');if(cv){const L=S.ledger.slice(-24);const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*2;cv.height=h*2;const c=cv.getContext('2d');c.scale(2,2);const mx=Math.max(...L.map(r=>r.cash),1),mn=Math.min(0,...L.map(r=>r.cash));c.strokeStyle='#2f6b3a';c.lineWidth=2;c.beginPath();L.forEach((r,i)=>{const x=10+i/(Math.max(1,L.length-1))*(w-20),y=h-10-(r.cash-mn)/(mx-mn||1)*(h-20);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#7d8578';c.font="9px 'Martian Mono'";c.fillText(money(mx),10,10)}}}};

ACT.cert=el=>{const a=S.animals.find(x=>x.id===el.dataset.id);if(!a)return;closePop();certificate(a)};
function certificate(a){const sp=SPECIES[a.sp];const b=S.book[a.id]||{};const m=S.book[a.mother],f=S.book[a.father];const gm=m&&S.book[m.m],gf=m&&S.book[m.f],fm=f&&S.book[f.m],ff=f&&S.book[f.f];const kids=descendants(a.id);
  const tree=(n)=>n.map(k=>`<div style="padding-left:12px;border-left:1px solid #cdc2a8">${S.book[k.id]?.s==='F'?'♀':'♂'} ${esc(S.book[k.id]?.n||'?')}${tree(k.kids)}</div>`).join('');
  const R=a.loc.t==='encl'?encById(a.loc.id)?._R:null;const miss=R&&R.species[a.sp]?R.species[a.sp].miss:[];const care=a.loc.t==='encl'?S.staff.filter(s=>s.assign===a.loc.id):[];
  const tests=Object.entries(a.tests||{});const adult=isAdult(a);const no='WK-'+String(Object.keys(S.book).indexOf(a.id)+1).padStart(5,'0');
  modal(`<div class="ch">${esc(S.name.toUpperCase())} · CERTIFICATE OF LIFE</div><h3>${esc(a.name)}</h3><div class="sci">${esc(sp.n)} — ${esc(sp.sci)}</div><svg class="seal" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="#b4532d" stroke-width="1.5" stroke-dasharray="2 2"/>${markSVG('#b4532d','#f6efdc','none')}</svg>
  <canvas data-animal="${a.id}" data-bg="#efe6cf"></canvas>
  <dl class="kv"><dt>Register no.</dt><dd class="mono">${no}</dd><dt>Sex</dt><dd>${a.sex==='F'?'Female ♀':'Male ♂'}</dd><dt>Born</dt><dd>${a.born<0?'Before arrival':dateStr(a.born)} · ${ageStr(ageOf(a))}</dd><dt>Growth</dt><dd>${adult?'Fully grown':'Growing — '+pct(growth(a))+' of adult size, mature at '+sp.mat+' y'}</dd>
  <dt>Origin</dt><dd>${{bred:'Born here','market-baby':'Acquired young','market-adult':'Acquired adult',rescue:'Wild rescue',lab:'Laboratory (IVF)','lab-hybrid':'Laboratory hybrid'}[a.origin]||a.origin}</dd><dt>Form</dt><dd>${MORPHS[a.gen.morph].n} · size ${pct(a.gen.size)}${a.line?' · '+esc(a.line):''}${a.hybrid?' · carries '+esc((TRAITS[(a.gen.extra||[])[0]]||'pattern').toLowerCase())+' from '+esc(SPECIES[a.hybrid].n):''}</dd>
  <dt>Status</dt><dd>${IUCN[sp.status]}</dd><dt>Home</dt><dd>${esc(locTxt(a))}</dd><dt>Caretaker</dt><dd>${care.length?care.map(s=>esc(s.name)).join(', '):'—'}</dd><dt>Welfare</dt><dd>${pct(a.welfare)} · health ${pct(a.health)}${a.sick?' · '+esc(a.sick.n):''}${a.inbred?' · inbred':''}</dd></dl>
  <hr class="dash"><div class="lbl">Tests</div><div class="small">${tests.length?tests.map(([k,v])=>`${v===1?'✓':'○'} ${k}`).join(' · '):a.origin==='bred'?'Born on site — routine checks only':'No records'}</div>
  <div class="lbl" style="margin-top:8px">Requirements</div><div class="small">${sp.space.toLocaleString()} ${sp.home==='tank'?'m³':'m²'} · ${sp.needs.map(n=>NEED_TXT[n]).join(', ')||'—'} · ${sp.tmin}–${sp.tmax}°C · ${SOCIAL_TXT[sp.social].toLowerCase()} ${sp.gmin}–${sp.gmax}${miss.length?`<br><b style="color:#b4532d">Missing now: ${miss.map(n=>NEED_TXT[n]).join(', ')}</b>`:''}</div>
  <div class="lbl" style="margin-top:8px">Diet</div><div class="small">${sp.diet.map(x=>FOOD[x].n).join(', ')} · ${dailyKg(sp,a).toFixed(dailyKg(sp,a)<1?3:1)} kg/day</div>
  <hr class="dash"><div class="lbl">Lineage</div><div class="tree">${m||f?`<div>Dam ♀ ${esc(m?.n||'unknown')}${gm||gf?` <span class="muted">(${esc(gm?.n||'?')} × ${esc(gf?.n||'?')})</span>`:''}</div><div>Sire ♂ ${esc(f?.n||'unknown')}${fm||ff?` <span class="muted">(${esc(fm?.n||'?')} × ${esc(ff?.n||'?')})</span>`:''}</div>`:'<div>Founder — no recorded parents</div>'}</div>
  <div class="lbl" style="margin-top:8px">Breeding line forward · ${offspringOf(a.id).length} offspring</div><div class="tree">${kids.length?tree(kids):'<div class="muted">None yet</div>'}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><span class="stamp">${adult?'Adult':'Juvenile'}</span><span class="row"><input class="field" style="width:130px;padding:6px 9px" value="${esc(a.name)}" data-ch="renameA" data-id="${a.id}"><button class="btn sm alt" data-act="closeModal">Close</button></span></div>`,'cert');requestAnimationFrame(()=>paintPortraits($('over')))}
IN.renameA=el=>{const a=S.animals.find(x=>x.id===el.dataset.id);a.name=el.value.trim()||a.name;if(S.book[a.id])S.book[a.id].n=a.name};

ACT.howto=()=>modal(`<h3>Field guide</h3><div class="small" style="line-height:1.55"><p><b>The map is the park.</b> Drag to pan, pinch to zoom, tap anything to inspect it.</p><p><b>Start:</b> lay a path from the check-in desk, build a clinic and kitchen, fence a habitat, then buy animals in the Register. They ship, spend weeks in quarantine, then move in.</p><p><b>Welfare</b> comes from space, needs (pool, shade, shelter, heat…), diet, group size, climate and keeper care. Every habitat's Checklist shows what's missing.</p><p><b>Shapes:</b> tap points to draw; tap a point twice to round it; drag to pull it. Habitats, ponds, beds and hills all work this way.</p><p><b>Long game:</b> accreditation unlocks rarer species, the lab, polar habitats and finally the deep ocean tank. Magazines review you monthly; awards are judged yearly; the Ark Prize asks for nearly everything.</p><p><b>No shortcuts:</b> crowding, duplicate cheap exhibits, quick trades, ticket gouging and idle fast-forwarding all lower your integrity — and every score with it.</p></div><button class="btn leaf wide" data-act="closeModal">Got it</button>`);
function awardsCeremony(won,y){modal(`<div class="lbl">Awards · Year ${y}</div><h3>The judges have spoken</h3>${won.map(a=>`<div class="card row" style="margin-top:8px"><div style="width:52px;height:52px;border-radius:50%;background:var(--ochre);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none">${a.ic}</div><div><b style="font-family:var(--f-disp);font-size:17px">${a.n}</b><div class="small muted">${a.d}</div></div></div>`).join('')}<button class="btn leaf wide" style="margin-top:14px" data-act="closeModal">Wonderful</button>`)}
function arkCeremony(){modal(`<div style="text-align:center"><svg viewBox="0 0 64 64" style="width:90px;height:90px">${markSVG('#d0962a','#1d2a21','#2f6b3a')}</svg><div class="lbl">The rarest honour in zoology</div><h3 style="font-size:32px">The Ark Prize</h3><p class="small" style="line-height:1.55">${esc(S.name)} has been named an ark — a place where species are kept, bred, studied and returned. Very few parks ever get here.</p><span class="stamp" style="font-size:16px">Ark-class</span><br><br><button class="btn gold wide" data-act="closeModal">Keep going</button></div>`)}

/* =====================================================================
   WILDKEEP · side views — habitat cross-sections, aquarium & vivarium
   glass, and the block-building designer
   ===================================================================== */
const SIDE={mode:null,id:null,raf:0,b:null,brush:{s:'cube',w:2,d:2,h:3,o:0,c:'#c3ae7c',erase:false},hist:[]};
function sideOpen(mode,title,sub){SIDE.mode=mode;$('side').classList.add('on');$('sdTitle').textContent=title;$('sdSub').textContent=sub;closePop();closeSheet();$('dock').style.display='none';cancelAnimationFrame(SIDE.raf);const loop=()=>{if(!SIDE.mode)return;try{SIDE.mode==='encl'?drawSide():drawDesigner()}catch(e){console.error(e)}SIDE.raf=requestAnimationFrame(loop)};loop()}
ACT.closeSide=()=>{SIDE.mode=null;$('side').classList.remove('on');cancelAnimationFrame(SIDE.raf);dockSync();onWorldChanged()};
ACT.sideView=el=>{const e=encById(el.dataset.id);if(!e)return;SIDE.id=e.id;sideOpen('encl',e.name,HABITATS[e.kind].n+' · cross-section');sideCtl()};
function sideCanvas(){const cv=$('sideCv');const w=cv.clientWidth,h=cv.clientHeight;const d=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w,h}}
function drawSide(){const e=encById(SIDE.id);if(!e){ACT.closeSide();return}const{c,w,h}=sideCanvas();const t=performance.now()/1000;const g=geoOf(e);const b=bbox(g);const an=inEncl(e);const tod=S.day%1;const night=tod<.18?1-tod/.18:tod>.82?(tod-.82)/.18:0;
  const tank=e.kind==='tank';const ground=tank?h*.86:h*.62;
  /* sky / room */
  const sky=c.createLinearGradient(0,0,0,ground);if(tank){sky.addColorStop(0,mix('#3f8fa0','#0a1a2a',night*.7));sky.addColorStop(1,mix('#0f3a4e','#04101a',night*.7))}else if(e.kind==='viv'){sky.addColorStop(0,'#2f4a3a');sky.addColorStop(1,'#1d2a21')}else{sky.addColorStop(0,mix('#b8d4d8','#14203a',night));sky.addColorStop(1,mix('#efe2c0','#2a3040',night))}c.fillStyle=sky;c.fillRect(0,0,w,h);
  const reg=an.length?SPECIES[an[0].sp].region:'Africa';
  if(!tank&&e.kind!=='viv'){/* distant hills in region tone */c.fillStyle=mix(REGION_COL[reg]||'#8aa04e','#b8c4a0',.5);c.globalAlpha=.55;c.beginPath();c.moveTo(0,ground);for(let x=0;x<=w;x+=10)c.lineTo(x,ground-40-Math.sin(x*.01+1)*24-Math.sin(x*.023)*14);c.lineTo(w,ground);c.fill();c.globalAlpha=1;

function newPark(name,charter){S=freshState({name,charter,cash:charter==='family'?440000:charter==='science'?420000:400000});
  S.blds.push({id:nid('b'),kind:'desk',x:360,y:700,rot:0,blocks:null});S.flags.ticket=16;S.flags.policy='rehab';S.food={};refreshMarket();refreshCandidates();
  /* a little starting nature near the gate */[[340,690,'acacia'],[384,692,'acacia'],[330,672,'browsebush'],[392,676,'flowers'],[350,712,'pampas'],[372,712,'pampas']].forEach(([x,y,sp])=>S.plants.push({id:nid('t'),sp,x,y,g:1,hue:rnd(-6,6),sc:rnd(.9,1.1),hp:1}));
  S.shapes.push({id:nid('s'),kind:'plaza',pts:[{x:350,y:703,r:1},{x:372,y:703,r:1},{x:376,y:712,r:1},{x:346,y:712,r:1}],c:'#d8cfbc'});
  logEv('Founded '+name,'gold');focusOn(360,668,5.5);saveGame()}

function intro(){const el=$('intro');el.classList.add('on');let charter='conservation';
  el.innerHTML=`<canvas id="introCv"></canvas><div class="in"><svg viewBox="0 0 64 64" style="width:92px;height:92px">${markSVG()}</svg><h1>WILDKEEP</h1><div class="lbl" style="letter-spacing:.3em">A ZOOLOGICAL PARK · FIELD STATION</div><p>Two plots of grassland, a check-in desk and a $400,000 in founding money. What you build from here is up to you.</p>
  <div class="lbl" style="margin-top:18px">Name your park</div><input class="field" id="inName" value="${pick(['Ashgrove','Marula Hill','Kestrel Downs','Saltmarsh','Ironwood','Thornveld','Bramblefield','Lowcountry','Redwater'])} Zoo" maxlength="24" style="margin-top:6px">
  <div class="lbl" style="margin-top:16px">Charter</div><div class="pick"><button class="on" data-act="charter" data-v="conservation"><b>Ark</b>conservation grants</button><button data-act="charter" data-v="family"><b>Gate</b>more visitors</button><button data-act="charter" data-v="science"><b>Lab</b>cheaper genetics</button></div>
  <button class="btn gold wide" data-act="found" style="min-height:50px;font-family:var(--f-sign);letter-spacing:.14em;font-size:16px">FOUND THE PARK</button></div>`;
  ACT.charter=b=>{charter=b.dataset.v;el.querySelectorAll('.pick button').forEach(x=>x.classList.toggle('on',x===b))};
  ACT.found=()=>{newPark($('inName').value.trim()||'Wildkeep',charter);el.classList.remove('on');el.innerHTML='';start();setTimeout(()=>ACT.howto(),300)};
  const cv=$('introCv');const c=cv.getContext('2d');const loop=()=>{if(!el.classList.contains('on'))return;cv.width=innerWidth;cv.height=innerHeight;const t=performance.now()/4000;c.strokeStyle='rgba(208,150,42,.14)';c.lineWidth=1;for(let k=0;k<22;k++){c.beginPath();for(let x=0;x<=cv.width;x+=8){const y=cv.height*(k/22)+Math.sin(x*.006+t+k*.4)*24+Math.sin(x*.013-t*1.3)*10;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}requestAnimationFrame(loop)};loop()}

let _last=0,_hud=0,_started=false;
function frame(now){const dt=Math.min(.1,(now-_last)/1000||0);_last=now;try{simAdvance(dt);tickAnimals(dt);tickGuests(dt*Math.min(S.speed||0,3));if(!SIDE.mode)render();if(++_hud%12===0){hudSync();if(_hud%120===0)dockSync()}}catch(e){console.error(e)}requestAnimationFrame(frame)}
function start(){if(_started)return;_started=true;$('markSvg').innerHTML=markSVG();applyTheme();S.encl.forEach(evalEncl);if(!S.cands)refreshCandidates();if(!S.market.length)refreshMarket();dockSync();hudSync();renderGoal();requestAnimationFrame(t=>{_last=t;requestAnimationFrame(frame)})}
window.addEventListener('resize',()=>{resize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
window.addEventListener('pagehide',()=>saveGame());
(function boot(){resize();initInput();const s=loadGame();if(s){S=s;focusOn(360,668,5.5);start();if(s._tampered)note('Save file was edited outside the game.','bad')}else{S=freshState();intro()}})();
window.__wk={get S(){return S},SPECIES,SPECIES_LIST,processDay:d=>processDay(d),evalEncl,parkScores,buyListing,moveTo,arriveAtClinic,makeAnimal,refreshMarket,newPark,render,CAM,BUILD,startBuild,buildConfirm,openSheet,closeSheet,renderSheet,SHEETS,SH,ACT,IN,certificate,openDesigner,yearEnd,monthEnd,publishIssue,spawnRescue,inspect,pickAt,s2w,wx2s,wy2s};

</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.getRegistration().then(reg=>{if(!reg)return;
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&had){const b=document.createElement('button');b.className='btn gold';b.textContent='New version ready · Tap to update';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:300';b.onclick=()=>{try{saveGame()}catch(e){}location.reload()};document.body.appendChild(b)}})});
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})}
</script>
</body>
