/* =====================================================================
   WILDKEEP · simulation — habitats, welfare, diet, clinic, breeding,
   rehab, guests, money, ratings, magazines, awards, accreditation
   ===================================================================== */
const CLIMATE=[3,4,8,12,16,20,23,22,18,13,8,4];
const parkTemp=()=>{const d=S.day%YEAR/MONTH;const i=Math.floor(d),t=d-i;return lerp(CLIMATE[i%12],CLIMATE[(i+1)%12],t)};
const inEncl=e=>S.animals.filter(a=>a.loc.t==='encl'&&a.loc.id===e.id);
const encById=id=>S.encl.find(e=>e.id===id);
const staffCount=r=>S.staff.filter(s=>s.role===r).length;
function speciesCount(){const s=new Set();S.animals.forEach(a=>{if(a.loc.t==='encl')s.add(a.sp)});return s.size}
function speciesHeld(){const s=new Set();S.animals.forEach(a=>{if(['encl','clinic'].includes(a.loc.t))s.add(a.sp)});return s}
function onWorldChanged(){S._dirty=1;_graph=null;GROUND=null;S.encl.forEach(evalEncl);dockSync()}

/* ---------- habitat evaluation ---------- */
function enclGives(e){const g=new Set();(e.items||[]).forEach(it=>ITEMS[it.t].gives.forEach(x=>g.add(x)));(GROUNDS[e.ground]?.gives||[]).forEach(x=>g.add(x));
  const ge=geoOf(e);let trees=0;S.plants.forEach(p=>{if(pip(p.x,p.y,ge)){const k=PLANTS[p.sp].k;if(['tree','palm','conifer','willow','clump','fern','shrub'].includes(k)&&p.g>.4){trees++}if(PLANTS[p.sp].viv||k==='small'||k==='flowers'||k==='grass')g.add('plants')}});if(trees>=1){g.add('trees');g.add('shade')}if(trees>=2)g.add('plants');
  if(e.kind==='semi'){g.add('pool');g.add('deep')}if(e.kind==='polar'){g.add('cold');g.add('pool');g.add('deep')}if(e.kind==='tank'){g.add('deep');g.add('pool');if((e.settings.temp||25)<=16)g.add('cold')}
  if(e.kind==='viv'){const st=e.settings;if((st.humid||60)>=70)g.add('humid');if((st.climate||24)>=26)g.add('heat');if((st.climate||24)<=16)g.add('cold')}
  if(e.kind==='aviary'){g.add('perch')}if(S.lab.tech.enrich)g.add('enrich');return g}
function enclTemp(e){if(e.kind==='viv')return e.settings.climate||24;if(e.kind==='tank')return e.settings.temp||25;if(e.kind==='polar')return 2;return parkTemp()}
function enclCare(e){/* care capacity from assigned staff */let cap=0,vol=0;const sps=new Set(inEncl(e).map(a=>SPECIES[a.sp]));const dangerous=[...sps].some(s=>s.pred>=2||s.aggr>=3);
  S.staff.forEach(s=>{if(s.assign!==e.id)return;if(s.role==='keeper'){const match=[...sps].every(sp=>sp.keeper===s.spec);cap+=10*(.55+s.edu*.12+s.exp*.35)*(match?1.35:1)/(s.load||1)}if(s.role==='volunteer'&&!dangerous){vol+=3.5/(s.load||1)}});return{cap:cap+vol,keepers:S.staff.filter(s=>s.assign===e.id)}}
function careNeed(sp,a){return(.55+Math.log10(sp.kg+1)*.42)*(sp.pred>=2||sp.aggr>=3?1.3:1)*(.8+sp.diff*.1)*(a&&!isAdult(a)&&ageOf(a)<matDays(sp)*.2?1.8:1)}
function evalEncl(e){const an=inEncl(e);e._n=an.length;e._area=polyArea(geoOf(e));const R={species:{},missing:[],issues:[],space:1,need:1,social:1,temp:1,care:1,compat:[]};
  const gives=enclGives(e);const sps={};an.forEach(a=>{(sps[a.sp]=sps[a.sp]||[]).push(a)});
  /* space: share land/volume across species */
  let needSum=0;Object.entries(sps).forEach(([id,list])=>{needSum+=spaceNeed(SPECIES[id],list.length)});const have=e.kind==='tank'?tankVol(e):e._area;R.spaceHave=have;R.spaceNeed=needSum;R.space=needSum?clamp(have/needSum,0,1.4):1;
  /* needs */let tot=0,met=0;const T=enclTemp(e);
  Object.entries(sps).forEach(([id,list])=>{const sp=SPECIES[id];const miss=sp.needs.filter(n=>{if(n==='heat'&&T>=sp.tmin+4&&e.kind!=='viv')return false;if(n==='cold'&&T<=sp.tmax-6&&e.kind!=='viv'&&e.kind!=='tank')return false;if(n==='grass'&&['grass','savanna'].includes(e.ground))return false;return!gives.has(n)});
    if(!HOME_FITS[e.kind].includes(sp.home))R.issues.push(`${sp.n} cannot live in a ${HABITATS[e.kind].n.toLowerCase()}`);
    if(e.kind==='tank'&&(SALT.has(sp.id)?'salt':'fresh')!==(e.settings.water||'salt'))R.issues.push(`${sp.n} needs ${SALT.has(sp.id)?'salt':'fresh'} water`);
    const n=list.length;let soc=1;if(sp.social!=='solitary'&&n<sp.gmin)soc=.45+.55*n/sp.gmin;if(n>sp.gmax)soc=Math.max(.3,1-(n-sp.gmax)/(sp.gmax+1)*.8);if(sp.social==='solitary'&&n>1&&sp.aggr>=2)soc=.4;
    let tmp=1;const heatOK=gives.has('heat')||gives.has('shelter');const coolOK=gives.has('shade')||gives.has('pool')||gives.has('cold');if(T<sp.tmin)tmp=heatOK&&e.kind!=='tank'&&e.kind!=='viv'?.9:clamp(1-(sp.tmin-T)/10,0,1);if(T>sp.tmax)tmp=coolOK&&e.kind!=='tank'&&e.kind!=='viv'?.9:clamp(1-(T-sp.tmax)/8,0,1);
    const needs=sp.needs.length?1-miss.length/sp.needs.length:1;tot+=n;met+=needs*n;
    R.species[id]={n,miss,soc,tmp,needs,sp};miss.forEach(m=>{if(!R.missing.includes(m))R.missing.push(m)})});
  R.need=tot?met/tot:1;
  /* compatibility */const ids=Object.keys(sps);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const c=compat(SPECIES[ids[i]],SPECIES[ids[j]]);if(!c.ok)R.compat.push(c.why)}
  /* care */const care=enclCare(e);const need=sum(an,a=>careNeed(SPECIES[a.sp],a));R.careCap=care.cap;R.careNeed=need;R.care=need?clamp(care.cap/need,0,1.2):1;R.keepers=care.keepers;
  e._R=R;e._needOk=R.need;e._space=R.space;
  e._warn=an.length&&(R.space<.85||R.need<.7||R.compat.length||R.issues.length||R.care<.6)?1:0;
  e._wel=an.length?sum(an,a=>a.welfare)/an.length:0;return R}

/* ---------- daily ---------- */
let _lastDay=-1;
function simAdvance(dtReal){if(!S||!S.speed)return;const dd=dtReal/DAY_SEC*S.speed;const before=Math.floor(S.day);S.day+=dd;let after=Math.floor(S.day);for(let d=before+1;d<=after;d++){try{processDay(d)}catch(e){console.error('day',e)}}}
function processDay(d){
  S.encl.forEach(evalEncl);
  feedAll();
  S.animals.forEach(a=>dailyAnimal(a));
  S.animals=S.animals.filter(a=>!a._gone);
  clinicDay();rehabDay();breedingDay();deliveriesDay();plantsDay();staffDay();guestsDay();labDay();schoolDay();
  S.encl.forEach(evalEncl);ratingDay();
  if(d%7===0){refreshMarket();refreshCandidates()}
  if(d%MONTH===0)monthEnd(d);
  if(d%YEAR===0)yearEnd(d);
  checkGoals();if(d%5===0)saveGame();
  softRefresh()}

/* ---------- feeding ---------- */
function feedAll(){/* grown food from plants inside habitats */const grown={};S.plants.forEach(p=>{const d=PLANTS[p.sp];if(d.food&&p.g>.5){grown[d.food]=(grown[d.food]||0)+d.kg*p.g*(staffCount('gardener')?1.25:1)}});
  const chef=staffCount('chef');const kitchen=hasB('kitchen');
  /* spoilage */for(const k in S.food){S.food[k]*=chef?.99:.965;if(S.food[k]<.001)S.food[k]=0}
  const auto=S.flags.autoFood!==false;
  S.animals.forEach(a=>{if(!['encl','clinic','rehab','nursery'].includes(a.loc.t))return;const sp=SPECIES[a.sp];const need=dailyKg(sp,a);let got=0;const per=need/sp.diet.length;
    sp.diet.forEach(f=>{let take=0;if(f==='grass'&&a.loc.t==='encl'){const e=encById(a.loc.id);if(e&&['grass','savanna'].includes(e.ground)){take=Math.min(per,per*clamp(e._area/(sp.space*2),0,1))}}
      if(take<per&&grown[f]>0){const t=Math.min(per-take,grown[f]);grown[f]-=t;take+=t}
      if(take<per&&kitchen){const want=per-take;let have=S.food[f]||0;if(have<want&&auto){const buy=Math.max(want*(S.cash>0?30:3),1);const c=buy*FOOD[f].p*1.12;S.cash-=c;S.month.food+=c;S.food[f]=(S.food[f]||0)+buy;have+=buy}const t=Math.min(want,have);S.food[f]=have-t;take+=t}
      got+=take});
    const frac=need?got/need:1;a.fed=frac*(chef?1:.94)+(chef?.0:0);a.hunger=clamp(a.hunger+(1-frac)*.35-.25*frac,0,1)})}

/* ---------- animals ---------- */
function dailyAnimal(a){const sp=SPECIES[a.sp];const age=ageOf(a);
  if(a.loc.t==='transit'||a.loc.t==='released'||a.loc.t==='gone')return;
  let target=.5;
  if(a.loc.t==='encl'){const e=encById(a.loc.id);if(!e){a.loc={t:'clinic'};return}const R=e._R||evalEncl(e);const r=R.species[a.sp]||{soc:1,tmp:1,needs:1};
    target=.24*clamp(R.space,0,1)+.2*r.needs+.15*clamp(a.fed??1,0,1)+.13*r.soc+.16*clamp(R.care,0,1)+.12*r.tmp;
    if(R.compat.length)target-=.18;if(R.issues.length)target-=.25;if(S.lab.tech.conditioning)target+=.02;if(a.hybrid)target-=.03;
    /* fights in bad mixes */if(R.compat.length&&chance(.04)){fight(a,e)}}
  else if(a.loc.t==='clinic'){target=hasB('clinic')?.62:.35;if(clinicLoad()>clinicCap())target-=.15}
  else if(a.loc.t==='rehab'){target=.6}
  else if(a.loc.t==='nursery'){target=.72}
  target=clamp(target,0,1);a.welfare=clamp(a.welfare+(target-a.welfare)*.22,0,1);
  /* health */
  if(a.welfare<.4)a.health-=.012*(1-a.welfare);if(a.hunger>.7)a.health-=.02;if(a.welfare>.65&&a.health<1&&!a.sick)a.health=Math.min(1,a.health+.01);
  if(!a.sick&&chance(.0016*(1.6-a.welfare)*(a.inbred?1.8:1))){a.sick={n:pick(['Parasite load','Respiratory infection','Dental abscess','Foot lesion','Gut stasis','Skin infection','Eye infection']),d:rint(5,25)};note(`${esc(a.name)} the ${esc(sp.n)} is unwell — ${a.sick.n.toLowerCase()}.`,'bad','Vet alert')}
  if(a.sick){const vets=staffCount('vet');a.health-=vets?.004:.018;if(vets&&hasB('clinic')){a.sick.d-=Math.min(2,vets*.6+.4);if(a.sick.d<=0){a.sick=null;logEv(`${a.name} recovered`)}}}
  /* old age */const life=lifeDays(sp);if(age>life*.85&&chance(.0015+Math.max(0,(age-life)/life)*.02))a.health-=.25;
  /* babies without mothers or nursery */if(a.loc.t==='encl'&&age<matDays(sp)*.12&&a.reject&&!hasB('nursery'))a.health-=.05;
  if(a.health<=0)death(a)}
function fight(a,e){const an=inEncl(e);const victims=an.filter(b=>b!==a&&!compat(SPECIES[a.sp],SPECIES[b.sp]).ok);if(!victims.length)return;let v=pick(victims);let att=a;if(SPECIES[v.sp].pred>SPECIES[a.sp].pred){att=v;v=a}const sp=SPECIES[att.sp],vs=SPECIES[v.sp];S.stats.fights++;
  if(sp.pred>=2&&vs.kg<sp.kg*4){v.health-=chance(.5)?1:.5;note(`The ${esc(sp.n)} attacked ${esc(v.name)} the ${esc(vs.n)}.`,'bad','Incident');logEv(`${sp.n} attacked a ${vs.n} in ${e.name}`,'bad')}else{v.health-=.15;att.health-=.08;v.stress=1;note(`Fight in ${esc(e.name)}: ${esc(sp.n)} vs ${esc(vs.n)}.`,'bad','Incident')}if(v.health<=0)death(v);if(att.health<=0)death(att)}
function death(a){const sp=SPECIES[a.sp];a._gone=1;a.loc={t:'gone'};S.stats.died++;(S.dead=S.dead||[]).push({id:a.id,sp:a.sp,name:a.name,d:Math.floor(S.day),age:Math.floor(ageOf(a))});if(S.dead.length>200)S.dead.shift();if(S.book[a.id])S.book[a.id].x=Math.floor(S.day);
  note(`${esc(a.name)} the ${esc(sp.n)} has died${ageOf(a)>lifeDays(sp)*.85?' of old age':''}.`,'bad','Obituary');logEv(`${a.name} (${sp.n}) died aged ${ageStr(ageOf(a))}`,'bad');S.staff.forEach(s=>{if(s.focus===a.id)s.focus=null})}

/* ---------- clinic & quarantine ---------- */
const clinicCap=()=>hasB('clinic')?4+staffCount('vet')*3+(S.flags.clinicUp||0)*4:0;
const clinicLoad=()=>S.animals.filter(a=>a.loc.t==='clinic').length;
function quarantineDays(sp){return sp.group==='fish'||sp.group==='invertebrate'?14:['prim','pachy'].includes(sp.keeper)?45:30}
function testsFor(sp){const t=['Physical exam','Faecal parasite screen','Bloodwork'];if(['hoof','prim','pachy'].includes(sp.keeper))t.push('TB screen');if(sp.keeper==='carn')t.push(sp.plan.includes('cat')?'Panleukopenia vaccine':'Distemper & parvo vaccine');if(sp.keeper==='bird')t.push('Avian influenza & West Nile');if(sp.keeper==='prim')t.push('Measles & hepatitis');if(sp.keeper==='pachy')t.push('Tetanus & EEHV check');if(sp.keeper==='herp')t.push('Cryptosporidium PCR');if(['aqua','marine'].includes(sp.keeper))t.push('Water-borne pathogen screen');if(sp.keeper==='inv')t.push('Mite inspection');return t}
function arriveAtClinic(a){a.loc={t:'clinic'};const sp=SPECIES[a.sp];a.quarantine=quarantineDays(sp);a.qDone=0;a.tests={};testsFor(sp).forEach(t=>a.tests[t]=0);placeNearBuilding(a,'clinic');if(!S.animals.includes(a))S.animals.push(a)}
function clinicDay(){const vets=staffCount('vet');const has=hasB('clinic');let cap=clinicCap();
  S.animals.filter(a=>a.loc.t==='clinic').forEach((a,i)=>{const sp=SPECIES[a.sp];if(!has||!vets){a._qNote='Waiting for '+(has?'a vet':'a clinic');return}if(i>=cap){a._qNote='Clinic full — waiting';return}a._qNote='';
    a.qDone=(a.qDone||0)+(S.lab.tech.conditioning?1.2:1);const keys=Object.keys(a.tests||{});keys.forEach((k,j)=>{if(a.tests[k]<1&&a.qDone>=(j+1)*a.quarantine/(keys.length+1))a.tests[k]=chance(.97)?1:-1});
    keys.forEach(k=>{if(a.tests[k]===-1){a.tests[k]=.5;a.quarantine+=7;note(`${esc(a.name)} (${esc(sp.n)}) needs treatment after the ${k.toLowerCase()} — quarantine extended.`,'','Clinic')}else if(a.tests[k]===.5&&chance(.2))a.tests[k]=1});
    if(a.qDone>=a.quarantine&&Object.values(a.tests).every(v=>v===1)&&!a.cleared){a.cleared=1;if(a.dest){const e=encById(a.dest);if(e&&HOME_FITS[e.kind].includes(sp.home)){moveTo(a,e,true);return}}note(`${esc(a.name)} the ${esc(sp.n)} cleared quarantine and is ready to move.`,'gold','Clinic');logEv(`${a.name} (${sp.n}) cleared quarantine`)}})}
function moveTo(a,e,auto){const sp=SPECIES[a.sp];if(!HOME_FITS[e.kind].includes(sp.home)){note(`${esc(sp.n)} cannot live in a ${HABITATS[e.kind].n.toLowerCase()}.`,'bad');return false}
  const others=inEncl(e);for(const o of others){const c=compat(sp,SPECIES[o.sp]);if(!c.ok&&!S.flags.forceMix){confirmBox('Risky mix',esc(c.why)+'. Move anyway?','Move anyway',()=>{S.flags.forceMix=1;moveTo(a,e);S.flags.forceMix=0},true);return false}}
  a.loc={t:'encl',id:e.id};const p=randInPoly(geoOf(e));a.x=p.x;a.y=p.y;a.tx=a.x;a.ty=a.y;a.dest=null;a.welfare=Math.min(a.welfare,.7);evalEncl(e);S._dirty=1;logEv(`${a.name} (${sp.n}) moved into ${e.name}`);if(auto)note(`${esc(a.name)} the ${esc(sp.n)} moved into ${esc(e.name)}.`,'gold','Moved in');return true}
function placeNearBuilding(a,kind){const b=S.blds.find(x=>x.kind===kind)||S.blds.find(x=>x.kind==='desk');if(!b){a.x=CAM.x;a.y=CAM.y;return}const f=bldFoot(b);a.x=rnd(f.x0,f.x1);a.y=f.y1+rnd(1,4);a.tx=a.x;a.ty=a.y;a._home={x0:f.x0-1,x1:f.x1+1,y0:f.y1+.8,y1:f.y1+5}}

/* ---------- breeding ---------- */
function breedingDay(){const bc=hasB('breeding');S.encl.forEach(e=>{if(e.policy&&e.policy.breed===false)return;const an=inEncl(e);const by={};an.forEach(a=>(by[a.sp]=by[a.sp]||[]).push(a));
  Object.entries(by).forEach(([id,list])=>{const sp=SPECIES[id];const males=list.filter(a=>a.sex==='M'&&isAdult(a)&&a.welfare>.62&&a.health>.6&&ageOf(a)<lifeDays(sp)*.9);if(!males.length)return;
    list.filter(a=>a.sex==='F'&&isAdult(a)&&!a.preg&&a.welfare>.66&&a.health>.7&&ageOf(a)<lifeDays(sp)*.85&&S.day-a.lastBirth>breedInterval(sp)).forEach(f=>{
      const R=e._R;if(R&&(R.space<.9||R.need<.6))return;if(list.length>=sp.gmax+Math.max(1,Math.floor(sp.gmax*.25)))return;
      let p=.035/Math.pow(sp.diff,1.15)*(f.welfare-.55)*3;if(sp.diff>=4)p*=bc?(S.lab.tech.ai?1.6:1):.3;if(sp.repro==='spawn'){p*=e.settings&&e.settings.light==='seasonal'?1.4:.6;if(S.lab.tech.spawn)p*=2}if(sp.gest>300)p*=1.4;
      if(!chance(p))return;const m=males.sort((x,y)=>inbreeding(f.id,x.id)-inbreeding(f.id,y.id))[0];const F=inbreeding(f.id,m.id);
      f.preg={father:m.id,due:S.day+Math.max(4,sp.gest),F,repro:sp.repro};f.bred++;m.bred++;logEv(`${f.name} (${sp.n}) is ${sp.repro==='live'?'expecting':sp.repro==='eggs'?'gravid':'spawning'}`)})})});
  /* births */S.animals.filter(a=>a.preg&&S.day>=a.preg.due).forEach(f=>{const sp=SPECIES[f.sp];const P=f.preg;f.preg=null;f.lastBirth=S.day;const e=f.loc.t==='encl'?encById(f.loc.id):null;
    let n=sp.repro==='live'?rint(1,Math.min(sp.litter,4)):sp.repro==='eggs'?rint(Math.max(1,Math.floor(Math.min(sp.litter,6)/2)),Math.min(sp.litter,6)):rint(1,4);
    let surv;if(sp.repro==='eggs'){surv=hasB('incubator')&&(!e||!e.policy||e.policy.pull!==false)?.85:.5;if(S.lab.tech.eggpull&&hasB('incubator'))n=Math.min(8,n+rint(1,2))}else if(sp.repro==='spawn')surv=.6;else surv=.88;
    surv-=P.F*1.2;let born=0;for(let i=0;i<n;i++){if(!chance(surv))continue;const sex=sp.repro==='eggs'&&S.lab.tech.tsd&&['croc','tortoise','seaturtle','lizard','monitor'].includes(sp.plan)&&e&&e.policy&&e.policy.sex?e.policy.sex:null;
      const kid=makeAnimal(sp.id,{ageDays:0,mother:f.id,father:P.father,origin:'bred',sex,line:f.line,morphBoost:2});inherit(kid,f,S.animals.find(x=>x.id===P.father));if(P.F>=.125){kid.inbred=1;kid.health=.85}
      if(e){kid.loc={t:'encl',id:e.id};kid.x=f.x+rnd(-1,1);kid.y=f.y+rnd(-1,1)}else{kid.loc={t:'clinic'};placeNearBuilding(kid,'clinic')}
      if(sp.repro==='live'&&chance(.05*sp.diff)&&e){kid.reject=1;if(hasB('nursery')){kid.loc={t:'nursery'};placeNearBuilding(kid,'nursery');note(`${esc(f.name)} rejected her ${esc(sp.n)} infant — keepers are hand-rearing it in the nursery.`,'','Nursery')}else note(`${esc(f.name)} rejected her ${esc(sp.n)} infant and you have no nursery.`,'bad','Nursery')}
      S.animals.push(kid);born++;S.stats.born++;(S.yr=S.yr||{}).born=(S.yr.born||0)+1;if(P.F<.0625)S.yr.cleanBorn=(S.yr.cleanBorn||0)+1}
    if(born){sfx('birth');note(`${born} ${esc(sp.n)} ${born>1?'young':'baby'} born to ${esc(f.name)}!${P.F>=.125?' (inbred — check the studbook)':''}`,'gold','Birth');logEv(`${born} ${sp.n} born to ${f.name}`,'gold')}else if(n)note(`${esc(f.name)}'s ${sp.repro==='eggs'?'clutch failed to hatch':'young did not survive'}.`,'bad','Breeding')})}
function breedInterval(sp){return Math.max(45,sp.gest*1.2+(sp.kg>800?500:sp.kg>100?120:30))}
function inherit(kid,m,f){if(!m)return;const g=kid.gen,mg=m.gen,fg=f?f.gen:mg;g.size=clamp((mg.size+fg.size)/2+(Math.random()-.5)*.08,.8,1.2);g.hue=(mg.hue+fg.hue)/2+(Math.random()-.5)*6;g.lit=(mg.lit+fg.lit)/2;if(mg.morph!=='normal'&&fg.morph===mg.morph&&chance(.7))g.morph=mg.morph;else if((mg.morph!=='normal'||fg.morph!=='normal')&&chance(.25))g.morph=chance(.5)?mg.morph:fg.morph;if(m.hybrid){kid.hybrid=m.hybrid;g.extra=(mg.extra||[]).slice();g.pat=mg.pat}}

/* ---------- rehab & release ---------- */
function rehabDay(){if(!hasB('rehab'))return;const vets=staffCount('vet');
  if(S.day%MONTH===15&&chance(.35+S.rating*.08)){spawnRescue()}
  S.animals.filter(a=>a.loc.t==='rehab').forEach(a=>{const r=a.rehab;if(!r)return;const sp=SPECIES[a.sp];
    if(r.stage==='treat'){if(vets){r.prog+=1+vets*.15;if(r.prog>=r.need){r.stage='condition';r.cp=0;note(`${esc(a.name)} the ${esc(sp.n)} has healed — conditioning for release begins.`,'','Rehab')}}}
    else if(r.stage==='condition'){r.cp+=1;r.forage=clamp((r.forage||0)+(S.flags.liveFood!==false?.02:.008),0,1);r.fear=clamp((r.fear??.5)+(S.flags.handsOff!==false?.015:-.01),0,1);if(r.forage>=.9&&r.fear>=.8&&r.cp>=30){r.stage='acclim';r.ac=0;note(`${esc(a.name)} is ready for a pre-release pen.`,'gold','Rehab')}}
    else if(r.stage==='acclim'){const pen=S.encl.find(e=>(e.items||[]).some(i=>i.t==='releasepen'));if(pen){r.ac+=1;if(r.ac>=14&&r.stage!=='ready'){r.stage='ready';note(`${esc(a.name)} the ${esc(sp.n)} passed every release check.`,'gold','Rehab')}}else r.waitPen=1}})}
function spawnRescue(){const id=pick(RESCUE_POOL);const sp=SPECIES[id];const inj=pick(INJURY.filter(i=>i.for.includes(sp.group)))||INJURY[0];const a=makeAnimal(id,{ageDays:inj.id==='orphan'?rint(5,60):rint(matDays(sp),lifeDays(sp)*.5),origin:'rescue',wild:true,health:rnd(.3,.6)});
  a.rehab={inj:inj.n,need:rint(inj.days[0],inj.days[1]),prog:0,stage:'treat',forage:inj.id==='orphan'?0:.4,fear:inj.id==='orphan'?.2:.6,from:pick(['a wildlife hospital','a ranger patrol','a coast guard crew','a farmer','a partner sanctuary','a road crew'])};a.loc={t:'rehab'};placeNearBuilding(a,'rehab');S.animals.push(a);S.stats.rescued++;sfx('chirp');
  note(`A ${esc(sp.n.toLowerCase())} (${esc(inj.n.toLowerCase())}) arrived from ${a.rehab.from}.`,'gold','Rescue');logEv(`Rescued ${sp.n}: ${inj.n}`)}
function releaseAnimal(a,soft){const sp=SPECIES[a.sp];const r=a.rehab;let p=(soft?.88:.7)+(S.lab.tech.softrelease?.08:0);if(r)p+=(r.forage-.9)+(r.fear-.8);
  const ok=chance(clamp(p,.3,.98));if(ok){a.loc={t:'released'};a._gone=1;S.animals=S.animals.filter(x=>x!==a);S.stats.released++;(S.yr=S.yr||{}).released=(S.yr.released||0)+1;S.released.push({sp:a.sp,name:a.name,d:Math.floor(S.day),soft,wild:!!a.wild,F:a.inbred?1:0});if(S.book[a.id])S.book[a.id].r=Math.floor(S.day);sfx('gold');note(`${esc(a.name)} the ${esc(sp.n)} was released into the wild${soft?' (soft release)':''}.`,'gold','Release');logEv(`Released ${a.name} (${sp.n})`,'gold');S.rep+=threatened(sp)?4:2}
  else{a.health-=.2;if(r){r.stage='condition';r.cp=0;r.forage-=.2}note(`${esc(a.name)} struggled after release and was recovered — back to conditioning.`,'bad','Release');if(!a.rehab){a.loc={t:'clinic'};placeNearBuilding(a,'clinic')}}closePop();renderSheet()}
function canReintroduce(a){const sp=SPECIES[a.sp];return S.flags.policy==='reintro'&&threatened(sp)&&isAdult(a)&&!a.hybrid&&!a.inbred&&a.welfare>.75&&a.loc.t==='encl'&&a.origin==='bred'}

/* ---------- deliveries, market, staff ---------- */
function deliveriesDay(){S.deliveries=S.deliveries.filter(d=>{if(S.day<d.due)return true;const a=d.a;arriveAtClinic(a);sfx('chirp');note(`${esc(a.name)} the ${esc(SPECIES[a.sp].n)} arrived and is in quarantine.`,'','Delivery');logEv(`${SPECIES[a.sp].n} arrived at the clinic`);return false})}
function refreshMarket(){const n=10+S.accred*4+Math.floor(S.rating*2);const pool=SPECIES_LIST.filter(sp=>sp.rar<=5);const W=[0,1,.75,.42,.18,.07];S.market=S.market.filter(m=>m.exp>S.day);
  while(S.market.length<n){let sp;for(let k=0;k<20;k++){const c=pick(pool);if(chance(W[c.rar])){sp=c;break}}if(!sp)continue;const baby=chance(.45);const line=chance(sp.rar>=3?.12:.07);const morph=line?pick(['golden','pale','dark','red','leucistic','blue']):chance(.04)?rollMorph(6):'normal';
    const mult=(line?1.7:1)*(morph!=='normal'?1.5:1)*rnd(.85,1.2);const adult=Math.round(sp.price*mult/100)*100;const price=baby?Math.round(adult*.35/100)*100:adult;
    const del=baby?rint(4,8)+sp.rar*2:Math.round(8+Math.log10(sp.kg+1)*8+sp.rar*4);
    S.market.push({id:nid('m'),sp:sp.id,baby,sex:chance(.5)?'F':'M',price,line:line?pick(LINES)+' line':null,morph,del,exp:S.day+rint(8,20),size:line?rnd(1.04,1.14):null})}}
function buyListing(id,dest){const m=S.market.find(x=>x.id===id);if(!m)return;const sp=SPECIES[m.sp];const need=RARITY_ACCRED[sp.rar];if(S.accred<need)return note(`${sp.n} is only released to ${ACCRED[need].n} members.`,'bad');if((sp.status==='CR'||sp.status==='EW')&&!S.permits[sp.id])return note('A breeding-programme permit is needed first.','bad');if(!hasB('clinic'))return note('Build a veterinary clinic first — arrivals must be quarantined.','bad');
  if(!spend(m.price,'animals'))return;const age=m.baby?rint(Math.max(10,matDays(sp)*.04),Math.max(20,matDays(sp)*.15)):rint(matDays(sp),Math.max(matDays(sp)+30,lifeDays(sp)*.35));
  const a=makeAnimal(sp.id,{ageDays:age,sex:m.sex,origin:m.baby?'market-baby':'market-adult',line:m.line,morph:m.morph,size:m.size});a.dest=dest||null;a.boughtAt=S.day;a.loc={t:'transit'};
  S.deliveries.push({a,due:S.day+m.del});S.market=S.market.filter(x=>x!==m);S.stats.bought++;sfx('buy');note(`${esc(sp.n)} ordered — arrives in ${m.del} days.`,'','Register');logEv(`Bought ${m.baby?'a young':'an adult'} ${sp.n} for ${money(m.price)}`)}
function makeCandidate(role){const r=role||pick(['keeper','keeper','keeper','keeper','vet','chef','scientist','educator','gardener']);const edu=pick([1,1,1,2,2,2,3,3,4,5]);const spec=r==='keeper'?pick(Object.keys(KEEPER)):null;
  return{id:nid('c'),role:r,name:pick(FIRST)+' '+pick(LAST),edu:r==='vet'||r==='scientist'?Math.max(3,edu):edu,spec,exp:rnd(0,.5),wage:Math.round(ROLES[r].wage*(1+.22*(edu-1))*rnd(.92,1.1)/50)*50,age:rint(21,58),bio:pick(['Hand-reared a rhino calf','Ran a sea turtle hatchery','Field researcher, 6 years','Ex-sanctuary manager','Studbook keeper','Former safari guide','Published on enrichment','Worked at a raptor centre','Aquarium diver','Volunteer turned pro','Grew up on a farm','Speaks four languages'])}}
function refreshCandidates(){S.cands=[];for(let i=0;i<7;i++)S.cands.push(makeCandidate())}
function staffDay(){S.staff.forEach(s=>{s.exp=clamp((s.exp||0)+(s.assign||s.role!=='keeper'?.0016:.0004)*(hasB('lodge')?1.3:1),0,1)});
  /* keeper load: number of habitats each keeper is assigned to (single assignment) — position keepers near their habitat for the map */
  S.staff.forEach(s=>{if(s.role==='keeper'||s.role==='volunteer'){const e=s.assign&&encById(s.assign);if(e){const g=geoOf(e);const b=bbox(g);s._x=lerp(b.x0,b.x1,.5)+rnd(-3,3);s._y=b.y1+1.6}else s._x=null}})}

/* ---------- plants ---------- */
function plantsDay(){const gard=staffCount('gardener');S.plants.forEach(p=>{const d=PLANTS[p.sp];if(p.g<1)p.g=Math.min(1,p.g+(1/d.grow)*(gard?1.4:1));
  if(p.encl){const e=encById(p.encl);if(e){const browsers=inEncl(e).filter(a=>SPECIES[a.sp].diet.includes('browse')||SPECIES[a.sp].plan==='elephant').length;if(browsers&&d.k!=='small'){p.hp=(p.hp??1)-browsers*.002/(gard?2:1);if(p.hp<.3)p.g=Math.max(.3,p.g-.004)}}}})}

/* ---------- lab & school ---------- */
function labDay(){S.lab.eggs=S.lab.eggs.filter(eg=>{if(S.day<eg.due)return true;const sp=SPECIES[eg.sp];
  if(!chance(eg.p)){note(`Embryo of ${esc(sp.n)}${eg.trait?' × '+esc(TRAITS[eg.trait.replace('pat:','')]||eg.trait):''} did not develop.`,'bad','Laboratory');return false}
  const o={ageDays:0,origin:eg.trait?'lab-hybrid':'lab',mother:eg.mother,father:eg.father};if(eg.trait){if(eg.trait.startsWith('pat:'))o.pat=eg.trait.slice(4);else o.extra=[eg.trait];o.donor=eg.donor}
  const a=makeAnimal(sp.id,o);if(eg.trait){a.hybrid=eg.donor;S.stats.hybrids++;a.gen.donorCols=SPECIES[eg.donor].cols}else{S.stats.born++;(S.yr=S.yr||{}).born=(S.yr.born||0)+1}
  if(hasB('nursery')){a.loc={t:'nursery'};placeNearBuilding(a,'nursery')}else{arriveAtClinic(a)}if(!S.animals.includes(a))S.animals.push(a);sfx('birth');note(`The lab delivered ${esc(a.name)} — a ${eg.trait?esc(sp.n)+' carrying '+esc((TRAITS[eg.trait.replace('pat:','')]||'a new pattern').toLowerCase()):'healthy '+esc(sp.n)}.`,'gold','Laboratory');logEv(`Lab: ${sp.n}${eg.trait?' hybrid':''} born`,'gold');return false});
  /* nursery graduates */S.animals.filter(a=>a.loc.t==='nursery'&&ageOf(a)>matDays(SPECIES[a.sp])*.2).forEach(a=>{if(!a._grad){a._grad=1;note(`${esc(a.name)} the ${esc(SPECIES[a.sp].n)} is weaned and ready to join a habitat.`,'','Nursery')}})}
const TECH={conditioning:{n:'Operant conditioning',d:'Animals present for vet checks voluntarily: faster quarantine, less stress.',cost:30000,days:30},enrich:{n:'Enrichment programme',d:'Daily puzzles, scents and scatter feeds: every habitat counts as enriched.',cost:45000,days:40},handrear:{n:'Hand-rearing',d:'Nursery babies thrive; rejected infants survive.',cost:25000,days:30},
  eggpull:{n:'Egg pulling & double clutching',d:'Bigger clutches for birds and reptiles with an incubator.',cost:40000,days:45,need:'incubator'},tsd:{n:'Temperature-sex incubation',d:'Choose the sex of hatching reptiles per habitat.',cost:35000,days:40,need:'incubator'},ai:{n:'Artificial insemination',d:'Difficult species breed far more often at the breeding centre.',cost:90000,days:60,need:'breeding'},
  spawn:{n:'Spawning triggers',d:'Light and temperature cycles double fish and invertebrate spawning.',cost:50000,days:45},puppet:{n:'Puppet rearing',d:'Hand-reared young stay wild enough to release.',cost:30000,days:40},softrelease:{n:'Soft-release protocols',d:'Release success rises 8%.',cost:35000,days:40,need:'rehab'}};
function schoolDay(){if(S.lab.learning&&S.day>=S.lab.learning.due){S.lab.tech[S.lab.learning.k]=1;note(`Keepers have learned ${esc(TECH[S.lab.learning.k].n.toLowerCase())}.`,'gold','Keeper school');logEv('Learned '+TECH[S.lab.learning.k].n,'gold');S.lab.learning=null}
  S.staff.forEach(s=>{if(s.course&&S.day>=s.course){s.course=null;s.edu=Math.min(5,s.edu+1);s.wage=Math.round(s.wage*1.12/50)*50;note(`${esc(s.name)} graduated — now ${EDU[s.edu]}.`,'gold','Keeper school')}})}

/* ---------- guests ---------- */
let _graph=null;
function guestGraph(){if(_graph&&_graph.length===S.paths.length)return _graph;_graph=S.paths.map(p=>({p,g:pathGeo(p)}));return _graph}
function viewable(e){const g=geoOf(e);const b=bbox(g);for(const p of S.paths){const q=pathGeo(p);for(const v of q){if(v.x<b.x0-16||v.x>b.x1+16||v.y<b.y0-16||v.y>b.y1+16)continue;for(let j=0;j<g.length;j++)if(segDist(v,g[j],g[(j+1)%g.length])<15)return true}}return false}
function fairPrice(){return 10+S.rating*6+S.accred*2}
function guestsDay(){const gp=parkScores(true);const season=1+.35*Math.sin((S.day%YEAR/YEAR-.3)*Math.PI*2);const ticket=S.flags.ticket??18;const pf=clamp(1.45-.45*ticket/fairPrice(),.15,1.3);
  const n=Math.round((S.paths.length?1:0)*(10+40*Math.pow(S.rating,1.8)+gp.viewSpecies*6)*season*pf*rnd(.85,1.15));S.guestsToday=n;S.stats.peakGuests=Math.max(S.stats.peakGuests,n);if(n>=1500&&S.rating>=4)S.flags.visitorPeak=1;
  const cafe=S.blds.filter(b=>b.kind==='cafe').length,shop=S.blds.filter(b=>b.kind==='shop').length;
  const spend=n*(Math.min(cafe,3)*2.6+Math.min(shop,2)*2.2);const tk=n*ticket;const don=n*(.15+S.rating*.12)*(staffCount('educator')?1.4:1);
  S.cash+=tk+spend+don;S.month.tickets+=tk;S.month.sales+=spend;S.month.donations+=don;S.month.guests+=n;S.month.photos+=Math.round(n*(.03+gp.photo*.06))}
function tickGuests(dt){const G=guestGraph();if(!G.length){S.guests.length=0;return}const want=Math.min(110,Math.round(Math.sqrt(S.guestsToday||0)*4));const tod=S.day%1;const open=tod>.2&&tod<.8;
  if(open&&S.guests.length<want&&chance(.15)){const desk=S.blds.find(b=>b.kind==='desk');let best=G[0],bd=1e9,end=0;if(desk){G.forEach(o=>{[0,o.g.length-1].forEach(k=>{const d=dist(o.g[k],desk);if(d<bd){bd=d;best=o;end=k}})})}const pl=polyLen(best.g);
    S.guests.push({pi:G.indexOf(best),d:end?pl:0,dir:end?-1:1,x:best.g[end].x,y:best.g[end].y,c:pick(SHIRTS),k:chance(.12)?'photo':'',ph:Math.random()*6,life:rnd(60,200),pause:0})}
  S.guests=S.guests.filter(g=>{g.life-=dt;if(g.life<0||(!open&&chance(.02)))return false;const o=G[g.pi];if(!o)return false;if(g.pause>0){g.pause-=dt;return true}const L=polyLen(o.g);g.d+=g.dir*dt*1.3;
    if(g.d<0||g.d>L){const at=g.d<0?o.g[0]:o.g[o.g.length-1];const opts=[];G.forEach((q,i)=>{if(i===g.pi)return;for(let k=0;k<q.g.length;k++)if(dist(q.g[k],at)<5){opts.push([i,k]);break}});if(opts.length&&chance(.85)){const[i,k]=pick(opts);g.pi=i;const q=G[i];g.d=polyLen(q.g.slice(0,k+1));g.dir=k>q.g.length/2?-1:1}else{g.dir*=-1;g.d=clamp(g.d,0,L)}}
    if(chance(.004))g.pause=rnd(1,4);const p=pointAt(G[g.pi].g,g.d);const off=((g.ph*7)%2-1)*1.2;g.x=p.x-Math.sin(p.a)*off;g.y=p.y+Math.cos(p.a)*off;return true})}

/* ---------- live animal movement ---------- */
function tickAnimals(dt){const night=(S.day%1)<.15||(S.day%1)>.87;S.animals.forEach(a=>{if(!['encl','clinic','rehab','nursery'].includes(a.loc.t))return;const sp=SPECIES[a.sp];
  let area=null,poly=null;if(a.loc.t==='encl'){const e=encById(a.loc.id);if(!e)return;poly=geoOf(e);a._kind=e.kind}else{if(!a._home){placeNearBuilding(a,a.loc.t==='rehab'?'rehab':a.loc.t==='nursery'?'nursery':'clinic')}area=a._home}
  a.st-=dt;const nocturnal=['aardvark','owl','hyena','platypus','echidna','wombat','sloth'].includes(sp.plan)||sp.id==='binturong'||sp.id==='tas_devil';
  if(a.st<=0){const sleepy=(night&&!nocturnal)||(!night&&nocturnal&&chance(.5));const r=Math.random();
    if(sleepy&&chance(.7)){a.state='sleep';a.st=rnd(4,10)}else if(r<.45){a.state='walk';let t;const e=poly&&encById(a.loc.id);
      if(e&&chance(.35)&&e.items&&e.items.length){const it=pick(e.items);t={x:it.x+rnd(-2,2),y:it.y+rnd(-2,2)};if(!pip(t.x,t.y,poly))t=null}
      if(!t)t=poly?randInPoly(poly):{x:rnd(area.x0,area.x1),y:rnd(area.y0,area.y1)};a.tx=t.x;a.ty=t.y;a.st=rnd(4,12)}
    else if(r<.7&&['grass','browse','hay'].includes(sp.diet[0])&&planFamily(sp.plan)==='quad'){a.state='graze';a.st=rnd(2,6)}else{a.state='idle';a.st=rnd(1.5,5)}
    if(planFamily(sp.plan)==='bird'&&a._kind==='aviary'&&chance(.3)&&!['penguin','ratite','flamingo','puffin','stork'].includes(sp.plan)){a.state='fly';const t=randInPoly(poly);a.tx=t.x;a.ty=t.y;a.st=rnd(2,5)}
    if(a._kind==='tank'||planFamily(sp.plan)==='fish'){a.state='swim';const t=poly?randInPoly(poly):{x:a.x,y:a.y};a.tx=t.x;a.ty=t.y;a.st=rnd(3,8)}}
  if(a.state==='walk'||a.state==='fly'||a.state==='swim'){const spd=(a.state==='fly'?3:a.state==='swim'?.9:.55)*Math.sqrt(sp.len+.3)*Math.min(S.speed||1,3)*.8;const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<.2){a.state=a.state==='swim'?'swim':'idle';if(a.state==='swim'){a.st=0}}else{const s=Math.min(d,spd*dt);a.x+=dx/d*s;a.y+=dy/d*s;if(Math.abs(dx)>.05)a.face=dx>0?1:-1}}
  /* altitude: flyers & swimmers */const tAlt=a.state==="fly"?3+(a.gen.patSeed%4):a._kind==='tank'?((a.gen.patSeed%7)/7)*((encById(a.loc.id)||{}).depth||2)*.5:0;a._alt=lerp(a._alt||0,tAlt,Math.min(1,dt*.8));
  if(!S.speed&&a.state!=='sleep')a.state=a.state==='walk'?'idle':a.state})}

/* =====================================================================
   WILDKEEP · score checkers, rating, money month, magazines, awards,
   accreditation and the integrity (anti-grind) check
   ===================================================================== */
function parkScores(fresh){if(!fresh&&S._ps&&S._psd===Math.floor(S.day))return S._ps;
  const inE=S.animals.filter(a=>a.loc.t==='encl');const view=S.encl.filter(e=>e._n&&viewable(e));const vs=new Set();let appeal=0;view.forEach(e=>{const seen=new Set();inEncl(e).forEach(a=>{if(!seen.has(a.sp)){seen.add(a.sp);vs.add(a.sp);appeal+=appealOf(SPECIES[a.sp])*(a.hybrid?1.3:1)}})});
  const sp=speciesCount();const ha=landArea()/10000;
  const welfare=inE.length?sum(inE,a=>a.welfare)/inE.length:0;const minWel=inE.length?Math.min(...inE.map(a=>a.welfare)):0;
  const occ=S.encl.filter(e=>e._n);const space=occ.length?occ.filter(e=>e._space>=.95).length/occ.length:0;const needs=occ.length?sum(occ,e=>e._needOk||0)/occ.length:0;const diet=inE.length?sum(inE,a=>clamp(a.fed??1,0,1))/inE.length:0;
  const ratio=sp/(ha*3.2+.01);const density=sp?clamp(1-Math.abs(Math.log(ratio))*.55,0,1):0;
  const keepers=S.staff.filter(s=>s.role==='keeper');const kEdu=keepers.length?sum(keepers,s=>s.edu)/keepers.length:0;const matchN=keepers.filter(s=>{const e=s.assign&&encById(s.assign);return e&&inEncl(e).every(a=>SPECIES[a.sp].keeper===s.spec)}).length;const expertise=keepers.length?clamp(kEdu/5*.6+matchN/keepers.length*.4,0,1):0;
  const care=occ.length?sum(occ,e=>clamp(e._R?.care||0,0,1))/occ.length:0;
  const plantsM=S.plants.filter(p=>p.g>.6).length;const custom=S.blds.filter(b=>b.custom);const shapesUsed=new Set();custom.forEach(b=>(b.blocks||[]).forEach(k=>shapesUsed.add(k.s)));
  const curvy=S.paths.length?sum(S.paths,p=>p.pts.length>2?1:.4)/S.paths.length:0;const roundE=S.encl.length?sum(S.encl,e=>e.pts.filter(p=>p.r).length/e.pts.length)/S.encl.length:0;
  const themed=occ.length?occ.filter(e=>{const r=new Set(inEncl(e).map(a=>SPECIES[a.sp].region));return r.size===1}).length/occ.length:0;
  const design=clamp(.25*clamp(plantsM/(ha*35+5),0,1)+.2*clamp(custom.length/4,0,1)+.15*curvy+.15*roundE+.1*clamp(S.shapes.length/(ha*3+2),0,1)+.15*themed,0,1);
  const threat=new Set(inE.filter(a=>threatened(SPECIES[a.sp])).map(a=>a.sp)).size;const conservation=clamp(threat/Math.max(4,sp)*.6+clamp((S.yr?.born||0)/20,0,1)*.2+clamp(S.stats.released/15,0,1)*.2,0,1);
  const releaseScore=clamp((S.stats.released*1.5+S.rehabDone.length)/20,0,1)*(S.flags.policy==='none'?.4:1);
  const amen=clamp((Math.min(S.blds.filter(b=>b.kind==='cafe').length,3)/2+Math.min(S.blds.filter(b=>b.kind==='toilets').length,3)/2+Math.min(S.blds.filter(b=>b.kind==='bench').length,12)/10+Math.min(S.blds.filter(b=>b.kind==='shop').length,2)/2)/4*1.6,0,1);
  const photo=clamp(S.blds.filter(b=>b.kind==='hide'||b.kind==='tower').length/5*.5+plantsM/200*.25+clamp(appeal/120,0,1)*.25,0,1);
  /* integrity: grind patterns */const cheap={};occ.forEach(e=>{new Set(inEncl(e).map(a=>a.sp)).forEach(id=>{const s=SPECIES[id];if(s.status==='LC'&&s.rar<=2)cheap[id]=(cheap[id]||0)+1})});const dupes=sum(Object.values(cheap),v=>Math.max(0,v-2));
  const crowd=occ.filter(e=>e._space<.8).length;const price=(S.flags.ticket??18)>fairPrice()*1.5?1:0;const trades=(S.trades||[]).filter(t=>S.day-t<YEAR).length;const fastIdle=clamp((S.stats.grind||0)/200,0,1);
  const integrity=clamp(1-dupes*.06-crowd*.07-price*.15-trades*.03-fastIdle*.25-(S.stats.hybrids>40?.1:0),0,1);
  const ps={viewSpecies:vs.size,species:sp,appeal,welfare,minWel,space,needs,diet,density,ratio,expertise,kEdu,care,design,plantsM,customN:custom.length,shapesUsed:shapesUsed.size,themed,threat,conservation,releaseScore,amen,photo,integrity,dupes,crowd,trades,ha};
  S._ps=ps;S._psd=Math.floor(S.day);return ps}
function ratingDay(){const p=parkScores(true);const appealN=clamp(Math.log10(1+p.appeal)/2.25,0,1);
  let t=.3+1.7*appealN+1.25*p.welfare+.6*p.amen+.55*p.design+.3*p.density+.2*p.photo-(S.encl.some(e=>e._warn&&e._n)?.25:0)-((S.flags.ticket??18)>fairPrice()*1.3?.4:0);if(!S.animals.some(a=>a.loc.t==='encl'))t=Math.min(t,.8);t=clamp(t*(.85+.15*p.integrity),0,5);
  S.rating=clamp(S.rating+(t-S.rating)*.04,0,5);S.welfare=p.welfare;S.appeal=p.appeal}

/* ---------- month ---------- */
function monthEnd(d){const m=S.month;const wages=sum(S.staff,s=>s.wage);const up=sum(S.encl,e=>e.kind==='tank'?tankVol(e)*2.8+800:e.kind==='polar'?(e._area||0)*1.5+1500:e.kind==='viv'?(e._area||0)*6+300:(e._area||0)*.05+150)+sum(S.blds,b=>BLD[b.kind].cost*.003);
  const grant=Math.round(1500+S.accred*14000+Math.pow(S.rating,2)*2600+parkScores().threat*700+S.stats.released*300+(S.flags.patron?20000:0));
  S.cash+=grant-wages-up;m.wages=wages;m.upkeep=up;m.grants=grant;
  const rec={d,...m,cash:S.cash,rating:S.rating,welfare:S.welfare,species:speciesCount()};S.ledger.push(rec);if(S.ledger.length>240)S.ledger.shift();
  for(const k in m)m[k]=0;
  /* magazine rotation */const mk=['ff','wl','nr'][Math.floor(d/MONTH)%3];publishIssue(mk);
  checkAccred();if(S.cash<0){note('The park is in debt. Patrons are worried — cut costs or raise income.','bad','Finance');S.rep-=1}
  if(S.speed>=8)S.stats.grind=(S.stats.grind||0)+(S._actions?0:6);S._actions=0;
  logEv(`Month closed: ${money(rec.tickets+rec.sales+rec.donations+grant)} in, ${money(wages+up+rec.food+rec.build+rec.animals)} out`);
  if(S.cash<-200000&&!S.flags.bailout){S.flags.bailout=1;S.cash+=150000;note('An emergency patron loan of $150k keeps the gates open — once.','gold','Finance')}}
function yearEnd(d){const y=Math.floor(d/YEAR);const p=parkScores(true);const won=[];const has=id=>S.awards.some(a=>a.id===id);const ys=S.yr||{};const yrMags=S.mags.filter(m=>m.d>d-YEAR);
  const magAvg=k=>{const l=yrMags.filter(m=>m.mag===k);return l.length?sum(l,m=>m.score)/l.length:0};
  const tankV=sum(S.encl.filter(e=>e.kind==='tank'),e=>tankVol(e));const aquaSp=new Set(S.animals.filter(a=>a.loc.t==='encl'&&encById(a.loc.id)?.kind==='tank').map(a=>a.sp)).size;
  const C={newcomer:y<=2&&S.rating>=3,welfare:p.welfare>=.88&&p.minWel>=.5,breeding:(ys.cleanBorn||0)>=12,release:(ys.released||0)>=5,garden:p.plantsM>=250&&p.design>=.8,arch:p.customN>=6&&p.shapesUsed>=4,photo:magAvg('wl')>=8,diversity:p.species>=40&&p.density>=.7,aquarium:tankV>=5000&&aquaSp>=15,academy:S.staff.filter(s=>s.role==='keeper').length>=15&&p.kEdu>=4,rescue:S.stats.released+S.rehabDone.length>=10,visitor:!!S.flags.visitorPeak,
    ark:p.species>=120&&S.stats.born>=2000&&S.stats.released>=40&&p.welfare>=.92&&S.rating>=4.9&&['ff','wl','nr'].every(k=>yrMags.some(m=>m.mag===k&&m.score>=9))&&p.customN>=8&&p.kEdu>=4&&S.encl.some(e=>e.kind==='tank'&&e.depth>=6&&tankVol(e)>=2000)&&p.integrity>=.92&&p.minWel>=.6};
  AWARDS.forEach(a=>{if(C[a.id]&&!(a.id==='newcomer'&&has('newcomer'))&&!(a.id==='ark'&&has('ark'))){S.awards.push({id:a.id,y,d});won.push(a)}});
  S.flags.visitorPeak=0;S.yr={};
  if(won.length){sfx('gold');won.forEach(a=>{note(`<b>${esc(a.n)}</b> — Year ${y}`,'gold','Award');logEv('Won '+a.n,'gold')});if(won.some(a=>a.ark)){S.flags.ark=1;setTimeout(()=>arkCeremony(),400)}else setTimeout(()=>awardsCeremony(won,y),400)}
  else note('Awards season passed without a win. The judges are watching next year.','','Year '+y)}

/* ---------- accreditation ---------- */
function accredCheck(level){const n=ACCRED[level].need;const p=parkScores();const keepers=S.staff.filter(s=>s.role==='keeper');const rows=[];const R=(t,ok,v)=>rows.push({t,ok,v});
  if(n.species)R(`${n.species}+ species on show`,p.species>=n.species,p.species);if(n.welfare)R(`Average welfare ${pct(n.welfare)}+`,p.welfare>=n.welfare,pct(p.welfare));if(n.clinic)R('A veterinary clinic with a vet',hasB('clinic')&&staffCount('vet')>0,hasB('clinic')?staffCount('vet')+' vets':'none');
  if(n.stars)R(`${n.stars}★ rating`,S.rating>=n.stars,S.rating.toFixed(1)+'★');if(n.keeperEdu)R(`Keepers average ${EDU[Math.ceil(n.keeperEdu)]} level`,keepers.length&&p.kEdu>=n.keeperEdu,p.kEdu.toFixed(1));if(n.threat)R(`${n.threat}+ threatened species`,p.threat>=n.threat,p.threat);if(n.births)R(`${n.births}+ captive births (all time)`,S.stats.born>=n.births,S.stats.born);if(n.releases)R(`${n.releases}+ animals released`,S.stats.released>=n.releases,S.stats.released);
  return rows}
function checkAccred(){const next=S.accred+1;if(next<ACCRED.length){const rows=accredCheck(next);if(rows.every(r=>r.ok)){S.accred=next;sfx('gold');S.cash+=next*50000;note(`<b>${ACCRED[next].n}</b> — inspectors approved the park. ${money(next*50000)} grant released.`,'gold','Accreditation');logEv('Accredited: '+ACCRED[next].n,'gold')}}
  if(S.accred>0){const cur=ACCRED[S.accred].need;const p=parkScores();if(cur.welfare&&p.welfare<cur.welfare-.08){S.flags.accWarn=(S.flags.accWarn||0)+1;if(S.flags.accWarn>=3){S.accred--;S.flags.accWarn=0;note('Accreditation downgraded — welfare fell too far.','bad','Accreditation');logEv('Accreditation downgraded','bad')}else note('Inspectors warn: welfare is below accreditation standard.','bad','Accreditation')}else S.flags.accWarn=0}}

/* ---------- magazines ---------- */
function publishIssue(k){const p=parkScores(true);if(!S.animals.some(a=>a.loc.t==='encl'))return;const M=MAGS[k];let sc;
  const hyb=S.animals.filter(a=>a.hybrid&&a.loc.t==='encl').length;
  if(k==='ff')sc=p.welfare*4.2+p.needs*1.2+p.space*1.1+p.conservation*1.8+p.design*.9+p.density*.8-(hyb?Math.min(1.5,hyb*.15):0);
  else if(k==='wl')sc=clamp(Math.log10(1+p.appeal)/2.2,0,1)*3.6+p.photo*2.6+p.design*1.8+p.welfare*1.2+(hyb?Math.min(1,hyb*.2):0)+(S.animals.some(a=>a.gen.morph!=='normal'&&a.loc.t==='encl')?.6:0);
  else sc=clamp((S.stats.born)/120,0,1)*2+p.releaseScore*2+p.expertise*2.2+p.conservation*1.6+clamp(Object.keys(S.lab.tech).length/6,0,1)*1+p.welfare*1.2-(hyb?Math.min(2,hyb*.25):0)-(S.animals.some(a=>a.inbred)?.6:0);
  sc=clamp(sc*(.7+.3*p.integrity),0,10);sc=Math.round(sc*10)/10;
  const pool=S.animals.filter(a=>a.loc.t==='encl');const feat=pool.sort((x,y)=>(appealOf(SPECIES[y.sp])+(y.gen.morph!=='normal'?3:0)+(y.hybrid&&k==='wl'?3:0))-(appealOf(SPECIES[x.sp])+(x.gen.morph!=='normal'?3:0)+(x.hybrid&&k==='wl'?3:0)))[Math.floor(Math.random()*Math.min(3,pool.length))];
  const v=M.voice;const opener=sc>=8?v[0]:sc>=6.5?v[1]:sc>=5?v[4]:v[3];const best=k==='ff'?(p.welfare>.85?'animals that look genuinely at home':'habitats that still need work'):k==='wl'?(p.photo>.6?'hides and sightlines built for patience':'too many fences in every frame'):(S.stats.born>20?'a studbook that is starting to matter':'a breeding programme yet to begin');
  const crit=p.integrity<.8?' One suspects shortcuts: crowded paddocks and duplicate exhibits.':p.space<.8?' Some habitats are plainly too small.':p.needs<.75?' Several animals lack basic furnishings.':'';
  const quote=`${opener} ${S.name} — ${best}.${crit}${feat?' The '+SPECIES[feat.sp].n.toLowerCase()+(feat.gen.morph!=='normal'?' ('+MORPHS[feat.gen.morph].n.toLowerCase()+')':'')+' stole the issue.':''}`;
  const head=sc>=9?pick(['The park everyone is talking about','A new standard','Masterclass']):sc>=7.5?pick(['Worth the journey','Quietly excellent','Rising fast']):sc>=5.5?pick(['Promise, with caveats','A park in progress','Getting there']):pick(['Not yet','Room to grow','Disappointing']);
  const iss={mag:k,d:Math.floor(S.day),score:sc,quote,head,feat:feat?feat.id:null,featSp:feat?feat.sp:null,no:S.mags.filter(m=>m.mag===k).length+1};S.mags.push(iss);if(feat){(S._ghost=S._ghost||{})[feat.id]=JSON.parse(JSON.stringify(feat))}
  S.rep+=sc-5;note(`<b>${M.n}</b> scored the park ${sc}/10 — “${esc(head)}”`,sc>=7?'gold':sc<5?'bad':'','New issue');dockBadge('journal')}

/* ---------- goals ---------- */
function checkGoals(){while(S.goalIx<GOALS.length&&GOALS[S.goalIx].c()){note('✓ '+GOALS[S.goalIx].t,'gold','Field notes');S.cash+=5000+S.goalIx*2500;S.goalIx++}renderGoal()}
function renderGoal(){const g=$('goal');if(!g)return;if(S.goalHide||S.goalIx>=GOALS.length||BUILD.mode||SH.key){g.style.display='none';return}g.style.display='block';const cur=GOALS[S.goalIx];const prev=GOALS[S.goalIx-1];
  g.innerHTML=`<button data-act="hideGoal">×</button><h6>Field notes · ${S.goalIx+1}/${GOALS.length}</h6>${prev?`<div class="done">${esc(prev.t)}</div>`:''}<div><b>→</b> ${esc(cur.t)}</div><div class="muted" style="font-size:11px">Reward ${money(5000+S.goalIx*2500)}</div>`}
ACT.hideGoal=()=>{S.goalHide=true;renderGoal()};

/* =====================================================================
   WILDKEEP · interface — dock, inspector, field-journal sheets
   ===================================================================== */
const ICONS={build:'<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>',register:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/>',animals:'<circle cx="8" cy="7" r="2"/><circle cx="16" cy="7" r="2"/><circle cx="5" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/><path d="M12 11c-3 0-5 3.5-5 6a3 3 0 0 0 3 3c1 0 1.4-.6 2-.6s1 .6 2 .6a3 3 0 0 0 3-3c0-2.5-2-6-5-6z"/>',care:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 9v5M9.5 11.5h5"/>',science:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/>',journal:'<path d="M5 3h11l3 3v15H5z"/><path d="M9 8h6M9 12h6M9 16h4"/>'};
const DOCK=[['build','Build'],['register','Register'],['animals','Animals'],['care','Care'],['science','Science'],['journal','Journal']];
function dockSync(){const d=$('dock');if(!d)return;if(!d.children.length)d.innerHTML=DOCK.map(([k,l])=>`<button data-act="dock" data-v="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${l}</span><i class="badge" id="bdg-${k}" style="display:none"></i></button>`).join('');
  d.querySelectorAll('button').forEach(b=>b.classList.toggle('on',SH.key===b.dataset.v));d.style.display=BUILD.mode?'none':'flex';
  const cl=S?S.animals.filter(a=>a.loc.t==='clinic'&&a.cleared).length+S.animals.filter(a=>a.rehab&&a.rehab.stage==='ready').length:0;const b=$('bdg-care');if(b){b.style.display=cl?'block':'none';b.textContent=cl}renderGoal()}
function dockBadge(k){const b=$('bdg-'+k);if(b){b.style.display='block';b.textContent='•'}}
ACT.dock=el=>{const k=el.dataset.v;if(SH.key===k){closeSheet();return}const b=$('bdg-'+k);if(b&&k==='journal')b.style.display='none';openSheet(k)};

/* ---------- small helpers ---------- */
const meter=(v,warn=.7,bad=.45)=>`<div class="meter ${v<bad?'bad':v<warn?'warn':''}"><i style="width:${clamp(v,0,1)*100}%"></i></div>`;
const iucn=s=>`<span class="iucn ${s}" title="${IUCN[s]}">${s}</span>`;
const pt=(sp,w=64,h=48,cls='thumb',morph)=>`<canvas class="${cls}" data-portrait="${sp}" ${morph?`data-morph="${morph}"`:''} style="width:${w}px;height:${h}px"></canvas>`;
const at=(a,w=64,h=48,cls='thumb')=>`<canvas class="${cls}" data-animal="${a.id}" style="width:${w}px;height:${h}px"></canvas>`;
const sexIc=s=>s==='F'?'♀':'♂';

  <div class="row" style="margin-top:10px"><button class="btn sm leaf" data-act="cert" data-id="${a.id}">Life certificate</button>${a.loc.t==='encl'?`<button class="btn sm alt" data-act="openEncl" data-id="${a.loc.id}">Habitat</button><button class="btn sm alt" data-act="sideView" data-id="${a.loc.id}">Side view</button>`:''}<span class="grow"></span><button class="btn sm alt" data-act="closePop">×</button></div>`);requestAnimationFrame(()=>paintPortraits($('pop')));return}
  if(o.e){const e=o.e;const R=e._R||evalEncl(e);pop(`<div class="row"><div class="grow"><div class="lbl">${HABITATS[e.kind].n} · ${Math.round(e._area).toLocaleString()} m²${e.kind==='tank'?' · '+tankVol(e).toLocaleString()+' m³':''}</div><div class="h3" style="margin:2px 0">${esc(e.name)}</div><div class="small">${e._n} animals · welfare ${pct(e._wel||0)}</div></div>${e._warn?'<span class="chip bad">Needs attention</span>':e._n?'<span class="chip ok">Good</span>':'<span class="chip">Empty</span>'}</div>
  <div class="row wrap" style="margin-top:10px"><button class="btn sm leaf" data-act="openEncl" data-id="${e.id}">Open</button><button class="btn sm alt" data-act="sideView" data-id="${e.id}">Side view</button><button class="btn sm alt" data-act="furnish" data-id="${e.id}">Furnish</button><button class="btn sm alt" data-act="reshape" data-id="${e.id}">Reshape</button><span class="grow"></span><button class="btn sm alt" data-act="closePop">×</button></div>`);return}
  if(o.b){const b=o.b,k=BLD[b.kind];pop(`<div class="row"><div class="grow"><div class="lbl">${k.n}</div><div class="h3" style="margin:2px 0">${esc(b.name||k.n)}</div><div class="small muted">${k.d}</div></div></div><div class="row wrap" style="margin-top:10px"><button class="btn sm leaf" data-act="openBld" data-id="${b.id}">Open</button><button class="btn sm alt" data-act="designBld" data-id="${b.id}">Redesign</button><button class="btn sm alt" data-act="moveBld" data-id="${b.id}">Move</button><span class="grow"></span><button class="btn sm alt" data-act="closePop">×</button></div>`);return}
  if(o.p){const p=o.p,d=PLANTS[p.sp];pop(`<div class="row"><div class="grow"><div class="lbl">${d.region} · ${d.k}</div><div class="h3" style="margin:2px 0">${d.n}</div><div class="small">${p.g<1?'Growing · '+pct(p.g):'Mature'}${d.food?' · yields '+FOOD[d.food].n.toLowerCase():''}${p.hp<.6?' · browsed hard':''}</div></div><button class="btn sm terra" data-act="bulldozeSel">Remove</button><button class="btn sm alt" data-act="closePop">×</button></div>`);return}
  if(o.s||o.path){const n=o.s?SHAPES[o.s.kind].n:PATHS[o.path.kind].n+' path';pop(`<div class="row"><div class="h3 grow" style="margin:0">${n}</div>${o.s?`<button class="btn sm alt" data-act="reshapeShape">Reshape</button>`:''}<button class="btn sm terra" data-act="bulldozeSel">Remove</button><button class="btn sm alt" data-act="closePop">×</button></div>`)}}
ACT.bulldozeSel=()=>{if(SEL.obj)bulldoze(SEL.obj);closePop()};
ACT.reshapeShape=()=>{const s=SEL.obj.s;closePop();startBuild('reshape',null,{edit:s});BUILD.shapeEdit=1};
ACT.openEncl=el=>{closePop();openSheet('encl',null,el.dataset.id)};
ACT.openBld=el=>{closePop();const b=S.blds.find(x=>x.id===el.dataset.id);const map={desk:'desk',clinic:'care',kitchen:'care',lab:'science',breeding:'science',school:'science',rehab:'care',nursery:'care',incubator:'science',greenhouse:'build'};const tab={clinic:'clinic',kitchen:'kitchen',rehab:'rehab',nursery:'clinic',lab:'lab',breeding:'breeding',school:'school',incubator:'breeding',greenhouse:'nature'}[b.kind];if(map[b.kind])openSheet(map[b.kind],tab,b.id);else openSheet('bld',null,b.id)};
ACT.moveBld=el=>{const b=S.blds.find(x=>x.id===el.dataset.id);startBuild('move',null,{edit:b});BUILD.rot=b.rot||0};
ACT.furnish=el=>{const e=encById(el.dataset.id);startBuild('item',Object.keys(ITEMS).find(k=>ITEMS[k].hab.split(' ').includes(e.kind)),{target:e})};
ACT.reshape=el=>{const e=encById(el.dataset.id);startBuild('reshape',null,{edit:e})};
ACT.focusEncl=el=>{const e=encById(el.dataset.id);const c=centroid(geoOf(e));closeSheet();focusOn(c.x,c.y,Math.max(CAM.z,4));SEL.obj={e};inspect({e})};

/* ---------- build sheet ---------- */
SHEETS.build={title:'Build',sub:()=>'Funds '+money(S.cash),tabs:[['habitats','Habitats'],['buildings','Buildings'],['paths','Paths'],['nature','Nature'],['tools','Land & tools']],
  render(tab){if(tab==='habitats')return`<p class="small muted">Draw the outline point by point — sharp corners or round, pulled into any shape. Then furnish it so every species' needs are met.</p><div class="list">${Object.entries(HABITATS).map(([k,h])=>`<button class="card tap row" data-act="bEncl" data-v="${k}" style="text-align:left${S.accred<h.accred?';opacity:.5':''}"><div style="width:46px;height:46px;border-radius:12px;background:${h.col};flex:none;border:3px solid ${h.fence}"></div><div class="grow"><b>${h.n}</b>${S.accred<h.accred?` <span class="tag">${ACCRED[h.accred].n}</span>`:''}<div class="small muted">${h.d}</div><div class="lbl">${k==='tank'?'from '+money(h.base)+' + $700/m³ · deep tanks +$2.5M':'$'+h.perM+'/m fence · $'+h.perM2+'/m² · base '+money(h.base)}</div></div></button>`).join('')}</div>`;
    if(tab==='buildings')return`<div class="grid2">${Object.entries(BLD).filter(([k])=>k!=='desk').map(([k,b])=>{const own=b.unique&&hasB(k);const lock=b.accred&&S.accred<b.accred;return`<button class="card tap" data-act="bBld" data-v="${k}" style="text-align:left${own||lock?';opacity:.45':''}"><canvas data-bprev="${k}" style="width:100%;height:70px;display:block"></canvas><b style="font-size:13.5px">${b.n}</b><div class="lbl">${own?'Built':lock?ACCRED[b.accred].n:b.cost?money(b.cost):'Free'}</div><div class="small muted" style="font-size:11.5px;line-height:1.3;margin-top:3px">${b.d}</div></button>`}).join('')}</div>`;
    if(tab==='paths')return`<p class="small muted">Paths are splines — every point you tap bends the walk. Guests only see habitats within about 14 m of a path.</p><div class="list">${Object.entries(PATHS).map(([k,p])=>`<button class="card tap row" data-act="bPath" data-v="${k}"><div style="width:60px;height:14px;border-radius:7px;background:${p.c};border:2px solid ${p.e}"></div><b class="grow" style="text-align:left">${p.n}</b><span class="price">$${p.cost}/m</span></button>`).join('')}</div>`;
    if(tab==='nature')return`<div class="h3">Ground shapes</div><p class="small muted">Lawns, beds, ponds, hills, sand and rockeries — pull the points into any outline and pick a colour.</p><div class="grid3">${Object.entries(SHAPES).map(([k,s])=>`<button class="card tap" data-act="bShape" data-v="${k}"><div style="height:30px;border-radius:12px 20px 8px 18px;background:${s.c}"></div><b style="font-size:12.5px">${s.n}</b><div class="lbl">$${s.cost}/m²</div></button>`).join('')}</div>
      <div class="h3">Plants</div><p class="small muted">${hasB('greenhouse')?'Your greenhouse grows seedlings at a quarter of the price.':'Build a greenhouse to plant cheap seedlings.'} Trees inside habitats count as trees and shade; browse, bamboo and eucalyptus plants feed animals.</p><div class="grid2">${Object.entries(PLANTS).map(([k,p])=>`<button class="card tap row" data-act="bPlant" data-v="${k}" style="text-align:left"><div style="width:30px;height:30px;border-radius:50%;background:${p.c};flex:none"></div><div class="grow"><b style="font-size:12.5px">${p.n}</b><div class="lbl">${p.region}${p.food?' · '+p.food:''}</div></div></button>`).join('')}</div>`;
    return`<div class="list"><button class="card tap row" data-act="bLand"><b class="grow" style="text-align:left">Buy land</b><span class="price">${money(plotPrice())}</span></button><button class="card tap row" data-act="bDoze"><b class="grow" style="text-align:left">Bulldozer</b><span class="small muted">remove things</span></button></div><div class="small muted" style="margin-top:12px">You own ${S.plots.length} plots · ${(landArea()/10000).toFixed(1)} ha. Score checkers judge species count against land size.</div>`},
  after(){document.querySelectorAll('canvas[data-bprev]').forEach(cv=>{if(cv._d)return;cv._d=1;const k=cv.dataset.bprev;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*2;cv.height=h*2;const c=cv.getContext('2d');c.scale(2,2);bldPreview(c,{kind:k,x:0,y:0,rot:0,blocks:null},w,h)})}};
function bldPreview(c,b,w,h){const blocks=bldBlocks(b);const W=b.w||BLD[b.kind].w,D=b.d||BLD[b.kind].dpt;let maxH=0;blocks.forEach(k=>maxH=Math.max(maxH,k.z+k.h));const sc=Math.min(w*.8/W,h*.8/(D*TILT+maxH*HZ+1));const ox=w/2-W*sc/2,oy=h*.92-D*sc*TILT;const P={x:x=>ox+x*sc,y:(y,z)=>oy+y*sc*TILT-z*sc*HZ};const bb={...b,x:W/2,y:D/2};const s=blocks.slice().sort((p,q)=>(p.y+p.d)-(q.y+q.d)||p.z-q.z);s.forEach(k=>drawBlock(c,k,0,0,P))}
ACT.bEncl=el=>startBuild('encl',el.dataset.v);ACT.bBld=el=>startBuild('bld',el.dataset.v);ACT.bPath=el=>startBuild('path',el.dataset.v);ACT.bShape=el=>startBuild('shape',el.dataset.v);ACT.bPlant=el=>startBuild('plant',el.dataset.v);ACT.bLand=()=>startBuild('land');ACT.bDoze=()=>startBuild('bulldoze');

/* ---------- register (market + encyclopedia) ---------- */
const GROUPS=[['all','All'],['mammal','Mammals'],['bird','Birds'],['reptile','Reptiles'],['amphibian','Amphibians'],['fish','Fish'],['invertebrate','Invertebrates']];
let REG={g:'all',q:'',sp:null};
SHEETS.register={title:'The Register',sub:'Animals for sale · species encyclopedia',tall:true,tabs:[['market','For sale'],['species','Species'],['permits','Permits']],
  render(tab){const filt=`<div class="seg" style="margin-bottom:10px;overflow-x:auto">${GROUPS.map(([k,l])=>`<button class="${REG.g===k?'on':''}" data-act="regG" data-v="${k}">${l}</button>`).join('')}</div>`;
    if(tab==='market'){const L=S.market.filter(m=>REG.g==='all'||SPECIES[m.sp].group===REG.g).sort((a,b)=>SPECIES[a.sp].rar-SPECIES[b.sp].rar);
      return`<p class="small muted">New listings arrive weekly from partner zoos and breeders. Babies are cheap but slow and need more care; adults cost more and take longer to ship. Every arrival goes to quarantine first.</p>${filt}<div class="list">${L.length?L.map(m=>{const sp=SPECIES[m.sp];const lock=S.accred<RARITY_ACCRED[sp.rar];const permit=(sp.status==='CR'||sp.status==='EW')&&!S.permits[sp.id];return`<div class="card row">${pt(sp.id,84,62,'thumb lg',m.morph!=='normal'?m.morph:null)}<div class="grow"><div class="row" style="gap:5px">${iucn(sp.status)}<b>${esc(sp.n)}</b></div><div class="row wrap" style="gap:4px;margin:4px 0">${m.baby?'<span class="tag baby">Young</span>':'<span class="tag">Adult</span>'}<span class="tag">${sexIc(m.sex)}</span>${m.line?`<span class="tag line">${esc(m.line)}</span>`:''}${m.morph!=='normal'?`<span class="tag rare">${MORPHS[m.morph].n}</span>`:''}<span class="tag">${RARITY_TXT[sp.rar]}</span></div><div class="lbl">Ships in ${m.del} d · listing ends in ${Math.ceil(m.exp-S.day)} d</div></div><div class="col" style="align-items:flex-end"><span class="price">${money(m.price)}</span><button class="btn sm ${lock||permit?'off':'leaf'}" data-act="buyAsk" data-id="${m.id}">${lock?'🔒':permit?'Permit':'Buy'}</button><button class="btn sm alt" data-act="spInfo" data-v="${sp.id}">Info</button></div></div>`}).join(''):'<div class="empty"><b>Nothing listed</b>New animals arrive each week.</div>'}</div>`}
    if(tab==='species'){if(REG.sp)return speciesPage(REG.sp);const L=SPECIES_LIST.filter(s=>(REG.g==='all'||s.group===REG.g)&&(!REG.q||(s.n+' '+s.sci+' '+s.region).toLowerCase().includes(REG.q.toLowerCase())));const held=speciesHeld();
      return`<input class="field" placeholder="Search ${SPECIES_LIST.length} species…" value="${esc(REG.q)}" data-ch="regQ" style="margin-bottom:8px">${filt}<div class="lbl" style="margin-bottom:6px">${L.length} species · ${held.size} in your park</div><div class="grid2">${L.map(s=>`<button class="card tap" data-act="spInfo" data-v="${s.id}" style="text-align:left;padding:8px">${pt(s.id,140,90,'thumb')}<div class="row" style="gap:5px;margin-top:4px">${iucn(s.status)}<b style="font-size:12.5px;line-height:1.15">${esc(s.n)}</b></div><div class="lbl" style="margin-top:2px">${s.region} · ${held.has(s.id)?'✓ kept':RARITY_TXT[s.rar]}</div></button>`).join('')}</div>`}
    const L=SPECIES_LIST.filter(s=>s.status==='CR'||s.status==='EW');return`<p class="small muted">Critically endangered and extinct-in-the-wild species are only moved between institutions in managed breeding programmes. Apply once per species — permits take 60 days and need ${ACCRED[2].n} status.</p><div class="list">${L.map(s=>{const st=S.permits[s.id];return`<div class="card row">${pt(s.id)}<div class="grow"><b>${esc(s.n)}</b><div class="lbl">${iucn(s.status)} ${st===1?'Permit granted':st?'Under review · '+Math.max(0,Math.ceil(st-S.day))+' d':'No permit'}</div></div>${st?'':`<button class="btn sm ${S.accred<2?'off':'leaf'}" data-act="permit" data-v="${s.id}">Apply · ${money(25000)}</button>`}</div>`}).join('')}</div>`},after:afterPaint};
ACT.regG=el=>{REG.g=el.dataset.v;renderSheet()};IN.regQ=el=>{REG.q=el.value;renderSheet(true)};
ACT.spInfo=el=>{REG.sp=el.dataset.v;if(SH.key!=='register')openSheet('register','species');else{SH.tab='species';renderSheet(true)}};ACT.spBack=()=>{REG.sp=null;renderSheet(true)};
ACT.permit=el=>{if(!spend(25000,'build'))return;S.permits[el.dataset.v]=S.day+60;note('Permit application filed.');renderSheet()};
function permitsDay(){for(const k in S.permits){if(S.permits[k]!==1&&S.day>=S.permits[k]){S.permits[k]=1;note(`Breeding-programme permit granted: ${esc(SPECIES[k].n)}.`,'gold','Permit')}}}
ACT.buyAsk=el=>{const m=S.market.find(x=>x.id===el.dataset.id);if(!m)return;const sp=SPECIES[m.sp];const fits=S.encl.filter(e=>HOME_FITS[e.kind].includes(sp.home));
  modal(`<div class="row">${pt(sp.id,110,80,'thumb lg',m.morph!=='normal'?m.morph:null)}<div><div class="lbl">${m.baby?'Young':'Adult'} ${sexIc(m.sex)} · ${RARITY_TXT[sp.rar]}</div><h3>${esc(sp.n)}</h3><div class="price">${money(m.price)}</div></div></div>
  <p class="small" style="line-height:1.5">${m.baby?'Young animals are cheap but vulnerable: they need extra keeper time'+(hasB('nursery')?' (your nursery helps)':' — a nursery helps a lot')+' and years to mature.':'Adults are ready to breed sooner but cost more and travel longer.'} It ships in <b>${m.del} days</b>, then spends about ${quarantineDays(sp)} days in quarantine.</p>
  <div class="lbl">After quarantine, move to</div><select class="field" id="buyDest"><option value="">Decide later</option>${fits.map(e=>`<option value="${e.id}">${esc(e.name)} (${inEncl(e).length})</option>`).join('')}</select>${fits.length?'':`<p class="small" style="color:var(--terra)">You have no ${HABITATS[{land:'land',semi:'semi',aviary:'aviary',viv:'viv',polar:'polar',tank:'tank'}[sp.home]].n.toLowerCase()} yet.</p>`}
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn alt" data-act="closeModal">Cancel</button><button class="btn leaf" data-act="buyGo" data-id="${m.id}">Buy · ${money(m.price)}</button></div>`);requestAnimationFrame(()=>paintPortraits($('over')))};
ACT.buyGo=el=>{const d=$('buyDest').value;closeModal();buyListing(el.dataset.id,d||null);renderSheet()};
function speciesPage(id){const s=SPECIES[id];const needs=s.needs.map(n=>`<span class="chip">${NEED_TXT[n]||n}</span>`).join(' ');const kept=S.animals.filter(a=>a.sp===id&&['encl','clinic','nursery'].includes(a.loc.t));

  <div class="card"><div class="lbl">Size</div><b>${s.len} m · ${s.kg>=1?s.kg.toLocaleString()+' kg':Math.round(s.kg*1000)+' g'}</b></div><div class="card"><div class="lbl">Life</div><b>${s.life} y</b><div class="lbl">mature at ${s.mat} y</div></div>
