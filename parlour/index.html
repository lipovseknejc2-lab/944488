/* =====================================================================
   PARLOUR · the Reserve — a fixed supply of Knots, and two notes you can
   hold: Sage (green, never falls) and Gilt (gold, grows, may dip)
   ===================================================================== */
const SUPPLY=250000;
const NOTES={sage:{n:'Sage Note',col:'#8fb38a',start:100,d:'The steady note. Its price only ever rises, a little with every game you play and every day you return. While you hold Sage, every game pays you more.'},
  gilt:{n:'Gilt Note',col:'#d9b56a',start:250,d:'The ambitious note. It climbs faster but moves with the market and can dip, though never more than 12% below its own peak. It pays a dividend every ten games.'}};
const PATRON=[
  {id:'first',n:'First note',d:'Buy your first note',gift:30,c:r=>r.sage.held+r.gilt.held>0},
  {id:'steady',n:'Steady hand',d:'Hold Sage for 7 days',gift:120,c:r=>r.sage.held>0&&r.sage.since&&Date.now()-r.sage.since>7*864e5},
  {id:'goldnerve',n:'Golden nerve',d:'Hold Gilt through a dip of 5% or more',gift:150,c:r=>r.gilt.held>0&&r.gilt.sawDip},
  {id:'balanced',n:'Balanced book',d:'Hold both notes, each worth 500+ knots',gift:200,c:r=>val('sage')>=500&&val('gilt')>=500},
  {id:'patron',n:'Patron',d:'Hold notes worth 5,000 knots',gift:400,c:()=>val('sage')+val('gilt')>=5000},
  {id:'benefactor',n:'Benefactor',d:'Hold notes worth 25,000 knots',gift:1500,c:()=>val('sage')+val('gilt')>=25000},
  {id:'gain',n:'Well invested',d:'Realise a 1,000-knot gain on a sale',gift:250,c:r=>(r.bestGain||0)>=1000},
  {id:'dividend',n:'Dividend circle',d:'Collect 500 knots in Gilt dividends',gift:300,c:r=>(r.divs||0)>=500}
];
function resDef(){return{pool:SUPPLY-120,price:{sage:100,gilt:250},peak:{gilt:250},hist:{sage:[100],gilt:[250]},sage:{held:0,cost:0,since:0},gilt:{held:0,cost:0,since:0,sawDip:false},games:0,lastDay:dstr(),awards:{},divs:0,bestGain:0,paidOut:0}}
function R(){if(!S.res||typeof S.res!=='object')S.res=resDef();const d=resDef();for(const k in d)if(S.res[k]===undefined)S.res[k]=d[k];return S.res}
const val=k=>R()[k].held*R().price[k];
/* scarcity: payouts shrink as the Reserve empties; Sage holders get a bonus */
function scarcity(){return clamp(Math.pow(R().pool/SUPPLY,.55),.15,1)}
function sageBonus(){const v=val('sage');return v>=20000?.2:v>=5000?.12:v>=1000?.07:v>0?.03:0}
function payout(n){const r=R();if(n<=0)return 0;let amt=Math.round(n*scarcity()*(1+sageBonus()));amt=Math.min(amt,Math.max(0,r.pool));r.pool-=amt;r.paidOut+=amt;S.knots+=amt;S.knotsEarned+=amt;return amt}
function spendK(n){S.knots-=n;R().pool+=n}
/* price movement: driven by play and by days, deterministic per step */
function stepPrice(kind,seed){const r=R();const rnd2=seedRand(seed);if(kind==='sage'){r.price.sage=+(r.price.sage*(1+.0012+rnd2()*.0008)).toFixed(3)}else{const drift=.0028,vol=.014;let p=r.price.gilt*(1+drift+(rnd2()+rnd2()-1)*vol);p=Math.max(p,r.peak.gilt*.88);r.price.gilt=+p.toFixed(3);r.peak.gilt=Math.max(r.peak.gilt,r.price.gilt);if(r.gilt.held>0&&r.price.gilt<=r.peak.gilt*.95)r.gilt.sawDip=true}
  r.hist[kind].push(r.price[kind]);if(r.hist[kind].length>120)r.hist[kind].shift()}
function onGamePlayed(){const r=R();r.games++;stepPrice('sage','s'+r.games);stepPrice('gilt','g'+r.games);
  if(r.games%10===0&&r.gilt.held>0){const div=Math.max(1,Math.round(val('gilt')*.006));const paid=Math.min(div,r.pool);if(paid>0){r.pool-=paid;S.knots+=paid;S.knotsEarned+=paid;r.divs+=paid;setTimeout(()=>toast(`Gilt dividend · +${paid} knots`),1600)}}checkPatron()}
function onDays(){const r=R();const today=dstr();if(r.lastDay===today)return;const days=Math.min(30,Math.max(1,Math.round((new Date(today)-new Date(r.lastDay))/864e5)||1));for(let i=0;i<days;i++){stepPrice('sage','d'+today+i);stepPrice('sage','e'+today+i);stepPrice('gilt','d'+today+i)}r.lastDay=today;checkPatron()}
function checkPatron(){const r=R();for(const a of PATRON){if(r.awards[a.id])continue;if(a.c(r)){r.awards[a.id]=Date.now();const paid=Math.min(a.gift,r.pool);r.pool-=paid;S.knots+=paid;S.knotsEarned+=paid;setTimeout(()=>{toast(`Patron honour · ${esc(a.n)} · +${paid}`);sfx('rank')},800)}}save()}
function invest(kind,knots){const r=R();knots=Math.floor(knots);if(knots<=0||knots>S.knots)return false;const units=knots/r.price[kind];S.knots-=knots;r[kind].held+=units;r[kind].cost+=knots;if(!r[kind].since)r[kind].since=Date.now();sfx('chip');checkPatron();save();return true}
function divest(kind,frac){const r=R();const h=r[kind];if(h.held<=0)return 0;const units=h.held*frac;const gross=Math.floor(units*r.price[kind]);const basis=h.cost*frac;let gain=gross-basis;if(gain>0&&gain>r.pool){gain=r.pool}const paid=Math.round(basis+gain);if(gain>0)r.pool-=gain;else r.pool+=-gain;h.held-=units;h.cost-=basis;if(h.held<1e-6){h.held=0;h.cost=0;h.since=0;if(kind==='gilt')h.sawDip=false}S.knots+=paid;r.bestGain=Math.max(r.bestGain||0,gain);sfx('coin');checkPatron();save();return paid}

function sparkSVG(arr,col,w=300,h=70){if(arr.length<2)arr=[arr[0],arr[0]];const mn=Math.min(...arr),mx=Math.max(...arr),sp=mx-mn||1;const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-6-(v-mn)/sp*(h-12)).toFixed(1)}`);

PAGES.reserve=function(){const r=R();const tot=val('sage')+val('gilt');const sc=scarcity();
  const noteCard=k=>{const N=NOTES[k],h=r[k],v=val(k),gain=v-h.cost,ch=r.hist[k],chg=ch.length>1?(ch[ch.length-1]/ch[Math.max(0,ch.length-11)]-1)*100:0;
    return`<div class="glass" style="padding:16px;margin-bottom:12px"><div style="display:flex;gap:14px;align-items:center">${noteSVG(k,128)}<div style="flex:1;min-width:0"><div class="lbl">${N.n}</div><div class="serif" style="font-size:26px;color:${N.col}">${r.price[k].toFixed(2)}</div><div class="tiny ${chg>=0?'':'muted'}" style="color:${chg>=0?N.col:'var(--ink3)'}">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}% over 10 games</div></div></div>
      <div style="margin:12px 0 6px">${sparkSVG(ch,N.col)}</div><p class="small ink2" style="line-height:1.45">${N.d}</p>
      <div class="stats" style="margin:12px 0 10px"><div><span class="lbl">Held</span><b>${h.held.toFixed(2)}</b></div><div><span class="lbl">Worth</span><b>${fmt(v)}</b></div><div><span class="lbl">${gain>=0?'Gain':'Loss'}</span><b style="color:${gain>=0?N.col:'var(--bad)'}">${gain>=0?'+':'−'}${fmt(Math.abs(gain))}</b></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${[50,250,1000].map(a=>`<button class="btn sm" data-inv="${k}" data-amt="${a}" ${S.knots<a?'disabled':''}>Buy ${a}</button>`).join('')}<button class="btn sm ghost" data-inv="${k}" data-amt="half" ${S.knots<2?'disabled':''}>Half purse</button></div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm ghost" data-sell="${k}" data-frac=".25" ${h.held?'':'disabled'}>Sell a quarter</button><button class="btn sm ghost" data-sell="${k}" data-frac="1" ${h.held?'':'disabled'}>Sell all</button></div></div>`};
  return header('Reserve')+`
  <div class="glass" style="padding:18px"><div class="lbl">The Reserve</div><div style="display:flex;align-items:baseline;gap:8px;margin:4px 0 10px"><span class="serif" style="font-size:30px">${fmt(r.pool)}</span><span class="small muted">of ${fmt(SUPPLY)} knots remain</span></div>
    <div class="gc" style="padding:0;min-height:0"><div class="rk" style="margin:0"><span class="bar" style="height:4px"><i style="width:${r.pool/SUPPLY*100}%"></i></span></div></div>
    <p class="small ink2" style="line-height:1.5;margin-top:12px">Only ${fmt(SUPPLY)} knots will ever exist. Every game pays from the Reserve and every purchase returns to it. As it empties, games pay less, so a knot kept is worth more than a knot spent.</p>
    <div class="stats"><div><span class="lbl">Pay rate</span><b>${Math.round(sc*100)}%</b></div><div><span class="lbl">Sage bonus</span><b>+${Math.round(sageBonus()*100)}%</b></div><div><span class="lbl">Your notes</span><b>${fmt(tot)}</b></div></div></div>
  <h2 class="sec">Notes<small>purse ${fmt(S.knots)}</small></h2>${noteCard('sage')}${noteCard('gilt')}
  <h2 class="sec">Patron honours<small>${Object.keys(r.awards).length} of ${PATRON.length}</small></h2><div class="glass" style="padding:4px 0">${PATRON.map(a=>`<div class="row"><span class="round" style="width:34px;height:34px;flex:none;${r.awards[a.id]?'background:var(--ink);color:var(--bg)':''}">${ui(r.awards[a.id]?'check':'star')}</span><div class="grow"><b style="font-weight:600">${a.n}</b><div class="small muted">${a.d}</div></div><span class="small ${r.awards[a.id]?'':'muted'}">${r.awards[a.id]?'Held':'+'+a.gift}</span></div>`).join('')}</div>
  <div class="tiny muted" style="text-align:center;margin-top:18px">Notes are play money inside Parlour only, never real money.</div>`};
UI.reserve='M4 10L12 4L20 10M5 10H19M6 10V18M10 10V18M14 10V18M18 10V18M4 18H20M3 21H21';
TABS.splice(4,0,['reserve','Reserve','reserve']);
document.addEventListener('click',e=>{const t=e.target.closest('[data-inv],[data-sell]');if(!t)return;ac();const k=t.dataset.inv||t.dataset.sell;
  if(t.dataset.inv){const amt=t.dataset.amt==='half'?Math.floor(S.knots/2):+t.dataset.amt;if(invest(k,amt)){toast(`Bought ${(amt/R().price[k]).toFixed(2)} ${NOTES[k].n}${amt>1?'s':''}`);renderPage()}}
  else{const paid=divest(k,+t.dataset.frac);if(paid){toast(`Sold for ${fmt(paid)} knots`);renderPage()}}});

boot();

</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.getRegistration().then(reg=>{if(!reg)return;
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&had){const b=document.createElement('button');b.className='btn';b.textContent='New version ready · Tap to update';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:300';b.onclick=()=>{try{save()}catch(e){}location.reload()};document.body.appendChild(b)}})});
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})}
</script>
</body>
</html>
