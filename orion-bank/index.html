<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orion">
<meta name="theme-color" content="#0a090d">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Orion Bank</title>
<style>:root{
  --bg:#0a090d; --ink:#f7f2ec; --ink2:rgba(247,242,236,.66); --ink3:rgba(247,242,236,.4);
  --coral:#e8825c; --coral2:#ffa27e; --violet:#8b7bff; --teal:#3dd6c3; --green:#5fe3a1; --red:#ff6f7d; --gold:#e6c27a; --blue:#5aa9ff;
  --line:rgba(255,255,255,.11);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#050407;color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic .d,svg .d{fill:currentColor;stroke:none;opacity:.2}
.ic.sm{width:18px;height:18px}.ic.xs{width:14px;height:14px}.ic.lg{width:28px;height:28px}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;width:100%;height:100dvh;max-width:430px;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:500px) and (min-height:760px){
  #app{height:min(900px,96dvh);border-radius:54px;box-shadow:0 0 0 10px #15131a,0 0 0 11px #2b2832,0 40px 120px rgba(0,0,0,.7)}
  :root{--sat:14px;--sab:10px}
}

/* ===== aurora backdrop ===== */
#aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#1b1426 0%,#0c0a10 55%,#07060a 100%)}
#aurora i{position:absolute;border-radius:50%;will-change:transform}
#aurora .a1{width:520px;height:520px;left:-200px;top:-120px;background:radial-gradient(circle,rgba(232,130,92,.42),transparent 62%);animation:drift1 22s ease-in-out infinite alternate}
#aurora .a2{width:560px;height:560px;right:-260px;top:140px;background:radial-gradient(circle,rgba(139,123,255,.34),transparent 62%);animation:drift2 26s ease-in-out infinite alternate}
#aurora .a3{width:480px;height:480px;left:-120px;bottom:-160px;background:radial-gradient(circle,rgba(61,214,195,.20),transparent 62%);animation:drift3 30s ease-in-out infinite alternate}
#aurora .stars{inset:0;width:100%;height:100%;border-radius:0;opacity:.55;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff9,transparent),radial-gradient(1.5px 1.5px at 220px 160px,#fff,transparent),radial-gradient(1px 1px at 320px 60px,#fff8,transparent),radial-gradient(1px 1px at 70px 220px,#fff7,transparent),radial-gradient(1.2px 1.2px at 270px 270px,#fffa,transparent);background-size:360px 320px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(90px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-110px,90px) scale(.9)}}
@keyframes drift3{to{transform:translate(120px,-90px) scale(1.2)}}
@keyframes twinkle{from{opacity:.25}to{opacity:.6}}

/* ===== glass ===== */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.65);-webkit-backdrop-filter:blur(28px) saturate(175%);backdrop-filter:blur(28px) saturate(175%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.13),transparent 46%);mix-blend-mode:screen}
.glass>*{position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:#16131a;border-color:transparent}
.chip.good{color:var(--green);background:rgba(95,227,161,.12);border-color:rgba(95,227,161,.18)}
.chip.bad{color:var(--red);background:rgba(255,111,125,.12);border-color:rgba(255,111,125,.2)}
.chip.coral{color:var(--coral2);background:rgba(232,130,92,.14);border-color:rgba(232,130,92,.22)}
.chip.gold{color:var(--gold);background:rgba(230,194,122,.13);border-color:rgba(230,194,122,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-weight:650;font-size:16px;letter-spacing:-.01em;transition:transform .25s var(--ease),filter .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffb08c,#e0668a);color:#1a0d12;box-shadow:0 10px 30px -8px rgba(224,102,138,.65),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.light{background:var(--ink);color:#17131b}
.btn.ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1)}
.btn.danger{background:rgba(255,111,125,.16);color:var(--red);border:1px solid rgba(255,111,125,.25)}
.btn.block{width:100%}.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{height:40px;font-size:14px;padding:0 16px}
.btn{white-space:nowrap}

/* ===== pages ===== */
#pages{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 120px);opacity:0;pointer-events:none;transform:translateY(10px) scale(.985);transition:opacity .35s var(--ease),transform .45s var(--ease);scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;pointer-events:auto;transform:none}
.ptitle{font-family:var(--serif);font-size:34px;letter-spacing:-.02em;font-weight:500;line-height:1.05}
.psub{color:var(--ink2);font-size:14px;margin-top:6px;line-height:1.4}
.phead{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 2px 18px;gap:12px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sect h3{font-size:19px;font-weight:650;letter-spacing:-.02em}
.sect a,.sect button.lnk{font-size:14px;color:var(--coral2);font-weight:600}
.row{display:flex;align-items:center}.gap8{gap:8px}.gap12{gap:12px}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.mut{color:var(--ink2)}.mut3{color:var(--ink3)}
.up{color:var(--green)}.dn{color:var(--red)}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;background:linear-gradient(135deg,#ffb08c,#8b7bff);color:#1b1020;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px -6px rgba(139,123,255,.6)}
.greet{flex:1;margin-left:12px;min-width:0}
.greet small{display:block;color:var(--ink2);font-size:13px}
.greet b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ptspill{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 11px;border-radius:999px;font-weight:650;font-size:14px;margin-right:8px}
.ptspill .ic{color:var(--gold)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #1b1620}

/* ===== balance hero ===== */
.hero{border-radius:34px;padding:22px 20px 18px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,130,92,.35),transparent 65%);pointer-events:none}
.hero .lbl{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;font-weight:550}
.hero .lbl button{color:var(--ink2);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07)}
.bal{font-family:var(--serif);font-size:50px;letter-spacing:-.035em;line-height:1.05;margin:8px 0 6px;font-weight:500;display:flex;align-items:baseline;white-space:nowrap}
.bal .cur{font-size:30px;margin-right:3px;color:var(--ink2)}
.bal .dec{font-size:28px;color:var(--ink2)}
.bal.mil{font-size:54px}
.hero .spark{height:64px;margin:8px -8px 4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.act .ib{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:transform .25s var(--ease),background .2s}
.act:active .ib{transform:scale(.92);background:rgba(255,255,255,.16)}

/* ===== pockets ===== */
.pockets{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.pockets::-webkit-scrollbar{display:none}
.pocket{flex:none;width:176px;scroll-snap-align:start;border-radius:26px;padding:16px;text-align:left;transition:transform .25s var(--ease)}
.pocket:active{transform:scale(.97)}
.pocket .pi{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.pocket small{display:block;color:var(--ink2);font-size:12.5px;font-weight:550}
.pocket b{display:block;font-size:22px;letter-spacing:-.02em;font-weight:650;margin:2px 0 6px}
.pocket .sub{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}

/* ===== list rows ===== */
.list{border-radius:28px;padding:6px}
.tx{display:flex;align-items:center;gap:13px;width:100%;padding:11px 10px;border-radius:22px;text-align:left;transition:background .2s}
.tx:active{background:rgba(255,255,255,.07)}
.tx .ti{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;flex:none;position:relative}
.tx .tn{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .ts{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .ta{font-weight:650;font-size:16px;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.tx .tp{font-size:11.5px;color:var(--gold);margin-top:2px;text-align:right}
.dayhd{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 4px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{padding:9px 15px;font-size:13.5px}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:16px;padding:0 14px;margin-bottom:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:var(--ink2)}
.search input{flex:1;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}

/* ===== insights ===== */
.insight{display:flex;align-items:center;gap:18px;border-radius:30px;padding:18px}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend span{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:650}
.people{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:550;width:62px}
.person .pa{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:#150f1b}

/* ===== tab bar ===== */
#tabbar{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 12px);height:70px;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:30;background:linear-gradient(180deg,rgba(44,38,54,.9),rgba(22,18,28,.94))}
#fadeb{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sab) + 120px);z-index:20;pointer-events:none;background:linear-gradient(180deg,rgba(10,9,13,0),rgba(10,9,13,.88) 62%,#0a090d)}
#tabbar .lens{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px -6px rgba(232,130,92,.5);transition:transform .5s var(--spring)}
#tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);transition:color .3s,transform .3s var(--spring);z-index:1}
#tabbar button.on{color:var(--ink)}
#tabbar button.on .ic{color:var(--coral2)}
#tabbar button:active{transform:scale(.9)}

/* ===== pay dock ===== */
#paydock{position:absolute;right:0;top:44%;z-index:25;width:46px;height:128px;border-radius:26px 0 0 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:translateX(8px);transition:transform .5s var(--spring),opacity .35s;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.2);border-right:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),-10px 12px 34px -10px rgba(224,102,138,.5);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
#paydock:hover{transform:translateX(4px)}
#paydock.hide{opacity:0;pointer-events:none;transform:translateX(60px)}
#paydock.open{transform:translateX(-70px) scale(.8);opacity:0}
#paydock .pl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:750;letter-spacing:.22em;color:var(--ink)}
#paydock .ic{color:var(--coral2);animation:nfcpulse 2.4s ease-in-out infinite}
#paydock::after{content:"";position:absolute;left:5px;top:50%;width:3px;height:30px;margin-top:-15px;border-radius:3px;background:rgba(255,255,255,.35)}
@keyframes nfcpulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}

/* ===== toast ===== */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,-140%);z-index:200;display:flex;align-items:center;gap:10px;padding:11px 18px 11px 12px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;max-width:92%;transition:transform .55s var(--spring);background:linear-gradient(180deg,rgba(60,52,70,.85),rgba(28,24,34,.9));border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 14px 40px -8px rgba(0,0,0,.7)}
#toast.show{transform:translate(-50%,0)}
#toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(95,227,161,.18);color:var(--green)}
#toast .ti.w{background:rgba(255,162,126,.2);color:var(--coral2)}

/* ===== sheets ===== */
#sheets{position:absolute;inset:0;z-index:100;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(5,4,8,.5);opacity:0;transition:opacity .4s var(--ease);pointer-events:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.scrim.in{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 8px);max-height:calc(100% - var(--sat) - 20px);display:flex;flex-direction:column;border-radius:40px;overflow:hidden;pointer-events:auto;transform:translateY(112%);transition:transform .6s var(--ease);background:linear-gradient(180deg,rgba(46,39,56,.88),rgba(22,18,28,.94));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 -10px 80px -20px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);will-change:transform}
.sheet.in{transform:none}
.sheet.drag{transition:none}
.sheet.full{top:calc(var(--sat) + 10px)}
.sheet .grab{position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:5px;background:rgba(255,255,255,.3);z-index:5}
.sheet .xbtn{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);z-index:6;color:var(--ink2)}
.sheet .sc{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;scrollbar-width:none}
.sheet .sc::-webkit-scrollbar{display:none}
.sheet .body{padding:4px 22px 26px}
.shero{position:relative;height:178px;margin-bottom:-6px;overflow:hidden;pointer-events:none}
.shero svg{width:100%;height:100%;display:block}
.shero{-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}

.sh1{font-family:var(--serif);font-size:28px;letter-spacing:-.02em;font-weight:500;line-height:1.12;text-align:center}
.sh2{color:var(--ink2);text-align:center;font-size:15px;line-height:1.45;margin:8px auto 0;max-width:320px}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px;gap:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right}
.panel{border-radius:24px;padding:4px 16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07)}
.modal-center .sheet{bottom:auto;top:50%;margin-top:-190px}

/* ===== keypad ===== */
.amt{text-align:center;font-family:var(--serif);font-size:56px;letter-spacing:-.03em;font-weight:500;margin:6px 0 2px;min-height:64px}
.amt small{font-size:30px;color:var(--ink2);margin-right:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pad button{height:56px;border-radius:20px;font-size:25px;font-weight:500;background:rgba(255,255,255,.07);display:grid;place-items:center;transition:transform .15s var(--ease),background .15s}
.pad button:active{transform:scale(.93);background:rgba(255,255,255,.16)}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);gap:2px}
.seg button{flex:1;height:36px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:all .3s var(--ease);white-space:nowrap;padding:0 10px}
.seg button.on{background:rgba(255,255,255,.17);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 10px rgba(0,0,0,.3)}
.seg.buy button.on[data-v=buy]{background:rgba(95,227,161,.22);color:var(--green)}
.seg.buy button.on[data-v=sell]{background:rgba(255,111,125,.22);color:var(--red)}

/* ===== toggle ===== */
.tgl{position:relative;width:52px;height:32px;border-radius:999px;background:rgba(255,255,255,.16);flex:none;transition:background .3s;border:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .4s var(--spring)}
.tgl.on{background:linear-gradient(135deg,#ffa27e,#e0668a)}
.tgl.on::after{transform:translateX(20px)}
.ctrl{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.ctrl:last-child{border-bottom:0}

    return `<g>${o?`<circle cx="${s[1]}" cy="${s[2]}" r="${r*3.4}" fill="url(#gHalo)" opacity=".7"/>`:''}${n?`<circle cx="${s[1]}" cy="${s[2]}" r="${r*2.6}" fill="url(#gHalo)" opacity="${.15+frac*.5}"/>`:''}${spk(s[1],s[2],r*(o?2.1:1.1),o?1:(n?.35+frac*.4:.25),o?(i===1?'#ffb08c':i===7?'#a9c8ff':'#fff'):'#fff')}</g>`}).join('');

function sheet(o){
  const layer=$('#sheets');
  const scrim=document.createElement('div');scrim.className='scrim';
  const el=document.createElement('div');el.className='sheet '+(o.full?'full ':'')+(o.cls||'');
  el.innerHTML=`<div class="grab"></div><div class="dragzone" style="position:absolute;left:0;right:0;top:0;height:60px;z-index:4;touch-action:none"></div>${o.noX?'':`<button class="xbtn" aria-label="Close">${ic('close','sm')}</button>`}

  layer.append(scrim,el);
  const api={el,scrim,body:$('.body',el),sc:$('.sc',el),closed:false,
    close(){if(api.closed)return;api.closed=true;const i=SHEETS.indexOf(api);if(i>=0)SHEETS.splice(i,1);scrim.classList.remove('in');el.classList.remove('in');el.style.transform='';
      setTimeout(()=>{scrim.remove();el.remove()},650);o.onClose&&o.onClose();syncDock()}};
  SHEETS.push(api);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{scrim.classList.add('in');el.classList.add('in')}));
  scrim.addEventListener('click',()=>{if(SHEETS[SHEETS.length-1]===api&&!o.locked)api.close()});
  const x=$('.xbtn',el);x&&x.addEventListener('click',()=>api.close());
  // drag to dismiss
  const dz=$('.dragzone',el);let y0=0,dy=0,t0=0,on=false;
  dz.addEventListener('pointerdown',e=>{on=true;y0=e.clientY;dy=0;t0=e.timeStamp;el.classList.add('drag');dz.setPointerCapture(e.pointerId)});
  dz.addEventListener('pointermove',e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);el.style.transform=`translateY(${dy}px)`;scrim.style.opacity=String(1-dy/500)});
  const end=e=>{if(!on)return;on=false;el.classList.remove('drag');scrim.style.opacity='';const v=dy/Math.max(1,e.timeStamp-t0);
    if(!o.locked&&(dy>120||v>.7))api.close();else el.style.transform=''};
  dz.addEventListener('pointerup',end);dz.addEventListener('pointercancel',end);

  return api;
}

const TFS={'1D':{n:72,ms:20*60e3,k:1},'1W':{n:84,ms:2*36e5,k:2.45},'1M':{n:90,ms:8*36e5,k:4.9},'1Y':{n:104,ms:3.5*DAY,k:15.9}};
const asset=s=>ASSETS.find(a=>a.s===s);
function initMarkets(){
  const day=Math.floor(Date.now()/DAY);const now=Date.now();
  ASSETS.forEach(A=>{
    A.p0=A.p;A.series={};
    Object.entries(TFS).forEach(([tf,cfg])=>{
      const r=mulberry(hash(A.s+tf)+day*0),sg=A.sig*Math.sqrt(cfg.k);const drift=(r()-.45)*sg*.18;
      let c=1;const arr=[];
      for(let i=0;i<cfg.n;i++){const o=c,ret=drift+sg*gauss(r);c=Math.max(.2,o*(1+ret));
        const h=Math.max(o,c)*(1+Math.abs(gauss(r))*sg*.35),l=Math.min(o,c)*(1-Math.abs(gauss(r))*sg*.35);
        arr.push({t:now-(cfg.n-i)*cfg.ms,o,h,l,c})}
      const k=A.p/arr[arr.length-1].c;arr.forEach(x=>{x.o*=k;x.h*=k;x.l*=k;x.c*=k});
      A.series[tf]=arr;
    });
    const d1=A.series['1D'];A.open24=d1[0].o;
  });
}
const quote=A=>{const s=A.t==='crypto'?.0006:A.t==='stock'?.0004:.0003;return{bid:A.p*(1-s/2),ask:A.p*(1+s/2),s}};
const feeRate=A=>A.t==='crypto'?topTier().fee/100:0;
const chg24=A=>(A.p-A.open24)/A.open24*100;

  const A=asset(sym),q=e/A.p;const h=S.hold[sym]||(S.hold[sym]={q:0,cost:0});h.q+=q;h.cost+=e;

function rsi(A){const c=A.series['1D'].map(x=>x.c).slice(-15);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}return l===0?100:100-100/(1+g/l)}
function ma(A,n=20){const c=A.series['1D'].map(x=>x.c).slice(-n);return c.reduce((a,b)=>a+b,0)/c.length}
function sparkSVG(A,w=64,h=30){
  const c=A.series['1D'].map(x=>x.c).slice(-40);const sm=smooth(c,w,h,3);const up=c[c.length-1]>=c[0];
  return `<path d="${sm.line}" fill="none" stroke="${up?'#5fe3a1':'#ff6f7d'}" stroke-width="1.8" stroke-linecap="round"/>`;
}

/* ---- live engine ---- */
function tickMarkets(){
  const now=Date.now();
  ASSETS.forEach(A=>{
    A.prev=A.p;A.p=Math.max(A.p*.2,A.p*(1+gauss(Math.random)*A.tv+(A.p0-A.p)/A.p0*.0006));
    Object.keys(TFS).forEach(tf=>{const a=A.series[tf],l=a[a.length-1];l.c=A.p;if(A.p>l.h)l.h=A.p;if(A.p<l.l)l.l=A.p});
  });
  checkOrders();
  if(cur==='trade')liveTrade();
  liveDetail&&liveDetail();
}
function liveTrade(){
  ASSETS.forEach(A=>{
    const pe=$(`[data-pr="${A.s}"]`);if(!pe)return;const c=chg24(A);
    pe.textContent=fmtPrice(A.p);pe.classList.remove('flash-up','flash-dn');void pe.offsetWidth;pe.classList.add(A.p>=A.prev?'flash-up':'flash-dn');
    const ce=$(`[data-ch="${A.s}"]`);ce.textContent=pct(c);ce.className='num '+(c>=0?'up':'dn');
    const sp=$(`[data-sp="${A.s}"]`);sp&&(sp.innerHTML=sparkSVG(A));
  });
  const pv=portfolioValue(),cost=Object.values(S.hold).reduce((a,h)=>a+h.cost,0);
  const e=$('#pfv');if(e&&!S.hide)e.textContent=eur(pv);
}
function checkOrders(){
  let changed=false;
  S.orders.slice().forEach(o=>{
    const A=asset(o.sym),q=quote(A);let fill=null;
    if(o.side==='buy'&&o.type==='limit'&&q.ask<=o.price)fill=q.ask;
    if(o.side==='sell'&&o.type==='limit'&&q.bid>=o.price)fill=q.bid;
    if(o.side==='sell'&&o.type==='stop'&&q.bid<=o.price)fill=q.bid;
    if(fill==null)return;
    S.orders.splice(S.orders.indexOf(o),1);changed=true;
    const fr=feeRate(A);
    if(o.side==='buy'){const spent=o.qty*fill,fee=spent*fr,back=o.reserve-spent-fee;S.spending+=Math.max(0,back);const h=S.hold[o.sym]||(S.hold[o.sym]={q:0,cost:0});h.q+=o.qty;h.cost+=spent+fee;
      addTx({name:`Bought ${qtyStr(o.qty)} ${o.sym}`,cat:A.t==='crypto'?'crypto':'trade',amt:-(spent+fee),card:'Orion Spending',note:`Limit filled @ ${fmtPrice(fill)}`,pts:0})}
    else{const g=o.qty*fill,fee=g*fr;S.spending+=g-fee;addTx({name:`Sold ${qtyStr(o.qty)} ${o.sym}`,cat:A.t==='crypto'?'crypto':'trade',amt:g-fee,card:'Orion Spending',note:`${o.type==='stop'?'Stop-loss':'Limit'} filled @ ${fmtPrice(fill)}`})}
    track('trade');toast(`${o.type==='stop'?'Stop-loss':'Limit order'} filled · ${o.sym}`);
  });
  if(changed){save();refresh('home','trade')}
}
function cancelOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(o.side==='buy')S.spending+=o.reserve;else{const h=S.hold[o.sym]||(S.hold[o.sym]={q:0,cost:0});h.q+=o.qty;h.cost+=o.cost||0}
  S.orders=S.orders.filter(x=>x.id!==id);save();toast('Order cancelled');refresh('trade','home');
}

/* ---- chart ---- */
let chartCtx=null;
function fmtT(t,tf){const d=new Date(t);return tf==='1D'?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):tf==='1Y'?d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function chartSVG(A,tf,mode){
  const W=340,H=210,pr=50,cw=W-pr,top=10,bot=H-24;const a=A.series[tf],n=a.length;
  let lo=Math.min(...a.map(c=>c.l)),hi=Math.max(...a.map(c=>c.h));const pad=(hi-lo)*.1||hi*.01;lo-=pad;hi+=pad;
  const y=v=>top+(1-(v-lo)/(hi-lo))*(bot-top),x=i=>(i+.5)/n*cw;
  const up=a[n-1].c>=a[0].o,col=up?'#5fe3a1':'#ff6f7d';
  chartCtx={W,H,cw,n,y,x,a,tf,lo,hi,top,bot};
  let g='';for(let i=0;i<=3;i++){const v=hi-(hi-lo)*i/3,yy=y(v);g+=`<line x1="0" x2="${cw}" y1="${yy}" y2="${yy}" stroke="#fff" stroke-opacity=".07"/><text x="${cw+6}" y="${yy+4}" fill="#fff" fill-opacity=".45" font-size="10" font-family="ui-monospace,Menlo,monospace">${v>=1000?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(3)}</text>`}
  let body='';
  if(mode==='line'){const pts=a.map((c,i)=>[x(i),y(c.c)]);let d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
    body=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${pts[n-1][0]} ${bot}L${pts[0][0]} ${bot}Z" fill="url(#cg)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`}
  else{const bw=Math.max(1.5,cw/n*.62);
    body=a.map((c,i)=>{const u=c.c>=c.o,cc=u?'#5fe3a1':'#ff6f7d',xx=x(i);return `<line x1="${xx}" x2="${xx}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${cc}" stroke-width="1.2"/><rect x="${xx-bw/2}" y="${Math.min(y(c.o),y(c.c))}" width="${bw}" height="${Math.max(1.2,Math.abs(y(c.o)-y(c.c)))}" rx="1" fill="${cc}"/>`}).join('');
    const m=[];for(let i=19;i<n;i++){let s=0;for(let j=i-19;j<=i;j++)s+=a[j].c;m.push([x(i),y(s/20)])}
    body+=`<path d="${m.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}" fill="none" stroke="#ffa27e" stroke-width="1.5" stroke-dasharray="3 3" opacity=".9"/>`}
  const ly=y(A.p);
  const t0=fmtT(a[0].t,tf),t1=fmtT(a[Math.floor(n/2)].t,tf),t2='Now';
  return `<svg viewBox="0 0 ${W} ${H}" id="cs">${g}${body}<line x1="0" x2="${cw}" y1="${ly}" y2="${ly}" stroke="${col}" stroke-dasharray="2 4" stroke-opacity=".8"/><rect x="${cw+1}" y="${ly-9}" width="${pr-2}" height="18" rx="6" fill="${col}"/><text x="${cw+pr/2}" y="${ly+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#10131a" font-family="ui-monospace,Menlo,monospace">${A.p>=1000?A.p.toFixed(0):A.p>=10?A.p.toFixed(1):A.p.toFixed(3)}</text>
  <text x="0" y="${H-6}" fill="#fff" fill-opacity=".4" font-size="10">${t0}</text><text x="${cw/2}" y="${H-6}" text-anchor="middle" fill="#fff" fill-opacity=".4" font-size="10">${t1}</text><text x="${cw}" y="${H-6}" text-anchor="end" fill="#fff" fill-opacity=".4" font-size="10">${t2}</text>
  <g id="xh" style="display:none"><line id="xl" y1="${top}" y2="${bot}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="3 3"/><circle id="xc" r="4.5" fill="#fff" stroke="${col}" stroke-width="2"/></g></svg><div class="tip" id="tip"></div>`;
}

    else if(side==='buy'&&total>S.spending+1e-9)err='Not enough in Spending';

function ringSVG(v){const C=2*Math.PI*42;return `<svg class="ring" viewBox="0 0 104 104"><circle cx="52" cy="52" r="42" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="9"/><circle cx="52" cy="52" r="42" fill="none" stroke="url(#gRing)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 52 52)"/><text x="52" y="56" text-anchor="middle" font-family="ui-serif,Georgia,serif" font-size="30" fill="#fff" font-weight="500">${v}</text><text x="52" y="72" text-anchor="middle" font-size="9" fill="#fff" fill-opacity=".5" letter-spacing="1.5">SCORE</text></svg>`}
function qrSVG(seed,sz=21){
  const r=mulberry(hash(seed));let d='';const fin=(x,y)=>(x<7&&y<7)||(x>=sz-7&&y<7)||(x<7&&y>=sz-7);
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){let on;if(fin(x,y)){const lx=x%(sz-7)<7&&x<7?x:x-(sz-7),ly=y<7?y:y-(sz-7);on=lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}else on=r()>.52;if(on)d+=`M${x} ${y}h1v1h-1z`}
  return `<svg class="qr" viewBox="-.5 -.5 ${sz+1} ${sz+1}" shape-rendering="crispEdges"><path d="${d}" fill="#14101c"/></svg>`;
}

        if(bad){a.close();setTimeout(()=>popup({hero:ill('panic'),title:'Payment declined',sub:`${bad}. Your funds did not move.`,actions:[{label:'OK',cls:'light'}]}),350);return}

        const pts=Math.floor(amt*ptsMult());earnPts(pts,'Chain Pay');addTx({name:svc.n,cat:'crypto',amt:-amt,card:`Chain Pay · ${A.s}`,note:`Paid with ${qtyStr(q)} ${A.s} · token ORX`,pts});track('rail');track('spend',amt);save();a.close();
        setTimeout(()=>popup({hero:ill('check'),title:`Paid with ${A.n}`,sub:`${eur(amt)} to ${svc.n} · ${qtyStr(q)} ${A.s} · +${pts} pts`,actions:[{label:'Done',cls:'light'}]}),350);refresh('security','home','trade','points')}}});
}

/* ============ Orion Bank · points ============ */

const pointsTier=()=>PTIERS.reduce((a,t)=>S.lifetime>=t.min?t:a,PTIERS[0]);
const MISSIONS=[

];
function track(id,amt=1){
  const m=MISSIONS.find(x=>x.id===id);if(!m||S.misDone[id])return;
  const before=S.mis[id]||0;S.mis[id]=Math.min(m.target,before+amt);
  if(before<m.target&&S.mis[id]>=m.target)setTimeout(()=>toast(`Mission complete · claim ${m.r} pts`),900);
  save();
}
const REWARDS=[
  {id:'cash10',n:'€10 account credit',cost:1000,ic:'wallet',blob:'gBlobT',col:'#7cf0dc',hero:'add',d:'Lands in your Spending balance instantly.',fx:()=>{S.spending+=10;addTx({name:'Orion Points redemption',cat:'points',amt:10,card:'Orion Rewards'});return 'Credited to Spending'}},
  {id:'lounge',n:'Airport lounge pass',cost:2500,ic:'plane',blob:'gBlobB',col:'#bfe2ff',hero:'lounge',d:'One visit to any of 1,300+ lounges worldwide. Show the code at the desk.',v:1},
  {id:'boost',n:'2× points booster · 7 days',cost:800,ic:'bolt',blob:'gBlobG',col:'#ffe6a3',hero:'points',d:'Double points on every purchase for seven days. Stacks with your card multiplier.',fx:()=>{S.boostUntil=Math.max(Date.now(),S.boostUntil)+7*DAY;return 'Booster active for 7 days'}},
  {id:'btc25',n:'€25 Bitcoin credit',cost:2500,ic:'bitcoin',blob:'gBlobG',col:'#f7b24a',hero:'trade',d:'Converted to Bitcoin at the live price and added to your portfolio.',fx:()=>{creditCrypto(25,'BTC');return 'Bitcoin added to your portfolio'}},
  {id:'nofx',n:'Fee-free FX · 30 days',cost:1200,ic:'globe',blob:'gBlobB',col:'#9cc3ff',hero:'swap',d:'No exchange fees on any currency for 30 days, no limits.',fx:()=>{S.feeFreeUntil=Math.max(Date.now(),S.feeFreeUntil)+30*DAY;return 'Fee-free FX active for 30 days'}},
  {id:'coffee',n:'Coffee on us · 10 cups',cost:1800,ic:'coffee',blob:'gBlobC',col:'#e8b27a',hero:'gift',d:'A digital voucher for ten coffees at partner cafés.',v:1},
  {id:'cinema',n:'Cinema for two',cost:1500,ic:'film',blob:'gBlobR',col:'#ff9ac2',hero:'gift',d:'Two tickets for any standard screening at partner cinemas.',v:1},
  {id:'tree',n:'Plant 5 trees',cost:300,ic:'leaf',blob:'gBlobT',col:'#7fe0b0',hero:'gift',d:'We fund five trees through our reforestation partner in your name.',v:1}
];
const dayKey=d=>new Date(d).toDateString();
function claimCheckin(){
  const today=dayKey(Date.now());if(S.streak.last===today)return;
  S.streak.n=S.streak.last===dayKey(Date.now()-DAY)?S.streak.n+1:1;S.streak.last=today;
  const r=20+Math.min(S.streak.n,7)*5;earnPts(r,`Daily check-in · day ${S.streak.n}`);save();toast(`+${r} Orion Points · day ${S.streak.n} streak`);refresh('points','home');
}
R.points=function(){
  const p=$('#p-points'),sc=p.scrollTop;
  const T=pointsTier(),ni=PTIERS.indexOf(T)+1,N=PTIERS[ni],frac=N?clamp((S.lifetime-T.min)/(N.min-T.min),0,1):1;
  const today=dayKey(Date.now())===S.streak.last,boost=S.boostUntil>Date.now();
  const rw=10+MISSIONS.length;
  p.innerHTML=`<div class="phead"><div><div class="ptitle">Orion Points</div><div class="psub">Earn on every payment. Spend on things you love.</div></div></div>
  <div class="pts glass">${constellation(T.lit,frac)}<div class="mut" style="font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Balance</div><div class="big num" id="pbig">${S.points.toLocaleString('en-US')}</div>
    <div class="row gap8" style="justify-content:center;margin-top:10px;flex-wrap:wrap"><span class="chip gold">${ic('star','xs')}${T.name}</span><span class="chip">${ptsMult().toFixed(ptsMult()%1?2:0)}× earn rate</span>${boost?`<span class="chip coral">${ic('bolt','xs')}Booster ${Math.ceil((S.boostUntil-Date.now())/DAY)}d</span>`:''}</div>
    ${N?`<div style="margin:20px 6px 0;text-align:left"><div class="row between" style="font-size:13px"><span class="mut">${(N.min-S.lifetime).toLocaleString('en-US')} pts to ${N.name}</span><span class="mut3">${S.lifetime.toLocaleString('en-US')} / ${N.min.toLocaleString('en-US')}</span></div><div class="bar" style="margin-top:8px"><i style="width:${frac*100}%"></i></div><div class="mut3" style="font-size:12px;margin-top:10px;text-align:center">Next star lights up: ${N.perk}</div></div>`:`<div class="mut" style="font-size:13px;margin-top:18px">Every star is lit. Welcome to Rigel.</div>`}
  </div>
  <div class="glass list" style="margin-top:14px;padding:16px;display:flex;align-items:center;gap:14px"><div class="ci" style="width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(230,194,122,.28),rgba(255,162,126,.2));color:var(--gold);flex:none">${ic('gift','lg')}</div><div class="grow"><b style="font-size:16px">Daily check-in</b><div class="mut" style="font-size:13px;margin-top:2px">${S.streak.n?`${S.streak.n}-day streak`:'Start a streak'} · +${20+Math.min(S.streak.n+(today?0:1),7)*5} pts ${today?'earned today':'today'}</div></div><button class="btn ${today?'ghost':'primary'} sm" id="chk" ${today?'disabled':''}>${today?ic('check','sm')+'Done':'Claim'}</button></div>

  <div class="sect"><h3>Missions</h3><span class="mut3" style="font-size:13px">${MISSIONS.filter(m=>S.misDone[m.id]).length}/${MISSIONS.length} done</span></div>
  <div class="glass list" style="padding:4px 16px">${MISSIONS.map(m=>{const v=S.mis[m.id]||0,done=v>=m.target,claimed=S.misDone[m.id];return `<div class="mission" style="${claimed?'opacity:.5':''}"><div class="mi" style="${done?'background:rgba(95,227,161,.18);color:var(--green)':''}">${ic(claimed?'check':m.ic)}</div><div class="grow"><b style="font-size:15.5px;display:block;letter-spacing:-.01em">${m.t}</b><div class="mut" style="font-size:12.5px;margin:2px 0 8px">${m.d}</div><div class="bar" style="height:6px"><i style="width:${v/m.target*100}%"></i></div></div>${claimed?'':done?`<button class="btn primary sm" data-m="${m.id}">+${m.r}</button>`:`<span class="chip gold">${ic('star','xs')}${m.r}</span>`}</div>`}).join('')}</div>

  <div class="sect"><h3>Rewards</h3><span class="mut3" style="font-size:13px">Spend your points</span></div>
  <div class="rewards">${REWARDS.map(r=>`<button class="reward glass ${S.points<r.cost?'cant':''}" data-r="${r.id}"><div class="rimg">${thumb(r.ic,r.blob,r.col)}</div><div class="rb"><b>${r.n}</b><small>${ic('star','xs')}${r.cost.toLocaleString('en-US')}</small></div></button>`).join('')}</div>
  ${S.rewards.length?`<div class="sect"><h3>My vouchers</h3></div><div class="glass list" style="padding:4px 16px">${S.rewards.map(r=>`<div class="benefit"><div class="bi">${ic('ticket')}</div><div class="grow"><b>${esc(r.name)}</b><small class="mono">${r.code}</small></div><button class="chip" data-cp="${r.code}">${ic('copy','xs')}Copy</button></div>`).join('')}</div>`:''}
  <div class="sect"><h3>Recent activity</h3></div>
  <div class="glass list" style="padding:4px 16px">${S.ptsLog.length?S.ptsLog.slice(0,6).map(l=>`<div class="kv"><span style="color:var(--ink)">${esc(l.why)}<br><small class="mut3">${dayLabel(l.ts)} · ${timeStr(l.ts)}</small></span><b class="${l.n>0?'up':''}">${l.n>0?'+':'−'}${Math.abs(l.n).toLocaleString('en-US')}</b></div>`).join(''):'<div class="empty">Your points activity appears here</div>'}</div>`;
  p.scrollTop=sc;
  $('#chk',p).onclick=claimCheckin;
  $$('[data-m]',p).forEach(b=>b.onclick=()=>{const m=MISSIONS.find(x=>x.id===b.dataset.m);S.misDone[m.id]=true;earnPts(m.r,m.t);save();confetti(p.parentElement.parentElement);toast(`+${m.r} Orion Points`);refresh('points','home')});
  $$('[data-r]',p).forEach(b=>b.onclick=()=>rewardSheet(b.dataset.r));
  $$('[data-cp]',p).forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.cp)}catch(_){}toast('Code copied')});
};
function rewardSheet(id){
  const r=REWARDS.find(x=>x.id===id),can=S.points>=r.cost;
  sheet({hero:ill(r.hero),title:r.n,sub:r.d,
    html:`<div class="panel" style="margin-top:18px"><div class="kv"><span>Cost</span><b class="num" style="color:var(--gold)">${r.cost.toLocaleString('en-US')} pts</b></div><div class="kv"><span>Your balance</span><b class="num">${S.points.toLocaleString('en-US')} pts</b></div><div class="kv"><span>After redeeming</span><b class="num ${can?'':'dn'}">${(S.points-r.cost).toLocaleString('en-US')} pts</b></div></div><div class="stack"><button class="btn primary block" id="rd" ${can?'':'disabled'}>${can?`${ic('gift','sm')}Redeem for ${r.cost.toLocaleString('en-US')} pts`:`Need ${(r.cost-S.points).toLocaleString('en-US')} more points`}</button></div>`,
    onMount(a){$('#rd',a.el).onclick=()=>{
      S.points-=r.cost;let msg='';
      if(r.v){const code='ORN-'+Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('').replace(/(.{4})/,'$1-');S.rewards.unshift({name:r.n,code,ts:Date.now()});msg=`Your code: ${code}`}
      else msg=r.fx();
      S.ptsLog.unshift({ts:Date.now(),n:-r.cost,why:`Redeemed · ${r.n}`});save();a.close();
      setTimeout(()=>{const s=popup({hero:ill(r.hero),title:'Redeemed',sub:`${r.n}. ${msg}`,actions:[{label:'Done',cls:'light'}]});confetti(s.el)},380);refresh('points','home','trade')}}});
}

/* ============ Orion Bank · Orion Pay ============ */
const TERMINALS=[{n:'Café Lumière',a:4.8,c:'coffee'},{n:'Aurora Market',a:36.4,c:'groc'},{n:'Meridian Taxi',a:18.9,c:'transport'},{n:'Sushi Kōen',a:54.2,c:'food'},{n:'Skyline Hotel',a:212,c:'travel'},{n:'Nova Electronics',a:649,c:'shop'}];
const spentToday=()=>{const t=new Date();t.setHours(0,0,0,0);return -S.txs.filter(x=>x.ts>=t.getTime()&&x.amt<0&&x.cat!=='transfer'&&x.cat!=='fx'&&x.cat!=='trade'&&x.cat!=='sub').reduce((a,b)=>a+b.amt,0)};
function openPay(){
  if(SHEETS.length)return;
  const dock=$('#paydock');dock.classList.add('open');
  const srcs=TIERS.filter(t=>S.owned[t.id]).map(t=>({k:'card',t}));
  if(S.rail.on&&Object.keys(S.hold).some(s=>asset(s).t==='crypto'&&S.hold[s].q>1e-9))srcs.push({k:'rail',t:{id:'rail',name:'Chain Pay'}});
  let idx=Math.max(0,srcs.findIndex(s=>s.k==='card'&&s.t.id===S.primary)),busy=false;
  const sh=sheet({onClose(){dock.classList.remove('open');syncDock()},
    html:`<div class="row between" style="margin-top:-4px"><div class="row gap8"><div style="width:30px;height:30px">${LOGO_MINI}</div><b style="font-size:17px;letter-spacing:-.01em">Orion Pay</b></div></div>
    <div class="paystage" style="padding-top:20px"><div class="paycards" id="pcs">${srcs.map((s,i)=>cardHTML(s.t,{compact:1,frozen:s.k==='card'&&isFrozen(s.t.id),last:s.k==='rail'?'7F3K':last4(s.t.id)}).replace('class="bcard','class="bcard '+(i===idx?'cur ':'')+' ')).join('')}</div>
    <div style="text-align:center;margin:4px 0 0"><b id="pn" style="font-size:16px"></b><div class="mut" id="pb" style="font-size:13px;margin-top:3px"></div></div></div>
    <div class="paystate" id="ps"></div>
    <div class="mut3" style="font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;margin:6px 0 8px">Simulate a terminal</div><div class="terms" id="tm">${TERMINALS.map((t,i)=>`<button class="term" data-i="${i}"><b>${t.n}</b><small>${eur(t.a)}</small></button>`).join('')}</div>`});
  const q=id=>$(id,sh.el),ps=html=>q('#ps').innerHTML=html;
  const cur=()=>srcs[idx];
  const label=()=>{const s=cur();q('#pn').textContent=s.k==='rail'?`Chain Pay · ${S.rail.asset}`:`${s.t.name} ••${last4(s.t.id)}`;
    q('#pb').textContent=s.k==='rail'?`Settles from your ${S.rail.asset}`:isFrozen(s.t.id)?'Frozen · unfreeze in Security':`Spending ${eur(S.spending)}`;
    $$('.bcard',q('#pcs')).forEach((c,i)=>c.classList.toggle('cur',i===idx))};
  const pcs=q('#pcs');
  requestAnimationFrame(()=>{const c=pcs.children[idx];if(c)pcs.scrollLeft=c.offsetLeft-(pcs.clientWidth-c.offsetWidth)/2});
  let raf;pcs.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const mid=pcs.scrollLeft+pcs.clientWidth/2;let b=0,bd=1e9;[...pcs.children].forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;b=i}});if(b!==idx&&!busy){idx=b;label();ready()}})});
  label();
  const faceHTML=`<div class="faceid"><span class="scan"></span>${ic('faceid')}</div><b style="font-size:16px">Face ID</b><div class="mut" style="font-size:13.5px">Look at your iPhone to pay</div>`;
  const readyHTML=()=>{const s=cur();return s.k==='card'&&isFrozen(s.t.id)?`<div style="color:#bfe0ff">${ic('snow','lg')}</div><b style="font-size:16px">This card is frozen</b><div class="mut" style="font-size:13.5px">Pick another card or unfreeze it in Security</div>`:`<div class="waves"><i></i><i></i><i></i><div class="core">${ic('nfc','lg')}</div></div><b style="font-size:16px">Hold near reader</b><div class="mut" style="font-size:13.5px">Or tap a terminal below to simulate</div>`};
  const ready=()=>ps(readyHTML());
  const auth=()=>{if(!S.ctl.faceid){ready();return}ps(faceHTML);setTimeout(()=>{if(!sh.closed&&!busy)ps(`<div style="color:var(--green)">${ic('check','lg')}</div><b style="font-size:16px">Face ID verified</b>`),setTimeout(()=>{if(!sh.closed&&!busy)ready()},520)},1250)};
  auth();
  $$('.term',sh.el).forEach(b=>b.onclick=async()=>{
    if(busy)return;const T=TERMINALS[+b.dataset.i],s=cur();
    const fail=(t,m)=>{ps(`<div style="color:var(--red)">${ic('ban','lg')}</div><b style="font-size:16px">${t}</b><div class="mut" style="font-size:13.5px;max-width:260px">${m}</div><button class="btn ghost sm" id="again" style="margin-top:6px">Try again</button>`);$('#again',sh.el).onclick=ready};
    if(!S.ctl.contactless)return fail('Contactless is off','Turn it on in Security to pay with Orion Pay.');
    if(s.k==='card'&&isFrozen(s.t.id))return fail('Card frozen','Unfreeze it in Security or choose another card.');
    if(spentToday()+T.a>S.ctl.dailyLimit)return fail('Daily limit reached',`This would exceed your ${eur(S.ctl.dailyLimit,{d:0})} daily limit.`);
    let q2=0,A=null;
    if(s.k==='card'){if(T.a>S.spending)return fail('Insufficient funds','Add money or move funds out of your Vault.')}
    else{A=asset(S.rail.asset);const h=S.hold[A.s];q2=T.a/quote(A).bid;
      if(T.a>S.rail.perTx)return fail('Above Chain Pay cap',`Your per-payment cap is ${eur(S.rail.perTx,{d:0})}.`);
      if(S.rail.spent+T.a>S.rail.daily)return fail('Daily Chain Pay cap','Raise it in Security to continue.');
      if(!h||h.q<q2)return fail(`Not enough ${A.s}`,'Buy more in the Trade tab.')}
    busy=true;ps(`<div class="waves"><i></i><i></i><i></i><div class="core">${ic('nfc','lg')}</div></div><b style="font-size:16px">Processing…</b>`);
    await sleep(900);if(sh.closed){busy=false;return}
    let pts=0;
    if(s.k==='card'){S.spending-=T.a}
    else{const h=S.hold[A.s],avg=h.cost/h.q;h.q-=q2;h.cost-=avg*q2;if(h.q<1e-9)delete S.hold[A.s];S.rail.spent+=T.a}
    S.yearSpend+=T.a;S.paidCount++;pts=earnPts(T.a*ptsMult(),'Orion Pay · '+T.n);
    addTx({name:T.n,cat:T.c,amt:-T.a,card:s.k==='rail'?`Chain Pay · ${A.s}`:`${s.t.name.replace('Orion ','')} ••${last4(s.t.id)}`,note:s.k==='rail'?`Paid with ${qtyStr(q2)} ${A.s}`:'Orion Pay · contactless',pts});
    track('pay');track('spend',T.a);save();
    ps(`<svg class="done" viewBox="0 0 92 92"><circle cx="46" cy="46" r="42"/><path d="M28 47l12 12 24-26"/></svg><b style="font-size:20px;letter-spacing:-.01em">Done</b><div class="mut" style="font-size:14px">${eur(T.a)} · ${T.n}${pts?` · <span style="color:var(--gold)">+${pts} pts</span>`:''}</div>`);
    confetti(sh.el,['#5fe3a1','#ffb08c','#e6c27a','#fff']);label();busy=false;refresh('home','cards','points','security');
    setTimeout(()=>{if(!sh.closed&&!busy&&$('.done',sh.el))ready()},3200);
  });
}

/* ============ Orion Bank · boot ============ */
function welcomeSheet(){
  sheet({locked:true,noX:true,hero:ill('welcome'),title:`Welcome to Orion, ${esc(S.name.split(' ')[0])}`,sub:'Your account is open. Here is a starter credit so you can explore every corner of the app.',
    html:`<div class="panel" style="margin-top:20px">${[['wallet','Spending balance','€10,000.00'],['vault','Vault · earning 2.8% APY','€5,000.00'],['star','Orion Points','5,000 pts'],['bitcoin','Bitcoin welcome credit','€50.00']].map(([i,t,v])=>`<div class="benefit" style="padding:12px 2px"><div class="bi" style="width:40px;height:40px;border-radius:14px">${ic(i,'sm')}</div><div class="grow"><b style="font-size:15px">${t}</b></div><b class="num">${v}</b></div>`).join('')}</div>
    <div class="mut" style="font-size:12px;text-align:center;margin:12px 6px 0;line-height:1.45">Demo account with simulated money. Nothing here is real.</div>
    <div class="stack"><button class="btn primary block" id="claim">${ic('gift','sm')}Claim my starter credit</button></div>`,
    onMount(a){$('#claim',a.el).onclick=()=>{
      S.welcomed=true;S.spending=10000;S.vault=5000;S.vaultTs=Date.now();S.points=5000;S.lifetime=5000;S.ptsLog.unshift({ts:Date.now(),n:5000,why:'Welcome bonus'});
      creditCrypto(50,'BTC');save();confetti(a.el);
      setTimeout(()=>{a.close();R.home();const tot=totalBal();animateNum($('#bal'),0,tot,v=>balHTML(v,false),1800);refresh('points','trade','cards','security')},650)}}});
}
function boot(){
  S=load();initMarkets();accrue();refresh();
  TABS.forEach(t=>{const b=$(`#tabbar [data-t="${t}"]`);b.onclick=()=>go(t)});
  go('home');
  const dock=$('#paydock');dock.onclick=openPay;
  let sx=0,drag=false;dock.addEventListener('pointerdown',e=>{sx=e.clientX;drag=true});dock.addEventListener('pointermove',e=>{if(drag&&sx-e.clientX>18){drag=false;openPay()}});dock.addEventListener('pointerup',()=>drag=false);
  setInterval(tickMarkets,1500);
  setInterval(()=>{accrue();const e=$('#vaultTick');if(e)e.textContent='+€'+S.earned.toFixed(6)},1000);
  setInterval(save,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){accrue();R.home()}});
  // splash
  setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>{$('#splash').remove();if(!S.welcomed)setTimeout(welcomeSheet,250)},850)},2900);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('DOMContentLoaded',boot);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.bcard'))e.preventDefault()});

})();</script>
